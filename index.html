<style>
:root{--green:#0a7d33;--green-dark:#075c25;--green-light:#e7f5ec;--gold:#f6b40a;--ink:#1f2a24;--muted:#6b7a72;--line:#e2e8e4;

--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.btn{background:var(--green);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(.93)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:#f7faf8}
.btn.danger{background:var(--red)}.btn.gold{background:var(--gold);color:#3a2c00}
.btn.blue{background:var(--blue)}.btn.purple{background:var(--purple)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn.icon{padding:5px 8px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.icon:hover{border-color:var(--green);color:var(--green)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill.green{background:var(--green-light);color:var(--green-dark)}.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:#fdf3d7;color:var(--amber)}.pill.blue{background:#e3eefb;color:var(--blue)}
.pw-wrap{position:relative;display:block}.pw-wrap input{width:100%;padding-right:40px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:17px;line-height:1;opacity:.6;padding:4px}.pw-eye:hover{opacity:1}
.pill.purple{background:var(--purple-light);color:var(--purple)}.pill.grey{background:#eef2ef;color:var(--muted)}
.pill.gold{background:#fdf3d7;color:#9a6b00}

#screen{min-height:100vh}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth.owner{background:linear-gradient(135deg,#3a2461,#6b3fa0)}
.auth.school{background:linear-gradient(135deg,var(--green),var(--green-dark))}
.auth.check{background:linear-gradient(135deg,#0f3d6e,#1e5fa8)}
.acard{background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:410px;padding:32px 30px;text-align:center}
.acard .crest{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px}
.crest.g{background:var(--green-light)}.crest.p{background:var(--purple-light)}.crest.b{background:#e3eefb}
.acard h1{font-size:20px;margin-bottom:3px}.acard .sub{color:var(--muted);font-size:13px;margin-bottom:22px}

.topbar .who{text-align:right;line-height:1.25}.topbar .who b{display:block}.topbar .who span{font-size:11.5px;opacity:.85}
.layout{display:flex}

.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--ink);font-weight:600;font-size:14px;margin-bottom:3px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--green-light)}.nav-item.active{background:var(--green);color:#fff}
.nav-item.owner.active{background:var(--purple)}.nav-item.owner:hover{background:var(--purple-light)}
.nav-item .ic{font-size:17px;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:20px;padding:0 7px;font-weight:700}
.main{flex:1;padding:24px 28px;max-width:1200px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-head h2{font-size:22px}.page-head p{color:var(--muted);font-size:13.5px;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card.pad{padding:18px}

.stat.accent{background:var(--green);color:#fff;border-color:var(--green)}.stat.accent.purple{background:var(--purple);border-color:var(--purple)}
.stat.accent .lbl,.stat.accent .meta{color:rgba(255,255,255,.85)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:11px 12px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfa}
.t-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}.toolbar .grow{flex:1;min-width:160px}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}.empty .big{font-size:40px;margin-bottom:8px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--green-light);display:inline-flex;align-items:center;justify-content:center;font-size:15px;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .15s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal.lg{max-width:820px}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:17px}.modal-body{padding:20px;max-height:74vh;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2 .full{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.fld{margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:32px}.toast.err{background:var(--red)}
.subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.subtab{padding:7px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted)}
.subtab.active{background:var(--green);color:#fff;border-color:var(--green)}
.score-in{width:56px;padding:6px;text-align:center}
.muted{color:var(--muted)}.right{text-align:right}.center{text-align:center}.flex{display:flex;align-items:center;gap:8px}.gap{gap:8px}
.mt{margin-top:14px}.mb{margin-bottom:14px}hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-prev{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px}
#camWrap video{width:100%;border-radius:10px;background:#000}
.linkbox{display:flex;gap:8px;align-items:center;background:#f7faf8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.linkbox code{flex:1;overflow:auto;white-space:nowrap;color:var(--green-dark)}
.insight{border-left:4px solid var(--purple);background:var(--purple-light);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:13.5px}
.insight b{color:var(--purple)}
.bar{height:8px;border-radius:5px;background:var(--green);display:inline-block}
.report{background:#fff;border:2px solid var(--green);border-radius:8px;padding:26px;max-width:760px;margin:0 auto}
.report .rh{display:flex;align-items:center;gap:16px;border-bottom:3px double var(--green);padding-bottom:14px;margin-bottom:14px}
.report .rh .seal{width:62px;height:62px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--green);overflow:hidden}
.report .rh .seal img{width:100%;height:100%;object-fit:cover}
.report .rh h2{font-size:21px;color:var(--green-dark)}.report .rh .addr{font-size:12px;color:var(--muted)}
.report .rh .doc{margin-left:auto;text-align:right;font-size:12px}.report .rh .doc b{color:var(--green-dark)}
.report .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 18px;font-size:12.5px;margin-bottom:16px}
.report .meta-grid div span{color:var(--muted);display:block;font-size:10.5px;text-transform:uppercase}
.report table{font-size:12.5px}.report th,.report td{border:1px solid #cfe0d5;padding:7px 9px}.report th{background:var(--green-light);color:var(--green-dark)}
.report .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.report .summary .box{border:1px solid #cfe0d5;border-radius:8px;padding:10px;text-align:center}
.report .summary .box .v{font-size:20px;font-weight:800;color:var(--green-dark)}.report .summary .box .k{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.report .remarks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;font-size:12.5px}
.report .remarks .r{border:1px solid #cfe0d5;border-radius:8px;padding:10px;min-height:62px}
.report .remarks .r b{color:var(--green-dark);display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase}
.report .sign{display:flex;justify-content:space-between;margin-top:24px;font-size:12px}
.report .sign div{text-align:center;width:45%}.report .sign .line{border-top:1px solid #888;margin-top:30px;padding-top:4px}
.keybox{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.viewonly{background:#fff8e1;border:1px solid #f3e2a0;color:#8a6d00;border-radius:8px;padding:8px 12px;font-size:12.5px;text-align:center;margin-top:10px}
.receipt{max-width:520px;margin:0 auto;border:1px solid var(--line);border-radius:12px;padding:0 24px 24px;background:#fff;position:relative;overflow:hidden}
.receipt:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#0b5e3a,#caa64e)}
.receipt .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #caa64e;padding:18px 0 12px;margin-bottom:14px}
.receipt .rh .seal{width:50px;height:50px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;border:2px solid #caa64e}
.receipt .rh .seal img{width:100%;height:100%;object-fit:cover}
.receipt h2{font-size:18px;color:#0b5e3a}.receipt .no{margin-left:auto;text-align:right;font-size:12px}

.receipt .lines div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.receipt .lines div span{color:var(--muted)}

.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.idcard{width:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);margin:0 auto}

<script>
/* ===================== GLOBALS ===================== */
const TERMS=['First Term','Second Term','Third Term'];
const DEFAULT_CLASSES=['Nursery 1','Nursery 2','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Primary 6'];
const NURSERY_SUBJECTS=['Numeracy','Literacy','Rhymes','Colouring & Drawing','Social Habits','Health Habits'];
const PRIMARY_SUBJECTS=['English Language','Mathematics','Basic Science','Social Studies','Verbal Reasoning','Quantitative Reasoning','Civic Education','Computer Studies','Agricultural Science','Christian Religious Studies','Creative Arts','Physical & Health Education'];
let MODE='owner', SCHOOL_CODE='', DB=null, MASTER=null, USER=null, supa=null;
let STORE={}, BASE={}, pushTimers={};

/* ===================== STORAGE ===================== */
function loadStore(){try{STORE=JSON.parse(localStorage.getItem('sms_store'))||{};}catch(e){STORE={};}}
function saveStoreLocal(){try{localStorage.setItem('sms_store',JSON.stringify(STORE));}catch(e){console.warn('local cache full — relying on cloud',e);}}
function initSupa(){
  let url=SUPABASE_URL,key=SUPABASE_KEY;
  if(!url||!key){try{const c=JSON.parse(localStorage.getItem('sms_cfg'));if(c){url=c.url;key=c.key;}}catch(e){}}
  if(url&&key&&window.supabase){try{supa=window.supabase.createClient(url,key);return true;}catch(e){supa=null;}}
  return false;
}
function _clone(x){try{return JSON.parse(JSON.stringify(x));}catch(e){return x;}}
function loadBase(){try{BASE=JSON.parse(localStorage.getItem('sms_base'))||{};}catch(e){BASE={};}}
function saveBase(){try{localStorage.setItem('sms_base',JSON.stringify(BASE));}catch(e){}}
async function pullRow(id){if(!supa)return STORE[id];try{const{data}=await supa.from('school_data').select('data').eq('id',id).maybeSingle();if(data&&data.data){STORE[id]=data.data;BASE[id]=_clone(data.data);saveStoreLocal();saveBase();}return STORE[id];}catch(e){console.warn(e);return STORE[id];}}
async function pullAll(){if(!supa)return;try{const{data,error}=await supa.from('school_data').select('id,data');if(error)throw error;if(data){data.forEach(r=>{STORE[r.id]=r.data;BASE[r.id]=_clone(r.data);});saveStoreLocal();saveBase();}}catch(e){console.warn(e);setSync('err','Sync error');}}
/* ---- conflict-safe 3-way merge: never wipes newer cloud data, still honours edits & deletes ---- */
function _isObj(x){return x&&typeof x==='object'&&!Array.isArray(x);}
function _keyOf(it){if(it&&typeof it==='object'){if(it.id!=null)return '#'+it.id;if(it.code!=null)return '@'+it.code;if(it.pin!=null)return 'P'+it.pin;}return 'J'+JSON.stringify(it);}
function _idx(a){const m={};(a||[]).forEach(it=>{m[_keyOf(it)]=it;});return m;}
function _keys(){const k={};for(let i=0;i<arguments.length;i++){const o=arguments[i];if(o)Object.keys(o).forEach(x=>k[x]=1);}return Object.keys(k);}
function _eq(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function merge3(base,local,server){
  if(Array.isArray(local)||Array.isArray(server)||Array.isArray(base)){
    const bi=_idx(base),li=_idx(local),si=_idx(server);const res={};
    _keys(bi,li,si).forEach(k=>{const inB=k in bi,inL=k in li,inS=k in si;
      if(inL){res[k]=(inB&&inS&&_isObj(bi[k])&&_isObj(li[k])&&_isObj(si[k]))?merge3(bi[k],li[k],si[k]):li[k];}
      else if(inB&&inS){if(!_eq(si[k],bi[k]))res[k]=si[k];}
      else if(!inB&&inS){res[k]=si[k];}});
    const out=[],seen={};
    (local||[]).forEach(it=>{const k=_keyOf(it);if(k in res&&!seen[k]){out.push(res[k]);seen[k]=1;}});
    (server||[]).forEach(it=>{const k=_keyOf(it);if(k in res&&!seen[k]){out.push(res[k]);seen[k]=1;}});
    return out;
  }
  if(_isObj(local)||_isObj(server)||_isObj(base)){
    const b=_isObj(base)?base:{},l=_isObj(local)?local:{},s=_isObj(server)?server:{};const out={};
    _keys(b,l,s).forEach(k=>{const inB=k in b,inL=k in l,inS=k in s;
      if(inL){out[k]=merge3(b[k],l[k],s[k]);}
      else if(inB&&inS){if(!_eq(s[k],b[k]))out[k]=s[k];}
      else if(!inB&&inS){out[k]=s[k];}});
    return out;
  }
  if(_eq(local,base)&&server!==undefined)return server;
  return local!==undefined?local:server;
}
/* ---- rolling local backups (recovery net; per device) ---- */
function backupSnapshot(id){try{const doc=STORE[id];if(!doc)return;const key='sms_bak_'+id;let arr=[];try{arr=JSON.parse(localStorage.getItem(key))||[];}catch(e){}
  const last=arr[arr.length-1];if(last&&_eq(last.data,doc))return;arr.push({t:Date.now(),data:doc});while(arr.length>6)arr.shift();try{localStorage.setItem(key,JSON.stringify(arr));}catch(e){}}catch(e){}}
function listBackups(id){try{return JSON.parse(localStorage.getItem('sms_bak_'+id))||[];}catch(e){return [];}}
/* ---- concurrency-safe persistence core ----
   Every write to a school_data row goes through _commitRowCAS: read {data,updated_at} fresh, 3-way-merge
   local intent onto it, then write guarded by WHERE updated_at = the value just read (optimistic
   concurrency). If another writer changed the row first (0 rows affected), reread + remerge + retry,
   bounded. Never a blind unconditional upsert, so a stale writer can no longer silently clobber a newer
   confirmed write. _withRowLock serializes every writer (cloudCommit, flushPush, the online-reconnect
   handler) per row id, so two writes to the SAME school can never physically interleave — the second
   always starts from the first's confirmed result instead of racing it. ---- */
const _rowLocks={};
function _withRowLock(id,fn){
  const wait=_rowLocks[id]||Promise.resolve();
  const run=wait.then(fn,fn);
  _rowLocks[id]=run.then(()=>{},()=>{});
  return run;
}
async function _commitRowCAS(id,computeMerged){
  if(!supa)return {ok:false,error:'No database connection — not saved.'};
  let lastErr='Could not save — please retry.';
  for(let attempt=0;attempt<4;attempt++){
    try{
      setSync('saving','Saving…');
      const rd=await supa.from('school_data').select('data,updated_at').eq('id',id).maybeSingle();
      if(rd.error)throw rd.error;
      const server=rd.data&&rd.data.data;
      const serverUpdatedAt=rd.data?rd.data.updated_at:null;
      const merged=computeMerged(server);
      const newStamp=new Date().toISOString();
      let affected=1;
      if(server!=null){
        const wr=await supa.from('school_data').update({data:merged,updated_at:newStamp}).eq('id',id).eq('updated_at',serverUpdatedAt).select('id');
        if(wr.error)throw wr.error;
        affected=Array.isArray(wr.data)?wr.data.length:0;
      }else{
        const wr=await supa.from('school_data').upsert({id,data:merged,updated_at:newStamp});
        if(wr.error)throw wr.error;
      }
      if(affected===0){lastErr='Another update happened at the same time — retrying…';continue;}   /* CAS conflict: never overwrite a newer row — reread and retry instead */
      /* No post-update read-after-write: the CAS confirmed the write landed (affected≥1) and `merged`
         is by definition the new row state, so `merged` IS the authoritative result. The next screen-open
         HZpull catches up any concurrent writes that landed after our commit. Saves 1 round trip per commit. */
      return {ok:true,data:merged};
    }catch(e){console.warn('commit attempt failed',e);lastErr=(e&&e.message)||String(e);}
  }
  setSync('err','Database error — not saved');
  return {ok:false,error:lastErr};
}
/* ---- safe push: serialized, CAS-protected 3-way merge. Never blindly overwrites a newer cloud row.
   Offline note: STORE/localStorage let the PWA keep working with no connection, but that cached copy is
   never treated as authoritative — every flush rereads the server and merges/CAS-writes on top of it. ---- */
async function flushPush(id){
  if(!supa)return;
  const res=await _withRowLock(id,()=>{
    /* capture snapshots INSIDE the lock so any prior in-flight cloudCommit has already replaced
       STORE[id]/BASE[id] before we read them; prevents a stale local/base pointer from overwriting
       a newer confirmed state via merge3 when local!=base on some other-module field. */
    const localSnapshot=STORE[id];
    const baseSnapshot=BASE[id]!==undefined?BASE[id]:localSnapshot;
    return _commitRowCAS(id,server=>server!=null?merge3(baseSnapshot,localSnapshot,server):localSnapshot);
  });
  if(!res.ok){setSync('err','Sync error — will retry');clearTimeout(pushTimers[id]);pushTimers[id]=setTimeout(()=>flushPush(id),4000);return;}
  const authoritative=res.data;
  STORE[id]=authoritative;if(id===SCHOOL_CODE&&DB)DB=authoritative;if(id==='__master__'&&MASTER)MASTER=authoritative;
  BASE[id]=_clone(authoritative);saveStoreLocal();saveBase();setSync('on','Saved');
}
function pushRow(id){STORE[id]=(id==='__master__')?MASTER:(id===SCHOOL_CODE?DB:STORE[id]);saveStoreLocal();backupSnapshot(id);
  if(!supa)return;clearTimeout(pushTimers[id]);setSync('saving','Saving…');pushTimers[id]=setTimeout(()=>flushPush(id),700);}
function save(){pushRow(SCHOOL_CODE);}
function saveMaster(){pushRow('__master__');}
function saveSchoolRow(code){saveStoreLocal();backupSnapshot(code);if(!supa)return;clearTimeout(pushTimers[code]);setSync('saving','Saving…');pushTimers[code]=setTimeout(()=>flushPush(code),400);}
/* ---- DATABASE-FIRST commit: serialized, optimistic-concurrency read → 3-way merge → CAS write → reread.
   Returns {ok,error}. Use for flows that must CONFIRM persistence before reporting success (Hifz
   submit/approve/return). Shares _withRowLock/_commitRowCAS with flushPush, so it cannot interleave with
   a debounced push or the online-reconnect handler on the same row — a racing writer always operates on
   fresh authoritative data instead of silently overwriting this commit (or being overwritten by it).
   Tenant-scoped to the given row id (defaults to the authenticated school). ---- */
async function cloudCommit(id){id=id||SCHOOL_CODE;
  if(!supa){setSync('err','No database connection');return {ok:false,error:'No database connection — not saved.'};}
  clearTimeout(pushTimers[id]);
  /* Snapshot INSIDE the caller-synchronous entry so this commit's intent (the caller's just-applied
     mutations to DB) is captured before yielding to the microtask queue. Aliasing safety comes from
     the row lock: once inside it, no other write can have replaced the objects out from under us. */
  const localSnapshot=_clone((id==='__master__')?MASTER:(id===SCHOOL_CODE?DB:STORE[id]));
  STORE[id]=localSnapshot;saveStoreLocal();backupSnapshot(id);
  const baseSnapshot=BASE[id]!==undefined?BASE[id]:localSnapshot;
  const res=await _withRowLock(id,()=>_commitRowCAS(id,server=>server!=null?merge3(baseSnapshot,localSnapshot,server):localSnapshot));
  if(!res.ok)return {ok:false,error:res.error};
  const authoritative=res.data;
  STORE[id]=authoritative;BASE[id]=_clone(authoritative);if(id===SCHOOL_CODE)DB=authoritative;if(id==='__master__')MASTER=authoritative;
  saveStoreLocal();saveBase();setSync('on','Database saved');return {ok:true};
}
/* ---- authoritative refresh: reread THIS school's row from the database into DB (tenant-scoped) ---- */
async function HZpull(){if(!supa)return false;try{const d=await pullRow(SCHOOL_CODE);if(d){DB=d;STORE[SCHOOL_CODE]=d;return true;}}catch(e){console.warn('HZpull failed',e);}return false;}
/* ---- restore from a local backup (recover data already lost from the cloud) ---- */
function restoreBackupModal(code){const list=listBackups(code);
  modal('Restore a backup',`<p class="muted mb">Restoring replaces the cloud copy for this account with the chosen backup.</p>
   <label>Snapshots saved on this device</label>
   ${list.length?list.slice().reverse().map((b)=>{const d=b.data||{};const idx=list.indexOf(b);const np=(d.students||[]).length;const nr=Object.keys(d.results||{}).length;return `<div class="flex" style="justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px"><div><b>${new Date(b.t).toLocaleString()}</b><div class="muted" style="font-size:12px">${np} pupil(s) · ${nr} result record(s)</div></div><button class="btn sm gold" onclick="doRestore('${esc(code)}',${idx})">Restore</button></div>`;}).join(''):`<div class="empty" style="padding:14px">No snapshots on this device.</div>`}
   <hr><label>Or restore from a downloaded backup file (.json)</label>
   <input type="file" accept=".json,application/json" onchange="importBackupFile('${esc(code)}',this)" class="mt">`,
   `<button class="btn sec" onclick="closeModal()">Cancel</button>`,true);}
function importBackupFile(code,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{try{const j=JSON.parse(e.target.result);const doc=(j&&j.data&&typeof j.data==='object')?j.data:j;
    if(!doc||typeof doc!=='object'){toast('Not a valid backup file',true);return;}
    if(!confirm('Restore this backup file to the cloud? Current cloud data for this account will be replaced.'))return;
    STORE[code]=_clone(doc);BASE[code]=_clone(doc);saveStoreLocal();saveBase();if(code===SCHOOL_CODE)DB=STORE[code];
    if(supa){setSync('saving','Restoring…');supa.from('school_data').upsert({id:code,data:STORE[code],updated_at:new Date().toISOString()}).then(()=>setSync('on','Synced')).catch(()=>setSync('err','Sync error'));}
    closeModal();toast('Backup file restored');if(USER&&CURRENT){buildNav();go(CURRENT);}
  }catch(err){toast('Could not read that file',true);}};r.readAsText(f);}
async function doRestore(code,idx){const list=listBackups(code);const b=list[idx];if(!b){toast('Backup not found',true);return;}
  STORE[code]=_clone(b.data);BASE[code]=_clone(b.data);saveStoreLocal();saveBase();if(code===SCHOOL_CODE)DB=STORE[code];
  if(supa){try{setSync('saving','Restoring…');await supa.from('school_data').upsert({id:code,data:STORE[code],updated_at:new Date().toISOString()});setSync('on','Synced');}catch(e){setSync('err','Sync error');}}
  closeModal();toast('Backup restored');if(USER&&CURRENT){buildNav();go(CURRENT);}}
/* ---- download a dated JSON archive (off-site safety net) ---- */
function downloadBackup(code){code=code||SCHOOL_CODE;const doc=STORE[code]||(code===SCHOOL_CODE?DB:null);if(!doc){toast('No data to back up',true);return;}
  const st=doc.settings||{};const name=st.shortName||st.schoolName||st.storeName||st.familyName||code;
  const blob=new Blob([JSON.stringify({code,exportedAt:new Date().toISOString(),data:doc},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=String(name).replace(/[^\w]+/g,'-')+'-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function maybeWeeklyBackup(){try{if(!SCHOOL_CODE||!DB)return;const k='sms_lastdl_'+SCHOOL_CODE;const last=Number(localStorage.getItem(k)||0);
  if(Date.now()-last<7*24*3600*1000)return;localStorage.setItem(k,String(Date.now()));
  setTimeout(()=>{downloadBackup(SCHOOL_CODE);toast('📦 Weekly backup saved to your device');},1600);}catch(e){}}
/* ---- Backup module (owner can enable per tenant; shows a Backup nav page) ---- */
function hasBackup(){return !!(DB&&DB.settings)&&DB.settings.backup!==false;}
function tenantAccent(){return (DB&&DB.kind==='autoparts')?'#15366e':(DB&&DB.kind==='pharmacy')?'#0c5b56':(DB&&DB.kind==='family')?'#7a4d12':(DB&&DB.kind==='posagent')?'#0a7d33':'var(--green)';}
function vBackup(){const ac=tenantAccent();const snaps=listBackups(SCHOOL_CODE);
  $('#view').innerHTML=`<div class="page-head"><div><h2>🛟 Backup & Restore</h2><p>Save a copy of your data, or restore it if ever needed</p></div>
    <button class="btn" style="background:${ac}" onclick="downloadBackup(SCHOOL_CODE)">⬇ Download backup</button></div>
  <div class="card pad mb"><h3 class="mb">Your data is safe</h3>
    <p class="muted mb">Everything is stored in the cloud and merged so nothing is overwritten. For extra peace of mind, download a dated backup file to your device and keep it in Google Drive or email it to yourself. If anything ever looks wrong, tap <b>Sync now</b> first, then <b>Restore</b>.</p>
    <div class="flex gap" style="flex-wrap:wrap"><button class="btn sec" onclick="manualSync()">🔄 Sync now</button><button class="btn" style="background:${ac}" onclick="downloadBackup(SCHOOL_CODE)">⬇ Download backup file</button><button class="btn gold" onclick="restoreBackupModal(SCHOOL_CODE)">↩ Restore</button></div></div>
  <div class="card pad"><h3 class="mb">Automatic snapshots on this device (${snaps.length})</h3>
   ${snaps.length?`<div class="t-wrap"><table><thead><tr><th>Saved</th><th>Contents</th><th></th></tr></thead><tbody>${snaps.slice().reverse().map(b=>{const d=b.data||{};const idx=snaps.indexOf(b);const n=(d.students||d.products||d.members||d.txns||[]).length;return `<tr><td>${new Date(b.t).toLocaleString()}</td><td class="muted">${n} record(s)</td><td class="right"><button class="btn sm gold" onclick="doRestore('${SCHOOL_CODE}',${idx})">Restore</button></td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty">Snapshots build up automatically as you work.</div>`}
  </div>`;}
function toggleBackup(code){const d=STORE[code];if(!d)return;const cur=d.settings.backup!==false;d.settings.backup=!cur;STORE[code]=d;saveStoreLocal();saveSchoolRow(code);
  toast('Backup module '+(!cur?'enabled':'disabled')+' for this account');
  const reg=MASTER.schools.find(s=>s.code===code);const t=reg&&reg.type;
  if(t==='pharmacy')managePharmacy(code);else if(t==='autoparts')manageAuto(code);else if(t==='family')manageFamily(code);else if(t==='posagent')managePos(code);else manageSchool(code);}
function backupToggleBtn(code){const d=STORE[code];const on=!d||d.settings.backup!==false;return `<button class="btn sec" onclick="toggleBackup('${code}')">🛟 Backup module: ${on?'ON':'OFF'}</button>`;}
async function manualSync(){if(!supa){toast('Cloud is off. Owner sets keys in the file or Settings.',true);return;}
  if(!navigator.onLine){toast('You are offline. Connect to the internet to sync.',true);setSync('err','Offline');return;}
  if(MODE==='owner'){const ok=await pullAllStrict();if(!ok){toast('Could not reach the cloud. Check your connection.',true);setSync('err','Sync error');return;}MASTER=STORE['__master__'];}
  else{const r=await cloudPull(SCHOOL_CODE);const m=await cloudPull('__master__');if(!r.ok||!m.ok){toast('Could not reach the cloud. Check your connection.',true);setSync('err','Sync error');return;}DB=STORE[SCHOOL_CODE]?ensureByKind(STORE[SCHOOL_CODE]):DB;MASTER=STORE['__master__'];}
  if(USER){buildNav();go(CURRENT);}setSync('on','Synced');toast('Synced from cloud');}
function setSync(state,txt){const c=$('#syncChip');if(!c)return;c.className='sync-chip '+(state==='on'?'':state);$('#syncTxt').textContent=txt;}

/* ===================== SEEDS ===================== */
function seedSchool(code,name){
  const classes=DEFAULT_CLASSES.map((n,i)=>({id:'c'+(i+1),name:n}));
  const subjects={};classes.forEach(c=>subjects[c.id]=c.name.startsWith('Nursery')?[...NURSERY_SUBJECTS]:[...PRIMARY_SUBJECTS]);
  return{settings:{code,schoolName:name,address:'Nigeria',motto:'Knowledge • Character • Service',logo:'',
      session:'2025/2026',term:'First Term',nextResumption:'',status:'active',receiptSeq:0,grade:{ca1:20,ca2:20,exam:60}},
    users:[{id:'u1',name:'School Administrator',username:'admin',password:'admin123',role:'admin',classes:[],staffId:'STAFF/001',photo:''}],
    classes,students:[],subjects,attendance:{},results:{},fees:{},payments:[],applicants:[],remarks:{}};
}
function seedMaster(){return{platform:{name:'EduManager Cloud',owner:{name:'Platform Owner',username:'owner',password:'owner123'}},
    schools:[{code:'DEMO',name:'Demo Nursery & Primary',status:'active',createdAt:today()}],
    pins:[],batches:[]};}
function ensureSchool(d){d.settings=d.settings||{};const g=d.settings.grade;if(!g)d.settings.grade={ca1:20,ca2:20,exam:60};
  if(d.settings.receiptSeq==null)d.settings.receiptSeq=0;if(!d.settings.status)d.settings.status='active';
  if(!Array.isArray(d.settings.termsDone))d.settings.termsDone=[];
  if(!d.settings.dates)d.settings.dates={termBegin:'',termEnd:'',resumption:''};
  if(!d.settings.bank)d.settings.bank={name:'',number:'',bank:''};
  if(!Array.isArray(d.events))d.events=defaultEvents(parseInt((d.settings.session||'2025').slice(0,4))||2025);
  if(!d.settings.modules)d.settings.modules={};
  if(!d.settings.theme)d.settings.theme='green';
  if(d.settings.currentWeek==null)d.settings.currentWeek=1;
  if(!d.settings.charges)d.settings.charges={late:200,absent:500};
  if(!d.staffAtt||typeof d.staffAtt!=='object')d.staffAtt={};
  if(!Array.isArray(d.lessonPlans))d.lessonPlans=[];
  if(!Array.isArray(d.houses))d.houses=[];

function modal(title,body,foot,big){$('#modal').className='modal'+(big?' lg':'');

$('#modalBg').addEventListener('click',e=>{if(e.target===$('#modalBg'))closeModal();});
let _photo='',_camStream=null;
function photoField(cur){_photo=cur||'';return `<label>Photo</label><div class="photo-pick mb">
  <div class="photo-prev" id="phPrev">${_photo?`<img src="${_photo}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'📷'}</div>
  <div><input type="file" id="phFile" accept="image/*" style="display:none" onchange="pickPhoto(this)">
   <button type="button" class="btn sec sm" onclick="document.getElementById('phFile').click()">⬆ Upload</button>

   ${_photo?'<button type="button" class="btn sec sm" onclick="clearPhoto()">Remove</button>':''}</div></div>

   <div class="flex gap mt"><button type="button" class="btn sm" onclick="snap()">Capture</button><button type="button" class="btn sec sm" onclick="stopCam()">Cancel</button></div></div>`;}
function setPrev(){$('#phPrev').innerHTML=_photo?`<img src="${_photo}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'📷';}
function clearPhoto(){_photo='';setPrev();}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>compress(e.target.result,d=>{_photo=d;setPrev();});r.readAsDataURL(f);}
function compress(dataURL,cb,max=260,q=.6){const img=new Image();img.decoding='async';img.onload=()=>{let w=img.width,h=img.height;if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w));cv.height=Math.max(1,Math.round(h));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);let out;try{out=cv.toDataURL('image/jpeg',q);}catch(e){out=dataURL;}cb(out);};img.onerror=()=>cb(dataURL);img.src=dataURL;}
/* fast, reliable image compressor straight from a File (no FileReader) */
function compressFile(file,cb,max=900,q=.72){let url;try{url=URL.createObjectURL(file);}catch(e){cb(null);return;}const img=new Image();img.decoding='async';
  img.onload=()=>{let w=img.width,h=img.height;if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w));cv.height=Math.max(1,Math.round(h));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    let out=null;try{out=cv.toDataURL('image/jpeg',q);}catch(e){out=null;}URL.revokeObjectURL(url);cb(out);};
  img.onerror=()=>{URL.revokeObjectURL(url);cb(null);};img.src=url;}
/* process a list of picked files → each image (compressed) via eachCb, then doneCb(count) */
function _showUp(total){let o=document.getElementById('upProg');if(!o){o=document.createElement('div');o.id='upProg';o.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99998;background:#0b1f14;color:#fff;padding:12px 16px;box-shadow:0 -4px 20px rgba(0,0,0,.35)';document.body.appendChild(o);}
  o.innerHTML='<div style="max-width:520px;margin:0 auto"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span id="upTxt">Preparing '+total+' image(s)…</span><span id="upPct">0%</span></div><div style="height:9px;background:rgba(255,255,255,.2);border-radius:20px;overflow:hidden"><div id="upBar" style="height:100%;width:0;background:linear-gradient(90deg,#12b158,#caa64e);transition:width .25s ease"></div></div></div>';o.style.display='block';}
function _setUp(done,total){const bar=document.getElementById('upBar'),txt=document.getElementById('upTxt'),pct=document.getElementById('upPct');const p=total?Math.round(done/total*100):100;if(bar)bar.style.width=p+'%';if(pct)pct.textContent=p+'%';if(txt)txt.textContent=done>=total?'Saving…':('Uploading '+done+' of '+total+'…');}
function _hideUp(){const o=document.getElementById('upProg');if(o)setTimeout(()=>{if(o)o.style.display='none';},700);}
function _readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('read failed'));try{r.readAsDataURL(f);}catch(e){rej(e);}});}
function _scaleDataURL(dataURL,max,q){return new Promise(res=>{const img=new Image();img.decoding='async';const to=setTimeout(()=>res(dataURL),8000);
  img.onload=()=>{clearTimeout(to);try{let w=img.width,h=img.height;if(!w||!h){res(dataURL);return;}if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w));cv.height=Math.max(1,Math.round(h));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',q));}catch(e){res(dataURL);}};
  img.onerror=()=>{clearTimeout(to);res(dataURL);};img.src=dataURL;});}
async function processImages(files,max,q,eachCb,doneCb){files=[...(files||[])].filter(f=>f&&(!f.type||/^image\//.test(f.type)));if(!files.length){doneCb(0);return;}
  const total=files.length;_showUp(total);let ok=0;
  for(let i=0;i<total;i++){let data=null;
    try{const raw=await _readAsDataURL(files[i]);data=await _scaleDataURL(raw,max,q)||raw;}catch(e){data=null;}
    if(data){try{eachCb(data);ok++;}catch(e){}}
    _setUp(i+1,total);}
  _hideUp();doneCb(ok);}
async function openCam(){$('#camWrap').style.display='block';try{_camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});$('#camVid').srcObject=_camStream;}catch(e){toast('Camera needs the hosted https link. Use Upload.',true);$('#camWrap').style.display='none';}}
function snap(){const v=$('#camVid');if(!v||!v.videoWidth)return;const cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);compress(cv.toDataURL('image/jpeg',.8),d=>{_photo=d;setPrev();});stopCam();}
function stopCam(){if(_camStream){_camStream.getTracks().forEach(t=>t.stop());_camStream=null;}const w=$('#camWrap');if(w)w.style.display='none';}

function sigImg(d,h){return d?`<img src="${d}" style="display:block;max-height:${h||26}px;max-width:100%;margin:0 auto -3px">`:'';}
function staffByPosition(pos){return DB.users.find(u=>u.role==='teacher'&&(u.position||'')===pos)||null;}
function directorUser(){return DB.users.find(u=>u.role==='admin'&&u.signature)||staffByPosition('Director')||DB.users.find(u=>u.role==='admin')||null;}
function openSignPad(kind,id){
  modal('✍️ Draw signature',`<p class="muted mb">Sign inside the box with your finger (phone) or mouse (laptop), then tap Save.</p>
    <canvas id="sigCv" width="560" height="200" style="width:100%;height:200px;border:2px dashed #bbb;border-radius:10px;background:#fff;touch-action:none;display:block;cursor:crosshair"></canvas>
    <div class="mt"><button class="btn sec sm" type="button" onclick="sigClear()">↺ Clear</button></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="sigSave('${kind}','${id}')">Save signature</button>`,true);
  setTimeout(sigInit,80);}
function sigInit(){const cv=$('#sigCv');if(!cv)return;const ctx=cv.getContext('2d');ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1f14';let drawing=false,last=null;cv._blank=true;
  const pos=e=>{const r=cv.getBoundingClientRect();const t=(e.touches&&e.touches[0])||e;return {x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)};};
  const down=e=>{drawing=true;cv._blank=false;last=pos(e);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault();};
  const up=()=>{drawing=false;};
  cv.addEventListener('mousedown',down);cv.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',up);}
function sigClear(){const cv=$('#sigCv');if(cv){cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv._blank=true;}}
function sigSave(kind,id){const cv=$('#sigCv');if(!cv)return;if(cv._blank){toast('Please draw your signature first',true);return;}
  let data;try{data=cv.toDataURL('image/png');}catch(e){toast('Could not save signature',true);return;}
  if(kind==='student'){const s=DB.students.find(x=>x.id===id);if(s)s.signature=data;}else{const u=DB.users.find(x=>x.id===id);if(u)u.signature=data;}
  save();closeModal();toast('Signature saved ✓');}

    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500"><input type="checkbox" id="ap_site" style="width:auto" ${u.showOnSite?'checked':''}> Show me on the homepage <b>Leadership</b> section (as Director)</label>
    <p class="muted" style="font-size:12px;margin-top:6px">This is the School Director profile used on report sheets and ID cards. Director and Administrator are the same account.</p>`,

function saveAdminProfile(){const u=DB.users.find(x=>x.id===USER.id);if(!u)return;u.name=$('#ap_name').value.trim()||u.name;u.position=$('#ap_pos').value.trim()||'Director';u.phone=$('#ap_phone').value.trim();u.bio=$('#ap_bio').value.trim();u.photo=_photo;u.showOnSite=$('#ap_site').checked;u.group='leadership';
  save();closeModal();USER=u;const wn=$('#whoName');if(wn)wn.textContent=u.name;toast('Profile saved');}

function renderQRs(){if(!window.qrcode)return;document.querySelectorAll('img.qrimg[data-qr]').forEach(el=>{if(el.dataset.done)return;
  try{const q=qrcode(0,'M');q.addData(el.getAttribute('data-qr')||' ');q.make();el.src=q.createDataURL(5,1);el.dataset.done='1';}catch(e){}});}
// Render barcodes + QRs, retrying a few times in case the CDN libs load slightly late.
function renderVisuals(tries){tries=tries||0;
  renderBarcodes();renderQRs();
  const pendingBC=[...document.querySelectorAll('svg.bc[data-code]')].some(el=>!el.dataset.done);
  const pendingQR=[...document.querySelectorAll('img.qrimg[data-qr]')].some(el=>!el.dataset.done);
  if((pendingBC||pendingQR)&&tries<14){setTimeout(()=>renderVisuals(tries+1),250);}
  else if(pendingBC){ // libs never loaded — show the code as text so the card still works
    document.querySelectorAll('svg.bc[data-code]').forEach(el=>{if(el.dataset.done)return;const fb=el.parentElement&&el.parentElement.querySelector('.bc-fallback');if(fb){fb.style.display='block';el.style.display='none';}el.dataset.done='1';});}}

function initials(name){return (name||'').split(/\s+/).filter(w=>/[a-z0-9]/i.test(w)).slice(0,3).map(w=>w[0].toUpperCase()).join('')||'S';}
function logoSVG(text,style){
  const palettes=[['#0a7d33','#e7f5ec'],['#1e5fa8','#e3eefb'],['#6b3fa0','#f0eafa'],['#b8860b','#fdf3d7'],['#c0392b','#fdecea'],['#0f766e','#d7f0ec']];
  const[fg,bg]=palettes[style%palettes.length];const t=esc(text);const shape=Math.floor(style/2)%3;let bgEl;
  if(shape===0)bgEl=`<circle cx="60" cy="60" r="56" fill="${bg}" stroke="${fg}" stroke-width="4"/>`;
  else if(shape===1)bgEl=`<rect x="6" y="6" width="108" height="108" rx="22" fill="${bg}" stroke="${fg}" stroke-width="4"/>`;
  else bgEl=`<path d="M60 6 L112 26 V64 C112 92 88 110 60 116 C32 110 8 92 8 64 V26 Z" fill="${bg}" stroke="${fg}" stroke-width="4"/>`;
  const fs=t.length>2?30:38;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">${bgEl}<text x="60" y="60" dy=".35em" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="${fs}" fill="${fg}">${t}</text></svg>`;}
function svgToDataURL(svg){return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));}
function genLogoChooser(){
  const nm=($('#sc_name')&&$('#sc_name').value.trim())||'School';const ini=initials(nm);
  const opts=[];for(let i=0;i<6;i++)opts.push(logoSVG(ini,i));
  $('#logoOpts').innerHTML=`<label>Pick a generated logo for “${esc(nm)}”</label><div class="logo-opts mb">
    ${opts.map((svg,i)=>`<div class="logo-opt" onclick="chooseLogo(${i})" id="lo${i}">${svg}</div>`).join('')}</div>`;
  window._logoOpts=opts;
}

/* ===================== PROMOTION / ANNUAL HELPERS ===================== */
function termAvg(stu,term){const subs=DB.subjects[stu.classId]||[];const res=DB.results[DB.settings.session+'|'+term+'|'+stu.id]||{};let t=0,n=0;
  subs.forEach(sub=>{const r=res[sub];if(r&&(r.ca1!=null||r.ca2!=null||r.exam!=null)){t+=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);n++;}});return n?t/n:null;}
function annual(stu){const t1=termAvg(stu,'First Term'),t2=termAvg(stu,'Second Term'),t3=termAvg(stu,'Third Term');
  const vals=[t1,t2,t3].filter(v=>v!=null);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;return{t1,t2,t3,avg,terms:vals.length};}
function promoteMark(){return (DB.settings.grade&&DB.settings.grade.promote)||40;}
function isFinalClass(classId){const c=DB.classes.find(x=>x.id===classId);if(!c)return false;if(hasModule('tahfiz')){const i=DB.classes.findIndex(x=>x.id===classId);return i>=0&&i===DB.classes.length-1;}if(DB.settings.modules&&DB.settings.modules.gradPry5)return /primary\s*5/i.test(c.name);return /primary\s*6|grad/i.test(c.name);}
function nextClassName(classId){if(isFinalClass(classId))return 'Graduated';const i=DB.classes.findIndex(c=>c.id===classId);return (i>=0&&i+1<DB.classes.length)?DB.classes[i+1].name:'Graduated';}
function promotionFor(stu){const a=annual(stu);if(a.avg==null)return{...a,decision:'pending',label:'No results',cls:'muted'};
  if(isFinalClass(stu.classId))return{...a,decision:'graduate',label:(DB.settings.modules&&DB.settings.modules.tahfiz)?'Graduated (Completion Certificate)':'Graduated (Primary Certificate)',cls:'promo-grad'};
  if(a.avg>=promoteMark())return{...a,decision:'promote',label:'Promoted to '+nextClassName(stu.classId),cls:'promo-yes'};
  return{...a,decision:'repeat',label:'To repeat '+className(stu.classId),cls:'promo-no'};}

/* print ONLY the given HTML (isolated in a hidden frame — nothing else prints) */
function printDoc(inner,page){
  const old=document.getElementById('printFrame');if(old)old.remove();
  const fr=document.createElement('iframe');fr.id='printFrame';fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(fr);const d=fr.contentWindow.document;
  d.open();d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Print</title><style>@page{size:'+(page||'A4 portrait')+';margin:8mm}html,body{margin:0;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>'+inner+'</body></html>');d.close();
  const imgs=[].slice.call(d.images);const fire=()=>{try{fr.contentWindow.focus();fr.contentWindow.print();}catch(e){}};
  if(!imgs.length){setTimeout(fire,350);}
  else{let done=0;const chk=()=>{if(++done>=imgs.length)setTimeout(fire,300);};imgs.forEach(im=>{if(im.complete)chk();else{im.onload=chk;im.onerror=chk;}});}
}
/* print a report card / annual report on EXACTLY one A4 page (auto shrink-to-fit) */
function printRC(html){
  const old=document.getElementById('printFrame');if(old)old.remove();
  const fr=document.createElement('iframe');fr.id='printFrame';fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';document.body.appendChild(fr);
  const styles=[].slice.call(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
  const d=fr.contentWindow.document;d.open();
  d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+styles+'</style>'+
    '<style>@page{size:A4 portrait;margin:0}html,body{margin:0;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    '.no-print{display:none!important}.rcpage{box-sizing:border-box;width:210mm;height:297mm;padding:7mm 8mm;overflow:hidden}'+
    '.rcfit{width:100%;height:100%}.rcfit .rc{max-width:100%!important;width:100%!important;min-height:100%!important;margin:0!important;box-shadow:none!important;border:none!important;display:flex!important;flex-direction:column!important}'+RC_COMPACT+'</style>'+
    '</head><body><div class="rcpage"><div class="rcfit">'+html+'</div></div></body></html>');
  d.close();
  try{[].slice.call(d.querySelectorAll('img.qrimg[data-qr]')).forEach(im=>{try{const Q=window.qrcode;if(!Q)return;const q=Q(0,'M');q.addData(im.getAttribute('data-qr')||'');q.make();im.src=q.createDataURL(5,1);}catch(e){}});}catch(e){}
  const win=fr.contentWindow;
  const finish=()=>{try{const fit=d.querySelector('.rcfit'),rc=d.querySelector('.rc');if(fit&&rc){rc.style.zoom='';const avail=fit.clientHeight,h=rc.scrollHeight;if(h>avail+1)rc.style.zoom=(avail/h).toFixed(4);}win.focus();win.print();}catch(e){try{win.print();}catch(_){}}};
  const imgs=[].slice.call(d.images);let n=imgs.length,done=0;
  if(!n){setTimeout(finish,250);}else{const chk=()=>{if(++done>=n)setTimeout(finish,250);};imgs.forEach(im=>{if(im.complete)chk();else{im.onload=chk;im.onerror=chk;}});}
}

/* ===================== SESSION / TERM MANAGEMENT ===================== */
function termsDone(){return DB.settings.termsDone||[];}
function allTermsDone(){return TERMS.every(t=>termsDone().includes(t));}
function nextSessionStr(s){const m=(s||'').match(/(\d{4})\s*\/\s*(\d{4})/);if(m)return (+m[1]+1)+'/'+(+m[2]+1);const y=new Date().getFullYear();return y+'/'+(y+1);}
function termArchive(label){
  // Build a records bundle for download/email at term/session close.
  const data={school:DB.settings.schoolName,code:DB.settings.code,session:DB.settings.session,term:DB.settings.term,generated:new Date().toISOString(),
    students:DB.students,results:DB.results,payments:DB.payments,fees:DB.fees,attendance:DB.attendance,applicants:DB.applicants,remarks:DB.remarks,settings:DB.settings};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(DB.settings.code||'school')+'-archive-'+(label||DB.settings.session).replace(/[^a-z0-9]/gi,'_')+'-'+today()+'.json';a.click();
}
function vSession(){
  const done=termsDone(),cur=DB.settings.term;
  $('#view').innerHTML=`<div class="page-head"><div><h2>📆 Session & Terms</h2><p>${esc(DB.settings.session)} — manage term progress and start a new session</p></div></div>
  <div class="cards-row">${TERMS.map(t=>{const d=done.includes(t);const isCur=t===cur;return `<div class="stat" style="border-color:${d?'var(--green)':isCur?'var(--gold)':'var(--line)'}">
    <div class="lbl">${esc(t)}</div><div class="num" style="font-size:18px;color:${d?'var(--green)':isCur?'var(--amber)':'var(--muted)'}">${d?'✓ Completed':isCur?'In progress':'Pending'}</div></div>`;}).join('')}</div>
  <div class="card pad mb" style="max-width:680px"><h3 class="mb">Current term: ${esc(cur)}</h3>
    <p class="muted mb">Completing a term locks it for the records and moves the school to the next term. A records archive (pupils, results, payments, admissions) downloads automatically for safe-keeping. Your data also stays in the cloud.</p>
    <div class="fld" style="max-width:340px"><label>Records email (for your reference)</label><input id="se_email" value="${esc(DB.settings.recordEmail||'')}" placeholder="admin@school.com"></div>
    ${done.includes(cur)?`<p class="pill green">${esc(cur)} already completed.</p>`:`<button class="btn" onclick="confirmCompleteTerm()">✓ Complete ${esc(cur)} & download records</button>`}
  </div>
  <div class="card pad mb" style="max-width:680px;border-left:4px solid var(--green)"><h3 class="mb">🛟 Backup & restore</h3>
    <p class="muted mb">Your data lives in the cloud and is merged safely so nothing gets overwritten. Tap <b>Download backup</b> anytime to save a dated file to your device (keep it in Google Drive or email it to yourself for extra safety). To recover, tap <b>Restore</b> and choose a snapshot or a downloaded file. This device keeps <b>${listBackups(SCHOOL_CODE).length} automatic snapshot(s)</b>.</p>
    <div class="flex gap" style="flex-wrap:wrap"><button class="btn sec" onclick="manualSync()">🔄 Sync now</button><button class="btn gold" onclick="downloadBackup(SCHOOL_CODE)">⬇ Download backup</button><button class="btn sec" onclick="restoreBackupModal(SCHOOL_CODE)">↩ Restore</button></div></div>
  ${hasModule('weeks')?`<div class="card pad mb" style="max-width:680px"><h3 class="mb">📅 School week</h3>
    <div class="flex gap" style="align-items:center;flex-wrap:wrap"><div class="stat" style="padding:10px 18px"><div class="lbl">Current week</div><div class="num">Week ${currentWeek()} <span style="font-size:15px;color:var(--muted)">of ${termWeeks()}</span></div></div>
      <div style="flex:1;min-width:160px"><div style="background:#eef2ef;border-radius:6px;height:10px;overflow:hidden"><div class="bar" style="width:${Math.round(currentWeek()/termWeeks()*100)}%;height:10px"></div></div></div></div>
    <div class="grid2 mt" style="max-width:420px"><div class="fld"><label>Weeks in a term</label><input type="number" id="wk_total" value="${termWeeks()}"></div>
      <div class="fld"><label>${(DB.settings.dates&&DB.settings.dates.termBegin)?'Auto-calculated from term-begin date':'Set current week manually'}</label><input type="number" id="wk_set" value="${currentWeek()}" ${(DB.settings.dates&&DB.settings.dates.termBegin)?'disabled':''}></div></div>
    <button class="btn sec sm" onclick="saveWeeks()">Save</button>
    <p class="muted mt" style="font-size:12px">${(DB.settings.dates&&DB.settings.dates.termBegin)?'✓ The week auto-advances from the term-begin date set on the Calendar page.':'💡 Set the <b>Term begins</b> date on the Calendar page and the week will advance automatically.'}</p></div>`:''}
  <div class="card pad" style="max-width:680px;border-left:4px solid ${allTermsDone()?'var(--green)':'var(--line)'}">
    <h3 class="mb">Start new session</h3>
    ${allTermsDone()
      ? `<p class="muted mb">All three terms are completed. Starting a new session will <b>promote pupils</b> (based on the Promotions page), graduate Primary 6, advance to <b>${esc(nextSessionStr(DB.settings.session))}</b>, reset to First Term, and archive this session.</p>
         <button class="btn gold" onclick="confirmNewSession()">🎓 Promote & Start ${esc(nextSessionStr(DB.settings.session))}</button>`
      : `<p class="muted">🔒 You can start a new session only after <b>all three terms</b> are completed. Completed: ${done.length}/3.</p>`}
  </div>`;
}
function confirmCompleteTerm(){const cur=DB.settings.term;
  modal('Complete '+cur+'?',`<p>This locks <b>${esc(cur)}</b> for the records and moves the school on to the next term. Only do this when <b>${esc(cur)} is truly finished and every score is entered.</b></p>
    <p class="muted" style="font-size:12.5px">A records archive will download automatically. If you complete a term by mistake, you can undo it any time with <b>Reset / fix term</b>.</p>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="closeModal();completeTerm()">Yes, complete ${esc(cur)}</button>`);}
function completeTerm(){
  const cur=DB.settings.term;DB.settings.recordEmail=($('#se_email')&&$('#se_email').value.trim())||DB.settings.recordEmail||'';
  if(!termsDone().includes(cur))DB.settings.termsDone.push(cur);
  // advance to next not-done term (keep order)
  const nextT=TERMS.find(t=>!DB.settings.termsDone.includes(t));
  if(nextT)DB.settings.term=nextT;
  save();termArchive(DB.settings.session+'-'+cur);
  toast(cur+' completed — records downloaded');
  vSession();buildNav();$('#termBadge').textContent=DB.settings.term+' • '+DB.settings.session;
}
function confirmNewSession(){
  const next=nextSessionStr(DB.settings.session);
  let promo=0,grad=0,rep=0;
  DB.students.filter(s=>!s.graduated).forEach(s=>{const d=promotionFor(s).decision;if(d==='promote')promo++;else if(d==='graduate')grad++;else rep++;});
  modal('Start new session — '+next,`<p>This will close <b>${esc(DB.settings.session)}</b> and begin <b>${esc(next)}</b>:</p>
    <ul style="margin:10px 0 10px 18px;font-size:13.5px">
      <li><b>${promo}</b> pupil(s) promoted to the next class</li>
      <li><b>${grad}</b> Primary 6 pupil(s) graduated (kept as records)</li>
      <li><b>${rep}</b> pupil(s) repeating their class</li></ul>
    <p class="muted" style="font-size:12.5px">Past results stay saved under ${esc(DB.settings.session)}. A full session archive will download. This cannot be undone.</p>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="doNewSession()">Promote & Start ${esc(next)}</button>`);
}
function doNewSession(){
  termArchive('FULL-'+DB.settings.session);
  const next=nextSessionStr(DB.settings.session);
  DB.students.filter(s=>!s.graduated).forEach(s=>{const p=promotionFor(s);
    if(p.decision==='graduate'){s.graduated=true;s.graduatedSession=DB.settings.session;}
    else if(p.decision==='promote'){const i=DB.classes.findIndex(c=>c.id===s.classId);if(i>=0&&i+1<DB.classes.length)s.classId=DB.classes[i+1].id;}
    // repeat/pending: stay in same class
  });
  DB.settings.session=next;DB.settings.term='First Term';DB.settings.termsDone=[];
  save();closeModal();$('#termBadge').textContent=DB.settings.term+' • '+DB.settings.session;
  toast('New session '+next+' started');go('dashboard');
}

function saveWeeks(){DB.settings.termWeeks=Math.max(1,Number($('#wk_total').value)||13);const sw=$('#wk_set');if(sw&&!sw.disabled)DB.settings.currentWeek=Math.max(1,Number(sw.value)||1);save();vSession();toast('Weeks saved');}

      ${(window._parentKids&&window._parentKids.length>1)?`<div class="card pad mb"><div class="muted" style="font-size:11px;margin-bottom:5px">My children</div><div class="flex gap" style="flex-wrap:wrap">${window._parentKids.map(k=>`<button class="btn sm ${k.id===s.id?'':'sec'}" onclick="renderParentDash(DB.students.find(x=>x.id==='${k.id}'))">${esc(k.name)}</button>`).join('')}</div></div>`:''}
      ${HZparentCard(s)}
      <div class="cards-row">
        <div class="stat"><div class="lbl">Balance</div><div class="num" style="font-size:20px;color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</div><div class="meta">${naira(paid)} of ${naira(due)} paid</div></div>
        <div class="stat"><div class="lbl">Attendance</div><div class="num" style="font-size:20px">${tot?Math.round(pres/tot*100)+'%':'—'}</div><div class="meta">${pres}/${tot} present</div></div>

/* ===================== ACCOUNTS & FINANCE ===================== */
let finTab='overview';
const INCOME_CATS=['Donation','Grant','PTA Levy','Rent income','Fund-raising','Other'];
const EXPENSE_CATS=['Salaries','Utilities (light/water)','Rent','Maintenance','Teaching materials','Transport','Feeding','Examination','Other'];
function feesIncome(allTime){return DB.payments.filter(p=>p.status==='approved'&&(allTime||(p.session===DB.settings.session&&p.term===DB.settings.term))).reduce((a,p)=>a+(+p.amount||0),0);}
function ledgerSum(kind,allTime){return DB.ledger.filter(l=>l.kind===kind&&(allTime||(l.session===DB.settings.session&&l.term===DB.settings.term))).reduce((a,l)=>a+(+l.amount||0),0);}
function balanceAll(){return feesIncome(true)+ledgerSum('income',true)-ledgerSum('expense',true);}
function vFinance(){
  $('#view').innerHTML=`<div class="page-head"><div><h2>💵 School Accounts</h2><p>${esc(DB.settings.term)}, ${esc(DB.settings.session)}</p></div></div>
  <div class="subtabs">${[['overview','Overview'],['income','Income'],['expenses','Expenditure'],['salaries','Staff Salaries'],['statement','Statement 🖨']].map(([k,l])=>`<button class="subtab${finTab===k?' active':''}" onclick="finTab='${k}';vFinance()">${l}</button>`).join('')}</div>
  <div id="finArea"></div>`;
  ({overview:finOverview,income:()=>finList('income'),expenses:()=>finList('expense'),salaries:finSalaries,statement:finStatement}[finTab]||finOverview)();
}
function finOverview(){const inc=feesIncome()+ledgerSum('income'),exp=ledgerSum('expense'),bal=inc-exp;
  const recent=DB.ledger.slice().reverse().slice(0,10);
  $('#finArea').innerHTML=`<div class="cards-row">
    <div class="stat accent"><div class="lbl">Income (term)</div><div class="num">${naira(inc)}</div><div class="meta">incl. ${naira(feesIncome())} fees</div></div>
    <div class="stat"><div class="lbl">Expenditure (term)</div><div class="num" style="color:var(--red)">${naira(exp)}</div></div>
    <div class="stat"><div class="lbl">Term Balance</div><div class="num" style="color:${bal>=0?'var(--green)':'var(--red)'}">${naira(bal)}</div></div>
    <div class="stat"><div class="lbl">Total Balance (all-time)</div><div class="num" style="color:${balanceAll()>=0?'var(--green)':'var(--red)'}">${naira(balanceAll())}</div></div></div>
  <div class="card pad"><div class="flex" style="justify-content:space-between"><h3>Recent transactions</h3><div class="flex gap"><button class="btn sm" onclick="editLedger('income')">＋ Income</button><button class="btn sm sec" onclick="editLedger('expense')">＋ Expense</button></div></div>
  ${recent.length?`<div class="t-wrap mt"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th class="right">Amount</th></tr></thead><tbody>
    ${recent.map(l=>`<tr><td class="muted">${esc(l.date)}</td><td><span class="pill ${l.kind==='income'?'green':'red'}">${l.kind}</span></td><td>${esc(l.category)}</td><td>${esc(l.desc||'—')}</td><td class="right" style="color:${l.kind==='income'?'var(--green)':'var(--red)'}">${l.kind==='income'?'+':'−'}${naira(l.amount)}</td></tr>`).join('')}
  </tbody></table></div>`:'<p class="muted mt">No manual transactions yet. Fees collected are counted automatically.</p>'}</div>`;
}
function finList(kind){const list=DB.ledger.filter(l=>l.kind===kind).slice().reverse();const cats=kind==='income'?INCOME_CATS:EXPENSE_CATS;
  $('#finArea').innerHTML=`<div class="toolbar"><button class="btn" onclick="editLedger('${kind}')">＋ Add ${kind==='income'?'income':'expense'}</button>
    ${kind==='income'?`<span class="pill green">Fees collected this term: ${naira(feesIncome())} (auto)</span>`:`<span class="pill red">Total ${kind} this term: ${naira(ledgerSum('expense'))}</span>`}</div>
  ${list.length?`<div class="t-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Term</th><th class="right">Amount</th><th></th></tr></thead><tbody>
    ${list.map(l=>`<tr><td class="muted">${esc(l.date)}</td><td>${esc(l.category)}</td><td>${esc(l.desc||'—')}</td><td class="muted">${esc(l.term||'')}</td><td class="right"><b>${naira(l.amount)}</b></td>
      <td class="right" style="white-space:nowrap"><button class="btn icon" onclick="editLedger('${kind}','${l.id}')">✏️</button><button class="btn icon" onclick="delLedger('${l.id}')">🗑️</button></td></tr>`).join('')}
  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">${kind==='income'?'💰':'🧾'}</div>No ${kind} entries yet.</div></div>`}`;
}
function editLedger(kind,id){const l=id?DB.ledger.find(x=>x.id===id):{date:today(),kind};const cats=kind==='income'?INCOME_CATS:EXPENSE_CATS;
  modal((id?'Edit ':'Add ')+(kind==='income'?'income':'expense'),`<div class="grid2">
    <div class="fld"><label>Category</label><select id="lg_cat">${cats.map(c=>`<option ${l.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="fld"><label>Amount (₦) *</label><input id="lg_amt" type="number" value="${l.amount||''}"></div>
    <div class="fld"><label>Date</label><input id="lg_date" type="date" value="${esc(l.date||today())}"></div>
    <div class="fld"><label>Reference</label><input id="lg_ref" value="${esc(l.ref||'')}" placeholder="receipt/voucher no"></div>
    <div class="fld full"><label>Description</label><input id="lg_desc" value="${esc(l.desc||'')}"></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveLedger('${kind}','${id||''}')">Save</button>`);}
function saveLedger(kind,id){const amt=Number($('#lg_amt').value);if(!amt||amt<=0){toast('Valid amount required',true);return;}
  const obj={kind,category:$('#lg_cat').value,amount:amt,date:$('#lg_date').value,ref:$('#lg_ref').value.trim(),desc:$('#lg_desc').value.trim(),session:DB.settings.session,term:DB.settings.term,by:USER.name};
  if(id)Object.assign(DB.ledger.find(x=>x.id===id),obj);else{obj.id=uid('lg');DB.ledger.push(obj);}save();closeModal();vFinance();toast('Saved');}
function delLedger(id){DB.ledger=DB.ledger.filter(x=>x.id!==id);save();vFinance();toast('Removed');}
function finSalaries(){const staff=DB.users.filter(u=>u.role!=='owner');
  const paidThis=sid=>DB.ledger.filter(l=>l.kind==='expense'&&l.category==='Salaries'&&l.staffId===sid&&l.session===DB.settings.session&&l.term===DB.settings.term).reduce((a,l)=>a+(+l.amount||0),0);
  $('#finArea').innerHTML=`<p class="muted mb">Set each staff salary, then record a payment — it posts to Expenditure automatically.</p>
  <div class="t-wrap"><table><thead><tr><th>Staff</th><th>Role</th><th>Monthly salary (₦)</th><th class="right">Paid this term</th><th></th></tr></thead><tbody>
  ${staff.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td class="muted">${u.role==='admin'?'Admin':'Teacher'}</td>
    <td><input class="score-in" style="width:120px;text-align:right" type="number" value="${u.salary??''}" onchange="setSalary('${u.id}',this.value)"></td>
    <td class="right">${naira(paidThis(u.id))}</td>
    <td class="right"><button class="btn sm" onclick="paySalary('${u.id}')">Record payment</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function setSalary(uid,v){const u=DB.users.find(x=>x.id===uid);u.salary=Number(v)||0;save();}
function paySalary(uid){const u=DB.users.find(x=>x.id===uid);const amt=Number(u.salary)||0;if(!amt){toast('Set a salary amount first',true);return;}
  modal('Pay salary — '+u.name,`<div class="grid2"><div class="fld"><label>Amount (₦)</label><input id="sal_amt" type="number" value="${amt}"></div>
    <div class="fld"><label>For month</label><input id="sal_month" value="${new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'})}"></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="doPaySalary('${uid}')">Record payment</button>`);}
function doPaySalary(uid){const u=DB.users.find(x=>x.id===uid);const amt=Number($('#sal_amt').value)||0;if(!amt){toast('Amount required',true);return;}
  DB.ledger.push({id:uid('lg'),kind:'expense',category:'Salaries',amount:amt,date:today(),staffId:uid,desc:'Salary — '+u.name+' ('+$('#sal_month').value+')',session:DB.settings.session,term:DB.settings.term,by:USER.name});
  save();closeModal();finSalaries();toast('Salary recorded as expense');}
function finStatement(){
  const incFees=feesIncome(),incCats={},expCats={};
  DB.ledger.filter(l=>l.session===DB.settings.session&&l.term===DB.settings.term).forEach(l=>{const m=l.kind==='income'?incCats:expCats;m[l.category]=(m[l.category]||0)+(+l.amount||0);});
  const incTotal=incFees+Object.values(incCats).reduce((a,b)=>a+b,0);const expTotal=Object.values(expCats).reduce((a,b)=>a+b,0);const bal=incTotal-expTotal;const logo=DB.settings.logo?`<img src="${DB.settings.logo}">`:'🎓';
  const html=`<div class="rc" style="${themeVars()}"><div class="rc-top"><div class="rc-head"><div class="rc-crest">${logo}</div><div class="rc-sch"><h2>${esc(DB.settings.schoolName)}</h2><div class="addr">${addrTel()}</div></div></div></div>
    <div class="rc-title">✦ FINANCIAL STATEMENT — ${esc(DB.settings.term)}, ${esc(DB.settings.session)} ✦</div>
    <div style="padding:16px 22px">
      <h4 style="color:var(--rg);margin-bottom:6px">INCOME</h4><table class="rc-tbl" style="margin-bottom:14px"><tbody>
        <tr><td class="sub">School fees collected</td><td style="text-align:right">${naira(incFees)}</td></tr>
        ${Object.entries(incCats).map(([c,v])=>`<tr><td class="sub">${esc(c)}</td><td style="text-align:right">${naira(v)}</td></tr>`).join('')}
        <tr style="background:var(--cream)"><td class="sub"><b>Total Income</b></td><td style="text-align:right"><b>${naira(incTotal)}</b></td></tr></tbody></table>
      <h4 style="color:var(--rg);margin-bottom:6px">EXPENDITURE</h4><table class="rc-tbl" style="margin-bottom:14px"><tbody>
        ${Object.keys(expCats).length?Object.entries(expCats).map(([c,v])=>`<tr><td class="sub">${esc(c)}</td><td style="text-align:right">${naira(v)}</td></tr>`).join(''):'<tr><td class="sub muted">No expenses recorded</td><td style="text-align:right">₦0</td></tr>'}
        <tr style="background:var(--cream)"><td class="sub"><b>Total Expenditure</b></td><td style="text-align:right"><b>${naira(expTotal)}</b></td></tr></tbody></table>
      <div class="rc-sum"><span>Total Income: <b>${naira(incTotal)}</b></span><span>Total Expenditure: <b>${naira(expTotal)}</b></span><span>Balance: <b>${naira(bal)}</b></span></div>
      <div class="rc-sign" style="padding:16px 0 0"><div><div class="ln">Bursar / Accountant</div></div><div><div class="ln">Head Teacher</div></div></div>
    </div></div>`;
  $('#finArea').innerHTML=`<div class="no-print mb"><button class="btn gold" onclick="window.print()">🖨 Print / Save statement</button> <span class="muted" style="font-size:12px">All-time balance: <b>${naira(balanceAll())}</b></span></div>${html}`;
}

const GAL_CATS=['Sports / Inter-house','Cultural Day','Graduation','Excursion','Prize-giving','Academic','Religious','Other'];
function ytId(u){const m=(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/))([\w-]{11})/);return m?m[1]:'';}
function vimeoId(u){const m=(u||'').match(/vimeo\.com\/(?:video\/)?(\d+)/);return m?m[1]:'';}
function isFb(u){return /facebook\.com|fb\.watch|fb\.me/i.test(u||'');}
function videoEmbedSrc(u){const y=ytId(u);if(y)return 'https://www.youtube.com/embed/'+y+'?autoplay=1&rel=0';const v=vimeoId(u);if(v)return 'https://player.vimeo.com/video/'+v+'?autoplay=1';
  if(isFb(u))return 'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(u)+'&show_text=false&autoplay=true';return '';}
function videoThumb(u){const y=ytId(u);return y?'https://img.youtube.com/vi/'+y+'/hqdefault.jpg':'';}
function showLightbox(albumId,mediaIdx){const a=DB.gallery.find(x=>x.id===albumId);if(!a)return;const imgs=(a.media||[]).filter(m=>m.type==='image').map(m=>m.url);const cu=a.media[mediaIdx]&&a.media[mediaIdx].url;let i=imgs.indexOf(cu);if(i<0)i=0;window._lb={imgs,i};renderLightbox();}
function renderLightbox(){const lb=window._lb;if(!lb||!lb.imgs.length)return;let el=document.getElementById('lightbox');if(!el){el=document.createElement('div');el.id='lightbox';el.onclick=e=>{if(e.target===el)closeLightbox();};document.body.appendChild(el);}
  el.className='lb-open';el.innerHTML=`<button class="lb-x" onclick="closeLightbox()">✕</button>${lb.imgs.length>1?'<button class="lb-nav lb-prev" onclick="lbStep(-1)">‹</button><button class="lb-nav lb-next" onclick="lbStep(1)">›</button>':''}<img src="${lb.imgs[lb.i]}">${lb.imgs.length>1?`<div class="lb-count">${lb.i+1} / ${lb.imgs.length}</div>`:''}`;}
function lbStep(d){const lb=window._lb;lb.i=(lb.i+d+lb.imgs.length)%lb.imgs.length;renderLightbox();}
function closeLightbox(){const el=document.getElementById('lightbox');if(el)el.className='';}
document.addEventListener('keydown',e=>{const el=document.getElementById('lightbox');if(!el||el.className!=='lb-open')return;if(e.key==='Escape')closeLightbox();else if(e.key==='ArrowRight')lbStep(1);else if(e.key==='ArrowLeft')lbStep(-1);});
function playVideo(u){const src=videoEmbedSrc(u);const inner=src?`<div style="position:relative;padding-bottom:56.25%;height:0"><iframe src="${src}" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`:`<video controls autoplay src="${esc(u)}" style="width:100%;border-radius:8px"></video>`;
  modal('Video',inner,`<button class="btn sec" onclick="closeModal()">Close</button>`,true);}
function mediaTile(m,albumId,i,admin){const del=admin?`<button class="btn icon" style="position:absolute;top:4px;right:4px;background:#fff;z-index:3" onclick="event.stopPropagation();delMedia('${albumId}',${i})">✕</button>`:'';
  const drag=admin?`draggable="true" ondragstart="mediaDragStart(${i})" ondragover="event.preventDefault()" ondrop="mediaDrop('${albumId}',${i})"`:'';
  const ord=admin?`<div style="position:absolute;bottom:4px;left:4px;display:flex;gap:3px;z-index:3"><button class="btn icon" style="background:#fff;padding:2px 7px" onclick="event.stopPropagation();mediaMove('${albumId}',${i},-1)">◀</button><button class="btn icon" style="background:#fff;padding:2px 7px" onclick="event.stopPropagation();mediaMove('${albumId}',${i},1)">▶</button></div>`:'';
  if(m.type==='image')return `<div class="card" ${drag} style="overflow:hidden;position:relative;cursor:zoom-in" onclick="showLightbox('${albumId}',${i})">${del}${ord}<img src="${m.url}" style="width:100%;height:140px;object-fit:cover"></div>`;
  const th=videoThumb(m.url);const fb=isFb(m.url);
  const ph=th?`<img src="${th}" style="width:100%;height:100%;object-fit:cover">`:(fb?'<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1877f2,#0b5fce);color:#fff"><div style="font-size:30px;font-weight:800">f</div><div style="font-size:10px;letter-spacing:.05em">FACEBOOK VIDEO</div></div>':'<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;background:#000;color:#fff">🎬</div>');
  return `<div class="card vtile" ${drag} onclick="playVideo('${jq(m.url)}')">${ph}<div class="vplay"><span>▶</span></div>${del}${ord}</div>`;}
function vGallery(){
  $('#view').innerHTML=`<div class="page-head"><div><h2>🖼️ Events Gallery</h2><p>Photos & videos of school activities</p></div><button class="btn" onclick="editAlbum()">＋ Add activity / album</button></div>
  <div id="galArea"></div>`;renderGallery();
}
