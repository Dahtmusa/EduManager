/* ---- POS ---- */
function vPhPOS(){
  $('#view').innerHTML=`<div class="page-head"><div><h2>Sell (POS)</h2><p>Search or scan a product, build the cart, then checkout</p></div></div>
  <div class="flex gap" style="align-items:flex-start;flex-wrap:wrap">
    <div class="card pad" style="flex:1;min-width:300px">
      <div class="flex gap mb"><input id="pos_q" placeholder="🔎 Search name / category / barcode" oninput="phRenderPosList()" style="flex:1" onkeydown="if(event.key==='Enter')phQuickAdd()">
        <button class="btn sec" onclick="phScanToggle()" id="posScanBtn">📷 Scan</button></div>
      <div id="posScan" style="display:none"><div id="reader"></div><div class="muted center mb" style="font-size:12px">Point at the barcode.</div></div>
      <div id="posList"></div>
    </div>
    <div class="card pad" style="flex:1;min-width:300px">
      <h3 class="mb">🛒 Cart</h3><div id="posCart"></div>
    </div>
  </div>`;
  phRenderPosList();phRenderCart();}
function phRenderPosList(){const q=($('#pos_q')?$('#pos_q').value:'').toLowerCase().trim();
  let list=DB.products.filter(p=>!p.archived);
  if(q)list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q)||(p.barcode||'').toLowerCase()===q||(p.barcode||'').toLowerCase().includes(q));
  list=list.slice(0,60);
  const el=$('#posList');if(!el)return;
  el.innerHTML=list.length?`<div class="t-wrap" style="max-height:60vh;overflow:auto"><table><tbody>
    ${list.map(p=>{const out=Number(p.stock||0)<=0;const es=phExpStatus(p);return `<tr>
      <td><b>${esc(p.name)}</b>${es?` <span class="pill ${es.cls}">${es.txt}</span>`:''}<br><span class="muted" style="font-size:11px">${esc(p.category||'')}${p.unit?' · '+esc(p.unit):''} · Stock ${Number(p.stock||0)}</span></td>
      <td class="right" style="white-space:nowrap"><b>${pmoney(p.sell)}</b></td>
      <td class="right"><button class="btn sm ${out?'sec':''}" ${out?'disabled':''} style="${out?'':'background:#0c5b56;color:#fff'}" onclick="phAddCart('${p.id}')">${out?'Out':'＋ Add'}</button></td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="empty"><div class="big">💊</div>${DB.products.length?'No match.':'No products yet. Add them in Inventory.'}</div>`;}
function phQuickAdd(){const q=($('#pos_q').value||'').toLowerCase().trim();if(!q)return;
  const p=DB.products.find(x=>!x.archived&&((x.barcode||'').toLowerCase()===q))||DB.products.find(x=>!x.archived&&(x.name||'').toLowerCase().includes(q));
  if(p){phAddCart(p.id);$('#pos_q').value='';phRenderPosList();}}
function phAddCart(id){const p=phProd(id);if(!p)return;const stock=Number(p.stock||0);
  const line=PH_CART.find(c=>c.id===id);
  if(line){if(line.qty>=stock){toast('Only '+stock+' in stock',true);return;}line.qty++;}
  else{if(stock<=0){toast('Out of stock',true);return;}PH_CART.push({id,qty:1});}
  phRenderCart();}
function phCartQty(id,delta){const line=PH_CART.find(c=>c.id===id);if(!line)return;const p=phProd(id);const stock=Number(p.stock||0);
  line.qty+=delta;if(line.qty<=0){PH_CART=PH_CART.filter(c=>c.id!==id);}else if(line.qty>stock){line.qty=stock;toast('Only '+stock+' in stock',true);}
  phRenderCart();}
function phCartSet(id,val){const line=PH_CART.find(c=>c.id===id);if(!line)return;const p=phProd(id);const stock=Number(p.stock||0);let q=Math.floor(Number(val)||0);if(q>stock){q=stock;toast('Only '+stock+' in stock',true);}if(q<=0){PH_CART=PH_CART.filter(c=>c.id!==id);}else line.qty=q;phRenderCart();}
function phRemoveCart(id){PH_CART=PH_CART.filter(c=>c.id!==id);phRenderCart();}
function phCartTotal(){return PH_CART.reduce((a,c)=>{const p=phProd(c.id);return a+(p?Number(p.sell||0)*c.qty:0);},0);}
function phRenderCart(){const el=$('#posCart');if(!el)return;
  if(!PH_CART.length){el.innerHTML=`<div class="empty"><div class="big">🛒</div>Cart is empty.</div>`;return;}
  const total=phCartTotal();
  el.innerHTML=`<div class="t-wrap"><table><tbody>
    ${PH_CART.map(c=>{const p=phProd(c.id);if(!p)return '';return `<tr>
      <td><b>${esc(p.name)}</b><br><span class="muted" style="font-size:11px">${pmoney(p.sell)} each</span></td>
      <td style="white-space:nowrap"><button class="btn icon sm" onclick="phCartQty('${c.id}',-1)">−</button>
        <input value="${c.qty}" onchange="phCartSet('${c.id}',this.value)" style="width:46px;text-align:center;display:inline-block;padding:4px">
        <button class="btn icon sm" onclick="phCartQty('${c.id}',1)">＋</button></td>
      <td class="right"><b>${pmoney(p.sell*c.qty)}</b></td>
      <td class="right"><button class="btn icon sm danger" onclick="phRemoveCart('${c.id}')">✕</button></td></tr>`;}).join('')}
  </tbody></table></div>
  <div class="flex" style="justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin:10px 0;padding-top:8px;border-top:2px solid #eee"><span>Total</span><span style="color:#0c5b56">${pmoney(total)}</span></div>
  <div class="grid2"><div class="fld"><label>Payment</label><select id="pos_pay"><option>Cash</option><option>Transfer</option><option>POS / Card</option><option>Credit</option></select></div>
    <div class="fld"><label>Customer (optional)</label><input id="pos_cust" placeholder="Walk-in"></div></div>
  <div class="fld"><label>Amount paid now (${phCur()})</label><input id="pos_paid" type="number" min="0" step="0.01" value="${total}" oninput="phPaidHint(${total})"></div>
  <div id="pos_balhint" class="muted" style="font-size:12px;margin:-4px 0 8px"></div>
  <div class="flex gap"><button class="btn" style="flex:1;justify-content:center;background:#0c5b56" onclick="phCheckout()">✓ Checkout · ${pmoney(total)}</button>
    <button class="btn sec" onclick="PH_CART=[];phRenderCart()">Clear</button></div>`;}
function phPaidHint(total){const v=Math.max(0,Number($('#pos_paid').value)||0);const bal=Math.max(0,total-v);const el=$('#pos_balhint');if(!el)return;
  el.innerHTML=bal>0?`<span style="color:#c0392b;font-weight:700">Balance (customer owes): ${pmoney(bal)}</span>`:`<span style="color:#0a7d33">Paid in full ✓</span>`;}
function phCheckout(){if(!PH_CART.length){toast('Cart is empty',true);return;}
  for(const c of PH_CART){const p=phProd(c.id);if(!p||c.qty>Number(p.stock||0)){toast('Not enough stock for '+(p?p.name:'item'),true);return;}}
  const items=PH_CART.map(c=>{const p=phProd(c.id);return{productId:p.id,name:p.name,qty:c.qty,price:Number(p.sell||0),cost:Number(p.cost||0)};});
  const total=items.reduce((a,i)=>a+i.price*i.qty,0);const cost=items.reduce((a,i)=>a+i.cost*i.qty,0);
  DB.settings.receiptSeq=(DB.settings.receiptSeq||0)+1;
  const paid=Math.min(total,Math.max(0,Number($('#pos_paid').value)||0));const balance=Math.max(0,total-paid);
  const sale={id:uid('sl'),receiptNo:'PH/'+String(DB.settings.receiptSeq).padStart(4,'0'),date:new Date().toISOString(),
    items,total,cost,profit:total-cost,payment:$('#pos_pay').value,customer:($('#pos_cust').value||'').trim(),cashier:USER.name,
    paid,balance,settled:balance<=0.001,payments:paid>0?[{date:new Date().toISOString(),amount:paid,method:$('#pos_pay').value}]:[]};
  items.forEach(i=>{const p=phProd(i.productId);if(p)p.stock=Number(p.stock||0)-i.qty;});
  DB.sales.push(sale);save();PH_CART=[];
  toast(balance>0?('Sale recorded · balance '+pmoney(balance)):('Sale recorded · '+pmoney(total)));phShowReceipt(sale.id);vPhPOS();}
function phReceiptHTML(s){const set=DB.settings;const logo=set.logo?`<img src="${set.logo}" style="width:46px;height:46px;border-radius:8px;object-fit:cover">`:'<div style="font-size:34px">💊</div>';
  return `<div class="receipt" style="max-width:330px;margin:0 auto;font-family:'Courier New',monospace;color:#111;background:#fff;padding:14px 16px;border:1px solid #ddd">
    <div style="text-align:center;border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px">${logo}
      <div style="font-weight:800;font-size:15px">${esc(set.storeName)}</div>
      ${set.slogan?`<div style="font-size:10px;font-style:italic">${esc(set.slogan)}</div>`:''}
      <div style="font-size:11px">${esc(set.address||'')}</div>${set.phone?`<div style="font-size:11px">☎ ${esc(set.phone)}</div>`:''}</div>
    <div style="font-size:11.5px;display:flex;justify-content:space-between"><span>${esc(s.receiptNo)}</span><span>${esc((s.date||'').replace('T',' ').slice(0,16))}</span></div>
    <div style="font-size:11.5px;margin-bottom:6px">Cashier: ${esc(s.cashier||'')}${s.customer?' · '+esc(s.customer):''}</div>
    <table style="width:100%;font-size:11.5px;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid #000"><th style="text-align:left">Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Amt</th></tr></thead>
      <tbody>${(s.items||[]).map(i=>`<tr><td style="text-align:left">${esc(i.name)}<br><span style="color:#666">@${pmoney(i.price)}</span></td><td style="text-align:center">${i.qty}</td><td style="text-align:right">${pmoney(i.price*i.qty)}</td></tr>`).join('')}</tbody>
    </table>
    <div style="border-top:1px dashed #999;margin-top:8px;padding-top:6px;display:flex;justify-content:space-between;font-weight:800;font-size:15px"><span>TOTAL</span><span>${pmoney(s.total)}</span></div>
    <div style="font-size:11.5px;display:flex;justify-content:space-between"><span>Payment</span><span>${esc(s.payment||'')}</span></div>
    ${(Number(s.balance||0)>0)?`<div style="font-size:11.5px;display:flex;justify-content:space-between"><span>Paid</span><span>${pmoney(s.paid||0)}</span></div>
    <div style="font-size:13px;display:flex;justify-content:space-between;font-weight:800;color:#c0392b;margin-top:2px"><span>BALANCE DUE</span><span>${pmoney(s.balance)}</span></div>`:''}
    <div style="text-align:center;font-size:11px;margin-top:10px;border-top:1px dashed #999;padding-top:8px">Thank you. Goods sold in good faith.<br>Powered by Muscode</div>
  </div>`;}
function phShowReceipt(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;
  modal('Receipt — '+s.receiptNo,phReceiptHTML(s),`<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn no-print" style="background:#25d366" onclick="storeShareReceipt('${s.id}')">💬 WhatsApp image</button><button class="btn no-print" style="background:#0c5b56" onclick="window.print()">🖨 Print</button>`);}
/* POS scan reuses Html5Qrcode */
function phScanToggle(){const box=$('#posScan');if(!box)return;if(box.style.display==='none'){box.style.display='block';phStartPosScan();}else{stopScan();box.style.display='none';}}
function phStartPosScan(){if(!window.Html5Qrcode){toast('Scanner not loaded',true);return;}if(window._scanner)return;
  const fmts=window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.QR_CODE]:undefined;
  window._scanner=new Html5Qrcode('reader');
  window._scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:140},formatsToSupport:fmts},txt=>phScanned(txt),()=>{}).catch(()=>{toast('Camera failed',true);window._scanner=null;});}
function phScanned(code){code=(code||'').trim();const p=DB.products.find(x=>!x.archived&&(x.barcode||'')===code);if(p){phAddCart(p.id);toast('Added '+p.name);}else{toast('No product with barcode '+code,true);}}

/* ---- Sales history + debtors ---- */
function phSaleBalance(s){if(s.voided)return 0;if(s.balance!=null)return Number(s.balance||0);return (s.payment==='Credit'&&!s.settled)?Number(s.total||0):0;}
function phCreditOutstanding(){return DB.sales.reduce((a,s)=>a+phSaleBalance(s),0);}
function vPhSales(){const t=today();if(!PH_SFROM)PH_SFROM=t.slice(0,8)+'01';if(!PH_STO)PH_STO=t;
  $('#view').innerHTML=`<div class="page-head"><div><h2>Sales</h2><p>History, receipts, refunds & debtors</p></div>
    <button class="btn" style="background:#0c5b56" onclick="go('pos')">🛒 New Sale</button></div>
  <div class="toolbar no-print"><div><label>From</label><input id="sl_from" type="date" value="${PH_SFROM}" onchange="PH_SFROM=this.value;phRenderSales()"></div>
    <div><label>To</label><input id="sl_to" type="date" value="${PH_STO}" onchange="PH_STO=this.value;phRenderSales()"></div>
    <div style="flex:1"><label>Search</label><input id="sl_q" value="${esc(PH_SQ)}" placeholder="receipt / customer" oninput="PH_SQ=this.value;phRenderSales()"></div>
    <div style="align-self:flex-end"><button class="btn sm sec" onclick="phSRange('today')">Today</button><button class="btn sm sec" onclick="phSRange('all')">All</button></div></div>
  <div id="slArea"></div>`;phRenderSales();}
function phSRange(k){const t=today();if(k==='today'){PH_SFROM=t;PH_STO=t;}else{PH_SFROM='2000-01-01';PH_STO=t;}
  const f=$('#sl_from'),to=$('#sl_to');if(f)f.value=PH_SFROM;if(to)to.value=PH_STO;phRenderSales();}
function phRenderSales(){const q=PH_SQ.toLowerCase().trim();
  let list=DB.sales.filter(s=>{const d=(s.date||'').slice(0,10);return (!PH_SFROM||d>=PH_SFROM)&&(!PH_STO||d<=PH_STO);});
  if(q)list=list.filter(s=>(s.receiptNo||'').toLowerCase().includes(q)||(s.customer||'').toLowerCase().includes(q));
  list=list.slice().reverse();
  const valid=list.filter(s=>!s.voided);
  const gross=valid.reduce((a,s)=>a+Number(s.total||0),0),profit=valid.reduce((a,s)=>a+Number(s.profit||0),0);
  const debt=phCreditOutstanding();
  const el=$('#slArea');if(!el)return;
  el.innerHTML=`<div class="cards-row">
    ${phStat('Transactions',valid.length,'in range')}
    ${phStat('Gross sales',pmoney(gross),'','#0c5b56')}
    ${phStat('Profit',pmoney(profit),'','#0a7d33')}
    ${phStat('Debtors (credit)',pmoney(debt),'unpaid',debt?'#c0392b':'')}
  </div>
  ${list.length?`<div class="t-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Pay</th><th class="right">Total</th><th class="right">Profit</th><th></th></tr></thead><tbody>
    ${list.map(s=>{const bal=phSaleBalance(s);return `<tr${s.voided?' style="opacity:.5"':''}>
      <td><b>${esc(s.receiptNo||'')}</b>${s.voided?' <span class="pill red">VOID</span>':''}</td>
      <td>${esc((s.date||'').replace('T',' ').slice(0,16))}</td>
      <td>${esc(s.customer||'—')}</td>
      <td>${esc(s.payment||'')}${bal>0?` <span class="pill gold">owes ${pmoney(bal)}</span>`:''}</td>
      <td class="right">${pmoney(s.total)}</td><td class="right" style="color:#0a7d33">${pmoney(s.profit)}</td>
      <td class="right" style="white-space:nowrap"><button class="btn sm sec" onclick="phShowReceipt('${s.id}')">Receipt</button>${bal>0?`<button class="btn sm" style="background:#0a7d33" onclick="phCustPay('${s.id}')">＋ Payment</button>`:''}${!s.voided?`<button class="btn sm danger" onclick="phVoidSale('${s.id}')">Void</button>`:''}</td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">🧾</div>No sales in range.</div></div>`}`;}
function phCustPay(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const bal=phSaleBalance(s);
  modal('Record customer payment — '+s.receiptNo,`<p class="muted mb">${esc(s.customer||'Customer')} · Total ${pmoney(s.total)} · Outstanding <b style="color:#c0392b">${pmoney(bal)}</b></p><div class="grid2">
    <div class="fld"><label>Amount received (${phCur()})</label><input id="phcp_amt" type="number" min="0" step="0.01" value="${bal}"></div>
    <div class="fld"><label>Method</label><select id="phcp_method"><option>Cash</option><option>Transfer</option><option>POS / Card</option></select></div>
  </div>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#0a7d33" onclick="phDoCustPay('${id}')">Record payment</button>`);}
function phDoCustPay(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const bal=phSaleBalance(s);
  let amt=Math.max(0,Number($('#phcp_amt').value)||0);if(amt<=0){toast('Enter an amount',true);return;}if(amt>bal)amt=bal;
  s.payments=s.payments||[];s.payments.push({date:new Date().toISOString(),amount:amt,method:$('#phcp_method').value});
  s.paid=Number(s.paid||0)+amt;s.balance=Math.max(0,Number(s.total||0)-Number(s.paid||0));s.settled=s.balance<=0.001;
  DB.settings.custPaySeq=(DB.settings.custPaySeq||0)+1;
  const pay={no:'RC/'+String(DB.settings.custPaySeq).padStart(4,'0'),date:new Date().toISOString(),amount:amt,method:$('#phcp_method').value,balAfter:s.balance};
  save();closeModal();toast('Payment recorded · '+pmoney(amt));phShowCustPayReceipt(s.id,pay);}
function phCustPayReceiptHTML(s,pay){const set=DB.settings;const logo=set.logo?`<img src="${set.logo}" style="width:46px;height:46px;border-radius:8px;object-fit:cover">`:'<div style="font-size:34px">💊</div>';

    <div style="text-align:center;font-weight:800;letter-spacing:.04em;margin-bottom:8px">PAYMENT RECEIPT</div>
    <div style="font-size:12.5px;line-height:1.9">
      <div style="display:flex;justify-content:space-between"><span>Receipt No.</span><b>${esc(pay.no)}</b></div>
      <div style="display:flex;justify-content:space-between"><span>Date</span><span>${esc((pay.date||'').slice(0,10))}</span></div>
      <div style="display:flex;justify-content:space-between"><span>Customer</span><b>${esc(s.customer||'—')}</b></div>
      <div style="display:flex;justify-content:space-between"><span>For sale</span><span>${esc(s.receiptNo||'')}</span></div>
      <div style="display:flex;justify-content:space-between"><span>Method</span><span>${esc(pay.method||'')}</span></div>
    </div>

function phSavePurchase(){const sup=$('#pu_sup').value;const items=[];
  DB.products.forEach(p=>{const qel=$('#pu_q_'+p.id);if(!qel)return;const q=Math.floor(Number(qel.value)||0);if(q>0){const c=Number($('#pu_c_'+p.id).value)||0;items.push({productId:p.id,name:p.name,qty:q,cost:c});}});
  if(!items.length){toast('Enter at least one quantity',true);return;}
  const total=items.reduce((a,i)=>a+i.qty*i.cost,0);const paid=Math.max(0,Number($('#pu_paid').value)||0);
  const date=$('#pu_date').value?new Date($('#pu_date').value).toISOString():new Date().toISOString();
  items.forEach(i=>{const p=phProd(i.productId);if(p){p.stock=Number(p.stock||0)+i.qty;if(i.cost)p.cost=i.cost;p.supplierId=sup;}});
  const s=phSupplier(sup);if(s)s.balance=Number(s.balance||0)+(total-paid);
  DB.purchases.push({id:uid('pu'),date,supplierId:sup,items,total,paid,note:$('#pu_note').value.trim()});

function vPhReports(){const t=today();if(!PH_FROM){PH_FROM=t.slice(0,8)+'01';}if(!PH_TO)PH_TO=t;
  $('#view').innerHTML=`<div class="page-head"><div><h2>Reports</h2><p>Sales, profit & stock</p></div>

function phRange(k){const t=today();if(k==='today'){PH_FROM=t;PH_TO=t;}else if(k==='month'){PH_FROM=t.slice(0,8)+'01';PH_TO=t;}else if(k==='all'){PH_FROM='2000-01-01';PH_TO=t;}
  const f=$('#rp_from'),to=$('#rp_to');if(f)f.value=PH_FROM;if(to)to.value=PH_TO;phRenderReports();}
function phRenderReports(){const sales=phSalesIn(PH_FROM,PH_TO);
  const gross=sales.reduce((a,s)=>a+Number(s.total||0),0);
  const cost=sales.reduce((a,s)=>a+Number(s.cost||0),0);
  const profit=gross-cost;
  const byPay={};sales.forEach(s=>{byPay[s.payment||'Cash']=(byPay[s.payment||'Cash']||0)+Number(s.total||0);});
  const agg={};sales.forEach(s=>(s.items||[]).forEach(i=>{const a=agg[i.productId]||(agg[i.productId]={name:i.name,qty:0,rev:0});a.qty+=Number(i.qty||0);a.rev+=Number(i.price||0)*Number(i.qty||0);}));
  const best=Object.values(agg).sort((a,b)=>b.qty-a.qty).slice(0,10);
  const low=phLow(),exp=phExpiring();
  const expTotal=storeExpensesIn(PH_FROM,PH_TO).reduce((a,e)=>a+Number(e.amount||0),0);const net=profit-expTotal;
  const el=$('#rpArea');if(!el)return;
  el.innerHTML=`<div class="cards-row">

    ${phStat('Gross sales',pmoney(gross),'','#0c5b56')}
    ${phStat('Gross profit',pmoney(profit),gross?((profit/gross*100).toFixed(1)+'% margin'):'','#0a7d33')}
    ${phStat('Expenses',pmoney(expTotal),'',expTotal?'#c0392b':'')}
    ${phStat('NET PROFIT',pmoney(net),'after expenses',net>=0?'#0a7d33':'#c0392b')}
  </div>
  <div class="flex gap" style="flex-wrap:wrap;align-items:flex-start">
    <div class="card pad" style="flex:1;min-width:280px"><h3 class="mb">Best sellers</h3>
      ${best.length?`<div class="t-wrap"><table><thead><tr><th>Product</th><th class="right">Qty</th><th class="right">Revenue</th></tr></thead><tbody>
        ${best.map(b=>`<tr><td>${esc(b.name)}</td><td class="right">${b.qty}</td><td class="right">${pmoney(b.rev)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No sales in range.</div>`}</div>
    <div class="card pad" style="flex:1;min-width:240px"><h3 class="mb">Payment methods</h3>
      ${Object.keys(byPay).length?`<div class="t-wrap"><table><tbody>${Object.entries(byPay).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="right"><b>${pmoney(v)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">—</div>`}
      <hr><div class="flex" style="justify-content:space-between"><span class="muted">Stock value (cost)</span><b>${pmoney(phStockValue())}</b></div>
      <div class="flex" style="justify-content:space-between"><span class="muted">Stock value (retail)</span><b>${pmoney(phRetailValue())}</b></div>
    </div>
  </div>
  <div class="flex gap" style="flex-wrap:wrap;align-items:flex-start">
    <div class="card pad" style="flex:1;min-width:280px"><h3 class="mb">⚠️ Low stock (${low.length})</h3>
      ${low.length?`<div class="t-wrap"><table><thead><tr><th>Product</th><th class="right">Stock</th><th class="right">Reorder ≤</th></tr></thead><tbody>${low.map(p=>`<tr><td>${esc(p.name)}</td><td class="right">${Number(p.stock||0)}</td><td class="right">${phReorder(p)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">All good 👍</div>`}</div>
    <div class="card pad" style="flex:1;min-width:280px"><h3 class="mb">⏳ Expiring / expired (${exp.length})</h3>
      ${exp.length?`<div class="t-wrap"><table><thead><tr><th>Product</th><th>Expiry</th><th class="right">Stock</th></tr></thead><tbody>${exp.map(p=>{const es=phExpStatus(p);return `<tr><td>${esc(p.name)}</td><td>${esc(p.expiry||'')} <span class="pill ${es.cls}">${es.txt}</span></td><td class="right">${Number(p.stock||0)}</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty">None 👍</div>`}</div>
  </div>
  ${storeExpensesCardHTML(PH_FROM,PH_TO,'phRenderReports')}`;}

function phExportCSV(type){let rows,name;
  if(type==='inventory'){name='inventory';rows=[['Name','Category','Unit','Stock','Cost','Sell','Reorder','Expiry','Batch','Barcode']];
    DB.products.filter(p=>!p.archived).forEach(p=>rows.push([p.name,p.category||'',p.unit||'',p.stock||0,p.cost||0,p.sell||0,phReorder(p),p.expiry||'',p.batch||'',p.barcode||'']));}
  else{name='sales';rows=[['Receipt','Date','Items','Total','Paid','Balance','Cost','Profit','Payment','Customer','Voided']];
    DB.sales.forEach(s=>rows.push([s.receiptNo,(s.date||'').replace('T',' ').slice(0,16),(s.items||[]).reduce((a,i)=>a+Number(i.qty||0),0),s.total||0,(s.paid!=null?s.paid:s.total)||0,phSaleBalance(s),s.cost||0,s.profit||0,s.payment||'',s.customer||'',s.voided?'YES':'']));}
  const csv=rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(DB.settings.shortName||DB.settings.storeName||'pharmacy')+'-'+name+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('CSV downloaded');}

function phSubInfo(reg){const sub=reg.sub||{};if(!sub.fee){return{cls:'grey',txt:'No fee set'};}
  const due=sub.due;if(!due)return{cls:'grey',txt:pmoneyOwner(sub.fee)+'/mo'};
  const days=Math.round((new Date(due).getTime()-new Date(today()).getTime())/86400000);
  if(days<0)return{cls:'red',txt:'Overdue '+(-days)+'d'};if(days<=7)return{cls:'gold',txt:'Due in '+days+'d'};return{cls:'green',txt:'Paid · due '+due};}

function savePharmacy(code){const name=$('#ph_name').value.trim(),addr=$('#ph_addr').value.trim(),phone=$('#ph_phone').value.trim();
  if(!name){toast('Name required',true);return;}if(!addr){toast('Address required',true);return;}
  if(!phone||phone.replace(/\D/g,'').length<7){toast('Valid phone required',true);return;}
  const fee=Math.max(0,Number($('#ph_fee').value)||0),due=$('#ph_due').value,cur=$('#ph_cur').value.trim()||'₦',theme=$('#ph_theme').value,status=$('#ph_status').value;
  if(code){const reg=MASTER.schools.find(s=>s.code===code);reg.name=name;reg.status=status;reg.sub=Object.assign(reg.sub||{},{fee,due});
    const d=STORE[code];Object.assign(d.settings,{storeName:name,shortName:$('#ph_short').value.trim(),address:addr,phone,email:$('#ph_email').value.trim(),currency:cur,theme,status,slogan:$('#ph_slogan').value.trim(),logo:(typeof _logo==='string'?_logo:d.settings.logo)});
    saveMaster();saveSchoolRow(code);closeModal();toast('Pharmacy updated');managePharmacy(code);return;}
  const newCode=$('#ph_code').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').replace(/^-+|-+$/g,'');
  if(!newCode){toast('Code required',true);return;}
  if(MASTER.schools.some(s=>s.code===newCode)){toast('Code already exists',true);return;}
  const auser=$('#ph_auser').value.trim(),apass=$('#ph_apass').value.trim();if(!auser||!apass){toast('Manager login required',true);return;}
  const d=seedPharmacy(newCode,name);Object.assign(d.settings,{shortName:$('#ph_short').value.trim(),address:addr,phone,email:$('#ph_email').value.trim(),currency:cur,theme,status,slogan:$('#ph_slogan').value.trim(),logo:(typeof _logo==='string'?_logo:'')});
  d.users[0].name=$('#ph_aname').value.trim()||'Pharmacy Manager';d.users[0].username=auser;d.users[0].password=apass;
  STORE[newCode]=d;MASTER.schools.push({code:newCode,name,type:'pharmacy',status,createdAt:today(),sub:{fee,due,lastPaid:'',history:[]}});

function managePharmacy(code){const reg=MASTER.schools.find(s=>s.code===code);const d=STORE[code];if(!d){toast('Data not loaded',true);return;}

function phMarkPaid(code){const reg=MASTER.schools.find(s=>s.code===code);const sub=reg.sub=reg.sub||{fee:0,history:[]};

let AU_CART=[], AU_FROM='', AU_TO='', AU_SFROM='', AU_STO='', AU_SQ='', AU_INVQ='';

function seedAuto(code,name){return{kind:'autoparts',

function ensureAuto(d){d.kind='autoparts';d.settings=d.settings||{};const s=d.settings;
  if(!s.currency)s.currency='₦';if(s.lowStock==null)s.lowStock=3;if(!s.theme)s.theme='blue';
  if(!s.status)s.status='active';if(s.receiptSeq==null)s.receiptSeq=0;if(!s.storeName)s.storeName=s.schoolName||'Auto Parts';
  if(s.supPaySeq==null)s.supPaySeq=0;if(s.custPaySeq==null)s.custPaySeq=0;
  ['products','suppliers','sales','purchases','adjustments','supplierPayments','expenses'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  if(!Array.isArray(d.users)||!d.users.length)d.users=[{id:'u1',name:'Store Operator',username:'admin',password:'admin123',role:'admin'}];
  return d;}
/* ---- helpers ---- */
function auCur(){return (DB.settings.currency||'₦');}
function amoney(n){return auCur()+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-NG');}
function auProd(id){return DB.products.find(p=>p.id===id);}
function auReorder(p){return (p.reorder!=null&&p.reorder!=='')?Number(p.reorder):Number(DB.settings.lowStock||0);}
function auLow(){return DB.products.filter(p=>!p.archived&&Number(p.stock||0)<=auReorder(p));}
function auStockValue(){return DB.products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.cost||0),0);}
function auRetailValue(){return DB.products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.sell||0),0);}
function auSalesIn(from,to){return DB.sales.filter(s=>{if(s.voided)return false;const d=(s.date||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to);});}
function auSupplier(id){return DB.suppliers.find(x=>x.id===id);}
function auPartLine(p){return [p.partNo,p.brand].filter(Boolean).join(' · ');}

function auRenderPosList(){const q=($('#aupos_q')?$('#aupos_q').value:'').toLowerCase().trim();
  let list=DB.products.filter(p=>!p.archived);
  if(q)list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.partNo||'').toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q)||(p.fitment||'').toLowerCase().includes(q)||(p.barcode||'').toLowerCase().includes(q));

      <td class="right" style="white-space:nowrap"><b>${amoney(p.sell)}</b></td>
      <td class="right"><button class="btn sm ${out?'sec':''}" ${out?'disabled':''} style="${out?'':'background:#15366e;color:#fff'}" onclick="auAddCart('${p.id}')">${out?'Out':'＋ Add'}</button></td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="empty"><div class="big">🔧</div>${DB.products.length?'No match.':'No parts yet. Add them in Inventory.'}</div>`;}
function auQuickAdd(){const q=($('#aupos_q').value||'').toLowerCase().trim();if(!q)return;
  const p=DB.products.find(x=>!x.archived&&((x.barcode||'').toLowerCase()===q||(x.partNo||'').toLowerCase()===q))||DB.products.find(x=>!x.archived&&(x.name||'').toLowerCase().includes(q));
  if(p){auAddCart(p.id);$('#aupos_q').value='';auRenderPosList();}}
function auAddCart(id){const p=auProd(id);if(!p)return;const stock=Number(p.stock||0);const line=AU_CART.find(c=>c.id===id);
  if(line){if(line.qty>=stock){toast('Only '+stock+' in stock',true);return;}line.qty++;}else{if(stock<=0){toast('Out of stock',true);return;}AU_CART.push({id,qty:1});}auRenderCart();}
function auCartQty(id,delta){const line=AU_CART.find(c=>c.id===id);if(!line)return;const p=auProd(id);const stock=Number(p.stock||0);
  line.qty+=delta;if(line.qty<=0){AU_CART=AU_CART.filter(c=>c.id!==id);}else if(line.qty>stock){line.qty=stock;toast('Only '+stock+' in stock',true);}auRenderCart();}
function auCartSet(id,val){const line=AU_CART.find(c=>c.id===id);if(!line)return;const p=auProd(id);const stock=Number(p.stock||0);let q=Math.floor(Number(val)||0);if(q>stock){q=stock;toast('Only '+stock+' in stock',true);}if(q<=0){AU_CART=AU_CART.filter(c=>c.id!==id);}else line.qty=q;auRenderCart();}
function auRemoveCart(id){AU_CART=AU_CART.filter(c=>c.id!==id);auRenderCart();}
function auCartTotal(){return AU_CART.reduce((a,c)=>{const p=auProd(c.id);return a+(p?Number(p.sell||0)*c.qty:0);},0);}
function auRenderCart(){const el=$('#auposCart');if(!el)return;
  if(!AU_CART.length){el.innerHTML=`<div class="empty"><div class="big">🛒</div>Cart is empty.</div>`;return;}
  const total=auCartTotal();
  el.innerHTML=`<div class="t-wrap"><table><tbody>
    ${AU_CART.map(c=>{const p=auProd(c.id);if(!p)return '';return `<tr>
      <td><b>${esc(p.name)}</b><br><span class="muted" style="font-size:11px">${amoney(p.sell)} each</span></td>
      <td style="white-space:nowrap"><button class="btn icon sm" onclick="auCartQty('${c.id}',-1)">−</button>
        <input value="${c.qty}" onchange="auCartSet('${c.id}',this.value)" style="width:46px;text-align:center;display:inline-block;padding:4px">

      <td class="right"><b>${amoney(p.sell*c.qty)}</b></td>

  </tbody></table></div>
  <div class="flex" style="justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin:10px 0;padding-top:8px;border-top:2px solid #eee"><span>Total</span><span style="color:#15366e">${amoney(total)}</span></div>

function auPaidHint(total){const v=Math.max(0,Number($('#aupos_paid').value)||0);const bal=Math.max(0,total-v);const el=$('#aupos_balhint');if(!el)return;
  el.innerHTML=bal>0?`<span style="color:#c0392b;font-weight:700">Balance (customer owes): ${amoney(bal)}</span>`:`<span style="color:#0a7d33">Paid in full ✓</span>`;}
function auCheckout(){if(!AU_CART.length){toast('Cart is empty',true);return;}

  const items=AU_CART.map(c=>{const p=auProd(c.id);return{productId:p.id,name:p.name,partNo:p.partNo||'',qty:c.qty,price:Number(p.sell||0),cost:Number(p.cost||0)};});
  const total=items.reduce((a,i)=>a+i.price*i.qty,0);const cost=items.reduce((a,i)=>a+i.cost*i.qty,0);

  items.forEach(i=>{const p=auProd(i.productId);if(p)p.stock=Number(p.stock||0)-i.qty;});
  DB.sales.push(sale);save();AU_CART=[];toast(balance>0?('Sale recorded · balance '+amoney(balance)):('Sale recorded · '+amoney(total)));auShowReceipt(sale.id);vAuPOS();}

function auCustPay(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const bal=auSaleBalance(s);

function auDoCustPay(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const bal=auSaleBalance(s);

function auSaveProduct(id){const name=$('#ar_name').value.trim(),sell=Number($('#ar_sell').value);
  if(!name){toast('Part name required',true);return;}if($('#ar_sell').value===''||!(sell>=0)){toast('Selling price required',true);return;}
  const rl=$('#ar_reorder').value;
  const data={name,partNo:$('#ar_partno').value.trim(),brand:$('#ar_brand').value.trim(),category:$('#ar_cat').value,condition:$('#ar_cond').value,
    fitment:$('#ar_fit').value.trim(),cost:Number($('#ar_cost').value)||0,sell,stock:Math.max(0,Math.floor(Number($('#ar_stock').value)||0)),
    reorder:rl===''?null:Math.max(0,Math.floor(Number(rl)||0)),location:$('#ar_loc').value.trim(),barcode:$('#ar_bc').value.trim(),supplierId:$('#ar_sup').value};
  if(id){Object.assign(auProd(id),data);}
  else{const np={id:uid('pr'),...data};DB.products.push(np);
    const paidNow=Math.max(0,Number(($('#ar_paid')||{}).value)||0);

      <td>${(pu.items||[]).length} line(s), ${(pu.items||[]).reduce((a,i)=>a+Number(i.qty||0),0)} units</td><td class="right">${amoney(pu.total)}</td><td class="right">${amoney(pu.paid)}</td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="empty"><div class="big">📦</div>No purchases recorded.</div>`}</div>`;}
function auEditSupplier(id){const s=id?auSupplier(id):null;
  modal(s?'Edit Supplier':'Add Supplier',`<div class="grid2">
    <div class="fld full"><label>Name *</label><input id="ausp_name" value="${esc(s?s.name:'')}"></div>
    <div class="fld"><label>Phone</label><input id="ausp_phone" value="${esc(s?(s.phone||''):'')}"></div>
    <div class="fld"><label>Balance owed (${auCur()})</label><input id="ausp_bal" type="number" step="0.01" value="${s?(s.balance||0):0}"></div>
    <div class="fld full"><label>Address</label><input id="ausp_addr" value="${esc(s?(s.address||''):'')}"></div>
  </div>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#15366e" onclick="auSaveSupplier('${id||''}')">Save</button>`);}
function auSaveSupplier(id){const name=$('#ausp_name').value.trim();if(!name){toast('Name required',true);return;}
  const data={name,phone:$('#ausp_phone').value.trim(),address:$('#ausp_addr').value.trim(),balance:Number($('#ausp_bal').value)||0};
  if(id){Object.assign(auSupplier(id),data);}else{DB.suppliers.push({id:uid('sp'),...data});}
  save();closeModal();toast('Saved');vAuSuppliers();}
function auDelSupplier(id){const s=auSupplier(id);if(!s)return;
  modal('Delete supplier?',`<p>Delete <b>${esc(s.name)}</b>?</p>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="auDoDelSupplier('${id}')">Delete</button>`);}
function auDoDelSupplier(id){DB.suppliers=DB.suppliers.filter(s=>s.id!==id);save();closeModal();toast('Deleted');vAuSuppliers();}
function auSupPay(id){const s=auSupplier(id);if(!s)return;const bal=Number(s.balance||0);
  modal('Pay supplier — '+s.name,`<p class="muted mb">Balance owed: <b style="color:${bal>0?'#c0392b':'#0a7d33'}">${amoney(bal)}</b></p><div class="grid2">
    <div class="fld"><label>Amount to pay (${auCur()})</label><input id="ausp_amt" type="number" min="0" step="0.01" value="${bal>0?bal:0}"></div>
    <div class="fld"><label>Method</label><select id="ausp_method"><option>Cash</option><option>Transfer</option><option>POS / Card</option><option>Cheque</option></select></div>
    <div class="fld"><label>Date</label><input id="ausp_date" type="date" value="${today()}"></div>
    <div class="fld"><label>Note</label><input id="ausp_note" placeholder="invoice / ref"></div>
  </div>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#0a7d33" onclick="auDoSupPay('${id}')">Record payment</button>`);}
function auDoSupPay(id){const s=auSupplier(id);const amt=Math.max(0,Number($('#ausp_amt').value)||0);if(amt<=0){toast('Enter an amount',true);return;}
  s.balance=Number(s.balance||0)-amt;
  DB.settings.supPaySeq=(DB.settings.supPaySeq||0)+1;
  const pay={id:uid('spay'),receiptNo:'SP/'+String(DB.settings.supPaySeq).padStart(4,'0'),date:($('#ausp_date').value?new Date($('#ausp_date').value).toISOString():new Date().toISOString()),supplierId:id,amount:amt,method:$('#ausp_method').value,note:$('#ausp_note').value.trim(),balAfter:s.balance};
  DB.supplierPayments.push(pay);save();closeModal();toast('Payment recorded · '+amoney(amt));auShowSupPayReceipt(pay.id);}
function auSupPayReceiptHTML(pay){const set=DB.settings;const s=auSupplier(pay.supplierId)||{};const logo=set.logo?`<img src="${set.logo}" style="width:46px;height:46px;border-radius:8px;object-fit:cover">`:'<div style="font-size:34px">🔧</div>';

      <div style="font-size:11px">${esc(set.address||'')}</div>${set.phone?`<div style="font-size:11px">☎ ${esc(set.phone)}</div>`:''}</div>

      <div style="display:flex;justify-content:space-between"><span>Receipt No.</span><b>${esc(pay.receiptNo)}</b></div>
      <div style="display:flex;justify-content:space-between"><span>Date</span><span>${esc((pay.date||'').slice(0,10))}</span></div>
      <div style="display:flex;justify-content:space-between"><span>Paid to</span><b>${esc(s.name||'')}</b></div>
      <div style="display:flex;justify-content:space-between"><span>Method</span><span>${esc(pay.method||'')}</span></div>
      ${pay.note?`<div style="display:flex;justify-content:space-between"><span>Note</span><span>${esc(pay.note)}</span></div>`:''}
    </div>
    <div style="border-top:1px dashed #999;margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-weight:800;font-size:17px"><span>AMOUNT PAID</span><span>${amoney(pay.amount)}</span></div>
    <div style="font-size:12px;display:flex;justify-content:space-between;margin-top:4px"><span>Balance now owed</span><b style="color:${Number(pay.balAfter||0)>0?'#c0392b':'#0a7d33'}">${amoney(pay.balAfter||0)}</b></div>
    <div style="text-align:center;font-size:11px;margin-top:12px;border-top:1px dashed #999;padding-top:8px">Received with thanks.<br>Powered by Muscode</div>
  </div>`;}
function auShowSupPayReceipt(id){const pay=DB.supplierPayments.find(x=>x.id===id);if(!pay)return;
  modal('Supplier Receipt — '+pay.receiptNo,auSupPayReceiptHTML(pay),`<button class="btn sec no-print" onclick="closeModal();vAuSuppliers()">Close</button><button class="btn no-print" style="background:#15366e" onclick="window.print()">🖨 Print / Send</button>`);}
function auSupStatement(id){const s=auSupplier(id);if(!s)return;const set=DB.settings;
  const tx=[];
  DB.purchases.filter(p=>p.supplierId===id).forEach(p=>{tx.push({date:p.date,desc:'Purchase'+(p.note?' ('+p.note+')':'')+' — '+(p.items||[]).reduce((a,i)=>a+Number(i.qty||0),0)+' units',debit:Number(p.total||0),credit:Number(p.paid||0)});});
  DB.supplierPayments.filter(p=>p.supplierId===id).forEach(p=>{tx.push({date:p.date,desc:'Payment '+(p.receiptNo||'')+(p.note?' ('+p.note+')':''),debit:0,credit:Number(p.amount||0)});});
  tx.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run=0;const rows=tx.map(t=>{run+=t.debit-t.credit;return `<tr><td>${esc((t.date||'').slice(0,10))}</td><td>${esc(t.desc)}</td><td class="right">${t.debit?amoney(t.debit):''}</td><td class="right">${t.credit?amoney(t.credit):''}</td><td class="right"><b>${amoney(run)}</b></td></tr>`;}).join('');
  const logo=set.logo?`<img src="${set.logo}" style="width:100%;height:100%;object-fit:cover">`:'🔧';
  modal('Statement — '+s.name,`<div class="rc" style="${themeVars()};max-width:none"><div class="rc-top"><div class="rc-head"><div class="rc-crest">${logo}</div><div class="rc-sch"><h2>${esc(set.storeName)}</h2>${set.slogan?`<div class="nick">${esc(set.slogan)}</div>`:''}<div class="addr">${esc(set.address||'')}${set.phone?' · ☎ '+esc(set.phone):''}</div></div></div></div>
    <div class="rc-title">✦ SUPPLIER STATEMENT OF ACCOUNT ✦</div>
    <div style="padding:10px 14px"><div class="flex" style="justify-content:space-between;flex-wrap:wrap"><div><b>Supplier:</b> ${esc(s.name)}${s.phone?'<br>☎ '+esc(s.phone):''}</div><div style="text-align:right"><b>Date:</b> ${today()}<br><b>Balance owed:</b> <span style="color:${Number(s.balance||0)>0?'#c0392b':'#0a7d33'};font-weight:800">${amoney(s.balance||0)}</span></div></div>
      <table class="rc-tbl" style="margin-top:10px"><thead><tr><th>Date</th><th>Description</th><th class="right">Goods (Debit)</th><th class="right">Paid (Credit)</th><th class="right">Running</th></tr></thead><tbody>${rows||'<tr><td colspan=5 class="center muted">No transactions yet.</td></tr>'}</tbody></table>
      <p class="muted" style="font-size:11.5px;margin-top:8px">“Running” is goods received minus payments. Current balance owed reflects any opening balance set manually.</p></div></div>`,
    `<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print / Save</button>`,true);}
function auNewPurchase(){if(!DB.suppliers.length){toast('Add a supplier first',true);auEditSupplier();return;}
  if(!DB.products.length){toast('Add parts first',true);auEditProduct();return;}
  const prods=DB.products.filter(p=>!p.archived).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  modal('Record Purchase',`<div class="grid2">
    <div class="fld"><label>Supplier *</label><select id="aupu_sup">${DB.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>Date</label><input id="aupu_date" type="date" value="${today()}"></div>
  </div>
  <label>Enter quantity received and unit cost for parts you bought:</label>
  <div class="t-wrap" style="max-height:46vh;overflow:auto;margin:6px 0"><table><thead><tr><th>Part</th><th class="right">In stock</th><th>Qty in</th><th>Unit cost</th></tr></thead><tbody>
    ${prods.map(p=>`<tr><td><b>${esc(p.name)}</b>${auPartLine(p)?`<br><span class="muted" style="font-size:11px">${esc(auPartLine(p))}</span>`:''}</td><td class="right">${Number(p.stock||0)}</td>
      <td><input id="aupu_q_${p.id}" type="number" min="0" step="1" value="0" style="width:70px;padding:4px"></td>
      <td><input id="aupu_c_${p.id}" type="number" min="0" step="0.01" value="${p.cost||0}" style="width:84px;padding:4px"></td></tr>`).join('')}
  </tbody></table></div>
  <div class="grid2"><div class="fld"><label>Amount paid now (${auCur()})</label><input id="aupu_paid" type="number" min="0" step="0.01" value="0"></div>
    <div class="fld"><label>Note</label><input id="aupu_note" placeholder="invoice no. etc"></div></div>
  <p class="muted" style="font-size:12px">Unpaid balance is added to the supplier's account.</p>`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#15366e" onclick="auSavePurchase()">Save purchase</button>`,true);}
function auSavePurchase(){const sup=$('#aupu_sup').value;const items=[];
  DB.products.forEach(p=>{const qel=$('#aupu_q_'+p.id);if(!qel)return;const q=Math.floor(Number(qel.value)||0);if(q>0){const c=Number($('#aupu_c_'+p.id).value)||0;items.push({productId:p.id,name:p.name,qty:q,cost:c});}});
  if(!items.length){toast('Enter at least one quantity',true);return;}
  const total=items.reduce((a,i)=>a+i.qty*i.cost,0);const paid=Math.max(0,Number($('#aupu_paid').value)||0);
  const date=$('#aupu_date').value?new Date($('#aupu_date').value).toISOString():new Date().toISOString();
  items.forEach(i=>{const p=auProd(i.productId);if(p){p.stock=Number(p.stock||0)+i.qty;if(i.cost)p.cost=i.cost;p.supplierId=sup;}});
  const s=auSupplier(sup);if(s)s.balance=Number(s.balance||0)+(total-paid);
  DB.purchases.push({id:uid('pu'),date,supplierId:sup,items,total,paid,note:$('#aupu_note').value.trim()});
  save();closeModal();toast('Purchase recorded · '+amoney(total));vAuSuppliers();}

/* ---- Reports ---- */
function vAuReports(){const t=today();if(!AU_FROM)AU_FROM=t.slice(0,8)+'01';if(!AU_TO)AU_TO=t;
  $('#view').innerHTML=`<div class="page-head"><div><h2>Reports</h2><p>Sales, profit & stock</p></div>
    <div class="flex gap"><button class="btn no-print" style="background:#15366e" onclick="storeEOD()">🧾 End-of-day</button><button class="btn gold no-print" onclick="window.print()">🖨 Print</button></div></div>
  <div class="toolbar no-print"><div><label>From</label><input id="aurp_from" type="date" value="${AU_FROM}" onchange="AU_FROM=this.value;auRenderReports()"></div>
    <div><label>To</label><input id="aurp_to" type="date" value="${AU_TO}" onchange="AU_TO=this.value;auRenderReports()"></div>
    <div style="align-self:flex-end"><button class="btn sm sec" onclick="auRange('today')">Today</button><button class="btn sm sec" onclick="auRange('month')">This month</button><button class="btn sm sec" onclick="auRange('all')">All time</button></div></div>
  <div id="aurpArea"></div>`;auRenderReports();}
function auRange(k){const t=today();if(k==='today'){AU_FROM=t;AU_TO=t;}else if(k==='month'){AU_FROM=t.slice(0,8)+'01';AU_TO=t;}else if(k==='all'){AU_FROM='2000-01-01';AU_TO=t;}
  const f=$('#aurp_from'),to=$('#aurp_to');if(f)f.value=AU_FROM;if(to)to.value=AU_TO;auRenderReports();}
function auRenderReports(){const sales=auSalesIn(AU_FROM,AU_TO);
  const gross=sales.reduce((a,s)=>a+Number(s.total||0),0),cost=sales.reduce((a,s)=>a+Number(s.cost||0),0),profit=gross-cost;
  const byPay={};sales.forEach(s=>{byPay[s.payment||'Cash']=(byPay[s.payment||'Cash']||0)+Number(s.total||0);});
  const agg={};sales.forEach(s=>(s.items||[]).forEach(i=>{const a=agg[i.productId]||(agg[i.productId]={name:i.name,qty:0,rev:0});a.qty+=Number(i.qty||0);a.rev+=Number(i.price||0)*Number(i.qty||0);}));
  const best=Object.values(agg).sort((a,b)=>b.qty-a.qty).slice(0,10);const low=auLow();
  const expTotal=storeExpensesIn(AU_FROM,AU_TO).reduce((a,e)=>a+Number(e.amount||0),0);const net=profit-expTotal;
  const el=$('#aurpArea');if(!el)return;
  el.innerHTML=`<div class="cards-row">
    ${phStat('Transactions',sales.length,AU_FROM+' → '+AU_TO)}
    ${phStat('Gross sales',amoney(gross),'','#15366e')}
    ${phStat('Gross profit',amoney(profit),gross?((profit/gross*100).toFixed(1)+'% margin'):'','#0a7d33')}
    ${phStat('Expenses',amoney(expTotal),'',expTotal?'#c0392b':'')}
    ${phStat('NET PROFIT',amoney(net),'after expenses',net>=0?'#0a7d33':'#c0392b')}
  </div>
  <div class="flex gap" style="flex-wrap:wrap;align-items:flex-start">
    <div class="card pad" style="flex:1;min-width:280px"><h3 class="mb">Best sellers</h3>
      ${best.length?`<div class="t-wrap"><table><thead><tr><th>Part</th><th class="right">Qty</th><th class="right">Revenue</th></tr></thead><tbody>
        ${best.map(b=>`<tr><td>${esc(b.name)}</td><td class="right">${b.qty}</td><td class="right">${amoney(b.rev)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No sales in range.</div>`}</div>
    <div class="card pad" style="flex:1;min-width:240px"><h3 class="mb">Payment methods</h3>
      ${Object.keys(byPay).length?`<div class="t-wrap"><table><tbody>${Object.entries(byPay).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="right"><b>${amoney(v)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">—</div>`}
      <hr><div class="flex" style="justify-content:space-between"><span class="muted">Stock value (cost)</span><b>${amoney(auStockValue())}</b></div>
      <div class="flex" style="justify-content:space-between"><span class="muted">Stock value (retail)</span><b>${amoney(auRetailValue())}</b></div>
    </div>
  </div>
  <div class="card pad"><h3 class="mb">⚠️ Low stock (${low.length})</h3>
    ${low.length?`<div class="t-wrap"><table><thead><tr><th>Part</th><th>Fits</th><th class="right">Stock</th><th class="right">Reorder ≤</th></tr></thead><tbody>${low.map(p=>`<tr><td>${esc(p.name)}</td><td><span class="muted">${esc(p.fitment||'—')}</span></td><td class="right">${Number(p.stock||0)}</td><td class="right">${auReorder(p)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">All good 👍</div>`}</div>
  ${storeExpensesCardHTML(AU_FROM,AU_TO,'auRenderReports')}`;}

function auSaveSettings(){const s=DB.settings;_logo=_logo||s.logo||'';
  s.storeName=$('#aust_name').value.trim()||s.storeName;s.shortName=$('#aust_short').value.trim();s.address=$('#aust_addr').value.trim();
  s.phone=$('#aust_phone').value.trim();s.email=$('#aust_email').value.trim();s.currency=$('#aust_cur').value.trim()||'₦';
  s.slogan=$('#aust_slogan').value.trim();s.theme=$('#aust_theme').value;s.lowStock=Math.max(0,Number($('#aust_low').value)||3);
  if(typeof _logo==='string')s.logo=_logo;
  save();toast('Settings saved');enterAuto();}
function auSaveMyLogin(){const name=$('#aumy_name').value.trim(),user=$('#aumy_user').value.trim().toLowerCase(),pass=$('#aumy_pass').value.trim();
  if(!name||!user||!pass){toast('All fields required',true);return;}
  USER.name=name;USER.username=user;USER.password=pass;
  const u=DB.users.find(x=>x.id===USER.id);if(u){u.name=name;u.username=user;u.password=pass;}
  sessionStorage.setItem('sms_su',SCHOOL_CODE+'|'+USER.id);save();toast('Login updated');enterAuto();}
function auExportCSV(type){let rows,name;
  if(type==='inventory'){name='inventory';rows=[['Name','PartNo','Brand','Category','Condition','Fits','Stock','Cost','Sell','Reorder','Location','Barcode']];
    DB.products.filter(p=>!p.archived).forEach(p=>rows.push([p.name,p.partNo||'',p.brand||'',p.category||'',p.condition||'',p.fitment||'',p.stock||0,p.cost||0,p.sell||0,auReorder(p),p.location||'',p.barcode||'']));}
  else{name='sales';rows=[['Receipt','Date','Items','Total','Paid','Balance','Cost','Profit','Payment','Customer','Warranty','Voided']];
    DB.sales.forEach(s=>rows.push([s.receiptNo,(s.date||'').replace('T',' ').slice(0,16),(s.items||[]).reduce((a,i)=>a+Number(i.qty||0),0),s.total||0,(s.paid!=null?s.paid:s.total)||0,auSaleBalance(s),s.cost||0,s.profit||0,s.payment||'',s.customer||'',s.warranty||'',s.voided?'YES':'']));}
  const csv=rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(DB.settings.shortName||DB.settings.storeName||'autoparts')+'-'+name+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('CSV downloaded');}

function auMarkPaid(code){const reg=MASTER.schools.find(s=>s.code===code);const sub=reg.sub=reg.sub||{fee:0,history:[]};
  const base=sub.due&&sub.due>today()?new Date(sub.due):new Date(today());base.setMonth(base.getMonth()+1);
  sub.due=base.toISOString().slice(0,10);sub.lastPaid=today();sub.history=sub.history||[];sub.history.push({date:today(),amount:sub.fee||0});
  if(reg.status==='suspended'){reg.status='active';if(STORE[code])STORE[code].settings.status='active';saveSchoolRow(code);}
  saveMaster();toast('Payment recorded · next due '+sub.due);manageAuto(code);}
function toggleAuto(code){const reg=MASTER.schools.find(s=>s.code===code);reg.status=reg.status==='suspended'?'active':'suspended';

/* ---- share a receipt as an IMAGE (PNG) to WhatsApp / share sheet ---- */
function storeShareImage(html,filename,shareText){
  if(!window.html2canvas){toast('Image tool still loading — try again in a moment',true);return;}
  const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-10000px;top:0;background:#fff;z-index:-1';
  wrap.innerHTML=html;document.body.appendChild(wrap);const node=wrap.firstElementChild||wrap;toast('Preparing image…');
  html2canvas(node,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(canvas=>{
    if(wrap.parentNode)document.body.removeChild(wrap);
    canvas.toBlob(blob=>{if(!blob){toast('Could not create image',true);return;}
      const file=new File([blob],filename+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],text:shareText||''}).catch(()=>{});}
      else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Receipt image saved — attach it in WhatsApp');}
    },'image/png');
  }).catch(()=>{if(wrap.parentNode)document.body.removeChild(wrap);toast('Image failed — try Print instead',true);});
}

/* ---- expenses (true net profit) ---- */
const EXP_CATS=['Rent','Salaries / Wages','Utilities (power/water)','Transport / Fuel','Supplies','Repairs / Maintenance','Bank / Charges','Marketing','Miscellaneous'];
function storeExpensesIn(from,to){return (DB.expenses||[]).filter(e=>{const d=(e.date||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to);});}
function storeAddExpense(refreshName){window._exRefresh=refreshName||'';
  modal('Add expense',`<div class="grid2">
    <div class="fld"><label>Date</label><input id="ex_date" type="date" value="${today()}"></div>
    <div class="fld"><label>Category</label><select id="ex_cat">${EXP_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="fld"><label>Amount (${(DB.settings.currency||'₦')})</label><input id="ex_amt" type="number" min="0" step="0.01" value="0"></div>
    <div class="fld"><label>Note</label><input id="ex_note" placeholder="optional"></div>
  </div>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="storeSaveExpense()">Save expense</button>`);}
function storeSaveExpense(){const amt=Math.max(0,Number($('#ex_amt').value)||0);if(amt<=0){toast('Enter an amount',true);return;}
  DB.expenses=DB.expenses||[];DB.expenses.push({id:uid('ex'),date:($('#ex_date').value?new Date($('#ex_date').value).toISOString():new Date().toISOString()),category:$('#ex_cat').value,amount:amt,note:$('#ex_note').value.trim()});
  save();closeModal();toast('Expense saved');if(window._exRefresh&&window[window._exRefresh])window[window._exRefresh]();}
function storeDelExpense(id,refreshName){DB.expenses=(DB.expenses||[]).filter(e=>e.id!==id);save();toast('Removed');if(refreshName&&window[refreshName])window[refreshName]();}
function storeExpensesCardHTML(from,to,refreshName){const exps=storeExpensesIn(from,to).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));const tot=exps.reduce((a,e)=>a+Number(e.amount||0),0);
  return `<div class="card pad"><div class="flex" style="justify-content:space-between"><h3>Expenses <span class="muted" style="font-size:13px">(${pmoney(tot)})</span></h3><button class="btn sm" onclick="storeAddExpense('${refreshName}')">＋ Add expense</button></div>
  ${exps.length?`<div class="t-wrap mt"><table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="right">Amount</th><th></th></tr></thead><tbody>
    ${exps.map(e=>`<tr><td>${esc((e.date||'').slice(0,10))}</td><td>${esc(e.category||'')}</td><td><span class="muted">${esc(e.note||'')}</span></td><td class="right">${pmoney(e.amount)}</td><td class="right"><button class="btn sm danger" onclick="storeDelExpense('${e.id}','${refreshName}')">✕</button></td></tr>`).join('')}
  </tbody></table></div>`:`<div class="empty mt">No expenses in range.</div>`}</div>`;}
/* ---- end-of-day (Z) report ---- */
function storeEOD(date){const d=date||today();const set=DB.settings;
  const sales=(DB.sales||[]).filter(s=>!s.voided&&(s.date||'').slice(0,10)===d);
  const gross=sales.reduce((a,s)=>a+Number(s.total||0),0);const cogs=sales.reduce((a,s)=>a+Number(s.cost||0),0);const gp=gross-cogs;
  const collected={};DB.sales.forEach(s=>{if(s.voided)return;(s.payments||[]).forEach(p=>{if((p.date||'').slice(0,10)===d)collected[p.method||'Cash']=(collected[p.method||'Cash']||0)+Number(p.amount||0);});});
  const totalCollected=Object.values(collected).reduce((a,b)=>a+b,0);
  const creditToday=sales.reduce((a,s)=>a+Number(s.balance||0),0);
  const exps=storeExpensesIn(d,d);const expTotal=exps.reduce((a,e)=>a+Number(e.amount||0),0);
  const net=gp-expTotal;const logo=set.logo?`<img src="${set.logo}" style="width:100%;height:100%;object-fit:cover">`:(DB.kind==='autoparts'?'🔧':'💊');
  const html=`<div class="rc" style="${themeVars()};max-width:none"><div class="rc-top"><div class="rc-head"><div class="rc-crest">${logo}</div><div class="rc-sch"><h2>${esc(set.storeName)}</h2>${set.slogan?`<div class="nick">${esc(set.slogan)}</div>`:''}<div class="addr">${esc(set.address||'')}${set.phone?' · ☎ '+esc(set.phone):''}</div></div></div></div>
    <div class="rc-title">✦ END-OF-DAY REPORT — ${esc(d)} ✦</div>
    <div style="padding:10px 16px">
      <table class="rc-tbl"><tbody>
        <tr><td>Number of sales</td><td class="right"><b>${sales.length}</b></td></tr>
        <tr><td>Gross sales</td><td class="right"><b>${pmoney(gross)}</b></td></tr>
        <tr><td>Cost of goods sold</td><td class="right">${pmoney(cogs)}</td></tr>
        <tr><td>Gross profit</td><td class="right"><b style="color:#0a7d33">${pmoney(gp)}</b></td></tr>
        <tr><td>Expenses today</td><td class="right" style="color:#c0392b">${pmoney(expTotal)}</td></tr>
        <tr><td><b>NET PROFIT (day)</b></td><td class="right"><b style="color:${net>=0?'#0a7d33':'#c0392b'}">${pmoney(net)}</b></td></tr>
      </tbody></table>
      <h4 style="margin:12px 0 4px">Money collected today (by method)</h4>
      <table class="rc-tbl"><tbody>${Object.keys(collected).length?Object.entries(collected).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="right">${pmoney(v)}</td></tr>`).join(''):'<tr><td colspan=2 class="center muted">No money collected.</td></tr>'}
        <tr><td><b>Total collected</b></td><td class="right"><b>${pmoney(totalCollected)}</b></td></tr>
        <tr><td>New credit given today</td><td class="right" style="color:#c0392b">${pmoney(creditToday)}</td></tr></tbody></table>
      ${exps.length?`<h4 style="margin:12px 0 4px">Expenses</h4><table class="rc-tbl"><tbody>${exps.map(e=>`<tr><td>${esc(e.category)}${e.note?' — '+esc(e.note):''}</td><td class="right">${pmoney(e.amount)}</td></tr>`).join('')}</tbody></table>`:''}
      <p class="muted" style="font-size:11.5px;margin-top:10px">Use “Total collected” to reconcile your cash drawer and transfers. Powered by Muscode.</p>
    </div></div>`;
  modal('End-of-Day — '+d,`<div class="toolbar no-print"><div><label>Date</label><input type="date" value="${d}" onchange="storeEOD(this.value)"></div></div>`+html,
    `<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print</button>`,true);}
function storeReorderLevel(p){return (p.reorder!=null&&p.reorder!=='')?Number(p.reorder):Number(DB.settings.lowStock||0);}
function storeLowList(){return DB.products.filter(p=>!p.archived&&Number(p.stock||0)<=storeReorderLevel(p));}
function storeReceiptText(s){const set=DB.settings;let t='*'+set.storeName+'*\n';if(set.slogan)t+='_'+set.slogan+'_\n';if(set.address)t+=set.address+'\n';if(set.phone)t+='Tel: '+set.phone+'\n';
  t+='--------------------\n';t+='Receipt: '+s.receiptNo+'\n'+(s.date||'').replace('T',' ').slice(0,16)+'\n';if(s.customer)t+='Customer: '+s.customer+'\n';t+='--------------------\n';
  (s.items||[]).forEach(i=>{t+=i.name+'  x'+i.qty+'   '+pmoney(i.price*i.qty)+'\n';});
  t+='--------------------\n*TOTAL: '+pmoney(s.total)+'*\n';
  if(Number(s.balance||0)>0){t+='Paid: '+pmoney(s.paid||0)+'\n*BALANCE DUE: '+pmoney(s.balance)+'*\n';}
  t+='Payment: '+(s.payment||'')+'\n';if(s.warranty)t+='Warranty: '+s.warranty+'\n';t+='\nThank you. Powered by Muscode';return t;}

   <p class="muted" style="font-size:12px">Opens WhatsApp with the receipt ready to send. Leave blank to pick a contact in WhatsApp.</p>`,

function storeReorderWa(){const low=storeLowList();if(!low.length){toast('No low-stock items 👍');return;}
  modal('WhatsApp reorder list ('+low.length+')',`<div class="fld"><label>Send to supplier</label><select id="ro_sup" onchange="if(this.value)document.getElementById('ro_num').value=this.value"><option value="">— choose / type number —</option>${DB.suppliers.map(s=>`<option value="${esc(s.phone||'')}">${esc(s.name)}${s.phone?' ('+esc(s.phone)+')':''}</option>`).join('')}</select></div>
   <div class="fld"><label>WhatsApp number</label><input id="ro_num" placeholder="080..."></div>
   <p class="muted" style="font-size:12px">${low.length} item(s) at/below reorder level will be listed.</p>`,
   `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#25d366" onclick="storeDoReorderWa()">💬 Open WhatsApp</button>`);}
function storeDoReorderWa(){const low=storeLowList();const num=($('#ro_num').value||'').trim();
  let t='*Order request from '+DB.settings.storeName+'*\n\n';low.forEach(p=>{t+='• '+p.name+(p.partNo?(' ['+p.partNo+']'):'')+(p.brand?(' - '+p.brand):'')+' — in stock: '+Number(p.stock||0)+'\n';});
  t+='\nPlease advise availability and price. Thank you.';window.open(waLink(num)+'?text='+encodeURIComponent(t),'_blank');closeModal();}
/* ---- owner cross-store overview ---- */
function ownerSaleBal(x){return x.voided?0:(x.balance!=null?Number(x.balance||0):(x.payment==='Credit'&&!x.settled?Number(x.total||0):0));}
function ownerStoreStats(){const t=today(),tm=t.slice(0,7);const r={today:0,month:0,stock:0,debt:0,subMonthly:0,subCollected:0,due:0,overdue:0,stores:[]};
  MASTER.schools.filter(s=>s.type==='pharmacy'||s.type==='autoparts').forEach(reg=>{const d=STORE[reg.code];
    const sales=d?(d.sales||[]).filter(x=>!x.voided):[];
    const tToday=sales.filter(x=>(x.date||'').slice(0,10)===t).reduce((a,x)=>a+Number(x.total||0),0);
    const tMonth=sales.filter(x=>(x.date||'').slice(0,7)===tm).reduce((a,x)=>a+Number(x.total||0),0);
    const stock=d?(d.products||[]).reduce((a,p)=>a+Number(p.stock||0)*Number(p.cost||0),0):0;
    const debt=d?(d.sales||[]).reduce((a,x)=>a+ownerSaleBal(x),0):0;
    const sub=reg.sub||{};const fee=Number(sub.fee||0);r.subMonthly+=fee;
    (sub.history||[]).forEach(h=>{if((h.date||'').slice(0,7)===tm)r.subCollected+=Number(h.amount||0);});
    const si=phSubInfo(reg);if(si.cls==='red')r.overdue++;else if(si.cls==='gold')r.due++;
    r.today+=tToday;r.month+=tMonth;r.stock+=stock;r.debt+=debt;
    r.stores.push({reg,today:tToday,month:tMonth,stock,debt,si});});
  return r;}
function ownerStoresSectionHTML(){const st=ownerStoreStats();if(!st.stores.length)return '';
  return `<div class="card pad mt"><div class="flex" style="justify-content:space-between;flex-wrap:wrap"><h3 class="mb">🏬 Stores overview (pharmacy + auto parts)</h3></div>
  <div class="cards-row">
    <div class="stat"><div class="lbl">Sales today</div><div class="num" style="color:#0c5b56">${pmoneyOwner(st.today)}</div></div>
    <div class="stat"><div class="lbl">Sales this month</div><div class="num" style="color:#0c5b56">${pmoneyOwner(st.month)}</div></div>
    <div class="stat"><div class="lbl">Stock value</div><div class="num" style="font-size:20px">${pmoneyOwner(st.stock)}</div></div>
    <div class="stat"><div class="lbl">Customer debtors</div><div class="num" style="font-size:20px;color:${st.debt?'#c0392b':''}">${pmoneyOwner(st.debt)}</div></div>
  </div>
  <div class="cards-row">
    <div class="stat"><div class="lbl">Subscription / month</div><div class="num" style="font-size:20px">${pmoneyOwner(st.subMonthly)}</div><div class="meta">recurring</div></div>
    <div class="stat"><div class="lbl">Collected this month</div><div class="num" style="font-size:20px;color:#0a7d33">${pmoneyOwner(st.subCollected)}</div></div>
    <div class="stat"><div class="lbl">Due soon</div><div class="num" style="color:${st.due?'#c8881b':''}">${st.due}</div></div>
    <div class="stat"><div class="lbl">Overdue</div><div class="num" style="color:${st.overdue?'#c0392b':''}">${st.overdue}</div></div>
  </div>
  <div class="t-wrap"><table><thead><tr><th>Store</th><th>Type</th><th class="right">Today</th><th class="right">This month</th><th class="right">Stock val.</th><th class="right">Debtors</th><th>Subscription</th></tr></thead><tbody>
    ${st.stores.map(x=>`<tr><td><b>${esc(x.reg.name)}</b></td><td>${x.reg.type==='pharmacy'?'💊 Pharmacy':'🔧 Auto'}</td>
      <td class="right">${pmoneyOwner(x.today)}</td><td class="right">${pmoneyOwner(x.month)}</td><td class="right">${pmoneyOwner(x.stock)}</td>
      <td class="right" style="color:${x.debt?'#c0392b':''}">${pmoneyOwner(x.debt)}</td><td><span class="pill ${x.si.cls}">${x.si.txt}</span></td></tr>`).join('')}
  </tbody></table></div>
  <p class="muted mt" style="font-size:12px">Figures shown in ₦. Live across all your stores via the cloud.</p></div>`;}

/* ===================== PWA: offline + auto-update + install ===================== */
function setManifest(){try{
  const nm=(MODE==='owner')?((MASTER&&MASTER.platform&&MASTER.platform.name)||'EduManager'):((DB&&DB.settings&&DB.settings.schoolName)||'EduManager Cloud');
  const icons=[{src:'/icon.svg',sizes:'any',type:'image/svg+xml',purpose:'any maskable'}];
  if(DB&&DB.settings&&DB.settings.logo){const lg=DB.settings.logo;icons.unshift({src:lg,sizes:'512x512',type:lg.indexOf('image/png')>0?'image/png':(lg.indexOf('svg')>0?'image/svg+xml':'image/jpeg'),purpose:'any'});}
  const m={name:nm,short_name:nm.slice(0,18),start_url:location.pathname,scope:'/',display:'standalone',orientation:'portrait',background_color:'#0a7d33',theme_color:'#0a7d33',icons};
  const url=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  const link=document.getElementById('manifestLink');if(link){if(link._u)URL.revokeObjectURL(link._u);link.href=url;link._u=url;}
  document.title=nm;const ti=document.getElementById('touchIcon');if(ti&&DB&&DB.settings&&DB.settings.logo)ti.href=DB.settings.logo;
}catch(e){}}
// install prompt
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-flex';});
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.style.display='none';deferredPrompt=null;toast('App installed');});
function doInstall(){if(!deferredPrompt){toast('On iPhone: tap Share → Add to Home Screen',true);return;}deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none';});}
// service worker (offline + update)
if('serviceWorker' in navigator){window.addEventListener('load',()=>{
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller){const ub=document.getElementById('updateBar');if(ub)ub.style.display='flex';}
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){const ub=document.getElementById('updateBar');if(ub)ub.style.display='flex';}});});
  }).catch(()=>{});
});}
