<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}

.btn{background:var(--green);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}

.btn.blue{background:var(--blue)}.btn.purple{background:var(--purple)}

.pill.purple{background:var(--purple-light);color:var(--purple)}.pill.grey{background:#eef2ef;color:var(--muted)}

#screen{min-height:100vh}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth.owner{background:linear-gradient(135deg,#3a2461,#6b3fa0)}

.crest.g{background:var(--green-light)}.crest.p{background:var(--purple-light)}.crest.b{background:#e3eefb}
.acard h1{font-size:20px;margin-bottom:3px}.acard .sub{color:var(--muted);font-size:13px;margin-bottom:22px}

#app{display:none;min-height:100vh}

.nav-item:hover{background:var(--green-light)}.nav-item.active{background:var(--green);color:#fff}
.nav-item.owner.active{background:var(--purple)}.nav-item.owner:hover{background:var(--purple-light)}
.nav-item .ic{font-size:17px;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:20px;padding:0 7px;font-weight:700}
.main{flex:1;padding:24px 28px;max-width:1200px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-head h2{font-size:22px}.page-head p{color:var(--muted);font-size:13.5px;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card.pad{padding:18px}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}

.empty{text-align:center;padding:46px 20px;color:var(--muted)}.empty .big{font-size:40px;margin-bottom:8px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--green-light);display:inline-flex;align-items:center;justify-content:center;font-size:15px;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}

.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .15s ease}

.modal.lg{max-width:820px}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:17px}.modal-body{padding:20px;max-height:74vh;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2 .full{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.fld{margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:32px}.toast.err{background:var(--red)}
.subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.subtab{padding:7px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted)}
.subtab.active{background:var(--green);color:#fff;border-color:var(--green)}
.score-in{width:56px;padding:6px;text-align:center}
.muted{color:var(--muted)}.right{text-align:right}.center{text-align:center}.flex{display:flex;align-items:center;gap:8px}.gap{gap:8px}
.mt{margin-top:14px}.mb{margin-bottom:14px}hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-prev{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px}
#camWrap video{width:100%;border-radius:10px;background:#000}
.linkbox{display:flex;gap:8px;align-items:center;background:#f7faf8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.linkbox code{flex:1;overflow:auto;white-space:nowrap;color:var(--green-dark)}
.insight{border-left:4px solid var(--purple);background:var(--purple-light);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:13.5px}
.insight b{color:var(--purple)}
.bar{height:8px;border-radius:5px;background:var(--green);display:inline-block}
.report{background:#fff;border:2px solid var(--green);border-radius:8px;padding:26px;max-width:760px;margin:0 auto}
.report .rh{display:flex;align-items:center;gap:16px;border-bottom:3px double var(--green);padding-bottom:14px;margin-bottom:14px}
.report .rh .seal{width:62px;height:62px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--green);overflow:hidden}
.report .rh .seal img{width:100%;height:100%;object-fit:cover}
.report .rh h2{font-size:21px;color:var(--green-dark)}.report .rh .addr{font-size:12px;color:var(--muted)}
.report .rh .doc{margin-left:auto;text-align:right;font-size:12px}.report .rh .doc b{color:var(--green-dark)}
.report .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 18px;font-size:12.5px;margin-bottom:16px}
.report .meta-grid div span{color:var(--muted);display:block;font-size:10.5px;text-transform:uppercase}
.report table{font-size:12.5px}.report th,.report td{border:1px solid #cfe0d5;padding:7px 9px}.report th{background:var(--green-light);color:var(--green-dark)}
.report .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.report .summary .box{border:1px solid #cfe0d5;border-radius:8px;padding:10px;text-align:center}
.report .summary .box .v{font-size:20px;font-weight:800;color:var(--green-dark)}.report .summary .box .k{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.report .remarks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;font-size:12.5px}
.report .remarks .r{border:1px solid #cfe0d5;border-radius:8px;padding:10px;min-height:62px}
.report .remarks .r b{color:var(--green-dark);display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase}
.report .sign{display:flex;justify-content:space-between;margin-top:24px;font-size:12px}
.report .sign div{text-align:center;width:45%}.report .sign .line{border-top:1px solid #888;margin-top:30px;padding-top:4px}
.keybox{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.viewonly{background:#fff8e1;border:1px solid #f3e2a0;color:#8a6d00;border-radius:8px;padding:8px 12px;font-size:12.5px;text-align:center;margin-top:10px}
.receipt{max-width:520px;margin:0 auto;border:1px solid var(--line);border-radius:12px;padding:0 24px 24px;background:#fff;position:relative;overflow:hidden}
.receipt:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#0b5e3a,#caa64e)}
.receipt .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #caa64e;padding:18px 0 12px;margin-bottom:14px}
.receipt .rh .seal{width:50px;height:50px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;border:2px solid #caa64e}
.receipt .rh .seal img{width:100%;height:100%;object-fit:cover}
.receipt h2{font-size:18px;color:#0b5e3a}.receipt .no{margin-left:auto;text-align:right;font-size:12px}
.receipt .amount{font-size:30px;font-weight:800;color:#0b5e3a;text-align:center;margin:14px 0;border:2px dashed #caa64e;border-radius:10px;padding:12px;background:#fbf6e7}
.receipt .lines div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.receipt .lines div span{color:var(--muted)}
.receipt .paid-stamp{display:inline-block;border:3px solid var(--green);color:var(--green);font-weight:800;padding:4px 14px;border-radius:8px;transform:rotate(-8deg);letter-spacing:.1em;margin-top:14px}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.idcard{width:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);margin:0 auto}
.idcard .top{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:9px}
.idcard .top .lg{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px}
.idcard .top .nm{font-weight:700;font-size:12.5px;line-height:1.15}.idcard .top .nm small{font-weight:400;opacity:.85;font-size:10px;display:block}
.idcard .body{display:flex;gap:12px;padding:14px}
.idcard .ph{width:84px;height:96px;object-fit:cover;border-radius:8px;border:2px solid var(--green-light);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0}
.idcard .info{font-size:12px;flex:1}.idcard .info .big{font-size:15px;font-weight:800;color:var(--ink);line-height:1.1;margin-bottom:4px}
.idcard .info .row{margin-bottom:3px}.idcard .info .row span{color:var(--muted)}
.idcard .role-pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--green-light);color:var(--green-dark);margin-top:3px}
.idcard .barcode{padding:6px 14px 12px;text-align:center}.idcard .barcode svg{max-width:100%}
.idcard .foot{background:var(--green-light);color:var(--green-dark);font-size:9.5px;text-align:center;padding:5px;font-weight:600}
.pincard{border:2px dashed var(--purple);border-radius:10px;padding:12px 14px;background:#fff;font-size:12px}
.pincard .p{font-size:20px;font-weight:800;letter-spacing:.12em;color:var(--purple);font-family:monospace;margin:4px 0}
.pingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
#reader{width:100%;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden}.scan-result{max-width:460px;margin:16px auto 0}

  .modal-bg{position:static;background:none;padding:0;display:block}.modal,.modal.lg{box-shadow:none;max-width:none;border-radius:0}
  .modal-head{display:none}.modal-body{max-height:none;overflow:visible;padding:0}.report,.receipt{border:none}
  .idgrid,.pingrid{gap:10px}.idcard,.idc,.pincard{break-inside:avoid;page-break-inside:avoid}#checkPrint{box-shadow:none!important}}

.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:22px;padding:6px;margin-left:-4px}
#navScrim{display:none;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.35);z-index:39}
#navScrim.show{display:block}
.qrimg{image-rendering:pixelated}
/* Admission letter */
.letter{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:38px 42px 30px;font-size:13.5px;line-height:1.75;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.letter:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,var(--green),var(--gold))}
.letter .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.04;font-size:260px}
.letter .wm img{width:340px;height:340px;object-fit:contain}
.letter>*{position:relative;z-index:1}
.letter .lh{display:flex;align-items:center;gap:14px;border-bottom:3px double var(--green);padding-bottom:12px;margin-bottom:8px;margin-top:6px}
.letter .lh .lg{width:64px;height:64px;border-radius:12px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;flex-shrink:0;box-shadow:0 3px 8px rgba(10,125,51,.2)}
.letter .lh .lg img{width:100%;height:100%;object-fit:cover}
.letter .lh h2{font-size:21px;color:var(--green-dark)}.letter .lh .addr{font-size:11.5px;color:var(--muted)}
.letter .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:10px 0}
.letter .passport{float:right;width:90px;height:104px;object-fit:cover;border:2px solid var(--green-light);border-radius:8px;margin:0 0 8px 14px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:34px}
.letter .qrbox{text-align:center;font-size:9.5px;color:var(--muted)}
.letter .qrbox img{width:84px;height:84px}
.letter .lsign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px}

/* ===================== PROMOTION / ANNUAL HELPERS ===================== */
function termAvg(stu,term){const subs=DB.subjects[stu.classId]||[];const res=DB.results[DB.settings.session+'|'+term+'|'+stu.id]||{};let t=0,n=0;
  subs.forEach(sub=>{const r=res[sub];if(r&&(r.ca1!=null||r.ca2!=null||r.exam!=null)){t+=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);n++;}});return n?t/n:null;}
function annual(stu){const t1=termAvg(stu,'First Term'),t2=termAvg(stu,'Second Term'),t3=termAvg(stu,'Third Term');
  const vals=[t1,t2,t3].filter(v=>v!=null);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;return{t1,t2,t3,avg,terms:vals.length};}
function promoteMark(){return (DB.settings.grade&&DB.settings.grade.promote)||40;}
function isFinalClass(classId){const c=DB.classes.find(x=>x.id===classId);if(!c)return false;if(DB.settings.modules&&DB.settings.modules.gradPry5)return /primary\s*5/i.test(c.name);return /primary\s*6|grad/i.test(c.name);}
function nextClassName(classId){if(isFinalClass(classId))return 'Graduated';const i=DB.classes.findIndex(c=>c.id===classId);return (i>=0&&i+1<DB.classes.length)?DB.classes[i+1].name:'Graduated';}
function promotionFor(stu){const a=annual(stu);if(a.avg==null)return{...a,decision:'pending',label:'No results',cls:'muted'};
  if(isFinalClass(stu.classId))return{...a,decision:'graduate',label:'Graduated (Primary Certificate)',cls:'promo-grad'};
  if(a.avg>=promoteMark())return{...a,decision:'promote',label:'Promoted to '+nextClassName(stu.classId),cls:'promo-yes'};
  return{...a,decision:'repeat',label:'To repeat '+className(stu.classId),cls:'promo-no'};}

      <div class="rc-pos"><div class="l">POSITION</div><div class="n">${pos>=0?ord(pos+1):'—'}</div><div class="l">of ${ranked.length}</div></div></div>

    ${rows.map(r=>{const g=r.avg!=null?gradeOf(r.avg):null;return `<tr><td class="sub">${esc(r.sub)}</td><td>${r.a??'–'}</td><td>${r.b??'–'}</td><td>${r.c??'–'}</td><td class="tot">${r.avg!=null?r.avg.toFixed(1):'–'}</td><td>${g?g.g:'–'}</td></tr>`;}).join('')}</tbody></table>
    <div class="rc-sum"><span>Annual Average: <b>${p.avg!=null?p.avg.toFixed(1)+'%':'–'}</b></span><span>Overall Grade: <b>${p.avg!=null?gradeOf(p.avg).g:'–'}</b></span><span>Position: <b>${pos>=0?ord(pos+1):'–'}</b></span></div>

    <div class="rc-foot">${isl?`✦ “${esc(q.t)}” — ${esc(q.s)} ✦`:esc(DB.settings.motto||'')}</div>

  $('#view').innerHTML=`<div class="page-head"><div><h2>🎓 Promotions & Annual Reports</h2><p>End of ${esc(DB.settings.session)} — promotion mark ${promoteMark()}%</p></div></div>

function printPromoList(){const list=studentsIn(promoClass);const rows=list.map(s=>({s,p:promotionFor(s)}));

/* ===================== SESSION / TERM MANAGEMENT ===================== */
function termsDone(){return DB.settings.termsDone||[];}
function allTermsDone(){return TERMS.every(t=>termsDone().includes(t));}
function nextSessionStr(s){const m=(s||'').match(/(\d{4})\s*\/\s*(\d{4})/);if(m)return (+m[1]+1)+'/'+(+m[2]+1);const y=new Date().getFullYear();return y+'/'+(y+1);}
function termArchive(label){
  // Build a records bundle for download/email at term/session close.
  const data={school:DB.settings.schoolName,code:DB.settings.code,session:DB.settings.session,term:DB.settings.term,generated:new Date().toISOString(),
    students:DB.students,results:DB.results,payments:DB.payments,fees:DB.fees,attendance:DB.attendance,applicants:DB.applicants,remarks:DB.remarks,settings:DB.settings};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(DB.settings.code||'school')+'-archive-'+(label||DB.settings.session).replace(/[^a-z0-9]/gi,'_')+'-'+today()+'.json';a.click();
}
function vSession(){
  const done=termsDone(),cur=DB.settings.term;
  $('#view').innerHTML=`<div class="page-head"><div><h2>📆 Session & Terms</h2><p>${esc(DB.settings.session)} — manage term progress and start a new session</p></div></div>
  <div class="cards-row">${TERMS.map(t=>{const d=done.includes(t);const isCur=t===cur;return `<div class="stat" style="border-color:${d?'var(--green)':isCur?'var(--gold)':'var(--line)'}">
    <div class="lbl">${esc(t)}</div><div class="num" style="font-size:18px;color:${d?'var(--green)':isCur?'var(--amber)':'var(--muted)'}">${d?'✓ Completed':isCur?'In progress':'Pending'}</div></div>`;}).join('')}</div>
  <div class="card pad mb" style="max-width:680px"><h3 class="mb">Current term: ${esc(cur)}</h3>
    <p class="muted mb">Completing a term locks it for the records and moves the school to the next term. A records archive (pupils, results, payments, admissions) downloads automatically for safe-keeping. Your data also stays in the cloud.</p>
    <div class="fld" style="max-width:340px"><label>Records email (for your reference)</label><input id="se_email" value="${esc(DB.settings.recordEmail||'')}" placeholder="admin@school.com"></div>
    ${done.includes(cur)?`<p class="pill green">${esc(cur)} already completed.</p>`:`<button class="btn" onclick="completeTerm()">✓ Complete ${esc(cur)} & download records</button>`}
  </div>
  ${hasModule('weeks')?`<div class="card pad mb" style="max-width:680px"><h3 class="mb">📅 School week</h3>
    <div class="flex gap" style="align-items:center;flex-wrap:wrap"><div class="stat" style="padding:10px 18px"><div class="lbl">Current week</div><div class="num">Week ${currentWeek()} <span style="font-size:15px;color:var(--muted)">of ${termWeeks()}</span></div></div>
      <div style="flex:1;min-width:160px"><div style="background:#eef2ef;border-radius:6px;height:10px;overflow:hidden"><div class="bar" style="width:${Math.round(currentWeek()/termWeeks()*100)}%;height:10px"></div></div></div></div>
    <div class="grid2 mt" style="max-width:420px"><div class="fld"><label>Weeks in a term</label><input type="number" id="wk_total" value="${termWeeks()}"></div>
      <div class="fld"><label>${(DB.settings.dates&&DB.settings.dates.termBegin)?'Auto-calculated from term-begin date':'Set current week manually'}</label><input type="number" id="wk_set" value="${currentWeek()}" ${(DB.settings.dates&&DB.settings.dates.termBegin)?'disabled':''}></div></div>
    <button class="btn sec sm" onclick="saveWeeks()">Save</button>
    <p class="muted mt" style="font-size:12px">${(DB.settings.dates&&DB.settings.dates.termBegin)?'✓ The week auto-advances from the term-begin date set on the Calendar page.':'💡 Set the <b>Term begins</b> date on the Calendar page and the week will advance automatically.'}</p></div>`:''}
  <div class="card pad" style="max-width:680px;border-left:4px solid ${allTermsDone()?'var(--green)':'var(--line)'}">
    <h3 class="mb">Start new session</h3>
    ${allTermsDone()
      ? `<p class="muted mb">All three terms are completed. Starting a new session will <b>promote pupils</b> (based on the Promotions page), graduate Primary 6, advance to <b>${esc(nextSessionStr(DB.settings.session))}</b>, reset to First Term, and archive this session.</p>
         <button class="btn gold" onclick="confirmNewSession()">🎓 Promote & Start ${esc(nextSessionStr(DB.settings.session))}</button>`
      : `<p class="muted">🔒 You can start a new session only after <b>all three terms</b> are completed. Completed: ${done.length}/3.</p>`}
  </div>`;
}
function completeTerm(){
  const cur=DB.settings.term;DB.settings.recordEmail=$('#se_email').value.trim();
  if(!termsDone().includes(cur))DB.settings.termsDone.push(cur);
  // advance to next not-done term (keep order)
  const nextT=TERMS.find(t=>!DB.settings.termsDone.includes(t));
  if(nextT)DB.settings.term=nextT;
  save();termArchive(DB.settings.session+'-'+cur);
  toast(cur+' completed — records downloaded');
  vSession();buildNav();$('#termBadge').textContent=DB.settings.term+' • '+DB.settings.session;
}
function confirmNewSession(){
  const next=nextSessionStr(DB.settings.session);
  let promo=0,grad=0,rep=0;
  DB.students.filter(s=>!s.graduated).forEach(s=>{const d=promotionFor(s).decision;if(d==='promote')promo++;else if(d==='graduate')grad++;else rep++;});
  modal('Start new session — '+next,`<p>This will close <b>${esc(DB.settings.session)}</b> and begin <b>${esc(next)}</b>:</p>
    <ul style="margin:10px 0 10px 18px;font-size:13.5px">
      <li><b>${promo}</b> pupil(s) promoted to the next class</li>
      <li><b>${grad}</b> Primary 6 pupil(s) graduated (kept as records)</li>
      <li><b>${rep}</b> pupil(s) repeating their class</li></ul>
    <p class="muted" style="font-size:12.5px">Past results stay saved under ${esc(DB.settings.session)}. A full session archive will download. This cannot be undone.</p>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="doNewSession()">Promote & Start ${esc(next)}</button>`);
}
function doNewSession(){
  termArchive('FULL-'+DB.settings.session);
  const next=nextSessionStr(DB.settings.session);
  DB.students.filter(s=>!s.graduated).forEach(s=>{const p=promotionFor(s);
    if(p.decision==='graduate'){s.graduated=true;s.graduatedSession=DB.settings.session;}
    else if(p.decision==='promote'){const i=DB.classes.findIndex(c=>c.id===s.classId);if(i>=0&&i+1<DB.classes.length)s.classId=DB.classes[i+1].id;}
    // repeat/pending: stay in same class
  });
  DB.settings.session=next;DB.settings.term='First Term';DB.settings.termsDone=[];
  save();closeModal();$('#termBadge').textContent=DB.settings.term+' • '+DB.settings.session;
  toast('New session '+next+' started');go('dashboard');
}

function saveWeeks(){DB.settings.termWeeks=Math.max(1,Number($('#wk_total').value)||13);const sw=$('#wk_set');if(sw&&!sw.disabled)DB.settings.currentWeek=Math.max(1,Number(sw.value)||1);save();vSession();toast('Weeks saved');}

  <div class="t-wrap"><table><thead><tr><th>Staff</th><th class="center">Status</th><th class="right">Charge</th><th>Reason (absent)</th><th class="center">Decision</th></tr></thead><tbody>
  ${staff.map(u=>{const r=rec[u.id]||{};return `<tr>
    <td><b>${esc(u.name)}</b><br><span class="muted" style="font-size:11px">${u.role==='admin'?'Administrator':'Teacher'}</span></td>
    <td class="center"><div class="flex gap" style="justify-content:center">${[['P','Present','green'],['L','Late','gold'],['A','Absent','danger']].map(([k,l,c])=>`<button class="btn sm ${r.status===k?c:'sec'}" onclick="setStaffAtt('${u.id}','${k}')">${l}</button>`).join('')}</div></td>
    <td class="right">${r.charge?naira(r.charge):'—'}</td>
    <td>${r.status==='A'?`<input value="${esc(r.reason||'')}" placeholder="Reason for absence" onchange="setStaffReason('${u.id}',this.value)" style="font-size:12px">`:'<span class="muted">—</span>'}</td>
    <td class="center">${r.charge?`<div class="flex gap" style="justify-content:center"><button class="btn sm ${r.decision==='enforced'?'danger':'sec'}" onclick="staffDecision('${u.id}','enforced')">Enforce</button><button class="btn sm ${r.decision==='waived'?'green':'sec'}" onclick="staffDecision('${u.id}','waived')">Waive</button></div>`:'<span class="muted">—</span>'}</td></tr>`;}).join('')}

function setCharges(){DB.settings.charges={late:Number($('#ch_late').value)||0,absent:Number($('#ch_abs').value)||0};save();}
function setStaffAtt(uid,st){const ch=DB.settings.charges||{late:200,absent:500};DB.staffAtt[staffDate]=DB.staffAtt[staffDate]||{};
  const cur=DB.staffAtt[staffDate][uid]||{};
  if(cur.status===st){delete DB.staffAtt[staffDate][uid];}
  else{const charge=st==='L'?ch.late:st==='A'?ch.absent:0;DB.staffAtt[staffDate][uid]={status:st,charge,reason:cur.reason||'',decision:charge?'pending':''};}
  save();vStaffAtt();}
function setStaffReason(uid,v){const r=(DB.staffAtt[staffDate]||{})[uid];if(r){r.reason=v;save();}}

function houseStudents(hid){return DB.students.filter(s=>s.houseId===hid&&!s.graduated);}

  <div class="t-wrap"><table><thead><tr><th>House</th>${DB.houseActivities.map(a=>`<th class="center">${esc(a.name)} <button class="btn icon" style="padding:1px 4px" onclick="delActivity('${a.id}')">✕</button></th>`).join('')}<th class="center">Total</th></tr></thead><tbody>

function setHouseScore(kind,id,hid,val){const k=hsKey(kind,id,hid);if(val==='')delete DB.houseScores[k];else DB.houseScores[k]=Number(val);save();
  (houseTab==='inspect'?renderInspect:renderEvents)();}
function addActivity(){modal('Add activity',`<div class="fld"><label>Activity name *</label><input id="act_name" placeholder="e.g. March Past"></div>`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveActivity()">Add</button>`);}

function renderStandings(){if(!DB.houses.length){$('#houseArea').innerHTML=`<div class="card"><div class="empty">Create houses first.</div></div>`;return;}
  const rank=houseRank();const best=rank[0];const scored=rank.some(r=>r.total>0);
  const top=rank.slice(0,3);const order=[1,0,2];const heights=[110,86,66];const medals=['🥇','🥈','🥉'];const maxP=Math.max(1,top[0]?top[0].total:1);
  const podium=`<div class="podium">${order.filter(i=>top[i]).map(i=>{const r=top[i];return `<div class="col"><div class="name">${medals[i]} ${esc(r.h.name)}</div>

  ${rank.map((r,i)=>{let insp=0;INSPECT_WEEKS.forEach(w=>insp+=Number(DB.houseScores[hsKey('insp','wk'+w,r.h.id)])||0);const evt=r.total-insp;
    return `<tr${i===0&&scored?' style="background:#fdf3d7"':''}><td><b>${ord(i+1)}</b></td><td><b style="color:${esc(r.h.color)}">●</b> ${esc(r.h.name)}</td><td class="center">${houseStudents(r.h.id).length}</td><td class="right">${insp}</td><td class="right">${evt}</td><td class="right"><b>${r.total}</b></td></tr>`;}).join('')}

function lpSubjects(cid){const subs=DB.subjects[cid]||[];$('#lp_subject').innerHTML=subs.map(su=>`<option>${esc(su)}</option>`).join('');}
function autogenLesson(){const topic=$('#lp_topic').value.trim()||'the topic';const subj=$('#lp_subject').value;const cls=className($('#lp_class').value);
  const T=topic;const isMath=/math|quantitative/i.test(subj);
  $('#lp_obj').value=`By the end of the lesson, pupils should be able to:\n1. explain the meaning of ${T};\n2. ${isMath?'solve simple problems involving '+T:'mention/identify examples of '+T};\n3. state the importance/use of ${T} in everyday life.`;
  $('#lp_mat').value=`Textbook, chalkboard/whiteboard, charts, flashcards and real/improvised objects related to ${T}.`;
  $('#lp_prev').value=`Pupils in ${cls} are familiar with ideas around ${T} from earlier lessons and daily experience.`;
  $('#lp_intro').value=`The teacher introduces the lesson by asking pupils questions about ${T} and relating it to their everyday life.`;
  $('#lp_steps').value=`Step 1: Teacher explains the meaning of ${T}.\nStep 2: Teacher gives examples and demonstrates using the materials.\nStep 3: Pupils participate by giving their own examples.\nStep 4: Teacher writes summary notes on the board for pupils to copy.`;
  $('#lp_eval').value=`1. What is ${T}?\n2. ${isMath?'Solve one example involving '+T:'Mention two examples of '+T}.\n3. State one importance of ${T}.`;
  $('#lp_sum').value=`The teacher summarises the key points of ${T}, corrects pupils' misconceptions and links it to the next lesson.`;
  $('#lp_assign').value=`Pupils should write three sentences about ${T}${isMath?' and solve two practice questions':' and bring one example to the next class'}.`;
  toast('Draft generated — review & edit before saving');}
function saveLesson(id){const topic=$('#lp_topic').value.trim();if(!topic){toast('Topic is required',true);return;}
  const obj={classId:$('#lp_class').value,subject:$('#lp_subject').value,week:Number($('#lp_week').value)||1,duration:$('#lp_dur').value.trim(),topic,teacherId:$('#lp_teacher').value,
    objectives:$('#lp_obj').value.trim(),materials:$('#lp_mat').value.trim(),prevKnowledge:$('#lp_prev').value.trim(),intro:$('#lp_intro').value.trim(),
    steps:$('#lp_steps').value.trim(),evaluation:$('#lp_eval').value.trim(),summary:$('#lp_sum').value.trim(),assignment:$('#lp_assign').value.trim(),term:DB.settings.term,session:DB.settings.session};
  if(id)Object.assign(DB.lessonPlans.find(x=>x.id===id),obj);else{obj.id=uid('lp');obj.createdBy=USER.name;obj.createdAt=today();DB.lessonPlans.push(obj);}
  save();closeModal();lpClass=obj.classId;vLessons();toast('Lesson plan saved');}
function delLesson(id){DB.lessonPlans=DB.lessonPlans.filter(x=>x.id!==id);save();vLessons();toast('Lesson plan removed');}
function viewLesson(id){const p=DB.lessonPlans.find(x=>x.id===id);const t=DB.users.find(u=>u.id===p.teacherId);const logo=DB.settings.logo?`<img src="${DB.settings.logo}">`:'🎓';
  const nl=s=>esc(s||'—').replace(/\n/g,'<br>');
  modal('Lesson Plan — '+p.topic,`<div class="rc" style="${themeVars()}">
    <div class="rc-top"><div class="rc-head"><div class="rc-crest">${logo}</div><div class="rc-sch"><h2>${esc(DB.settings.schoolName)}</h2><div class="addr">${addrTel()}</div></div></div></div>
    <div class="rc-title">✦ LESSON PLAN ✦</div>
    <div style="padding:14px 18px">
      <div class="rc-fields" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px;margin-bottom:12px">
        <div class="f"><span>Subject</span><b>${esc(p.subject)}</b></div><div class="f"><span>Class</span><b>${esc(className(p.classId))}</b></div><div class="f"><span>Week</span><b>${p.week||'—'}</b></div>
        <div class="f"><span>Topic</span><b>${esc(p.topic)}</b></div><div class="f"><span>Duration</span><b>${esc(p.duration||'—')}</b></div><div class="f"><span>Teacher</span><b>${t?esc(t.name):'—'}</b></div></div>
      ${[['Behavioural Objectives',p.objectives],['Instructional Materials',p.materials],['Previous Knowledge',p.prevKnowledge],['Introduction',p.intro],['Presentation',p.steps],['Evaluation',p.evaluation],['Summary / Conclusion',p.summary],['Assignment',p.assignment]]
        .map(([h,v])=>`<div style="margin-bottom:8px"><b style="color:var(--rg);font-size:11px;text-transform:uppercase;letter-spacing:.04em">${h}</b><div style="font-size:12.5px;margin-top:2px;border:1px solid #e7dec0;border-radius:6px;padding:7px;background:#fbfaf3">${nl(v)}</div></div>`).join('')}
      <div class="rc-sign" style="padding:8px 0 0"><div><div class="ln">Teacher's Signature</div></div><div><div class="ln">Head Teacher's Signature</div></div></div>

function renderAuth(){
  const sc=$('#screen');sc.style.display='';$('#app').style.display='none';if(window.setManifest)setManifest();
  if(MODE==='check'){renderChecker();return;}
  if(MODE==='owner'){
    sc.innerHTML=`<div class="auth owner"><div class="acard"><div class="crest p">🛰️</div>
      <h1>${esc((MASTER&&MASTER.platform.name)||'EduManager Cloud')}</h1><div class="sub">Owner Console</div>
      <div class="auth-err" id="aerr"></div>
      <div class="field"><label>Owner username</label><input id="ou" placeholder="owner"></div>
      <div class="field"><label>Password</label><input id="op" type="password"></div>
      <button class="btn purple" style="width:100%;justify-content:center" onclick="ownerLogin()">Sign in</button>
      <div class="hint"><b>Demo:</b> owner / owner123. Change it in Owner → Settings.</div></div></div>`;
    $('#op').addEventListener('keydown',e=>{if(e.key==='Enter')ownerLogin();});return;
  }
  // school mode
  const name=(DB&&DB.settings.schoolName)||'School';
  const logo=(DB&&DB.settings.logo)?`<img src="${DB.settings.logo}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">`:'🎓';
  if(!DB){sc.innerHTML=`<div class="auth school"><div class="acard"><div class="crest g">🚫</div><h1>School not found</h1><div class="sub">No school for code “${esc(SCHOOL_CODE)}”. Check your link.</div></div></div>`;return;}
  if(DB.settings.status==='suspended'){sc.innerHTML=`<div class="auth school"><div class="acard"><div class="crest g">⏸️</div><h1>${esc(name)}</h1><div class="sub">This school's access is currently suspended. Please contact the provider.</div></div></div>`;return;}
  sc.innerHTML=`<div class="auth school"><div class="acard"><div class="crest g">${logo}</div>
    <h1>${esc(name)}</h1><div class="sub">Staff Portal</div>
    ${DB.settings.islamic?`<div class="bismillah" style="font-size:16px;margin:-4px 0 10px">${BISMILLAH.a}</div>`:''}
    <div class="auth-err" id="aerr"></div>
    <div class="field"><label>Username</label><input id="su" placeholder="admin"></div>
    <div class="field"><label>Password</label><input id="sp" type="password"></div>
    <button class="btn" style="width:100%;justify-content:center" onclick="schoolLogin()">Sign in</button>
    <div class="swlink">Student / Parent? <a onclick="MODE='check';renderChecker()">Check your result →</a></div>
    <div class="hint">Use the login details provided by your school's administrator.</div></div></div>`;

}
function ownerLogin(){const u=$('#ou').value.trim().toLowerCase(),p=$('#op').value;const o=MASTER.platform.owner;
  if(u===o.username.toLowerCase()&&p===o.password){USER={name:o.name,role:'owner'};enterApp();}else{$('#aerr').style.display='block';$('#aerr').textContent='Invalid owner credentials.';}}
function schoolLogin(){const u=$('#su').value.trim().toLowerCase(),p=$('#sp').value;
  const f=DB.users.find(x=>x.username.toLowerCase()===u&&x.password===p);
  if(!f){$('#aerr').style.display='block';$('#aerr').textContent='Invalid username or password.';return;}
  USER=f;sessionStorage.setItem('sms_su',SCHOOL_CODE+'|'+f.id);enterApp();}
function logout(){USER=null;sessionStorage.removeItem('sms_su');$('#app').style.display='none';if(window._scanner)stopScan();renderAuth();}

let CURRENT='';
function enterApp(){
  $('#screen').innerHTML='';$('#screen').style.display='none';$('#app').style.display='block';window.scrollTo(0,0);
  const owner=USER.role==='owner';
  $('#topbar').className='topbar'+(owner?' owner':'');
  $('#brandName').textContent=owner?((MASTER.platform.name)||'EduManager Cloud'):DB.settings.schoolName;
  $('#topLogo').textContent=owner?'🛰️':'🎓';
  $('#whoName').textContent=USER.name;$('#whoRole').textContent=owner?'Owner':(USER.role==='admin'?'Administrator':'Teacher');
  $('#termBadge').textContent=owner?'Platform':(DB.settings.term+' • '+DB.settings.session);
  setSync(supa?'on':'off',supa?'Synced':'Local');
  buildNav();go(owner?'odash':(USER.role==='admin'?'dashboard':'attendance'));
  setManifest();
}
function buildNav(){
  let items;
  if(USER.role==='owner') items=[['odash','📊','Dashboard'],['schools','🏫','Schools'],['pins','🔑','Result PINs'],['revenue','💵','Revenue'],['osettings','⚙️','Settings']];
  else if(USER.role==='admin'){items=[['dashboard','📊','Dashboard'],['insights','✨','Insights'],['students','👧','Students'],['admissions','📥','Admissions',pendingAppCount()],['classes','🏫','Classes'],['teachers','👩‍🏫','Teachers'],['attendance','📅','Attendance'],['scanner','📷','Scan ID'],['results','📝','Results'],['reports','🏅','Report Cards'],['promotions','🎓','Promotions'],['session','📆','Session'],['calendar','🗓️','Calendar'],['fees','💰','Fees',pendingPayCount()],['idcards','🪪','ID Cards']];
    if(hasModule('staffAttendance'))items.splice(7,0,['staffatt','👔','Staff Att.']);
    if(hasModule('houses'))items.push(['houses','🏠','Houses']);
    if(hasModule('lessonPlans'))items.push(['lessons','📚','Lesson Plans']);}
  else {items=[['attendance','📅','Attendance'],['scanner','📷','Scan ID'],['results','📝','Results'],['reports','🏅','Report Cards'],['myclasses','🏫','My Classes']];
    if(hasModule('lessonPlans'))items.splice(4,0,['lessons','📚','Lesson Plans']);}
  const ow=USER.role==='owner'?' owner':'';
  $('#sidebar').innerHTML=items.map(([k,i,l,b])=>`<button class="nav-item${ow}${k===CURRENT?' active':''}" onclick="go('${k}')"><span class="ic">${i}</span>${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
}
function toggleNav(open){const sb=document.querySelector('.sidebar'),sc=$('#navScrim');const show=open===undefined?!sb.classList.contains('show'):open;
  sb.classList.toggle('show',show);if(sc)sc.classList.toggle('show',show);}
function go(p){if(window._scanner)stopScan();CURRENT=p;buildNav();toggleNav(false);
  const map={odash:vODash,schools:vSchools,pins:vPins,revenue:vRevenue,osettings:vOSettings,
    dashboard:vDashboard,insights:vInsights,students:vStudents,admissions:vAdmissions,classes:vClasses,teachers:vTeachers,
    attendance:vAttendance,scanner:vScanner,results:vResults,reports:vReports,fees:vFees,idcards:vIdCards,myclasses:vMyClasses,
    promotions:vPromotions,session:vSession,calendar:vCalendar,staffatt:vStaffAtt,lessons:vLessons,houses:vHouses};
  (map[p]||vDashboard)();}

function resetCred(code,userId){const d=STORE[code];const u=d.users.find(x=>x.id===userId);if(!u){toast('User not found',true);return;}

function saveSchool(code){
  const name=$('#sc_name').value.trim();const ca1=+$('#sc_ca1').value,ca2=+$('#sc_ca2').value,exam=+$('#sc_exam').value;const promote=+$('#sc_promote').value||40;
  const addr=$('#sc_addr').value.trim(),phone=$('#sc_phone').value.trim(),email=$('#sc_email').value.trim();
  const themeSel=$('#sc_theme')?$('#sc_theme').value:'green';const mods={};document.querySelectorAll('.sc_mod:checked').forEach(c=>mods[c.value]=true);
  if(!name){toast('School name required',true);return;}
  if(!addr){toast('Full address is required',true);return;}
  if(!phone||phone.replace(/\D/g,'').length<7){toast('A valid phone number is required',true);return;}
  if(!email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('A valid school email is required',true);return;}
  if(ca1+ca2+exam!==100){toast('CA1+CA2+Exam must total 100',true);return;}
  if(code){const reg=MASTER.schools.find(s=>s.code===code);reg.name=name;reg.status=$('#sc_status').value;
    const d=STORE[code];Object.assign(d.settings,{schoolName:name,shortName:$('#sc_short').value.trim(),address:addr,phone,email,motto:$('#sc_motto').value.trim(),logo:_logo,islamic:$('#sc_islamic').checked,theme:themeSel,modules:mods,
      session:$('#sc_sess').value.trim(),term:$('#sc_term').value,status:$('#sc_status').value,grade:{ca1,ca2,exam,promote}});
    saveMaster();saveSchoolRow(code);closeModal();toast('School updated');manageSchool(code);return;}
  const newCode=$('#sc_code').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').replace(/^-+|-+$/g,'');
  if(!newCode){toast('Code required',true);return;}
  if(MASTER.schools.some(s=>s.code===newCode)){toast('Code already exists',true);return;}
  const auser=$('#sc_auser').value.trim(),apass=$('#sc_apass').value.trim();if(!auser||!apass){toast('Admin login required',true);return;}
  const d=seedSchool(newCode,name);Object.assign(d.settings,{shortName:$('#sc_short').value.trim(),address:addr,phone,email,motto:$('#sc_motto').value.trim(),logo:_logo,islamic:$('#sc_islamic').checked,theme:themeSel,modules:mods,

  d.users[0].name=$('#sc_aname').value.trim()||'School Administrator';d.users[0].username=auser;d.users[0].password=apass;
  STORE[newCode]=d;MASTER.schools.push({code:newCode,name,status:$('#sc_status').value,createdAt:today()});
  saveStoreLocal();saveMaster();saveSchoolRow(newCode);closeModal();toast('School created');manageSchool(newCode);
}

function doGenPins(){
  const school=$('#g_school').value,sess=$('#g_sess').value.trim(),term=$('#g_term').value;
  const qty=Math.max(1,Math.min(2000,+$('#g_qty').value||0)),maxUses=Math.max(1,+$('#g_uses').value||1),price=+$('#g_price').value||0;
  const batch={id:uid('b'),school,session:sess,term,qty,maxUses,price,createdAt:today()};
  const existing=new Set(MASTER.pins.map(p=>p.code));
  for(let i=0;i<qty;i++){let code;do{code=String(Math.floor(100000000000+Math.random()*899999999999));}while(existing.has(code));existing.add(code);
    MASTER.pins.push({code,school,session:sess,term,maxUses,uses:0,price,batch:batch.id,createdAt:today()});}
  MASTER.batches.push(batch);saveMaster();pinSchool=school;closeModal();toast(qty+' PINs generated');vPins();
}
function printPins(batchId){
  const b=MASTER.batches.find(x=>x.id===batchId);const reg=MASTER.schools.find(s=>s.code===b.school);

  const html=`<div class="no-print" style="margin-bottom:10px"><b>${esc(reg.name)}</b> — ${esc(b.term)}, ${esc(b.session)} · ${pins.length} PINs</div>

  modal('Print PINs — '+reg.name,html,`<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn purple no-print" onclick="window.print()">🖨 Print</button>`,true);

function vRevenue(){
  const rows=MASTER.schools.map(s=>{const bs=MASTER.batches.filter(b=>b.school===s.code);

/* ===================== SCHOOL: INSIGHTS (smart) ===================== */
function vInsights(){
  const insights=[];
  // best/worst class by average
  const classStats=DB.classes.map(c=>{const{rows}=computeClassResults(c.id);const scored=rows.filter(r=>r.count);
    const avg=scored.length?scored.reduce((a,r)=>a+r.avg,0)/scored.length:0;return{c,avg,scored:scored.length,total:rows.length};}).filter(x=>x.scored);
  if(classStats.length){const best=classStats.slice().sort((a,b)=>b.avg-a.avg)[0];const worst=classStats.slice().sort((a,b)=>a.avg-b.avg)[0];
    insights.push(`🏆 <b>${esc(best.c.name)}</b> leads with a class average of <b>${best.avg.toFixed(1)}%</b>.`);
    if(worst.c.id!==best.c.id)insights.push(`📉 <b>${esc(worst.c.name)}</b> needs support — class average <b>${worst.avg.toFixed(1)}%</b>.`);}
  // pupils needing attention across school
  let atRisk=[];DB.classes.forEach(c=>{const{rows}=computeClassResults(c.id);rows.forEach(r=>{if(r.count&&r.avg<50)atRisk.push({name:r.s.name,cls:c.name,avg:r.avg});});});
  atRisk.sort((a,b)=>a.avg-b.avg);
  // subject hotspots
  const subjAgg={};DB.classes.forEach(c=>{const{rows}=computeClassResults(c.id);rows.forEach(r=>r.marks.forEach(m=>{if(m.has){subjAgg[m.sub]=subjAgg[m.sub]||{t:0,n:0};subjAgg[m.sub].t+=m.total;subjAgg[m.sub].n++;}}));});
  const subjArr=Object.entries(subjAgg).map(([k,v])=>({sub:k,avg:v.t/v.n,n:v.n})).filter(x=>x.n>=3).sort((a,b)=>a.avg-b.avg);
  // attendance
  let p=0,tot=0;Object.keys(DB.attendance).forEach(k=>Object.values(DB.attendance[k]).forEach(v=>{tot++;if(v==='P')p++;}));
  const attRate=tot?Math.round(p/tot*100):0;
  if(attRate)insights.push(`📅 Overall attendance is <b>${attRate}%</b> across all recorded days.`);
  if(!insights.length)insights.push('Enter some results and attendance to unlock insights.');

  const totalPupils=DB.students.length;
  const summary=`Across <b>${totalPupils}</b> pupil(s)${classStats.length?` and ${classStats.length} class(es) with results`:''}, `+
    (classStats.length?`the school's overall average is <b>${(classStats.reduce((a,c)=>a+c.avg,0)/classStats.length).toFixed(1)}%</b>. `:'no results have been entered yet. ')+
    (atRisk.length?`<b>${atRisk.length}</b> pupil(s) are below 50% and may need extra support. `:(classStats.length?'No pupils are currently below 50% — strong performance overall. ':''))+
    (subjArr.length?`The weakest subject so far is <b>${esc(subjArr[0].sub)}</b> (${subjArr[0].avg.toFixed(0)}%)${subjArr.length>1?`, and the strongest is <b>${esc(subjArr[subjArr.length-1].sub)}</b> (${subjArr[subjArr.length-1].avg.toFixed(0)}%)`:''}.`:'');
  $('#view').innerHTML=`<div class="page-head"><div><h2>✨ Smart Insights</h2><p>Automatic analysis of results & attendance</p></div></div>
  <div class="card pad mb" style="border-left:4px solid var(--purple);background:var(--purple-light)"><div class="flex gap" style="align-items:flex-start"><span style="font-size:22px">🤖</span><div><b style="color:var(--purple)">AI Summary</b><div style="margin-top:4px">${summary}</div></div></div></div>
  ${insights.map(i=>`<div class="insight">${i}</div>`).join('')}
  <div class="grid2">
    <div class="card pad"><h3 class="mb">Pupils needing attention <span class="muted" style="font-size:12px">(avg below 50%)</span></h3>
      ${atRisk.length?`<div class="t-wrap"><table><thead><tr><th>Pupil</th><th>Class</th><th class="right">Avg</th></tr></thead><tbody>
        ${atRisk.slice(0,12).map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.cls)}</td><td class="right" style="color:var(--red)">${r.avg.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No at-risk pupils 🎉</p>'}</div>
    <div class="card pad"><h3 class="mb">Subjects by average</h3>
      ${subjArr.length?subjArr.slice(0,12).map(x=>`<div class="flex mb" style="gap:10px"><div style="flex:1"><div style="font-size:12.5px">${esc(x.sub)}</div>
        <div class="bar" style="width:${Math.max(4,x.avg)}%;background:${x.avg<50?'var(--red)':x.avg<60?'var(--gold)':'var(--green)'}"></div></div>
        <b style="width:48px;text-align:right">${x.avg.toFixed(0)}%</b></div>`).join(''):'<p class="muted">Not enough data yet.</p>'}</div>
  </div>`;
}

function delStudent(id){const s=DB.students.find(x=>x.id===id);

    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmDelStudent('${id}')">Delete</button>`);}
function confirmDelStudent(id){DB.students=DB.students.filter(x=>x.id!==id);
  Object.keys(DB.results).forEach(k=>{if(k.endsWith('|'+id))delete DB.results[k];});
  Object.keys(DB.fees).forEach(k=>{if(k.endsWith('|'+id))delete DB.fees[k];});
  Object.keys(DB.remarks).forEach(k=>{if(k.endsWith('|'+id))delete DB.remarks[k];});
  Object.keys(DB.attendance).forEach(k=>{if(DB.attendance[k][id])delete DB.attendance[k][id];});
  DB.payments=DB.payments.filter(p=>p.studentId!==id);save();closeModal();renderStuTable();toast('Pupil removed');}

let resClass='';

  $('#view').innerHTML=`<div class="page-head"><div><h2>Results Entry</h2><p>${esc(DB.settings.term)}, ${esc(DB.settings.session)} — CA1 (${g.ca1}) + CA2 (${g.ca2}) + Exam (${g.exam}) = 100</p></div></div>

function renderRes(){if(!resClass){$('#resArea').innerHTML=`<div class="card"><div class="empty">No class assigned.</div></div>`;return;}

  showSubj(document.querySelector('.subtab'),0);}
function showSubj(btn,i){document.querySelectorAll('.subtab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const g=G(),subj=(DB.subjects[resClass]||[])[i],list=studentsIn(resClass);
  $('#subjPane').innerHTML=`<div class="t-wrap"><table><thead><tr><th>Name</th><th class="center">CA1 (${g.ca1})</th><th class="center">CA2 (${g.ca2})</th><th class="center">Exam (${g.exam})</th><th class="center">Total</th><th class="center">Grade</th></tr></thead><tbody>
  ${list.map(s=>{const r=(DB.results[rkey(s.id)]||{})[subj]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const tot=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);const gr=gradeOf(tot);
    return `<tr><td><b>${esc(s.name)}</b></td>
    <td class="center"><input class="score-in" type="number" min="0" max="${g.ca1}" value="${r.ca1??''}" onchange="setScore('${s.id}','${jq(subj)}','ca1',this,${g.ca1})"></td>
    <td class="center"><input class="score-in" type="number" min="0" max="${g.ca2}" value="${r.ca2??''}" onchange="setScore('${s.id}','${jq(subj)}','ca2',this,${g.ca2})"></td>
    <td class="center"><input class="score-in" type="number" min="0" max="${g.exam}" value="${r.exam??''}" onchange="setScore('${s.id}','${jq(subj)}','exam',this,${g.exam})"></td>
    <td class="center" id="tot_${s.id}"><b>${has?tot:'—'}</b></td><td class="center" id="gr_${s.id}">${has?`<span class="pill ${gr.g==='F'?'red':'green'}">${gr.g}</span>`:'—'}</td></tr>`;}).join('')}
  </tbody></table></div><p class="muted mt" style="font-size:12.5px">Scores save automatically.</p>`;}
function setScore(sid,subj,field,inp,max){let v=inp.value===''?null:Math.max(0,Math.min(max,Number(inp.value)));if(v!==null)inp.value=v;
  const k=rkey(sid);DB.results[k]=DB.results[k]||{};DB.results[k][subj]=DB.results[k][subj]||{};
  if(v===null)delete DB.results[k][subj][field];else DB.results[k][subj][field]=v;
  const cur=DB.results[k][subj];if(cur.ca1==null&&cur.ca2==null&&cur.exam==null)delete DB.results[k][subj];save();
  const r=(DB.results[k]||{})[subj]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const tot=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);const gr=gradeOf(tot);
  $('#tot_'+sid).innerHTML=`<b>${has?tot:'—'}</b>`;$('#gr_'+sid).innerHTML=has?`<span class="pill ${gr.g==='F'?'red':'green'}">${gr.g}</span>`:'—';}

function computeClassResults(cid,sess,term){const subs=DB.subjects[cid]||[],list=studentsIn(cid);
  const rows=list.map(s=>{const res=DB.results[rkey(s.id,sess,term)]||{};let total=0,count=0;
    const marks=subs.map(sub=>{const r=res[sub]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const t=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);if(has){total+=t;count++;}return{sub,ca1:r.ca1,ca2:r.ca2,exam:r.exam,total:has?t:null,has};});
    return{s,marks,total,count,avg:count?total/count:0};});
  const ranked=rows.slice().filter(r=>r.count).sort((a,b)=>b.total-a.total);ranked.forEach((r,i)=>r.pos=i+1);return{rows,size:ranked.length};}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function autoRemark(avg,subs){if(!subs||!subs.some(m=>m.has))return'No results entered yet.';
  const scored=subs.filter(m=>m.has);const best=scored.slice().sort((a,b)=>b.total-a.total)[0];const worst=scored.slice().sort((a,b)=>a.total-b.total)[0];
  let base=avg>=70?'An excellent result.':avg>=60?'A very good performance.':avg>=50?'A good effort.':avg>=40?'A fair result; more effort needed.':'Needs serious improvement.';
  let tip='';if(best)tip+=` Strongest in ${best.sub}.`;if(worst&&worst.total<50&&worst.sub!==best.sub)tip+=` Should improve in ${worst.sub}.`;return base+tip;}
function autoHead(a){if(a>=70)return'Outstanding. A model pupil.';if(a>=50)return'Good progress. Well done.';if(a>=40)return'Can do better with more focus.';return'Requires close attention and support.';}

    <button class="subtab${feeTab==='invoices'?' active':''}" onclick="feeTab='invoices';vFees()">🧾 Invoices</button></div><div id="feeArea"></div>`;
  if(feeTab==='fees')renderFees();else if(feeTab==='approve')renderApprovals();else if(feeTab==='invoices')vInvoices();else renderPayHistory();}
function renderFees(){$('#feeArea').innerHTML=`<div class="toolbar"><div><label>Class</label><select onchange="feeClass=this.value;renderFees()">${DB.classes.map(c=>`<option value="${c.id}" ${feeClass===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div><button class="btn sec" onclick="setClassFee()">Set fee for whole class</button></div></div><div id="feeTbl"></div>`;
  const list=studentsIn(feeClass);if(!list.length){$('#feeTbl').innerHTML=`<div class="card"><div class="empty"><div class="big">💰</div>No pupils in this class.</div></div>`;return;}
  let tDue=0,tPaid=0;const rows=list.map(s=>{const f=DB.fees[rkey(s.id)]||{};const due=Number(f.due)||0,paid=approvedPaid(s.id),bal=due-paid;tDue+=due;tPaid+=paid;
    const st=due===0?['grey','Not set']:bal<=0?['green','Paid']:paid>0?['amber','Part']:['red','Owing'];
    return `<tr><td>${avatar(s.photo,'👧')}</td><td><b>${esc(s.name)}</b></td><td><input class="score-in" style="width:110px;text-align:right" type="number" value="${f.due??''}" onchange="setFeeDue('${s.id}',this.value)"></td>
      <td class="right">${naira(paid)}</td><td class="right" style="color:${bal>0?'var(--red)':'var(--green)'}"><b>${naira(bal)}</b></td>
      <td class="center"><span class="pill ${st[0]}">${st[1]}</span></td><td class="right" style="white-space:nowrap"><button class="btn sm" onclick="recordPayment('${s.id}')">＋ Pay</button><button class="btn icon" title="View / edit payments" onclick="managePayments('${s.id}')">📋</button></td></tr>`;}).join('');
  $('#feeTbl').innerHTML=`<div class="cards-row" style="margin-bottom:16px"><div class="stat"><div class="lbl">Expected</div><div class="num">${naira(tDue)}</div></div>
    <div class="stat"><div class="lbl">Collected</div><div class="num" style="color:var(--green)">${naira(tPaid)}</div></div>
    <div class="stat"><div class="lbl">Outstanding</div><div class="num" style="color:var(--red)">${naira(tDue-tPaid)}</div></div></div>
  <div class="t-wrap"><table><thead><tr><th></th><th>Name</th><th>Fee Due (₦)</th><th class="right">Paid</th><th class="right">Balance</th><th class="center">Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;}
function setFeeDue(sid,val){const k=rkey(sid);DB.fees[k]=DB.fees[k]||{};DB.fees[k].due=val===''?0:Number(val);save();renderFees();}
function setClassFee(){modal('Set fee for '+className(feeClass),`<div class="fld"><label>Fee (₦) for every pupil in ${esc(className(feeClass))}</label><input id="cf_amt" type="number" placeholder="e.g. 45000"></div>`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="applyClassFee()">Apply</button>`);}
function applyClassFee(){const amt=Number($('#cf_amt').value)||0;studentsIn(feeClass).forEach(s=>{const k=rkey(s.id);DB.fees[k]=DB.fees[k]||{};DB.fees[k].due=amt;});save();closeModal();renderFees();toast('Class fee applied');}
function recordPayment(sid){const s=DB.students.find(x=>x.id===sid);const due=Number((DB.fees[rkey(sid)]||{}).due)||0;const bal=due-approvedPaid(sid);
  modal('Record Payment — '+s.name,`<p class="muted mb">Outstanding (school fees): <b style="color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</b>. A receipt is generated once the payment is approved.</p>
    <div class="grid2"><div class="fld"><label>Payment for *</label><select id="p_purpose" onchange="document.getElementById('p_descWrap').style.display=this.value==='Other'?'block':'none'"><option>School Fees</option><option>Examination Fee</option><option>Uniform</option><option>Books / Stationery</option><option>PTA Levy</option><option>Development Levy</option><option>Excursion</option><option>Other</option></select></div>
    <div class="fld"><label>Amount (₦) *</label><input id="p_amt" type="number"></div>
    <div class="fld full" id="p_descWrap" style="display:none"><label>Describe the payment</label><input id="p_desc" placeholder="What is this payment for?"></div>
    <div class="fld"><label>Term</label><select id="p_term">${TERMS.map(t=>`<option ${DB.settings.term===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fld"><label>Date</label><input id="p_date" type="date" value="${today()}"></div>
    <div class="fld"><label>Method</label><select id="p_method"><option>Cash</option><option>Bank Transfer</option><option>POS</option><option>Cheque</option></select></div>
    <div class="fld"><label>Reference</label><input id="p_ref" placeholder="optional"></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePayment('${sid}',false)">Submit for approval</button>
     ${USER.role==='admin'?`<button class="btn gold" onclick="savePayment('${sid}',true)">Add & approve now</button>`:''}`);}
function savePayment(sid,approve){const amt=Number($('#p_amt').value);if(!amt||amt<=0){toast('Enter a valid amount',true);return;}
  let purpose=$('#p_purpose').value;if(purpose==='Other')purpose=$('#p_desc').value.trim()||'Other';
  const pay={id:uid('p'),studentId:sid,session:DB.settings.session,term:$('#p_term').value,amount:amt,purpose,method:$('#p_method').value,ref:$('#p_ref').value.trim(),date:$('#p_date').value,recordedBy:USER.name,status:'pending'};
  if(approve&&USER.role==='admin'){pay.status='approved';pay.approvedBy=USER.name;pay.approvedAt=today();pay.receiptNo=nextReceiptNo();}
  DB.payments.push(pay);save();closeModal();buildNav();vFees();if(approve)openReceipt(pay.id);
  toast(approve?'Approved — receipt ready':'Submitted for approval');}
function nextReceiptNo(){DB.settings.receiptSeq=(DB.settings.receiptSeq||0)+1;return 'RCT/'+DB.settings.session.slice(0,4)+'/'+String(DB.settings.receiptSeq).padStart(4,'0');}
function renderApprovals(){const pend=DB.payments.filter(p=>p.status==='pending').slice().reverse();
  if(!pend.length){$('#feeArea').innerHTML=`<div class="card"><div class="empty"><div class="big">✅</div>No payments awaiting approval.</div></div>`;return;}
  $('#feeArea').innerHTML=`<div class="t-wrap"><table><thead><tr><th>Date</th><th>Pupil</th><th>Payment for</th><th>Term</th><th class="right">Amount</th><th>By</th><th></th></tr></thead><tbody>
  ${pend.map(p=>{const s=DB.students.find(x=>x.id===p.studentId)||{name:'(deleted)'};return `<tr><td class="muted">${esc(p.date)}</td><td><b>${esc(s.name)}</b><br><span class="muted" style="font-size:11px">${esc(className(s.classId))}</span></td><td>${esc(p.purpose||'School Fees')}</td><td class="muted">${esc(p.term||'')}</td>
    <td class="right"><b>${naira(p.amount)}</b></td><td class="muted">${esc(p.recordedBy||'')}</td>
    <td class="right" style="white-space:nowrap"><button class="btn sm" onclick="approvePay('${p.id}')">Approve</button><button class="btn sm danger" onclick="rejectPay('${p.id}')">Reject</button></td></tr>`;}).join('')}
  </tbody></table></div>`;}
function approvePay(id){const p=DB.payments.find(x=>x.id===id);p.status='approved';p.approvedBy=USER.name;p.approvedAt=today();p.receiptNo=nextReceiptNo();save();buildNav();vFees();toast('Approved — '+p.receiptNo);openReceipt(id);}
function rejectPay(id){DB.payments.find(x=>x.id===id).status='rejected';save();buildNav();vFees();toast('Rejected');}
function renderPayHistory(){const list=DB.payments.filter(p=>p.session===DB.settings.session&&p.term===DB.settings.term).slice().reverse();
  if(!list.length){$('#feeArea').innerHTML=`<div class="card"><div class="empty"><div class="big">🧾</div>No payments this term.</div></div>`;return;}
  const stp={approved:['green','Approved'],pending:['amber','Pending'],rejected:['red','Rejected']};
  $('#feeArea').innerHTML=`<div class="t-wrap"><table><thead><tr><th>Date</th><th>Pupil</th><th>For</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(p=>{const s=DB.students.find(x=>x.id===p.studentId)||{name:'(deleted)'};const st=stp[p.status]||['grey',p.status];return `<tr><td class="muted">${esc(p.date)}</td><td><b>${esc(s.name)}</b></td><td>${esc(p.purpose||'School Fees')}</td>
    <td class="right">${naira(p.amount)}</td><td><span class="pill ${st[0]}">${st[1]}</span></td>
    <td class="right" style="white-space:nowrap">${p.status==='approved'?`<button class="btn icon" title="Receipt" onclick="openReceipt('${p.id}')">🧾</button>`:''}<button class="btn icon" title="Edit" onclick="editPayment('${p.id}')">✏️</button><button class="btn icon" title="Delete" onclick="delPayment('${p.id}')">🗑️</button></td></tr>`;}).join('')}
  </tbody></table></div><p class="muted mt" style="font-size:12px">✏️ correct a mistake · 🗑️ remove a wrong entry. Balances update automatically.</p>`;}
function managePayments(sid){const s=DB.students.find(x=>x.id===sid);const list=DB.payments.filter(p=>p.studentId===sid).slice().reverse();
  const due=Number((DB.fees[rkey(sid)]||{}).due)||0,paid=approvedPaid(sid),bal=due-paid;
  modal('Payments — '+s.name,`<p class="muted mb">Fee due (this term): <b>${naira(due)}</b> · Paid: <b style="color:var(--green)">${naira(paid)}</b> · Balance: <b style="color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</b></p>
    <div class="mb"><label>Fix the term fee total (₦) — if it was entered wrong</label><div class="flex gap"><input id="mp_due" type="number" value="${due}" style="max-width:170px"><button class="btn sec sm" onclick="fixFeeDue('${sid}')">Save fee</button></div></div>
    ${list.length?`<div class="t-wrap"><table><thead><tr><th>Date</th><th>For</th><th>Term</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(p=>`<tr><td class="muted">${esc(p.date)}</td><td>${esc(p.purpose||'School Fees')}</td><td class="muted">${esc(p.term||'')}</td><td class="right">${naira(p.amount)}</td><td><span class="pill ${p.status==='approved'?'green':p.status==='pending'?'amber':'red'}">${esc(p.status)}</span></td>
        <td class="right" style="white-space:nowrap"><button class="btn icon" title="Edit amount/details" onclick="editPayment('${p.id}')">✏️</button><button class="btn icon" title="Delete wrong entry" onclick="delPayment('${p.id}')">🗑️</button></td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted">No payments recorded for this pupil yet.</p>'}`,
    `<button class="btn sec" onclick="closeModal()">Close</button><button class="btn" onclick="recordPayment('${sid}')">＋ Add payment</button>`,true);}
function fixFeeDue(sid){const v=Number($('#mp_due').value)||0;const k=rkey(sid);DB.fees[k]=DB.fees[k]||{};DB.fees[k].due=v;save();toast('Term fee corrected');managePayments(sid);}
function editPayment(id){const p=DB.payments.find(x=>x.id===id);if(!p)return;
  modal('Edit payment',`<div class="grid2">
    <div class="fld"><label>Payment for</label><input id="ep_purpose" value="${esc(p.purpose||'School Fees')}"></div>
    <div class="fld"><label>Amount (₦)</label><input id="ep_amt" type="number" value="${p.amount}"></div>
    <div class="fld"><label>Term</label><select id="ep_term">${TERMS.map(t=>`<option ${p.term===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fld"><label>Date</label><input id="ep_date" type="date" value="${esc(p.date||'')}"></div>
    <div class="fld"><label>Method</label><input id="ep_method" value="${esc(p.method||'')}"></div>
    <div class="fld"><label>Status</label><select id="ep_status"><option value="approved" ${p.status==='approved'?'selected':''}>Approved</option><option value="pending" ${p.status==='pending'?'selected':''}>Pending</option><option value="rejected" ${p.status==='rejected'?'selected':''}>Rejected</option></select></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveEditPayment('${id}')">Save changes</button>`);}
function saveEditPayment(id){const p=DB.payments.find(x=>x.id===id);const amt=Number($('#ep_amt').value);if(!amt||amt<=0){toast('Valid amount required',true);return;}
  p.purpose=$('#ep_purpose').value.trim();p.amount=amt;p.term=$('#ep_term').value;p.date=$('#ep_date').value;p.method=$('#ep_method').value.trim();
  const ns=$('#ep_status').value;if(ns==='approved'&&!p.receiptNo){p.receiptNo=nextReceiptNo();p.approvedBy=USER.name;p.approvedAt=today();}p.status=ns;
  save();closeModal();buildNav();vFees();toast('Payment updated');}
function delPayment(id){const p=DB.payments.find(x=>x.id===id);const s=DB.students.find(x=>x.id===p.studentId)||{name:'(pupil)'};
  modal('Delete payment?',`<p>Remove the ${naira(p.amount)} payment for <b>${esc(s.name)}</b> (${esc(p.purpose||'School Fees')})? This corrects the balance and cannot be undone.</p>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmDelPayment('${id}')">Delete</button>`);}
function confirmDelPayment(id){DB.payments=DB.payments.filter(x=>x.id!==id);save();closeModal();buildNav();vFees();toast('Payment deleted');}
function openReceipt(id){const p=DB.payments.find(x=>x.id===id);const s=DB.students.find(x=>x.id===p.studentId)||{name:'(deleted)'};
  const due=Number((DB.fees[rkey(p.studentId)]||{}).due)||0;const bal=due-approvedPaid(p.studentId);const logo=DB.settings.logo?`<img src="${DB.settings.logo}" style="width:100%;height:100%;object-fit:cover">`:'🎓';
  modal('Receipt — '+(p.receiptNo||''),`<div class="receipt"><div class="rh"><div class="seal">${logo}</div><div><h2>${esc(DB.settings.schoolName)}</h2><div class="muted" style="font-size:11px">${addrTel()}</div></div>
    <div class="no">OFFICIAL RECEIPT<br><b>${esc(p.receiptNo||'—')}</b><br>${esc(p.date)}</div></div>
    <div style="display:flex;gap:14px;align-items:center;margin:6px 0 4px">
      <div style="width:64px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">${s.photo?`<img src="${s.photo}" style="width:100%;height:100%;object-fit:cover">`:'👧'}</div>
      <div style="flex:1"><div style="font-size:16px;font-weight:800">${esc(s.name)}</div><div class="muted" style="font-size:12px">${esc(className(s.classId))} · Adm ${esc(s.admissionNo||'—')}</div>
        <div style="margin-top:4px"><span class="pill green">${esc(p.term)} · ${esc(p.session)}</span></div></div></div>
    <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px">Being payment for</div>
    <div style="text-align:center;font-size:15px;font-weight:700;color:var(--green-dark);margin-bottom:6px">${esc(p.purpose||'School Fees')}</div>
    <div class="amount">${naira(p.amount)}</div>
    <div class="lines"><div><span>Payment for</span><b>${esc(p.purpose||'School Fees')}</b></div><div><span>Term</span><b>${esc(p.term)}</b></div><div><span>Session</span>${esc(p.session)}</div>
      <div><span>Method</span>${esc(p.method)}${p.ref?' · '+esc(p.ref):''}</div>
      <div><span>School fees for term</span>${naira(due)}</div><div><span>Fees balance</span><b style="color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</b></div><div><span>Approved by</span>${esc(p.approvedBy||'—')}</div></div>
    <div class="center"><div class="paid-stamp">PAID</div></div>
    <div class="sign" style="display:flex;justify-content:space-between;margin-top:22px;font-size:12px"><div style="text-align:center;width:45%"><div style="border-top:1px solid #888;margin-top:26px;padding-top:4px">Bursar / Admin</div></div><div style="text-align:center;width:45%"><div style="border-top:1px solid #888;margin-top:26px;padding-top:4px">School Stamp</div></div></div>
    ${docQuote(5)}
    <div style="text-align:center;font-size:10.5px;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:8px">${enquiryLine()}</div></div>`,
    `<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print / PDF</button>`);}

  <div class="qr" style="margin-top:8px"><img class="qrimg" data-qr="${esc(u.staffId||u.id)}"><div class="muted" style="font-size:8.5px">Scan to verify</div></div>
  <div class="terms">This card certifies the holder as authorised staff of ${esc(DB.settings.schoolName)}. It remains school property and must be returned on exit.</div>
  <div class="sig"><div class="ln">Staff Signature</div><div class="ln">Head Teacher</div></div></div>
  <div class="idc-foot">${esc(DB.settings.motto||'')}</div></div>`;}
function renderBarcodes(){if(!window.JsBarcode)return;document.querySelectorAll('svg.bc[data-code]').forEach(el=>{if(el.dataset.done)return;
  try{JsBarcode(el,el.getAttribute('data-code'),{format:'CODE128',height:42,width:1.7,fontSize:12,margin:0,displayValue:true});if(el.childNodes.length)el.dataset.done='1';}catch(e){}});}
function showStudentId(id){const s=DB.students.find(x=>x.id===id);modal('Pupil ID Card (Front & Back)',`<div class="idgrid" style="padding:6px 0">${studentCardHTML(s)}${studentCardBack(s)}</div>`,`<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print</button>`,true);renderVisuals();}
function showTeacherId(id){const u=DB.users.find(x=>x.id===id);modal('Staff ID Card (Front & Back)',`<div class="idgrid" style="padding:6px 0">${teacherCardHTML(u)}${teacherCardBack(u)}</div>`,`<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print</button>`,true);renderVisuals();}

/* ===================== SCHOOL: SCANNER ===================== */
function vScanner(){$('#view').innerHTML=`<div class="page-head"><div><h2>Scan ID</h2><p>Scan a pupil/staff barcode to verify, mark present or check fees</p></div></div>
  <div class="card pad" style="max-width:520px;margin:0 auto"><div id="reader"></div>
    <div class="flex gap mt" style="justify-content:center"><button class="btn" id="scanStartBtn" onclick="startScan()">▶ Start camera</button><button class="btn sec" onclick="stopScan()">Stop</button></div>
    <hr><p class="muted center" style="font-size:12.5px">No camera? Type the ID / admission number:</p>
    <div class="flex gap" style="max-width:340px;margin:0 auto"><input id="manualCode" placeholder="e.g. ADM/2025/001" onkeydown="if(event.key==='Enter')handleScan(this.value)"><button class="btn sec" onclick="handleScan(document.getElementById('manualCode').value)">Find</button></div>
    <p class="muted center mt" style="font-size:12px">📷 Camera needs the hosted https link.</p></div><div id="scanResult"></div>`;}
function startScan(){if(!window.Html5Qrcode){toast('Scanner not loaded',true);return;}if(window._scanner)return;
  const fmts=window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.QR_CODE]:undefined;
  window._scanner=new Html5Qrcode('reader');
  window._scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150},formatsToSupport:fmts},txt=>handleScan(txt),()=>{}).then(()=>{$('#scanStartBtn').textContent='Scanning…';}).catch(e=>{toast('Camera failed. Use manual entry.',true);window._scanner=null;});}
function stopScan(){if(window._scanner){const sc=window._scanner;window._scanner=null;sc.stop().then(()=>sc.clear()).catch(()=>{});const b=$('#scanStartBtn');if(b)b.textContent='▶ Start camera';}}
function handleScan(code){code=(code||'').trim();if(!code)return;
  const s=DB.students.find(x=>(x.admissionNo||'').toLowerCase()===code.toLowerCase()||x.id===code);
  const u=!s&&DB.users.find(x=>(x.staffId||'').toLowerCase()===code.toLowerCase()||x.id===code);stopScan();
  if(s)showScanStudent(s);else if(u)showScanTeacher(u);else{const r=$('#scanResult');if(r)r.innerHTML=`<div class="scan-result"><div class="card pad center"><div style="font-size:34px">❌</div><b>No match for “${esc(code)}”.</b></div></div>`;toast('No match',true);}}
function showScanStudent(s){const due=Number((DB.fees[rkey(s.id)]||{}).due)||0,paid=approvedPaid(s.id),bal=due-paid;const t=today();const mark=(DB.attendance[t+'|'+s.classId]||{})[s.id];const r=$('#scanResult');
  r.innerHTML=`<div class="scan-result"><div class="card pad"><div class="flex gap mb">${s.photo?`<img src="${s.photo}" style="width:64px;height:64px;border-radius:10px;object-fit:cover">`:'<div style="width:64px;height:64px;border-radius:10px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px">👧</div>'}
    <div><span class="pill green">PUPIL VERIFIED</span><div style="font-size:18px;font-weight:800;margin-top:4px">${esc(s.name)}</div><div class="muted">${esc(className(s.classId))} · Adm ${esc(s.admissionNo||'—')}</div></div></div>
    <div class="cards-row" style="margin-bottom:14px"><div class="stat"><div class="lbl">Fee due</div><div class="num" style="font-size:20px">${naira(due)}</div></div>
      <div class="stat"><div class="lbl">Paid</div><div class="num" style="font-size:20px;color:var(--green)">${naira(paid)}</div></div>
      <div class="stat"><div class="lbl">Balance</div><div class="num" style="font-size:20px;color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</div></div></div>
    <div class="flex gap" style="flex-wrap:wrap"><button class="btn ${mark==='P'?'sec':''}" onclick="scanMarkPresent('${s.id}')">${mark==='P'?'✓ Present today':'📅 Mark present today'}</button>
      <button class="btn sec" onclick="showStudentId('${s.id}')">ID card</button>${USER.role==='admin'?`<button class="btn sec" onclick="recordPayment('${s.id}')">Record payment</button>`:''}</div></div></div>`;
  r.scrollIntoView({behavior:'smooth',block:'nearest'});}
function showScanTeacher(u){const r=$('#scanResult');r.innerHTML=`<div class="scan-result"><div class="card pad"><div class="flex gap mb">${u.photo?`<img src="${u.photo}" style="width:64px;height:64px;border-radius:10px;object-fit:cover">`:'<div style="width:64px;height:64px;border-radius:10px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px">👩‍🏫</div>'}
    <div><span class="pill blue">STAFF VERIFIED</span><div style="font-size:18px;font-weight:800;margin-top:4px">${esc(u.name)}</div><div class="muted">Teacher · ${esc(u.staffId||'—')}</div><div class="muted">Classes: ${esc((u.classes||[]).map(className).join(', ')||'—')}</div></div></div>
    <button class="btn sec" onclick="showTeacherId('${u.id}')">ID card</button></div></div>`;r.scrollIntoView({behavior:'smooth',block:'nearest'});}
function scanMarkPresent(sid){const s=DB.students.find(x=>x.id===sid);const t=today();const k=t+'|'+s.classId;DB.attendance[k]=DB.attendance[k]||{};DB.attendance[k][sid]='P';save();toast(s.name.split(' ')[0]+' marked present');showScanStudent(s);}

/* ===================== SCHOOL: MY CLASSES (teacher) ===================== */
function vMyClasses(){const cls=teacherClasses();
  $('#view').innerHTML=`<div class="page-head"><div><h2>My Classes</h2><p>Classes assigned to you</p></div></div>
  ${cls.length?`<div class="cards-row">${cls.map(c=>`<div class="card pad"><h3>${esc(c.name)}</h3><p class="muted">${studentsIn(c.id).length} pupils · ${(DB.subjects[c.id]||[]).length} subjects</p>
    <div class="flex gap mt"><button class="btn sm sec" onclick="attClass='${c.id}';go('attendance')">Attendance</button><button class="btn sm sec" onclick="resClass='${c.id}';go('results')">Results</button></div></div>`).join('')}</div>
