/* ===================== QUR'AN COMPETITION ===================== */
let qTab='levels',qFilterHizb='',QURAN=null;
function quranLoaded(){return Array.isArray(QURAN)&&QURAN.length>6000&&QURAN[0]&&QURAN[0].g;}
function loadQuranCache(){if(quranLoaded())return;try{const c=JSON.parse(localStorage.getItem('quran_uthmani_v2'));if(Array.isArray(c)&&c.length>6000&&c[0].g)QURAN=c;}catch(e){}}
const RECITERS=[{id:'ar.alafasy',name:'Mishary Al-Afasy',br:128},{id:'ar.husary',name:'Mahmoud Al-Husary',br:128},{id:'ar.husarymujawwad',name:'Al-Husary (Mujawwad)',br:128},{id:'ar.minshawi',name:'Al-Minshawi',br:128},{id:'ar.abdulbasitmurattal',name:'Abdul-Basit (Murattal)',br:128},{id:'ar.abdurrahmaansudais',name:'Abdur-Rahman As-Sudais',br:192},{id:'ar.mahermuaiqly',name:'Maher Al-Muaiqly',br:128},{id:'ar.shaatree',name:'Abu Bakr Ash-Shaatri',br:128}];
function curReciter(){return RECITERS.find(r=>r.id===(DB.settings.quranReciter||'ar.alafasy'))||RECITERS[0];}
function ayahAudio(g){const r=curReciter();return 'https://cdn.islamic.network/quran/audio/'+r.br+'/'+r.id+'/'+g+'.mp3';}
let _qAudio=null;
function playAyah(g){try{if(_qAudio){_qAudio.pause();}_qAudio=new Audio(ayahAudio(g));_qAudio.play().catch(()=>toast('Audio needs internet (plays offline once cached).',true));toast('▶ Playing ayah…');}catch(e){toast('Could not play audio',true);}}
function stopAyah(){if(_qAudio){_qAudio.pause();_qAudio=null;}}
async function fetchQuran(){
  toast('Downloading the Qur’an… (one-time)');
  try{const r=await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');const j=await r.json();
    if(!j||!j.data||!j.data.surahs)throw 0;
    const arr=[];j.data.surahs.forEach(su=>su.ayahs.forEach(ay=>arr.push({g:ay.number,s:su.number,sn:su.englishName,a:ay.numberInSurah,h:Math.ceil(ay.hizbQuarter/4),t:ay.text})));
    QURAN=arr;try{localStorage.setItem('quran_uthmani_v2',JSON.stringify(arr));}catch(e){toast('Loaded (too large to cache offline)',true);}
    toast('Qur’an loaded — '+arr.length+' ayat across 60 Hizb');if(qTab==='levels')qRenderLevels();else if(qTab==='compete')qRenderCompete();
  }catch(e){toast('Could not download the Qur’an. Check internet, then retry.',true);}
}
function quranDir(){return DB.settings.quranDir||'end';}
function levelHizbRange(l){const cap=l.cap;return quranDir()==='begin'?[1,cap]:[61-cap,60];}
function reciteCandidates(l){if(!quranLoaded())return [];const[lo,hi]=levelHizbRange(l);const c=[];
  for(let i=0;i<QURAN.length-1;i++){const x=QURAN[i],y=QURAN[i+1];if(x.h>=lo&&x.h<=hi&&y.s===x.s)c.push(i);}return c;}
function reciteSheet(s){const l=qLevelOf(s);if(!l||!quranLoaded())return [];const cand=reciteCandidates(l);const n=DB.settings.quranQPerStudent||5;
  const picks=[],used={};let guard=0;while(picks.length<Math.min(n,cand.length)&&guard++<n*40){const idx=cand[Math.floor(Math.random()*cand.length)];if(used[idx])continue;used[idx]=1;const x=QURAN[idx],y=QURAN[idx+1];picks.push({prompt:x,answer:y});}return picks;}
function qLevel(id){return DB.quranLevels.find(l=>l.id===id);}
function qLevelOf(s){return s.quranLevel?qLevel(s.quranLevel):null;}
function qStudents(levelId){return DB.students.filter(s=>!s.graduated&&s.quranLevel===levelId).sort((a,b)=>a.name.localeCompare(b.name));}
function qScoreKey(sid){return DB.settings.session+'|'+DB.settings.term+'|'+sid;}
function bankForLevel(l){if(!l)return [];const[lo,hi]=levelHizbRange(l);return DB.quranQuestions.filter(q=>Number(q.hizb)>=lo&&Number(q.hizb)<=hi);}
function qEligible(s){return bankForLevel(qLevelOf(s));}
function vQuran(){loadQuranCache();
  $('#view').innerHTML=`<div class="page-head"><div><h2>☪ Qur’an Competition</h2><p>${esc(DB.settings.term)}, ${esc(DB.settings.session)} — Hizb levels (1–60). All pupils participate.</p></div></div>
  <div class="subtabs">${[['levels','Levels & Pupils'],['bank','Question Bank'],['compete','Competition'],['results','Results 🏆']].map(([k,l])=>`<button class="subtab${qTab===k?' active':''}" onclick="qTab='${k}';vQuran()">${l}</button>`).join('')}</div>
  <div id="qArea"></div>`;
  ({levels:qRenderLevels,bank:qRenderBank,compete:qRenderCompete,results:qRenderResults}[qTab]||qRenderLevels)();
}
function qRenderLevels(){
  const unassigned=DB.students.filter(s=>!s.graduated&&!s.quranLevel).length;
  $('#qArea').innerHTML=`<div class="card pad mb"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><b>📖 Qur’an text:</b> ${quranLoaded()?`<span class="pill green">Loaded (${QURAN.length} ayat, 60 Hizb)</span>`:'<span class="pill amber">Not loaded</span> — load it to auto-generate recitation questions'}</div>
      <button class="btn ${quranLoaded()?'sec':''} sm" onclick="fetchQuran()">${quranLoaded()?'↻ Reload':'⬇ Load Qur’an (one-time)'}</button></div>
    <div class="flex gap mt" style="align-items:center"><label style="margin:0">Memorisation counts:</label>
      <select onchange="DB.settings.quranDir=this.value;save();qRenderLevels()" style="max-width:280px">
        <option value="end" ${quranDir()==='end'?'selected':''}>From the end — Juz’ Amma first (Hizb 60 → 1)</option>
        <option value="begin" ${quranDir()==='begin'?'selected':''}>From the beginning — Al-Baqarah first (Hizb 1 → 60)</option></select></div>
    <p class="muted mt" style="font-size:12px">A level covers its Hizb range automatically, e.g. “5 Hizb” = ${quranDir()==='end'?'Hizb 56–60':'Hizb 1–5'}.</p></div>
  <div class="cards-row">${DB.quranLevels.map(l=>{const[lo,hi]=levelHizbRange(l);return `<div class="stat"><div class="lbl">${esc(l.name)}</div><div class="num">${qStudents(l.id).length}</div><div class="meta">Hizb ${lo}–${hi}</div></div>`;}).join('')}</div>
  ${unassigned?`<div class="viewonly mb">⚠ ${unassigned} pupil(s) not yet placed in a Hizb level. Assign them below.</div>`:''}
  <div class="card pad"><div class="flex" style="justify-content:space-between"><h3>Assign pupils to levels</h3><span class="muted" style="font-size:12px">Use ⬆ to upgrade a pupil to the next level when they complete it.</span></div>
  <div class="t-wrap mt"><table><thead><tr><th>Pupil</th><th>Class</th><th>Hizb Level</th><th></th></tr></thead><tbody>
  ${DB.students.filter(s=>!s.graduated).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td class="muted">${esc(className(s.classId))}</td>
    <td><select onchange="setQLevel('${s.id}',this.value)"><option value="">— not set —</option>${DB.quranLevels.map(l=>`<option value="${l.id}" ${s.quranLevel===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></td>
    <td class="right"><button class="btn sm sec" title="Upgrade to next level" onclick="upgradeQ('${s.id}')">⬆ Upgrade</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function setQLevel(sid,lid){const s=DB.students.find(x=>x.id===sid);if(lid)s.quranLevel=lid;else delete s.quranLevel;save();}
function upgradeQ(sid){const s=DB.students.find(x=>x.id===sid);const order=DB.quranLevels;const i=order.findIndex(l=>l.id===s.quranLevel);
  if(i<0){s.quranLevel=order[0].id;}else if(i+1<order.length){s.quranLevel=order[i+1].id;}else{toast('Already at highest level',true);return;}
  save();qRenderLevels();toast(s.name.split(' ')[0]+' upgraded to '+qLevel(s.quranLevel).name);}
function qRenderBank(){
  let list=DB.quranQuestions.slice();if(qFilterHizb)list=list.filter(q=>String(q.hizb)===String(qFilterHizb));
  list.sort((a,b)=>a.hizb-b.hizb);
  $('#qArea').innerHTML=`<div class="toolbar"><button class="btn" onclick="editQuestion()">＋ Add question</button>
    <div><label>Filter by Hizb</label><select onchange="qFilterHizb=this.value;qRenderBank()"><option value="">All Hizb</option>${Array.from({length:60},(_,i)=>i+1).map(n=>`<option value="${n}" ${String(qFilterHizb)===String(n)?'selected':''}>Hizb ${n}</option>`).join('')}</select></div>
    <span class="pill grey">${DB.quranQuestions.length} question(s) total</span></div>
  ${list.length?`<div class="t-wrap"><table><thead><tr><th>Hizb</th><th>Question</th><th>Answer</th><th></th></tr></thead><tbody>
    ${list.map(q=>`<tr><td class="center"><b>${q.hizb}</b></td><td>${esc(q.text)}</td><td class="muted">${esc(q.answer||'—')}</td>
      <td class="right" style="white-space:nowrap"><button class="btn icon" onclick="editQuestion('${q.id}')">✏️</button><button class="btn icon" onclick="delQuestion('${q.id}')">🗑️</button></td></tr>`).join('')}
  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">📖</div>No questions yet. Add questions tagged by their Hizb number.</div></div>`}`;
}
function editQuestion(id){const q=id?DB.quranQuestions.find(x=>x.id===id):{hizb:qFilterHizb||1};
  modal(id?'Edit question':'Add question',`<div class="grid2">
    <div class="fld"><label>Hizb (1–60) *</label><input id="q_hizb" type="number" min="1" max="60" value="${q.hizb||1}"></div></div>
    <div class="fld"><label>Question *</label><textarea id="q_text" rows="2" placeholder="e.g. Recite the next verse after… / Which Surah contains…">${esc(q.text||'')}</textarea></div>
    <div class="fld"><label>Answer / note (for examiner, optional)</label><textarea id="q_ans" rows="2">${esc(q.answer||'')}</textarea></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveQuestion('${id||''}')">Save</button>`);}
function saveQuestion(id){const hizb=Math.max(1,Math.min(60,Number($('#q_hizb').value)||1));const text=$('#q_text').value.trim();if(!text){toast('Question required',true);return;}
  const obj={hizb,text,answer:$('#q_ans').value.trim()};if(id)Object.assign(DB.quranQuestions.find(x=>x.id===id),obj);else{obj.id=uid('q');DB.quranQuestions.push(obj);}
  save();closeModal();qRenderBank();toast('Question saved');}
function delQuestion(id){DB.quranQuestions=DB.quranQuestions.filter(x=>x.id!==id);save();qRenderBank();toast('Question removed');}
function qRenderCompete(){
  const n=DB.settings.quranQPerStudent||5;const src=DB.settings.quranSource||(quranLoaded()?'recite':'bank');
  $('#qArea').innerHTML=`<div class="card pad mb" style="max-width:640px"><div class="grid2">
      <div class="fld"><label>Questions per pupil</label><input id="q_per" type="number" min="1" value="${n}"></div>
      <div class="fld"><label>Question source</label><select id="q_src"><option value="recite" ${src==='recite'?'selected':''}>Recitation — auto from Qur’an</option><option value="bank" ${src==='bank'?'selected':''}>Typed question bank</option></select></div>
      <div class="fld full"><label>Reciter (for ▶ audio)</label><select id="q_reciter">${RECITERS.map(r=>`<option value="${r.id}" ${curReciter().id===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
        <button type="button" class="btn sec sm mt" onclick="DB.settings.quranReciter=document.getElementById('q_reciter').value;playAyah(1)">▶ Preview</button></div>
    </div><button class="btn sec sm" onclick="setQCompete()">Save</button>
    ${src==='recite'&&!quranLoaded()?'<p class="viewonly mt">⚠ Load the Qur’an text on the <b>Levels</b> tab first to use recitation questions.</p>':''}</div>
  <div class="card pad"><h3 class="mb">Generate question sheets</h3>
    <p class="muted mb">Each pupil gets <b>${n}</b> ${src==='recite'?'<b>recitation prompt(s)</b> — a verse to continue — drawn from the Hizb within their level':'question(s) from the typed bank within their level'}. The examiner answer key is included.</p>
    <div class="t-wrap"><table><thead><tr><th>Level</th><th class="center">Pupils</th><th class="center">Available</th><th></th></tr></thead><tbody>
    ${DB.quranLevels.map(l=>{const pupils=qStudents(l.id);if(!pupils.length)return '';const avail=src==='recite'?reciteCandidates(l).length:bankForLevel(l).length;return `<tr><td><b>${esc(l.name)}</b></td><td class="center">${pupils.length}</td><td class="center">${avail}</td>
      <td class="right"><button class="btn sm ${avail<1?'sec':''}" onclick="printSheets('${l.id}')">🖨 Sheets for level</button></td></tr>`;}).join('')||'<tr><td colspan=4 class="muted center">No pupils assigned to levels yet.</td></tr>'}
    </tbody></table></div>
    <p class="muted mt" style="font-size:12px">If fewer items are available than the set number, all available are used. Each sheet is freshly randomised.</p></div>`;
}
function setQCompete(){DB.settings.quranQPerStudent=Math.max(1,Number($('#q_per').value)||1);DB.settings.quranSource=$('#q_src').value;if($('#q_reciter'))DB.settings.quranReciter=$('#q_reciter').value;save();qRenderCompete();toast('Saved');}
function pickQs(s){const pool=qEligible(s).slice();const n=DB.settings.quranQPerStudent||5;for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}return pool.slice(0,n);}
function sheetHead(s,l){const logo=DB.settings.logo?`<img src="${DB.settings.logo}">`:'🎓';
  return `<div class="rc-top"><div class="rc-bism">۞ ${BISMILLAH.a} ۞</div><div class="rc-head"><div class="rc-crest">${logo}</div><div class="rc-sch"><h2>${esc(DB.settings.schoolName)}</h2><div class="addr">${addrTel()}</div></div></div></div>
    <div class="rc-title">✦ QUR’AN COMPETITION — QUESTION SHEET ✦</div>
    <div class="rc-fields" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px;padding:12px 18px 0"><div class="f"><span>Pupil</span><b>${esc(s.name)}</b></div><div class="f"><span>Level</span><b>${esc(l?l.name:'—')}</b></div><div class="f"><span>Term</span><b>${esc(DB.settings.term)}</b></div></div>`;}
function sheetHTML(s){const l=qLevelOf(s);const src=DB.settings.quranSource||(quranLoaded()?'recite':'bank');
  let body;
  if(src==='recite'){const items=reciteSheet(s);
    body=items.length?`<ol style="font-size:13px;padding-left:20px">${items.map(it=>`<li style="margin-bottom:12px">Continue the recitation from <b>(${esc(it.prompt.sn)} ${it.prompt.s}:${it.prompt.a}, Hizb ${it.prompt.h})</b>
      <button class="btn sm sec no-print" style="margin-left:6px" onclick="playAyah(${it.prompt.g})">▶ Play ayah</button>:
      <div class="ayah">${esc(it.prompt.t)}</div>
      <div class="ayah-ans">الإجابة: ${esc(it.answer.t)} <span style="font-size:11px;color:#888">(${esc(it.answer.sn)} ${it.answer.s}:${it.answer.a})</span> <button class="btn sm sec no-print" onclick="playAyah(${it.answer.g})">▶ Play answer</button></div></li>`).join('')}</ol>`
      :'<p class="muted">No recitation items available for this level. Load the Qur’an text and check the level’s Hizb range.</p>';
  }else{const qs=pickQs(s);
    body=qs.length?`<ol style="font-size:13px;padding-left:20px">${qs.map(q=>`<li style="margin-bottom:8px"><b>(Hizb ${q.hizb})</b> ${esc(q.text)}${q.answer?`<div class="muted" style="font-size:11px;border-left:2px solid var(--rgold);padding-left:8px;margin-top:3px">Answer: ${esc(q.answer)}</div>`:''}</li>`).join('')}</ol>`
      :'<p class="muted">No eligible questions in the bank for this level yet.</p>';}
  return `<div class="rc" style="${themeVars()};margin-bottom:18px">${sheetHead(s,l)}<div style="padding:8px 18px 14px">${body}
    <div class="rc-sign" style="padding:6px 0 0"><div><div class="ln">Examiner</div></div><div><div class="ln">Score: ____ / ____</div></div></div></div></div>`;}
function printSheets(levelId){const pupils=qStudents(levelId);if(!pupils.length){toast('No pupils in this level',true);return;}
  modal('Question Sheets — '+qLevel(levelId).name,pupils.map(s=>`<div style="page-break-after:always">${sheetHTML(s)}</div>`).join(''),
  `<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print all sheets</button>`,true);renderVisuals();}
function qRenderResults(){
  $('#qArea').innerHTML=`<p class="muted mb">Enter each pupil's competition score, then ranking is computed within each level (best to last). Generate certificates below.</p>
  ${DB.quranLevels.filter(l=>qStudents(l.id).length).map(l=>{
    const rows=qStudents(l.id).map(s=>({s,score:Number(DB.quranScores[qScoreKey(s.id)])||0,has:DB.quranScores[qScoreKey(s.id)]!=null}));
    const ranked=rows.slice().filter(r=>r.has).sort((a,b)=>b.score-a.score);ranked.forEach((r,i)=>r.pos=i+1);
    return `<div class="card pad mb"><div class="flex" style="justify-content:space-between"><h3>${esc(l.name)} <span class="muted" style="font-size:12px">(${rows.length} pupils)</span></h3>
      <button class="btn sm gold" onclick="printQCerts('${l.id}')">🏅 Certificates</button></div>
    <div class="t-wrap mt"><table><thead><tr><th>Pupil</th><th class="center">Score</th><th class="center">Position</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.s.name)}</b></td><td class="center"><input class="score-in" type="number" value="${r.has?r.score:''}" onchange="setQScore('${r.s.id}',this.value)"></td>
      <td class="center">${r.pos?(r.pos<=5?['🥇','🥈','🥉','4th','5th'][r.pos-1]:ord(r.pos)):'—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;}).join('')||'<div class="card"><div class="empty">Assign pupils to levels first.</div></div>'}`;
}
function setQScore(sid,val){const k=qScoreKey(sid);if(val==='')delete DB.quranScores[k];else DB.quranScores[k]=Number(val);save();qRenderResults();}
function printQCerts(levelId){const l=qLevel(levelId);const rows=qStudents(levelId).map(s=>({s,score:Number(DB.quranScores[qScoreKey(s.id)])||0,has:DB.quranScores[qScoreKey(s.id)]!=null}));
  const ranked=rows.slice().filter(r=>r.has).sort((a,b)=>b.score-a.score);ranked.forEach((r,i)=>r.pos=i+1);
  const posOf={};ranked.forEach(r=>posOf[r.s.id]=r.pos);
  if(!rows.length){toast('No pupils',true);return;}
  modal('Qur’an Certificates — '+l.name,rows.map(r=>qCertHTML(r.s,l,r.score,posOf[r.s.id])).join(''),
  `<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print all</button>`,true);}
function qCertHTML(s,l,score,pos){const logo=DB.settings.logo?`<img src="${DB.settings.logo}">`:'🎓';const top5=pos&&pos<=5;const ord5=pos?ord(pos):'';
  return `<div class="cert" style="page-break-after:always">${s.photo?`<img class="cpass" src="${s.photo}">`:''}
    <div class="lg">${logo}</div><h1>${esc(DB.settings.schoolName)}</h1><div class="sub2">${addrTel()}</div>
    <div style="font-family:'Amiri',serif;font-size:18px;color:var(--green-dark);direction:rtl;margin:4px 0">۞ ${BISMILLAH.a} ۞</div>
    <div class="ttl">Qur’an Competition — Certificate ${top5?'of Excellence':'of Participation'}</div>
    <p>This is to certify that</p><div class="nm">${esc(s.name)}</div>
    <p>participated in the Qur’an Competition (<b>${esc(l.name)}</b> level) for <b>${esc(DB.settings.term)}, ${esc(DB.settings.session)}</b>${score?` and scored <b>${score}</b>`:''}${top5?`, finishing in <b>${ord5} position</b>`:''}.</p>
    <p style="font-style:italic;color:#5a6b62">“The best of you are those who learn the Qur’an and teach it.” — Hadith, Bukhari</p>
    <p>Awarded this ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}.</p>
    <div class="crow"><div class="line">Mu’allim / Examiner</div><div class="seal">★</div><div class="line">Head Teacher</div></div></div>`;}

/* ===================== HOUSES & ACTIVITIES ===================== */
const INSPECT_WEEKS=[3,4,5,6,7,8,9];
let houseTab='houses';
function hsKey(kind,id,houseId){return kind+'|'+DB.settings.session+'|'+DB.settings.term+'|'+id+'|'+houseId;}
function houseStudents(hid){return DB.students.filter(s=>s.houseId===hid&&!s.graduated);}
function houseTotal(hid){let t=0;INSPECT_WEEKS.forEach(w=>{t+=Number(DB.houseScores[hsKey('insp','wk'+w,hid)])||0;});
  DB.houseActivities.forEach(a=>{t+=Number(DB.houseScores[hsKey('evt',a.id,hid)])||0;});return t;}
function houseRank(){return DB.houses.map(h=>({h,total:houseTotal(h.id)})).sort((a,b)=>b.total-a.total);}
function vHouses(){
  $('#view').innerHTML=`<div class="page-head"><div><h2>🏠 Houses & Activities</h2><p>${esc(DB.settings.term)}, ${esc(DB.settings.session)} — all pupils participate</p></div></div>
  <div class="subtabs">${[['houses','Houses & Pupils'],['inspect','Inspections (Wk 3–9)'],['events','Activities'],['standings','Standings 🏆']].map(([k,l])=>`<button class="subtab${houseTab===k?' active':''}" onclick="houseTab='${k}';vHouses()">${l}</button>`).join('')}</div>
  <div id="houseArea"></div>`;
  ({houses:renderHousesTab,inspect:renderInspect,events:renderEvents,standings:renderStandings}[houseTab]||renderHousesTab)();
}
function renderHousesTab(){
  if(!DB.houses.length){$('#houseArea').innerHTML=`<div class="card"><div class="empty"><div class="big">🏠</div>No houses yet.<br><button class="btn mt" onclick="editHouse()">＋ Create a house</button></div></div>`;return;}
  const unassigned=DB.students.filter(s=>!s.houseId&&!s.graduated).length;
  $('#houseArea').innerHTML=`<div class="toolbar"><button class="btn" onclick="editHouse()">＋ Add house</button><button class="btn sec" onclick="autoAssignHouses()">🎲 Auto-assign pupils</button>
    ${unassigned?`<span class="pill amber">${unassigned} pupil(s) not in a house</span>`:'<span class="pill green">All pupils assigned</span>'}</div>
  <div class="cards-row">${DB.houses.map(h=>{const m=DB.users.find(u=>u.id===h.masterId);const init=((h.name||'?').trim()[0]||'?').toUpperCase();return `<div class="card pad" style="border-top:5px solid ${esc(h.color||'#888')}">
    <div class="flex" style="justify-content:space-between"><div class="flex gap"><div class="house-crest" style="background:${esc(h.color||'#888')}">${esc(init)}</div><div><h3 style="margin:0;line-height:1.1">${esc(h.name)}</h3><span class="muted" style="font-size:12px">${houseStudents(h.id).length} pupils</span></div></div>
      <div style="white-space:nowrap"><button class="btn icon" onclick="editHouse('${h.id}')">✏️</button><button class="btn icon" onclick="delHouse('${h.id}')">🗑️</button></div></div>
    <div class="mt" style="font-size:12.5px">👤 <b>Master:</b> ${m?esc(m.name):'<span style="color:var(--amber)">unassigned</span>'}</div>
    <button class="btn sm sec mt" onclick="assignPupils('${h.id}')" style="width:100%;justify-content:center">Manage pupils</button></div>`;}).join('')}</div>`;
}
let _houseImg='';
function editHouse(id){const h=id?DB.houses.find(x=>x.id===id):{color:'#0a7d33'};const teachers=DB.users.filter(u=>u.role==='teacher');_houseImg=h.image||'';
  modal(id?'Edit House':'Add House',`<div class="grid2">
    <div class="fld"><label>House name *</label><input id="h_name" value="${esc(h.name||'')}" placeholder="e.g. Green House"></div>
    <div class="fld"><label>Colour</label><input id="h_color" type="color" value="${esc(h.color||'#0a7d33')}" style="height:40px;padding:3px"></div>
    <div class="fld full"><label>House master / mistress</label><select id="h_master"><option value="">— none —</option>${teachers.map(t=>`<option value="${t.id}" ${h.masterId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div>
    <label>House photo (shows in the homepage Houses carousel)</label>
    <div class="photo-pick mb"><div class="photo-prev" id="hImgPrev" style="width:120px;height:70px;border-radius:8px">${_houseImg?`<img src="${_houseImg}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`:'🏠'}</div>
      <div><input type="file" id="hImgFile" accept="image/*" style="display:none" onchange="pickHouseImg(this)"><button type="button" class="btn sec sm" onclick="document.getElementById('hImgFile').click()">⬆ Upload</button> <button type="button" class="btn sec sm" onclick="clearHouseImg()">Remove</button></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveHouse('${id||''}')">Save</button>`);}
function pickHouseImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>compress(e.target.result,d=>{_houseImg=d;$('#hImgPrev').innerHTML=`<img src="${d}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`;},900,.6);r.readAsDataURL(f);}
function clearHouseImg(){_houseImg='';const p=$('#hImgPrev');if(p)p.innerHTML='🏠';}
function saveHouse(id){const name=$('#h_name').value.trim();if(!name){toast('Name required',true);return;}
  const obj={name,color:$('#h_color').value,masterId:$('#h_master').value,image:_houseImg};
  if(id)Object.assign(DB.houses.find(x=>x.id===id),obj);else{obj.id=uid('h');DB.houses.push(obj);}save();closeModal();vHouses();toast('House saved');}
function delHouse(id){DB.students.forEach(s=>{if(s.houseId===id)delete s.houseId;});DB.houses=DB.houses.filter(x=>x.id!==id);save();vHouses();toast('House removed');}
function autoAssignHouses(){if(!DB.houses.length){toast('Create houses first',true);return;}
  const list=DB.students.filter(s=>!s.graduated);list.forEach((s,i)=>{s.houseId=DB.houses[i%DB.houses.length].id;});save();vHouses();toast('Pupils distributed across houses');}
function assignPupils(hid){const h=DB.houses.find(x=>x.id===hid);
  modal('Pupils in '+h.name,`<p class="muted mb">Tick pupils that belong to <b>${esc(h.name)}</b>. (A pupil can only be in one house.)</p>
    <div style="max-height:50vh;overflow:auto">${DB.students.filter(s=>!s.graduated).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;color:var(--ink);padding:4px 0"><input type="checkbox" class="hp" value="${s.id}" style="width:auto" ${s.houseId===hid?'checked':''}> ${esc(s.name)} <span class="muted" style="font-size:11px">${esc(className(s.classId))}${s.houseId&&s.houseId!==hid?' · in '+esc((DB.houses.find(x=>x.id===s.houseId)||{}).name||''):''}</span></label>`).join('')}</div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePupilsHouse('${hid}')">Save</button>`,true);}
function savePupilsHouse(hid){const checked=[...document.querySelectorAll('.hp:checked')].map(c=>c.value);
  DB.students.forEach(s=>{if(checked.includes(s.id))s.houseId=hid;else if(s.houseId===hid)delete s.houseId;});save();closeModal();vHouses();toast('Pupils updated');}
function renderInspect(){if(!DB.houses.length){$('#houseArea').innerHTML=`<div class="card"><div class="empty">Create houses first.</div></div>`;return;}
  const cw=hasModule('weeks')?currentWeek():0;
  $('#houseArea').innerHTML=`<p class="muted mb">Enter weekly inspection scores for each house (Weeks 3–9).${hasModule('weeks')?` Current week: <b>Week ${cw}</b>.`:''}</p>
  <div class="t-wrap"><table><thead><tr><th>House</th>${INSPECT_WEEKS.map(w=>`<th class="center" style="${w===cw?'background:var(--gold);color:#3a2c05':''}">Wk ${w}</th>`).join('')}<th class="center">Total</th></tr></thead><tbody>
  ${DB.houses.map(h=>{let tot=0;const cells=INSPECT_WEEKS.map(w=>{const k=hsKey('insp','wk'+w,h.id);const v=DB.houseScores[k];tot+=Number(v)||0;return `<td class="center"><input class="score-in" type="number" value="${v??''}" onchange="setHouseScore('insp','wk${w}','${h.id}',this.value)"></td>`;}).join('');
    return `<tr><td><b style="color:${esc(h.color)}">●</b> ${esc(h.name)}</td>${cells}<td class="center"><b>${tot}</b></td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function renderEvents(){if(!DB.houses.length){$('#houseArea').innerHTML=`<div class="card"><div class="empty">Create houses first.</div></div>`;return;}
  $('#houseArea').innerHTML=`<div class="toolbar"><button class="btn sec" onclick="addActivity()">＋ Add activity</button><span class="muted" style="font-size:12.5px">End-of-term activities (Debate, Quiz, Football…)</span></div>
  <div class="t-wrap"><table><thead><tr><th>House</th>${DB.houseActivities.map(a=>`<th class="center">${esc(a.name)} <button class="btn icon" style="padding:1px 4px" onclick="delActivity('${a.id}')">✕</button></th>`).join('')}<th class="center">Total</th></tr></thead><tbody>
  ${DB.houses.map(h=>{let tot=0;const cells=DB.houseActivities.map(a=>{const k=hsKey('evt',a.id,h.id);const v=DB.houseScores[k];tot+=Number(v)||0;return `<td class="center"><input class="score-in" type="number" value="${v??''}" onchange="setHouseScore('evt','${a.id}','${h.id}',this.value)"></td>`;}).join('');
    return `<tr><td><b style="color:${esc(h.color)}">●</b> ${esc(h.name)}</td>${cells}<td class="center"><b>${tot}</b></td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function setHouseScore(kind,id,hid,val){const k=hsKey(kind,id,hid);if(val==='')delete DB.houseScores[k];else DB.houseScores[k]=Number(val);save();
  (houseTab==='inspect'?renderInspect:renderEvents)();}
function addActivity(){modal('Add activity',`<div class="fld"><label>Activity name *</label><input id="act_name" placeholder="e.g. March Past"></div>`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveActivity()">Add</button>`);}
function saveActivity(){const n=$('#act_name').value.trim();if(!n){toast('Name required',true);return;}DB.houseActivities.push({id:uid('a'),name:n});save();closeModal();vHouses();}
function delActivity(id){DB.houseActivities=DB.houseActivities.filter(a=>a.id!==id);save();vHouses();}
function renderStandings(){if(!DB.houses.length){$('#houseArea').innerHTML=`<div class="card"><div class="empty">Create houses first.</div></div>`;return;}
  const rank=houseRank();const best=rank[0];const scored=rank.some(r=>r.total>0);
  const top=rank.slice(0,3);const order=[1,0,2];const heights=[110,86,66];const medals=['🥇','🥈','🥉'];const maxP=Math.max(1,top[0]?top[0].total:1);
  const podium=`<div class="podium">${order.filter(i=>top[i]).map(i=>{const r=top[i];return `<div class="col"><div class="name">${medals[i]} ${esc(r.h.name)}</div>

  $('#houseArea').innerHTML=`${scored?podium:''}
  <div class="t-wrap"><table><thead><tr><th>Pos</th><th>House</th><th class="center">Pupils</th><th class="right">Inspections</th><th class="right">Activities</th><th class="right">Total</th></tr></thead><tbody>

let lpClass='';
function myLessonClasses(){return USER.role==='admin'?DB.classes:teacherClasses();}
function vLessons(){
  const cls=myLessonClasses();if(!lpClass||!cls.find(c=>c.id===lpClass))lpClass=cls[0]?cls[0].id:'';
  let list=DB.lessonPlans.filter(p=>p.classId===lpClass);
  if(USER.role!=='admin')list=list.filter(p=>p.teacherId===USER.id||(USER.classes||[]).includes(p.classId));
  list.sort((a,b)=>(a.week||0)-(b.week||0));
  $('#view').innerHTML=`<div class="page-head"><div><h2>📚 Lesson Plans</h2><p>${esc(DB.settings.term)}, ${esc(DB.settings.session)} — Nigerian curriculum format</p></div>
    <button class="btn" onclick="editLesson()">＋ New Lesson Plan</button></div>
  <div class="toolbar"><div><label>Class</label><select onchange="lpClass=this.value;vLessons()">${cls.map(c=>`<option value="${c.id}" ${lpClass===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
  ${list.length?`<div class="t-wrap"><table><thead><tr><th class="center">Wk</th><th>Subject</th><th>Topic</th><th>Teacher</th><th></th></tr></thead><tbody>
    ${list.map(p=>{const t=DB.users.find(u=>u.id===p.teacherId);return `<tr><td class="center"><b>${p.week||'—'}</b></td><td>${esc(p.subject)}</td><td><b>${esc(p.topic)}</b></td>

  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">📚</div>No lesson plans for this class yet.<br><button class="btn sm mt" onclick="editLesson()">Create one</button></div></div>`}`;

function editLesson(id){const p=id?DB.lessonPlans.find(x=>x.id===id):{classId:lpClass,week:DB.settings.currentWeek||1,duration:'40 minutes'};

  modal(id?'Edit Lesson Plan':'New Lesson Plan',`
    <div class="grid2">
      <div class="fld"><label>Class *</label><select id="lp_class" onchange="lpSubjects(this.value)">${cls.map(c=>`<option value="${c.id}" ${(p.classId||lpClass)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Subject *</label><select id="lp_subject">${subs.map(su=>`<option ${p.subject===su?'selected':''}>${esc(su)}</option>`).join('')}</select></div>
      <div class="fld"><label>Week</label><input id="lp_week" type="number" value="${p.week||1}"></div>
      <div class="fld"><label>Duration</label><input id="lp_dur" value="${esc(p.duration||'40 minutes')}"></div>

    </div>

    <div class="grid2"><div class="fld"><label>Instructional materials</label><textarea id="lp_mat" rows="2">${esc(p.materials||'')}</textarea></div>
      <div class="fld"><label>Previous knowledge</label><textarea id="lp_prev" rows="2">${esc(p.prevKnowledge||'')}</textarea></div></div>
    <div class="fld"><label>Introduction</label><textarea id="lp_intro" rows="2">${esc(p.intro||'')}</textarea></div>

    <div class="fld"><label>Assignment</label><textarea id="lp_assign" rows="2">${esc(p.assignment||'')}</textarea></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveLesson('${id||''}')">Save lesson plan</button>`,true);}
function lpSubjects(cid){const subs=DB.subjects[cid]||[];$('#lp_subject').innerHTML=subs.map(su=>`<option>${esc(su)}</option>`).join('');}
function autogenLesson(){const topic=$('#lp_topic').value.trim()||'the topic';const subj=$('#lp_subject').value;const cls=className($('#lp_class').value);
  const T=topic;const isMath=/math|quantitative/i.test(subj);
  $('#lp_obj').value=`By the end of the lesson, pupils should be able to:\n1. explain the meaning of ${T};\n2. ${isMath?'solve simple problems involving '+T:'mention/identify examples of '+T};\n3. state the importance/use of ${T} in everyday life.`;
  $('#lp_mat').value=`Textbook, chalkboard/whiteboard, charts, flashcards and real/improvised objects related to ${T}.`;
  $('#lp_prev').value=`Pupils in ${cls} are familiar with ideas around ${T} from earlier lessons and daily experience.`;
  $('#lp_intro').value=`The teacher introduces the lesson by asking pupils questions about ${T} and relating it to their everyday life.`;
  $('#lp_steps').value=`Step 1: Teacher explains the meaning of ${T}.\nStep 2: Teacher gives examples and demonstrates using the materials.\nStep 3: Pupils participate by giving their own examples.\nStep 4: Teacher writes summary notes on the board for pupils to copy.`;
  $('#lp_eval').value=`1. What is ${T}?\n2. ${isMath?'Solve one example involving '+T:'Mention two examples of '+T}.\n3. State one importance of ${T}.`;
  $('#lp_sum').value=`The teacher summarises the key points of ${T}, corrects pupils' misconceptions and links it to the next lesson.`;
  $('#lp_assign').value=`Pupils should write three sentences about ${T}${isMath?' and solve two practice questions':' and bring one example to the next class'}.`;
  toast('Draft generated — review & edit before saving');}
function saveLesson(id){const topic=$('#lp_topic').value.trim();if(!topic){toast('Topic is required',true);return;}
  const obj={classId:$('#lp_class').value,subject:$('#lp_subject').value,week:Number($('#lp_week').value)||1,duration:$('#lp_dur').value.trim(),topic,teacherId:$('#lp_teacher').value,
    objectives:$('#lp_obj').value.trim(),materials:$('#lp_mat').value.trim(),prevKnowledge:$('#lp_prev').value.trim(),intro:$('#lp_intro').value.trim(),
    steps:$('#lp_steps').value.trim(),evaluation:$('#lp_eval').value.trim(),summary:$('#lp_sum').value.trim(),assignment:$('#lp_assign').value.trim(),term:DB.settings.term,session:DB.settings.session};
  if(id)Object.assign(DB.lessonPlans.find(x=>x.id===id),obj);else{obj.id=uid('lp');obj.createdBy=USER.name;obj.createdAt=today();DB.lessonPlans.push(obj);}
  save();closeModal();lpClass=obj.classId;vLessons();toast('Lesson plan saved');}
function delLesson(id){DB.lessonPlans=DB.lessonPlans.filter(x=>x.id!==id);save();vLessons();toast('Lesson plan removed');}

function saveSchool(code){
  const name=$('#sc_name').value.trim();const ca1=+$('#sc_ca1').value,ca2=+$('#sc_ca2').value,exam=+$('#sc_exam').value;const promote=+$('#sc_promote').value||40;
  const addr=$('#sc_addr').value.trim(),phone=$('#sc_phone').value.trim(),email=$('#sc_email').value.trim();
  const themeSel=$('#sc_theme')?$('#sc_theme').value:'green';const mods={};document.querySelectorAll('.sc_mod:checked').forEach(c=>mods[c.value]=true);
  if(!name){toast('School name required',true);return;}
  if(!addr){toast('Full address is required',true);return;}
  if(!phone||phone.replace(/\D/g,'').length<7){toast('A valid phone number is required',true);return;}
  if(!email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('A valid school email is required',true);return;}
  if(ca1+ca2+exam!==100){toast('CA1+CA2+Exam must total 100',true);return;}
  const domain=($('#sc_domain')?$('#sc_domain').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,''):'');
  if(code){const reg=MASTER.schools.find(s=>s.code===code);reg.name=name;reg.status=$('#sc_status').value;reg.domain=domain;
    const d=STORE[code];Object.assign(d.settings,{schoolName:name,shortName:$('#sc_short').value.trim(),address:addr,phone,email,motto:$('#sc_motto').value.trim(),domain,facebookUrl:($('#sc_fb')?$('#sc_fb').value.trim():d.settings.facebookUrl),logo:_logo,islamic:$('#sc_islamic').checked,theme:themeSel,modules:mods,
      session:$('#sc_sess').value.trim(),term:$('#sc_term').value,status:$('#sc_status').value,grade:{ca1,ca2,exam,promote}});
    saveMaster();saveSchoolRow(code);closeModal();toast('School updated');manageSchool(code);return;}
  const newCode=$('#sc_code').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').replace(/^-+|-+$/g,'');
  if(!newCode){toast('Code required',true);return;}
  if(MASTER.schools.some(s=>s.code===newCode)){toast('Code already exists',true);return;}
  const auser=$('#sc_auser').value.trim(),apass=$('#sc_apass').value.trim();if(!auser||!apass){toast('Admin login required',true);return;}

    session:$('#sc_sess').value.trim(),term:$('#sc_term').value,status:$('#sc_status').value,grade:{ca1,ca2,exam,promote}});
  d.users[0].name=$('#sc_aname').value.trim()||'School Administrator';d.users[0].username=auser;d.users[0].password=apass;
  STORE[newCode]=d;MASTER.schools.push({code:newCode,name,status:$('#sc_status').value,createdAt:today()});
  saveStoreLocal();saveMaster();saveSchoolRow(newCode);closeModal();toast('School created');manageSchool(newCode);

function doGenPins(){
  const school=$('#g_school').value,sess=$('#g_sess').value.trim(),term=$('#g_term').value;
  const qty=Math.max(1,Math.min(2000,+$('#g_qty').value||0)),maxUses=Math.max(1,+$('#g_uses').value||1),price=+$('#g_price').value||0;
  const batch={id:uid('b'),school,session:sess,term,qty,maxUses,price,createdAt:today()};
  const existing=new Set(MASTER.pins.map(p=>p.code));
  for(let i=0;i<qty;i++){let code;do{code=String(Math.floor(100000000000+Math.random()*899999999999));}while(existing.has(code));existing.add(code);
    MASTER.pins.push({code,school,session:sess,term,maxUses,uses:0,price,batch:batch.id,createdAt:today()});}
  MASTER.batches.push(batch);saveMaster();pinSchool=school;closeModal();toast(qty+' PINs generated');vPins();
}

/* ===================== SCHOOL: INSIGHTS (smart) ===================== */
function vInsights(){
  const insights=[];
  // best/worst class by average
  const classStats=DB.classes.map(c=>{const{rows}=computeClassResults(c.id);const scored=rows.filter(r=>r.count);
    const avg=scored.length?scored.reduce((a,r)=>a+r.avg,0)/scored.length:0;return{c,avg,scored:scored.length,total:rows.length};}).filter(x=>x.scored);
  if(classStats.length){const best=classStats.slice().sort((a,b)=>b.avg-a.avg)[0];const worst=classStats.slice().sort((a,b)=>a.avg-b.avg)[0];
    insights.push(`🏆 <b>${esc(best.c.name)}</b> leads with a class average of <b>${best.avg.toFixed(1)}%</b>.`);
    if(worst.c.id!==best.c.id)insights.push(`📉 <b>${esc(worst.c.name)}</b> needs support — class average <b>${worst.avg.toFixed(1)}%</b>.`);}
  // pupils needing attention across school
  let atRisk=[];DB.classes.forEach(c=>{const{rows}=computeClassResults(c.id);rows.forEach(r=>{if(r.count&&r.avg<50)atRisk.push({name:r.s.name,cls:c.name,avg:r.avg});});});
  atRisk.sort((a,b)=>a.avg-b.avg);
  // subject hotspots
  const subjAgg={};DB.classes.forEach(c=>{const{rows}=computeClassResults(c.id);rows.forEach(r=>r.marks.forEach(m=>{if(m.has){subjAgg[m.sub]=subjAgg[m.sub]||{t:0,n:0};subjAgg[m.sub].t+=m.total;subjAgg[m.sub].n++;}}));});
  const subjArr=Object.entries(subjAgg).map(([k,v])=>({sub:k,avg:v.t/v.n,n:v.n})).filter(x=>x.n>=3).sort((a,b)=>a.avg-b.avg);
  // attendance
  let p=0,tot=0;Object.keys(DB.attendance).forEach(k=>Object.values(DB.attendance[k]).forEach(v=>{tot++;if(v==='P')p++;}));
  const attRate=tot?Math.round(p/tot*100):0;
  if(attRate)insights.push(`📅 Overall attendance is <b>${attRate}%</b> across all recorded days.`);
  if(!insights.length)insights.push('Enter some results and attendance to unlock insights.');

  const totalPupils=DB.students.length;
  const summary=`Across <b>${totalPupils}</b> pupil(s)${classStats.length?` and ${classStats.length} class(es) with results`:''}, `+
    (classStats.length?`the school's overall average is <b>${(classStats.reduce((a,c)=>a+c.avg,0)/classStats.length).toFixed(1)}%</b>. `:'no results have been entered yet. ')+
    (atRisk.length?`<b>${atRisk.length}</b> pupil(s) are below 50% and may need extra support. `:(classStats.length?'No pupils are currently below 50% — strong performance overall. ':''))+
    (subjArr.length?`The weakest subject so far is <b>${esc(subjArr[0].sub)}</b> (${subjArr[0].avg.toFixed(0)}%)${subjArr.length>1?`, and the strongest is <b>${esc(subjArr[subjArr.length-1].sub)}</b> (${subjArr[subjArr.length-1].avg.toFixed(0)}%)`:''}.`:'');
  $('#view').innerHTML=`<div class="page-head"><div><h2>✨ Smart Insights</h2><p>Automatic analysis of results & attendance</p></div></div>
  <div class="card pad mb" style="border-left:4px solid var(--purple);background:var(--purple-light)"><div class="flex gap" style="align-items:flex-start"><span style="font-size:22px">🤖</span><div><b style="color:var(--purple)">AI Summary</b><div style="margin-top:4px">${summary}</div></div></div></div>
  ${insights.map(i=>`<div class="insight">${i}</div>`).join('')}
  <div class="grid2">
    <div class="card pad"><h3 class="mb">Pupils needing attention <span class="muted" style="font-size:12px">(avg below 50%)</span></h3>
      ${atRisk.length?`<div class="t-wrap"><table><thead><tr><th>Pupil</th><th>Class</th><th class="right">Avg</th></tr></thead><tbody>
        ${atRisk.slice(0,12).map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.cls)}</td><td class="right" style="color:var(--red)">${r.avg.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No at-risk pupils 🎉</p>'}</div>
    <div class="card pad"><h3 class="mb">Subjects by average</h3>
      ${subjArr.length?subjArr.slice(0,12).map(x=>`<div class="flex mb" style="gap:10px"><div style="flex:1"><div style="font-size:12.5px">${esc(x.sub)}</div>
        <div class="bar" style="width:${Math.max(4,x.avg)}%;background:${x.avg<50?'var(--red)':x.avg<60?'var(--gold)':'var(--green)'}"></div></div>
        <b style="width:48px;text-align:right">${x.avg.toFixed(0)}%</b></div>`).join(''):'<p class="muted">Not enough data yet.</p>'}</div>
  </div>`;
}

function saveStudent(id){const name=$('#f_name').value.trim();if(!name){toast('Name required',true);return;}
  const obj={name,photo:_photo,admissionNo:$('#f_adm').value.trim(),classId:$('#f_class').value,gender:$('#f_gender').value,dob:$('#f_dob').value,
    guardianName:$('#f_gname').value.trim(),guardianPhone:$('#f_gphone').value.trim(),address:$('#f_addr').value.trim()};
  if(id)Object.assign(DB.students.find(x=>x.id===id),obj);else{obj.id=uid('s');DB.students.push(obj);}
  save();closeModal();renderStuTable();toast('Pupil saved');}
function delStudent(id){const s=DB.students.find(x=>x.id===id);
  modal('Delete pupil?',`<p>Remove <b>${esc(s.name)}</b> and all their records? This cannot be undone.</p>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmDelStudent('${id}')">Delete</button>`);}
function confirmDelStudent(id){DB.students=DB.students.filter(x=>x.id!==id);
  Object.keys(DB.results).forEach(k=>{if(k.endsWith('|'+id))delete DB.results[k];});
  Object.keys(DB.fees).forEach(k=>{if(k.endsWith('|'+id))delete DB.fees[k];});
  Object.keys(DB.remarks).forEach(k=>{if(k.endsWith('|'+id))delete DB.remarks[k];});
  Object.keys(DB.attendance).forEach(k=>{if(DB.attendance[k][id])delete DB.attendance[k][id];});
  DB.payments=DB.payments.filter(p=>p.studentId!==id);save();closeModal();renderStuTable();toast('Pupil removed');}

function showSubj(btn,i){document.querySelectorAll('.subtab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');

  ${list.map(s=>{const r=(DB.results[rkey(s.id)]||{})[subj]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const tot=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);const gr=gradeOf(tot);
    return `<tr><td><b>${esc(s.name)}</b></td>

    <td class="center"><input class="score-in" type="number" min="0" max="${g.exam}" value="${r.exam??''}" onchange="setScore('${s.id}','${jq(subj)}','exam',this,${g.exam})"></td>

  </tbody></table></div><p class="muted mt" style="font-size:12.5px">Scores save automatically.</p>`;}
function setScore(sid,subj,field,inp,max){let v=inp.value===''?null:Math.max(0,Math.min(max,Number(inp.value)));if(v!==null)inp.value=v;
  const k=rkey(sid);DB.results[k]=DB.results[k]||{};DB.results[k][subj]=DB.results[k][subj]||{};
  if(v===null)delete DB.results[k][subj][field];else DB.results[k][subj][field]=v;
  const cur=DB.results[k][subj];if(cur.ca1==null&&cur.ca2==null&&cur.exam==null)delete DB.results[k][subj];save();
  const r=(DB.results[k]||{})[subj]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const tot=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);const gr=gradeOf(tot);
  $('#tot_'+sid).innerHTML=`<b>${has?tot:'—'}</b>`;$('#gr_'+sid).innerHTML=has?`<span class="pill ${gr.g==='F'?'red':'green'}">${gr.g}</span>`:'—';}

function computeClassResults(cid,sess,term){const subs=DB.subjects[cid]||[],list=studentsIn(cid);
  const rows=list.map(s=>{const res=DB.results[rkey(s.id,sess,term)]||{};let total=0,count=0;
    const marks=subs.map(sub=>{const r=res[sub]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const t=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);if(has){total+=t;count++;}return{sub,ca1:r.ca1,ca2:r.ca2,exam:r.exam,total:has?t:null,has};});
    return{s,marks,total,count,avg:count?total/count:0};});
  const ranked=rows.slice().filter(r=>r.count).sort((a,b)=>b.total-a.total);ranked.forEach((r,i)=>r.pos=i+1);return{rows,size:ranked.length};}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function autoRemark(avg,subs){if(!subs||!subs.some(m=>m.has))return'No results entered yet.';
  const scored=subs.filter(m=>m.has);const best=scored.slice().sort((a,b)=>b.total-a.total)[0];const worst=scored.slice().sort((a,b)=>a.total-b.total)[0];
  let base=avg>=70?'An excellent result.':avg>=60?'A very good performance.':avg>=50?'A good effort.':avg>=40?'A fair result; more effort needed.':'Needs serious improvement.';
  let tip='';if(best)tip+=` Strongest in ${best.sub}.`;if(worst&&worst.total<50&&worst.sub!==best.sub)tip+=` Should improve in ${worst.sub}.`;return base+tip;}
function autoHead(a){if(a>=70)return'Outstanding. A model pupil.';if(a>=50)return'Good progress. Well done.';if(a>=40)return'Can do better with more focus.';return'Requires close attention and support.';}
function editRemarks(sid){const rem=DB.remarks[rkey(sid)]||{};
  modal('Edit Remarks',`<div class="fld"><div class="flex" style="justify-content:space-between"><label>Class teacher's remark</label><button class="btn sm purple" onclick="aiRemark('${sid}','t')">🤖 AI suggest</button></div><textarea id="rm_t" rows="3">${esc(rem.teacher||'')}</textarea></div>
    <div class="fld"><div class="flex" style="justify-content:space-between"><label>Head teacher's remark</label><button class="btn sm purple" onclick="aiRemark('${sid}','h')">🤖 AI suggest</button></div><textarea id="rm_h" rows="3">${esc(rem.head||'')}</textarea></div>`,
    `<button class="btn sec" onclick="openReport('${sid}')">Back</button><button class="btn" onclick="saveRemarks('${sid}')">Save & view</button>`);}
function aiRemark(sid,which){const s=DB.students.find(x=>x.id===sid);const {rows}=computeClassResults(s.classId);const row=rows.find(r=>r.s.id===sid);
  const first=(s.name||'').split(/\s+/).slice(-1)[0]||'The pupil';
  if(which==='t'){$('#rm_t').value=first+' — '+autoRemark(row.avg,row.marks);}else{$('#rm_h').value=autoHead(row.avg);}
  toast('AI remark generated — edit if you like');}
function saveRemarks(sid){DB.remarks[rkey(sid)]={teacher:$('#rm_t').value.trim(),head:$('#rm_h').value.trim()};save();toast('Remarks saved');openReport(sid);}

let feeClass='',feeTab='fees';
function vFees(){if(!feeClass)feeClass=DB.classes[0]?DB.classes[0].id:'';
  $('#view').innerHTML=`<div class="page-head"><div><h2>Fees & Payments</h2><p>${esc(DB.settings.term)}, ${esc(DB.settings.session)}</p></div></div>
  <div class="subtabs"><button class="subtab${feeTab==='fees'?' active':''}" onclick="feeTab='fees';vFees()">Fees by class</button>
    <button class="subtab${feeTab==='approve'?' active':''}" onclick="feeTab='approve';vFees()">Approvals ${pendingPayCount()?`<span class="pill amber" style="margin-left:4px">${pendingPayCount()}</span>`:''}</button>
    <button class="subtab${feeTab==='history'?' active':''}" onclick="feeTab='history';vFees()">History</button>
    <button class="subtab${feeTab==='invoices'?' active':''}" onclick="feeTab='invoices';vFees()">🧾 Invoices</button></div><div id="feeArea"></div>`;
  if(feeTab==='fees')renderFees();else if(feeTab==='approve')renderApprovals();else if(feeTab==='invoices')vInvoices();else renderPayHistory();}
function renderFees(){$('#feeArea').innerHTML=`<div class="toolbar"><div><label>Class</label><select onchange="feeClass=this.value;renderFees()">${DB.classes.map(c=>`<option value="${c.id}" ${feeClass===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div><button class="btn sec" onclick="setClassFee()">Set fee for whole class</button></div></div><div id="feeTbl"></div>`;
  const list=studentsIn(feeClass);if(!list.length){$('#feeTbl').innerHTML=`<div class="card"><div class="empty"><div class="big">💰</div>No pupils in this class.</div></div>`;return;}
  let tDue=0,tPaid=0;const rows=list.map(s=>{const f=DB.fees[rkey(s.id)]||{};const due=Number(f.due)||0,paid=approvedPaid(s.id),bal=due-paid;tDue+=due;tPaid+=paid;
    const st=due===0?['grey','Not set']:bal<=0?['green','Paid']:paid>0?['amber','Part']:['red','Owing'];
    return `<tr><td>${avatar(s.photo,'👧')}</td><td><b>${esc(s.name)}</b></td><td><input class="score-in" style="width:110px;text-align:right" type="number" value="${f.due??''}" onchange="setFeeDue('${s.id}',this.value)"></td>
      <td class="right">${naira(paid)}</td><td class="right" style="color:${bal>0?'var(--red)':'var(--green)'}"><b>${naira(bal)}</b></td>
      <td class="center"><span class="pill ${st[0]}">${st[1]}</span></td><td class="right" style="white-space:nowrap"><button class="btn sm" onclick="recordPayment('${s.id}')">＋ Pay</button><button class="btn icon" title="View / edit payments" onclick="managePayments('${s.id}')">📋</button></td></tr>`;}).join('');
  $('#feeTbl').innerHTML=`<div class="cards-row" style="margin-bottom:16px"><div class="stat"><div class="lbl">Expected</div><div class="num">${naira(tDue)}</div></div>
    <div class="stat"><div class="lbl">Collected</div><div class="num" style="color:var(--green)">${naira(tPaid)}</div></div>
    <div class="stat"><div class="lbl">Outstanding</div><div class="num" style="color:var(--red)">${naira(tDue-tPaid)}</div></div></div>
  <div class="t-wrap"><table><thead><tr><th></th><th>Name</th><th>Fee Due (₦)</th><th class="right">Paid</th><th class="right">Balance</th><th class="center">Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;}
function setFeeDue(sid,val){const k=rkey(sid);DB.fees[k]=DB.fees[k]||{};DB.fees[k].due=val===''?0:Number(val);save();renderFees();}
function setClassFee(){modal('Set fee for '+className(feeClass),`<div class="fld"><label>Fee (₦) for every pupil in ${esc(className(feeClass))}</label><input id="cf_amt" type="number" placeholder="e.g. 45000"></div>`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="applyClassFee()">Apply</button>`);}
function applyClassFee(){const amt=Number($('#cf_amt').value)||0;studentsIn(feeClass).forEach(s=>{const k=rkey(s.id);DB.fees[k]=DB.fees[k]||{};DB.fees[k].due=amt;});save();closeModal();renderFees();toast('Class fee applied');}
function recordPayment(sid){const s=DB.students.find(x=>x.id===sid);const due=Number((DB.fees[rkey(sid)]||{}).due)||0;const bal=due-approvedPaid(sid);
  modal('Record Payment — '+s.name,`<p class="muted mb">Outstanding (school fees): <b style="color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</b>. A receipt is generated once the payment is approved.</p>
    <div class="grid2"><div class="fld"><label>Payment for *</label><select id="p_purpose" onchange="document.getElementById('p_descWrap').style.display=this.value==='Other'?'block':'none'"><option>School Fees</option><option>Examination Fee</option><option>Uniform</option><option>Books / Stationery</option><option>PTA Levy</option><option>Development Levy</option><option>Excursion</option><option>Other</option></select></div>
    <div class="fld"><label>Amount (₦) *</label><input id="p_amt" type="number"></div>
    <div class="fld full" id="p_descWrap" style="display:none"><label>Describe the payment</label><input id="p_desc" placeholder="What is this payment for?"></div>
    <div class="fld"><label>Term</label><select id="p_term">${TERMS.map(t=>`<option ${DB.settings.term===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fld"><label>Date</label><input id="p_date" type="date" value="${today()}"></div>
    <div class="fld"><label>Method</label><select id="p_method"><option>Cash</option><option>Bank Transfer</option><option>POS</option><option>Cheque</option></select></div>
    <div class="fld"><label>Reference</label><input id="p_ref" placeholder="optional"></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePayment('${sid}',false)">Submit for approval</button>
     ${USER.role==='admin'?`<button class="btn gold" onclick="savePayment('${sid}',true)">Add & approve now</button>`:''}`);}
function savePayment(sid,approve){const amt=Number($('#p_amt').value);if(!amt||amt<=0){toast('Enter a valid amount',true);return;}
  let purpose=$('#p_purpose').value;if(purpose==='Other')purpose=$('#p_desc').value.trim()||'Other';
  const pay={id:uid('p'),studentId:sid,session:DB.settings.session,term:$('#p_term').value,amount:amt,purpose,method:$('#p_method').value,ref:$('#p_ref').value.trim(),date:$('#p_date').value,recordedBy:USER.name,status:'pending'};
  if(approve&&USER.role==='admin'){pay.status='approved';pay.approvedBy=USER.name;pay.approvedAt=today();pay.receiptNo=nextReceiptNo();}
  DB.payments.push(pay);save();closeModal();buildNav();vFees();if(approve)openReceipt(pay.id);
  toast(approve?'Approved — receipt ready':'Submitted for approval');}
function nextReceiptNo(){DB.settings.receiptSeq=(DB.settings.receiptSeq||0)+1;return 'RCT/'+DB.settings.session.slice(0,4)+'/'+String(DB.settings.receiptSeq).padStart(4,'0');}
function renderApprovals(){const pend=DB.payments.filter(p=>p.status==='pending').slice().reverse();
  if(!pend.length){$('#feeArea').innerHTML=`<div class="card"><div class="empty"><div class="big">✅</div>No payments awaiting approval.</div></div>`;return;}
  $('#feeArea').innerHTML=`<div class="t-wrap"><table><thead><tr><th>Date</th><th>Pupil</th><th>Payment for</th><th>Term</th><th class="right">Amount</th><th>By</th><th></th></tr></thead><tbody>
  ${pend.map(p=>{const s=DB.students.find(x=>x.id===p.studentId)||{name:'(deleted)'};return `<tr><td class="muted">${esc(p.date)}</td><td><b>${esc(s.name)}</b><br><span class="muted" style="font-size:11px">${esc(className(s.classId))}</span></td><td>${esc(p.purpose||'School Fees')}</td><td class="muted">${esc(p.term||'')}</td>
    <td class="right"><b>${naira(p.amount)}</b></td><td class="muted">${esc(p.recordedBy||'')}</td>
    <td class="right" style="white-space:nowrap"><button class="btn sm" onclick="approvePay('${p.id}')">Approve</button><button class="btn sm danger" onclick="rejectPay('${p.id}')">Reject</button></td></tr>`;}).join('')}
  </tbody></table></div>`;}
function approvePay(id){const p=DB.payments.find(x=>x.id===id);p.status='approved';p.approvedBy=USER.name;p.approvedAt=today();p.receiptNo=nextReceiptNo();save();buildNav();vFees();toast('Approved — '+p.receiptNo);openReceipt(id);}
function rejectPay(id){DB.payments.find(x=>x.id===id).status='rejected';save();buildNav();vFees();toast('Rejected');}
function renderPayHistory(){const list=DB.payments.filter(p=>p.session===DB.settings.session&&p.term===DB.settings.term).slice().reverse();
  if(!list.length){$('#feeArea').innerHTML=`<div class="card"><div class="empty"><div class="big">🧾</div>No payments this term.</div></div>`;return;}
  const stp={approved:['green','Approved'],pending:['amber','Pending'],rejected:['red','Rejected']};
  $('#feeArea').innerHTML=`<div class="t-wrap"><table><thead><tr><th>Date</th><th>Pupil</th><th>For</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(p=>{const s=DB.students.find(x=>x.id===p.studentId)||{name:'(deleted)'};const st=stp[p.status]||['grey',p.status];return `<tr><td class="muted">${esc(p.date)}</td><td><b>${esc(s.name)}</b></td><td>${esc(p.purpose||'School Fees')}</td>

    <td class="right" style="white-space:nowrap">${p.status==='approved'?`<button class="btn icon" title="Receipt" onclick="openReceipt('${p.id}')">🧾</button>`:''}<button class="btn icon" title="Edit" onclick="editPayment('${p.id}')">✏️</button><button class="btn icon" title="Delete" onclick="delPayment('${p.id}')">🗑️</button></td></tr>`;}).join('')}
  </tbody></table></div><p class="muted mt" style="font-size:12px">✏️ correct a mistake · 🗑️ remove a wrong entry. Balances update automatically.</p>`;}
function managePayments(sid){const s=DB.students.find(x=>x.id===sid);const list=DB.payments.filter(p=>p.studentId===sid).slice().reverse();
  const due=Number((DB.fees[rkey(sid)]||{}).due)||0,paid=approvedPaid(sid),bal=due-paid;
  modal('Payments — '+s.name,`<p class="muted mb">Fee due (this term): <b>${naira(due)}</b> · Paid: <b style="color:var(--green)">${naira(paid)}</b> · Balance: <b style="color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</b></p>
    <div class="mb"><label>Fix the term fee total (₦) — if it was entered wrong</label><div class="flex gap"><input id="mp_due" type="number" value="${due}" style="max-width:170px"><button class="btn sec sm" onclick="fixFeeDue('${sid}')">Save fee</button></div></div>
    ${list.length?`<div class="t-wrap"><table><thead><tr><th>Date</th><th>For</th><th>Term</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(p=>`<tr><td class="muted">${esc(p.date)}</td><td>${esc(p.purpose||'School Fees')}</td><td class="muted">${esc(p.term||'')}</td><td class="right">${naira(p.amount)}</td><td><span class="pill ${p.status==='approved'?'green':p.status==='pending'?'amber':'red'}">${esc(p.status)}</span></td>

    `<button class="btn sec" onclick="closeModal()">Close</button><button class="btn" onclick="recordPayment('${sid}')">＋ Add payment</button>`,true);}
function fixFeeDue(sid){const v=Number($('#mp_due').value)||0;const k=rkey(sid);DB.fees[k]=DB.fees[k]||{};DB.fees[k].due=v;save();toast('Term fee corrected');managePayments(sid);}
function editPayment(id){const p=DB.payments.find(x=>x.id===id);if(!p)return;
  modal('Edit payment',`<div class="grid2">
    <div class="fld"><label>Payment for</label><input id="ep_purpose" value="${esc(p.purpose||'School Fees')}"></div>
    <div class="fld"><label>Amount (₦)</label><input id="ep_amt" type="number" value="${p.amount}"></div>
    <div class="fld"><label>Term</label><select id="ep_term">${TERMS.map(t=>`<option ${p.term===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fld"><label>Date</label><input id="ep_date" type="date" value="${esc(p.date||'')}"></div>
    <div class="fld"><label>Method</label><input id="ep_method" value="${esc(p.method||'')}"></div>
    <div class="fld"><label>Status</label><select id="ep_status"><option value="approved" ${p.status==='approved'?'selected':''}>Approved</option><option value="pending" ${p.status==='pending'?'selected':''}>Pending</option><option value="rejected" ${p.status==='rejected'?'selected':''}>Rejected</option></select></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveEditPayment('${id}')">Save changes</button>`);}
function saveEditPayment(id){const p=DB.payments.find(x=>x.id===id);const amt=Number($('#ep_amt').value);if(!amt||amt<=0){toast('Valid amount required',true);return;}
  p.purpose=$('#ep_purpose').value.trim();p.amount=amt;p.term=$('#ep_term').value;p.date=$('#ep_date').value;p.method=$('#ep_method').value.trim();
  const ns=$('#ep_status').value;if(ns==='approved'&&!p.receiptNo){p.receiptNo=nextReceiptNo();p.approvedBy=USER.name;p.approvedAt=today();}p.status=ns;

function delPayment(id){const p=DB.payments.find(x=>x.id===id);const s=DB.students.find(x=>x.id===p.studentId)||{name:'(pupil)'};
  modal('Delete payment?',`<p>Remove the ${naira(p.amount)} payment for <b>${esc(s.name)}</b> (${esc(p.purpose||'School Fees')})? This corrects the balance and cannot be undone.</p>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmDelPayment('${id}')">Delete</button>`);}
function confirmDelPayment(id){DB.payments=DB.payments.filter(x=>x.id!==id);save();closeModal();buildNav();vFees();toast('Payment deleted');}

  const due=Number((DB.fees[rkey(p.studentId)]||{}).due)||0;const bal=due-approvedPaid(p.studentId);const logo=DB.settings.logo?`<img src="${DB.settings.logo}" style="width:100%;height:100%;object-fit:cover">`:'🎓';

      <div style="width:64px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">${s.photo?`<img src="${s.photo}" style="width:100%;height:100%;object-fit:cover">`:'👧'}</div>
      <div style="flex:1"><div style="font-size:16px;font-weight:800">${esc(s.name)}</div><div class="muted" style="font-size:12px">${esc(className(s.classId))} · Adm ${esc(s.admissionNo||'—')}</div>
        <div style="margin-top:4px"><span class="pill green">${esc(p.term)} · ${esc(p.session)}</span></div></div></div>

    <div class="amount">${naira(p.amount)}</div>
    <div class="lines"><div><span>Payment for</span><b>${esc(p.purpose||'School Fees')}</b></div><div><span>Term</span><b>${esc(p.term)}</b></div><div><span>Session</span>${esc(p.session)}</div>

    `<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print / PDF</button>`);}

/* ===================== SCHOOL: ID CARDS ===================== */
let idTab='students',idClass='';

function studentCardBack(s){return `<div class="idc"><div class="idc-back">
  <div class="bk-h"><div class="lg">${idLogo()}</div><b>${esc(DB.settings.schoolName)} — Pupil Card (Back)</b></div>

/* ===================== BOOT ===================== */
async function boot(){
  loadStore();
  const params=new URLSearchParams(location.search);
  let code=params.get('s')||'';
  let wantCheck=params.get('check')==='1';
  // pretty path support: /greenfield  or  /greenfield/check
  const segs=location.pathname.split('/').filter(Boolean).filter(x=>!/\.html?$/i.test(x)&&!/^index$/i.test(x));
  if(!code&&segs.length){code=segs[0];if(segs[1]&&segs[1].toLowerCase()==='check')wantCheck=true;}
  SCHOOL_CODE=code.toUpperCase();
  initSupa();
  // ensure master
  if(supa){await pullRow('__master__');}
  MASTER=STORE['__master__'];
  // custom domain → school detection (when no ?s= and no path code)
  if(!code&&MASTER&&MASTER.schools){const host=location.hostname.replace(/^www\./i,'').toLowerCase();
    const m=MASTER.schools.find(s=>s.domain&&s.domain.replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./i,'').toLowerCase()===host);
    if(m){code=m.code;SCHOOL_CODE=code.toUpperCase();}}
  if(!MASTER){MASTER=seedMaster();STORE['__master__']=MASTER;saveStoreLocal();
    // also seed DEMO school
    if(!STORE['DEMO']){STORE['DEMO']=seedSchool('DEMO','Demo Nursery & Primary');saveStoreLocal();}
    if(supa){saveMaster();saveSchoolRow('DEMO');}}
  if(SCHOOL_CODE){
    MODE=wantCheck?'check':'school';
    if(supa){await pullRow(SCHOOL_CODE);if(MASTER&&!STORE[SCHOOL_CODE]){}}
    const _reg=MASTER&&MASTER.schools&&MASTER.schools.find(s=>s.code===SCHOOL_CODE);
    const _t=(_reg&&_reg.type)||(STORE[SCHOOL_CODE]&&STORE[SCHOOL_CODE].kind)||'school';
    DB=STORE[SCHOOL_CODE]?(_t==='pharmacy'?ensurePharmacy(STORE[SCHOOL_CODE]):_t==='autoparts'?ensureAuto(STORE[SCHOOL_CODE]):ensureSchool(STORE[SCHOOL_CODE])):null;
    if(DB){STORE[SCHOOL_CODE]=DB;}
    setSync(supa?'on':'off',supa?'Synced':'Local');
    // restore session
    const sess=sessionStorage.getItem('sms_su');
    if(!wantCheck&&DB&&sess&&sess.startsWith(SCHOOL_CODE+'|')){const uidp=sess.split('|')[1];const u=DB.users.find(x=>x.id===uidp);if(u){USER=u;enterApp();return;}}
    renderAuth();
  }else{
    MODE='owner';
    if(supa){await pullAll();MASTER=STORE['__master__']||MASTER;}
    setSync(supa?'on':'off',supa?'Synced':'Local');renderAuth();
  }
}
boot();

      <div class="muted" style="font-size:12.5px;margin-top:6px">${low.slice(0,6).map(p=>esc(p.name)+' ('+Number(p.stock||0)+')').join(', ')}${low.length>6?'…':''}</div></div>`:''}

      <div class="muted" style="font-size:12.5px;margin-top:6px">${exp.slice(0,6).map(p=>esc(p.name)+' — '+esc(p.expiry||'')).join(', ')}${exp.length>6?'…':''}</div></div>`:''}

    ${recent.map(s=>`<tr><td><b>${esc(s.receiptNo||'')}</b></td><td>${esc((s.date||'').replace('T',' ').slice(0,16))}</td><td>${(s.items||[]).reduce((a,i)=>a+Number(i.qty||0),0)}</td>
