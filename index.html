/* ---- Term fee items (levy) with Day / Boarding amounts ---- */
function studentFeeLines(s){const sec=sectionOf(s)==='Boarding'?'boarding':'day';const lines=[];
  const sf=Number((DB.settings.schoolFee||{})[sec])||0;if(sf>0)lines.push({name:'School Fees ('+sectionOf(s)+')',amt:sf});
  (DB.settings.feeItems||[]).forEach(it=>{const amt=Number(it[sec])||0;if(amt>0)lines.push({name:it.name,amt});});return lines;}
function studentFeeTotal(s){return studentFeeLines(s).reduce((a,l)=>a+l.amt,0);}
/* A pupil's fee for the term: the explicit amount if one was set, else auto from their section's school fee. */
function studentDue(sOrId,sess,term){const s=(typeof sOrId==='string')?DB.students.find(x=>x.id===sOrId):sOrId;if(!s)return 0;const f=DB.fees[rkey(s.id,sess,term)];if(f&&f.due!=null&&f.due!=='')return Number(f.due)||0;return studentFeeTotal(s);}

    `<div class="card pad mb"><h3 class="mb">School fees — ${esc(DB.settings.term)}, ${esc(DB.settings.session)}</h3>

  }else{

    `<div class="card pad mb"><div class="flex" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3>Fee items — ${esc(DB.settings.term)}, ${esc(DB.settings.session)}</h3><button class="btn sm" onclick="editFeeItem(-1)">＋ Add fee item</button></div>
      <p class="muted" style="font-size:12.5px;margin:6px 0 10px">Set each charge for the term. Day and Boarding amounts can differ (for example tuition). Leave an amount at 0 if it does not apply to that section.</p>

      ${items.length?items.map((it,i)=>`<tr><td><b>${esc(it.name)}</b></td><td class="right">${naira(it.day||0)}</td><td class="right">${naira(it.boarding||0)}</td><td class="right" style="white-space:nowrap"><button class="btn icon" onclick="editFeeItem(${i})">✏️</button><button class="btn icon" onclick="delFeeItem(${i})">🗑️</button></td></tr>`).join(''):'<tr><td colspan="4" class="muted center">No fee items yet. Add tuition and any other charges.</td></tr>'}
      </tbody><tfoot><tr style="font-weight:800;background:#faf5ee"><td>Total per pupil</td><td class="right">${naira(dayT)}</td><td class="right">${naira(boardT)}</td><td></td></tr></tfoot></table></div></div>`+genCard;

function saveSchoolFee(){DB.settings.schoolFee={day:Number($('#sf_day').value)||0,boarding:Number($('#sf_board').value)||0};save();renderFeeSetup();toast('School fees saved');}
function editFeeItem(i){const it=i>=0?(DB.settings.feeItems||[])[i]:{name:'',day:'',boarding:''};
  modal(i>=0?'Edit fee item':'Add fee item',`<div class="fld"><label>Item name *</label><input id="fi_name" value="${esc(it.name||'')}" placeholder="e.g. Tuition, PTA Levy, Exam Fee, Uniform"></div>
    <div class="grid2"><div class="fld"><label>Day amount (₦)</label><input id="fi_day" type="number" value="${esc(it.day??'')}" placeholder="0"></div>
      <div class="fld"><label>Boarding amount (₦)</label><input id="fi_board" type="number" value="${esc(it.boarding??'')}" placeholder="0"></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveFeeItem(${i})">Save</button>`);}
function saveFeeItem(i){const name=$('#fi_name').value.trim();if(!name){toast('Item name required',true);return;}
  const obj={name,day:Number($('#fi_day').value)||0,boarding:Number($('#fi_board').value)||0};
  DB.settings.feeItems=DB.settings.feeItems||[];if(i>=0)DB.settings.feeItems[i]=obj;else DB.settings.feeItems.push(obj);
  save();closeModal();renderFeeSetup();}
function delFeeItem(i){if(!confirm('Remove this fee item?'))return;DB.settings.feeItems.splice(i,1);save();renderFeeSetup();}
function generateLevy(){const sf=DB.settings.schoolFee||{};const hasFee=(Number(sf.day)||0)>0||(Number(sf.boarding)||0)>0||(DB.settings.feeItems||[]).length;
  if(!hasFee){toast('Set the school fees first',true);return;}
  const n=DB.students.filter(s=>!s.graduated).length;
  modal('Generate term levy?',`<p>This sets each pupil's <b>${esc(DB.settings.term)}</b> fee to the total of your fee items, using their section (Day or Boarding). It affects <b>${n}</b> pupil(s). Recorded payments are kept.</p>
    <p class="muted" style="font-size:12.5px">Any pupil without a section is treated as Day. You can still adjust an individual pupil's fee afterwards.</p>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="doGenerateLevy()">Generate for all pupils</button>`);}
function doGenerateLevy(){let n=0;DB.students.filter(s=>!s.graduated).forEach(s=>{const k=rkey(s.id);DB.fees[k]=DB.fees[k]||{};DB.fees[k].due=studentFeeTotal(s);n++;});save();closeModal();toast('Levy generated for '+n+' pupil(s)');feeTab='invoices';if(CURRENT==='fees')vFees();}
function recordPayment(sid){const s=DB.students.find(x=>x.id===sid);const due=studentDue(sid);const bal=due-approvedPaid(sid);
  modal('Record Payment — '+s.name,`<p class="muted mb">Outstanding (school fees): <b style="color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</b>. A receipt is generated once the payment is approved.</p>
    <div class="grid2"><div class="fld"><label>Payment for *</label><select id="p_purpose" onchange="document.getElementById('p_descWrap').style.display=this.value==='Other'?'block':'none'"><option>School Fees</option><option>Examination Fee</option><option>Uniform</option><option>Books / Stationery</option><option>PTA Levy</option><option>Development Levy</option><option>Excursion</option><option>Other</option></select></div>
    <div class="fld"><label>Amount (₦) *</label><input id="p_amt" type="number"></div>
    <div class="fld full" id="p_descWrap" style="display:none"><label>Describe the payment</label><input id="p_desc" placeholder="What is this payment for?"></div>
    <div class="fld"><label>Term</label><select id="p_term">${TERMS.map(t=>`<option ${DB.settings.term===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fld"><label>Date</label><input id="p_date" type="date" value="${today()}"></div>
    <div class="fld"><label>Method</label><select id="p_method"><option>Cash</option><option>Bank Transfer</option><option>POS</option><option>Cheque</option></select></div>
    <div class="fld"><label>Reference</label><input id="p_ref" placeholder="optional"></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePayment('${sid}',false)">Submit for approval</button>
     ${USER.role==='admin'?`<button class="btn gold" onclick="savePayment('${sid}',true)">Add & approve now</button>`:''}`);}
function savePayment(sid,approve){const amt=Number($('#p_amt').value);if(!amt||amt<=0){toast('Enter a valid amount',true);return;}
  let purpose=$('#p_purpose').value;if(purpose==='Other')purpose=$('#p_desc').value.trim()||'Other';
  const pay={id:uid('p'),studentId:sid,session:DB.settings.session,term:$('#p_term').value,amount:amt,purpose,method:$('#p_method').value,ref:$('#p_ref').value.trim(),date:$('#p_date').value,recordedBy:USER.name,status:'pending'};
  if(approve&&USER.role==='admin'){pay.status='approved';pay.approvedBy=USER.name;pay.approvedAt=today();pay.receiptNo=nextReceiptNo();}
  DB.payments.push(pay);save();closeModal();buildNav();vFees();if(approve)openReceipt(pay.id);
  toast(approve?'Approved — receipt ready':'Submitted for approval');}
function nextReceiptNo(){DB.settings.receiptSeq=(DB.settings.receiptSeq||0)+1;return 'RCT/'+DB.settings.session.slice(0,4)+'/'+String(DB.settings.receiptSeq).padStart(4,'0');}
function renderApprovals(){const pend=DB.payments.filter(p=>p.status==='pending').slice().reverse();
  if(!pend.length){$('#feeArea').innerHTML=`<div class="card"><div class="empty"><div class="big">✅</div>No payments awaiting approval.</div></div>`;return;}
  $('#feeArea').innerHTML=`<div class="t-wrap"><table><thead><tr><th>Date</th><th>Pupil</th><th>Payment for</th><th>Term</th><th class="right">Amount</th><th>By</th><th></th></tr></thead><tbody>
  ${pend.map(p=>{const s=DB.students.find(x=>x.id===p.studentId)||{name:'(deleted)'};return `<tr><td class="muted">${esc(p.date)}</td><td><b>${esc(s.name)}</b><br><span class="muted" style="font-size:11px">${esc(className(s.classId))}</span></td><td>${esc(p.purpose||'School Fees')}</td><td class="muted">${esc(p.term||'')}</td>
    <td class="right"><b>${naira(p.amount)}</b></td><td class="muted">${esc(p.recordedBy||'')}</td>
    <td class="right" style="white-space:nowrap"><button class="btn sm" onclick="approvePay('${p.id}')">Approve</button><button class="btn sm danger" onclick="rejectPay('${p.id}')">Reject</button></td></tr>`;}).join('')}
  </tbody></table></div>`;}
function approvePay(id){const p=DB.payments.find(x=>x.id===id);p.status='approved';p.approvedBy=USER.name;p.approvedAt=today();p.receiptNo=nextReceiptNo();save();buildNav();vFees();toast('Approved — '+p.receiptNo);openReceipt(id);}
function rejectPay(id){DB.payments.find(x=>x.id===id).status='rejected';save();buildNav();vFees();toast('Rejected');}
function renderPayHistory(){const list=DB.payments.filter(p=>p.session===DB.settings.session&&p.term===DB.settings.term).slice().reverse();
  if(!list.length){$('#feeArea').innerHTML=`<div class="card"><div class="empty"><div class="big">🧾</div>No payments this term.</div></div>`;return;}
  const stp={approved:['green','Approved'],pending:['amber','Pending'],rejected:['red','Rejected']};
  $('#feeArea').innerHTML=`<div class="t-wrap"><table><thead><tr><th>Date</th><th>Pupil</th><th>For</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>

  </tbody></table></div><p class="muted mt" style="font-size:12px">✏️ correct a mistake · 🗑️ remove a wrong entry. Balances update automatically.</p>`;}
function managePayments(sid){const s=DB.students.find(x=>x.id===sid);const list=DB.payments.filter(p=>p.studentId===sid).slice().reverse();

  modal('Payments — '+s.name,`<p class="muted mb">Fee due (this term): <b>${naira(due)}</b> · Paid: <b style="color:var(--green)">${naira(paid)}</b> · Balance: <b style="color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</b></p>
    <div class="mb"><label>Fix the term fee total (₦) — if it was entered wrong</label><div class="flex gap"><input id="mp_due" type="number" value="${due}" style="max-width:170px"><button class="btn sec sm" onclick="fixFeeDue('${sid}')">Save fee</button></div></div>
    ${list.length?`<div class="t-wrap"><table><thead><tr><th>Date</th><th>For</th><th>Term</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(p=>`<tr><td class="muted">${esc(p.date)}</td><td>${esc(p.purpose||'School Fees')}</td><td class="muted">${esc(p.term||'')}</td><td class="right">${naira(p.amount)}</td><td><span class="pill ${p.status==='approved'?'green':p.status==='pending'?'amber':'red'}">${esc(p.status)}</span></td>
        <td class="right" style="white-space:nowrap"><button class="btn icon" title="Edit amount/details" onclick="editPayment('${p.id}')">✏️</button><button class="btn icon" title="Delete wrong entry" onclick="delPayment('${p.id}')">🗑️</button></td></tr>`).join('')}

    `<button class="btn sec" onclick="closeModal()">Close</button><button class="btn" onclick="recordPayment('${sid}')">＋ Add payment</button>`,true);}
function fixFeeDue(sid){const v=Number($('#mp_due').value)||0;const k=rkey(sid);DB.fees[k]=DB.fees[k]||{};DB.fees[k].due=v;save();toast('Term fee corrected');managePayments(sid);}
function editPayment(id){const p=DB.payments.find(x=>x.id===id);if(!p)return;

    <div class="fld"><label>Payment for</label><input id="ep_purpose" value="${esc(p.purpose||'School Fees')}"></div>

    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveEditPayment('${id}')">Save changes</button>`);}

function delPayment(id){const p=DB.payments.find(x=>x.id===id);const s=DB.students.find(x=>x.id===p.studentId)||{name:'(pupil)'};

function confirmDelPayment(id){DB.payments=DB.payments.filter(x=>x.id!==id);save();closeModal();buildNav();vFees();toast('Payment deleted');}

/* ===================== BOOT (cloud-first: always loads live data; requires internet) ===================== */
function ensureByKind(d,type){const t=type||(d&&d.kind)||'school';
  return t==='pharmacy'?ensurePharmacy(d):t==='autoparts'?ensureAuto(d):t==='family'?ensureFamily(d):t==='posagent'?ensurePos(d):ensureSchool(d);}
async function cloudPull(id){if(!supa)return{ok:false,net:false};
  try{const{data,error}=await supa.from('school_data').select('data').eq('id',id).maybeSingle();if(error)throw error;
    if(data&&data.data){STORE[id]=data.data;BASE[id]=_clone(data.data);saveStoreLocal();saveBase();return{ok:true,found:true};}
    return{ok:true,found:false};
  }catch(e){console.warn('cloudPull',e);return{ok:false,net:true,err:(e&&e.message)||''+e};}}
async function pullAllStrict(){if(!supa)return false;try{const{data,error}=await supa.from('school_data').select('id,data');if(error)throw error;
  if(data){data.forEach(r=>{STORE[r.id]=r.data;BASE[r.id]=_clone(r.data);});saveStoreLocal();saveBase();}return true;}catch(e){console.warn(e);return false;}}
function renderOffline(msg){window._offline=1;const app=$('#app');if(app)app.style.display='none';const sc=$('#screen');if(!sc)return;sc.style.display='';
  sc.innerHTML=`<div class="auth"><div class="acard"><div class="crest" style="background:#64748b">📡</div><h1>You're offline</h1>
    <div class="sub">${esc(msg||'This app loads your data live from the cloud, so it needs an internet connection. Please connect and try again.')}</div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:16px" onclick="forceUpdate()">🔄 Retry</button></div></div>`;}
/* ---- Fully-online enforcement: lock the app whenever the connection drops ---- */
function showConnLock(){let o=document.getElementById('connLock');
  if(!o){o=document.createElement('div');o.id='connLock';o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(15,23,20,.9);display:flex;align-items:center;justify-content:center;padding:22px';
    o.innerHTML='<div style="background:#fff;border-radius:16px;max-width:340px;text-align:center;padding:26px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35)"><div style="font-size:44px">📡</div><h2 style="margin:8px 0 4px;font-size:20px">Connection lost</h2><p style="color:#6b7a72;font-size:14px;line-height:1.5;margin:0">This app runs fully online. Your work is safe. Reconnect to the internet and it will resume and re-sync automatically.</p></div>';
    document.body.appendChild(o);}
  o.style.display='flex';}
function hideConnLock(){const o=document.getElementById('connLock');if(o)o.style.display='none';}
window.addEventListener('offline',()=>{setSync('err','Offline');});
window.addEventListener('online',async()=>{hideConnLock();if(window._offline){location.reload();return;}
  setSync('saving','Reconnecting…');
  try{if(MODE==='owner'){await flushPush('__master__');}else if(SCHOOL_CODE){await flushPush(SCHOOL_CODE);await flushPush('__master__');}}catch(e){}
  setSync('on','Synced');if(USER&&CURRENT){try{buildNav();go(CURRENT);}catch(e){}}toast('Back online — synced');});
function renderUpdateRequired(v){window._offline=1;const app=$('#app');if(app)app.style.display='none';const sc=$('#screen');if(!sc){setTimeout(()=>location.reload(),1500);return;}sc.style.display='';
  sc.innerHTML=`<div class="auth"><div class="acard"><div class="crest" style="background:#b45309">⬆️</div><h1>Update required</h1>
    <div class="sub">A newer version of the app is available. To keep every device in sync and protect your records, this device must update before you can continue. <b>Your data is safe in the cloud.</b></div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:16px" onclick="forceUpdate()">⬆️ Update now</button>
    <p class="muted" style="font-size:12px;margin-top:10px">If it doesn't refresh, fully close the app and reopen it while connected to the internet.</p></div></div>`;}
async function forceUpdate(){try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}}catch(e){}
  try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}
  try{location.reload(true);}catch(e){location.reload();}}
async function boot(){
  loadStore();loadBase();
  const params=new URLSearchParams(location.search);
  let code=params.get('s')||'';
  let wantCheck=params.get('check')==='1';
  const segs=location.pathname.split('/').filter(Boolean).filter(x=>!/\.html?$/i.test(x)&&!/^index$/i.test(x));
  if(!code&&segs.length){code=segs[0];if(segs[1]&&segs[1].toLowerCase()==='check')wantCheck=true;}
  SCHOOL_CODE=code.toUpperCase();
  initSupa();
  if(!supa){renderOffline('This app is not configured for cloud sync. Please contact the provider.');return;}
  // MASTER (required, live). Don't trust navigator.onLine (often wrong) — actually try the cloud, with retries.
  let mp=await cloudPull('__master__');
  if(!mp.ok){await new Promise(r=>setTimeout(r,1200));mp=await cloudPull('__master__');}
  if(!mp.ok){await new Promise(r=>setTimeout(r,2500));mp=await cloudPull('__master__');}
  if(!mp.ok){const hint=/fetch|network|load failed/i.test(mp.err||'')?'Check your internet connection and try again.':('The cloud database did not respond — if the school’s Supabase project is paused (free projects pause after inactivity), open the Supabase dashboard and resume it. Details: '+(mp.err||'unknown'));renderOffline(hint);return;}
  MASTER=STORE['__master__'];
  if(!MASTER){ // first run only
    MASTER=seedMaster();STORE['__master__']=MASTER;if(!STORE['DEMO'])STORE['DEMO']=seedSchool('DEMO','Demo Nursery & Primary');
    saveStoreLocal();saveMaster();saveSchoolRow('DEMO');MASTER=STORE['__master__'];}
  // ---- Version gate: an out-of-date device is locked out until it updates ----
  const _floor=Number((MASTER&&MASTER.minVersion)||0);
  if(APP_VERSION<_floor){renderUpdateRequired(_floor);return;}
  if(APP_VERSION>_floor&&MASTER){MASTER.minVersion=APP_VERSION;try{saveMaster();}catch(e){}}
  // custom domain → school detection
  if(!code&&MASTER&&MASTER.schools){const host=location.hostname.replace(/^www\./i,'').toLowerCase();
    const m=MASTER.schools.find(s=>s.domain&&s.domain.replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./i,'').toLowerCase()===host);
    if(m){code=m.code;SCHOOL_CODE=code.toUpperCase();}}
  if(SCHOOL_CODE){
    MODE=wantCheck?'check':'school';
    const rp=await cloudPull(SCHOOL_CODE);
    if(!rp.ok){renderOffline();return;}
    const _reg=MASTER&&MASTER.schools&&MASTER.schools.find(s=>s.code===SCHOOL_CODE);
    const _t=(_reg&&_reg.type)||(STORE[SCHOOL_CODE]&&STORE[SCHOOL_CODE].kind)||'school';
    DB=STORE[SCHOOL_CODE]?ensureByKind(STORE[SCHOOL_CODE],_t):null;
    if(DB){STORE[SCHOOL_CODE]=DB;}
    setSync('on','Connected');
    const sess=sessionStorage.getItem('sms_su');
    if(!wantCheck&&DB&&sess&&sess.startsWith(SCHOOL_CODE+'|')){const uidp=sess.split('|')[1];const u=DB.users.find(x=>x.id===uidp);if(u){USER=u;enterApp();return;}}
    renderAuth();
  }else{
    MODE='owner';
    const ok=await pullAllStrict();
    if(!ok){renderOffline();return;}
    MASTER=STORE['__master__']||MASTER;setSync('on','Connected');renderAuth();
  }
}
/* ==================== HIFZ EVALUATION SYSTEM — Phase 2 (First-Term) ====================
   Additive. Reuses the Phase-1 validated 604-page index (pageOf/hifzReady) and the unique
   coverage engine (hifzMergeCoverage/hifzUniquePages/hifzCompletionPct). Never estimates a
   page; never turns the current position into verified coverage. All weights configurable
   from DB.settings.hifz. Old DB.tahfiz/tahTerm/tahEvalOpen are untouched. */
function HZcfg(){return hifzCfg();}
function HZw(){const w=HZcfg().weights||{};return {prog:(w.prog!=null?+w.prog:20),acc:(w.acc!=null?+w.acc:25),mur:(w.mur!=null?+w.mur:25),flu:(w.flu!=null?+w.flu:15),taj:(w.taj!=null?+w.taj:15)};}
function HZwSum(){const W=HZw();return W.prog+W.acc+W.mur+W.flu+W.taj;}
function HZclamp(x,lo,hi){return Math.max(lo,Math.min(hi,x));}
function HZround(x){return Math.round(x);}
/* ---- instructional days & expected pages (weekdays are only the fallback) ---- */
function HZaddDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function HZisWeekend(iso){const wd=new Date(iso+'T00:00:00').getDay();return (HZcfg().weekend||[0,6]).indexOf(wd)>-1;}

/* Per-record serialization + failure rollback for admin calendar mutations. Renders busy state
   in the same paint as the click so the button never looks unresponsive, then either adopts the
   authoritative post-commit state or reverts the local mutation and surfaces UPDATE FAILED. */
async function _hzCalCommit(id,busyLabel,applyFn,undoFn){
  if(_hzCalBusy.has(id)){toast('Please wait — a change to this evaluation is already in progress',true);return {ok:false,busy:true};}
  _hzCalBusy.set(id,busyLabel);_hzCalFailed.delete(id);_hzRerenderCalRow(id);   /* single paint: disabled button + busy label */
  try{applyFn();}catch(e){_hzCalBusy.delete(id);_hzRerenderCalRow(id);toast('Could not apply change: '+((e&&e.message)||e),true);return {ok:false,error:e};}
  let res;try{res=await cloudCommit();}catch(e){res={ok:false,error:(e&&e.message)||String(e)};}
  _hzCalBusy.delete(id);
  if(res.ok){_hzRerenderCalRow(id);return {ok:true};}
  try{undoFn();}catch(e){}
  _hzCalFailed.set(id,'— UPDATE FAILED');_hzRerenderCalRow(id);
  return {ok:false,error:res.error||'Database error'};
}

function _hzBtnBusy(btn,busyLabel){
  if(!btn||btn.dataset.hzBusy==='1')return null;
  btn.dataset.hzBusy='1';
  btn.dataset.hzOrig=btn.textContent;
  btn.dataset.hzOrigDisabled=btn.disabled?'1':'0';
  btn.disabled=true;
  btn.textContent=busyLabel;
  btn.style.color='';btn.style.borderColor='';   /* clear any prior UPDATE FAILED tint */
  return btn;
}
function _hzBtnClear(btn){
  if(!btn||!btn.dataset)return;
  if(btn.dataset.hzOrig!=null)btn.textContent=btn.dataset.hzOrig;
  btn.disabled=(btn.dataset.hzOrigDisabled==='1');
  delete btn.dataset.hzBusy;delete btn.dataset.hzOrig;delete btn.dataset.hzOrigDisabled;
  btn.style.color='';btn.style.borderColor='';
}
function _hzBtnFail(btn,marker){
  if(!btn)return;
  const orig=(btn.dataset&&btn.dataset.hzOrig!=null)?btn.dataset.hzOrig:btn.textContent;
  btn.textContent=orig+' '+(marker||'— DATABASE UPDATE FAILED');
  btn.disabled=false;
  btn.style.color='var(--red)';
  btn.style.borderColor='var(--red)';
  if(btn.dataset){delete btn.dataset.hzBusy;delete btn.dataset.hzOrig;delete btn.dataset.hzOrigDisabled;}
}

function HZvalidate(raw,c,prof){const err=[];

  const curOK=hzPointOK(raw.curSurah,raw.curAyah);
  if(!curOK.ok)err.push('Current position: '+curOK.error);

  const assR=hzRangeOK(raw.assessedFromSurah,raw.assessedFromAyah,raw.assessedToSurah,raw.assessedToAyah,{allowSinglePoint:true});
  if(!assR.ok)err.push('Assessed range: '+assR.error);

  if(!raw.newResult)err.push('Choose the new-portion result (Passed / Partial / Not passed).');

  if(!murR.ok)err.push('Muraja\'ah range: '+murR.error);

  ['major','minor','prompts','forgotten'].forEach(k=>{if(mu[k]<0||!Number.isInteger(mu[k]))err.push('Muraja\'ah counts must be whole numbers ≥ 0.');});

/* ---- helpers ---- */
function phCur(){return (DB.settings.currency||'₦');}
function pmoney(n){return phCur()+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-NG');}
function phProd(id){return DB.products.find(p=>p.id===id);}
function phReorder(p){return (p.reorder!=null&&p.reorder!=='')?Number(p.reorder):Number(DB.settings.lowStock||0);}
function phLow(){return DB.products.filter(p=>!p.archived&&Number(p.stock||0)<=phReorder(p));}
function phDaysTo(date){if(!date)return null;const d=new Date(date);if(isNaN(d))return null;return Math.round((d.getTime()-new Date(today()).getTime())/86400000);}
function phExpStatus(p){const dt=phDaysTo(p.expiry);if(dt==null)return null;if(dt<0)return{cls:'red',txt:'Expired'};if(dt<=Number(DB.settings.expiryDays||60))return{cls:'gold',txt:dt+'d left'};return null;}
function phExpiring(){return DB.products.filter(p=>!p.archived&&phExpStatus(p));}
function phStockValue(){return DB.products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.cost||0),0);}
function phRetailValue(){return DB.products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.sell||0),0);}
function phSalesIn(from,to){return DB.sales.filter(s=>{if(s.voided)return false;const d=(s.date||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to);});}
function phSupplier(id){return DB.suppliers.find(x=>x.id===id);}
function phStat(lbl,num,meta,color){return `<div class="stat"><div class="lbl">${lbl}</div><div class="num"${color?` style="color:${color}"`:''}>${num}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>`;}

function phAddCart(id){const p=phProd(id);if(!p)return;const stock=Number(p.stock||0);

  phRenderCart();}
function phCartQty(id,delta){const line=PH_CART.find(c=>c.id===id);if(!line)return;const p=phProd(id);const stock=Number(p.stock||0);
  line.qty+=delta;if(line.qty<=0){PH_CART=PH_CART.filter(c=>c.id!==id);}else if(line.qty>stock){line.qty=stock;toast('Only '+stock+' in stock',true);}
  phRenderCart();}
function phCartSet(id,val){const line=PH_CART.find(c=>c.id===id);if(!line)return;const p=phProd(id);const stock=Number(p.stock||0);let q=Math.floor(Number(val)||0);if(q>stock){q=stock;toast('Only '+stock+' in stock',true);}if(q<=0){PH_CART=PH_CART.filter(c=>c.id!==id);}else line.qty=q;phRenderCart();}

  const subtotal=items.reduce((a,i)=>a+i.price*i.qty,0);const cost=items.reduce((a,i)=>a+i.cost*i.qty,0);

  DB.sales.push(sale);storeLoyaltyAccrue(sale);save();PH_CART=[];

function phStartPosScan(){if(!window.Html5Qrcode){toast('Scanner not loaded',true);return;}if(window._scanner)return;

function phSaleBalance(s){if(s.voided)return 0;if(s.balance!=null)return Number(s.balance||0);return (s.payment==='Credit'&&!s.settled)?Number(s.total||0):0;}
function phCreditOutstanding(){return DB.sales.reduce((a,s)=>a+phSaleBalance(s),0);}

function phSRange(k){const t=today();if(k==='today'){PH_SFROM=t;PH_STO=t;}else{PH_SFROM='2000-01-01';PH_STO=t;}

  list=list.slice().reverse();

      <td><b>${esc(s.receiptNo||'')}</b>${s.voided?' <span class="pill red">VOID</span>':''}</td>
      <td>${esc((s.date||'').replace('T',' ').slice(0,16))}</td>
      <td>${esc(s.customer||'—')}</td>
      <td>${esc(s.payment||'')}${bal>0?` <span class="pill gold">owes ${pmoney(bal)}</span>`:''}</td>
      <td class="right">${pmoney(s.total)}</td><td class="right" style="color:#0a7d33">${pmoney(s.profit)}</td>
      <td class="right" style="white-space:nowrap"><button class="btn sm sec" onclick="phShowReceipt('${s.id}')">Receipt</button>${bal>0?`<button class="btn sm" style="background:#0a7d33" onclick="phCustPay('${s.id}')">＋ Payment</button>`:''}${!s.voided?`<button class="btn sm danger" onclick="phVoidSale('${s.id}')">Void</button>`:''}</td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">🧾</div>No sales in range.</div></div>`}`;}
function phCustPay(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const bal=phSaleBalance(s);
  modal('Record customer payment — '+s.receiptNo,`<p class="muted mb">${esc(s.customer||'Customer')} · Total ${pmoney(s.total)} · Outstanding <b style="color:#c0392b">${pmoney(bal)}</b></p><div class="grid2">
    <div class="fld"><label>Amount received (${phCur()})</label><input id="phcp_amt" type="number" min="0" step="0.01" value="${bal}"></div>
    <div class="fld"><label>Method</label><select id="phcp_method"><option>Cash</option><option>Transfer</option><option>POS / Card</option></select></div>
  </div>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#0a7d33" onclick="phDoCustPay('${id}')">Record payment</button>`);}
function phDoCustPay(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const bal=phSaleBalance(s);
  let amt=Math.max(0,Number($('#phcp_amt').value)||0);if(amt<=0){toast('Enter an amount',true);return;}if(amt>bal)amt=bal;
  s.payments=s.payments||[];s.payments.push({date:new Date().toISOString(),amount:amt,method:$('#phcp_method').value});
  s.paid=Number(s.paid||0)+amt;s.balance=Math.max(0,Number(s.total||0)-Number(s.paid||0));s.settled=s.balance<=0.001;
  DB.settings.custPaySeq=(DB.settings.custPaySeq||0)+1;
  const pay={no:'RC/'+String(DB.settings.custPaySeq).padStart(4,'0'),date:new Date().toISOString(),amount:amt,method:$('#phcp_method').value,balAfter:s.balance};
  save();closeModal();toast('Payment recorded · '+pmoney(amt));phShowCustPayReceipt(s.id,pay);}

      <div style="display:flex;justify-content:space-between"><span>For sale</span><span>${esc(s.receiptNo||'')}</span></div>
      <div style="display:flex;justify-content:space-between"><span>Method</span><span>${esc(pay.method||'')}</span></div>
    </div>
    <div style="border-top:1px dashed #999;margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-weight:800;font-size:17px"><span>AMOUNT PAID</span><span>${pmoney(pay.amount)}</span></div>
    <div style="font-size:12px;display:flex;justify-content:space-between;margin-top:4px"><span>Remaining balance</span><b style="color:${Number(pay.balAfter||0)>0?'#c0392b':'#0a7d33'}">${pmoney(pay.balAfter||0)}</b></div>
    <div style="text-align:center;font-size:11px;margin-top:12px;border-top:1px dashed #999;padding-top:8px">Thank you.<br>Powered by Muscode</div>
  </div>`;}
function phShowCustPayReceipt(saleId,pay){const s=DB.sales.find(x=>x.id===saleId);if(!s)return;
  modal('Payment Receipt — '+pay.no,phCustPayReceiptHTML(s,pay),`<button class="btn sec no-print" onclick="closeModal();phRenderSales()">Close</button><button class="btn no-print" style="background:#0c5b56" onclick="window.print()">🖨 Print</button>`);}
function phVoidSale(id){const s=DB.sales.find(x=>x.id===id);if(!s||s.voided)return;

function phRenderInv(){const q=PH_INVQ.toLowerCase().trim();
  let list=DB.products.filter(p=>!p.archived);if(q)list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q));

  const el=$('#invArea');if(!el)return;
  el.innerHTML=list.length?`<div class="t-wrap"><table><thead><tr><th>Product</th><th>Category</th><th class="right">Stock</th><th class="right">Cost</th><th class="right">Sell</th><th>Expiry</th><th></th></tr></thead><tbody>

function phSupplierOptions(sel){return `<option value="">— none —</option>`+DB.suppliers.map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${esc(s.name)}</option>`).join('');}
function phEditProduct(id){const p=id?phProd(id):null;

    <div class="fld"><label>&nbsp;</label><div class="muted" style="font-size:12px;padding-top:8px">Goods value = stock × cost. Any unpaid part is added to the supplier's balance, and a purchase is recorded.</div></div></div>`:''}`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#0c5b56" onclick="phSaveProduct('${id||''}')">${p?'Save':'Add product'}</button>`,true);}
function phSaveProduct(id){const name=$('#pr_name').value.trim(),sell=Number($('#pr_sell').value);
  if(!name){toast('Product name required',true);return;}if(!(sell>=0)||$('#pr_sell').value===''){toast('Selling price required',true);return;}
  const rl=$('#pr_reorder').value;
  const data={name,category:$('#pr_cat').value.trim(),unit:$('#pr_unit').value.trim(),cost:Number($('#pr_cost').value)||0,sell,
    stock:Math.max(0,Math.floor(Number($('#pr_stock').value)||0)),reorder:rl===''?null:Math.max(0,Math.floor(Number(rl)||0)),
    expiry:$('#pr_exp').value,batch:$('#pr_batch').value.trim(),barcode:$('#pr_bc').value.trim(),supplierId:$('#pr_sup').value};
  if(id){Object.assign(phProd(id),data);}
  else{const np={id:uid('pr'),...data};DB.products.push(np);
    const paidNow=Math.max(0,Number(($('#pr_paid')||{}).value)||0);
    if(np.supplierId&&np.stock>0&&np.cost>0){const tot=np.stock*np.cost;const sp=phSupplier(np.supplierId);
      if(sp)sp.balance=Number(sp.balance||0)+Math.max(0,tot-Math.min(tot,paidNow));
      DB.purchases.push({id:uid('pu'),date:new Date().toISOString(),supplierId:np.supplierId,items:[{productId:np.id,name:np.name,qty:np.stock,cost:np.cost}],total:tot,paid:Math.min(tot,paidNow),note:'Opening stock'});}}
  save();closeModal();toast('Saved');if(CURRENT==='inventory')vPhInventory();}

function phDoDelProduct(id){DB.products=DB.products.filter(p=>p.id!==id);save();closeModal();toast('Deleted');vPhInventory();}
function phRestock(id){const p=phProd(id);if(!p)return;

    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#0c5b56" onclick="phSaveRestock('${id}')">Add stock</button>`);}
function phSaveRestock(id){const p=phProd(id);const qty=Math.floor(Number($('#rs_qty').value)||0);if(qty<=0){toast('Enter a quantity',true);return;}
  const cost=Number($('#rs_cost').value)||0;const sup=$('#rs_sup').value;const exp=$('#rs_exp').value;

function phAdjust(id){const p=phProd(id);if(!p)return;
  modal('Adjust stock — '+p.name,`<p class="muted mb">Use for damage, expiry write-off, or correcting a miscount. Current stock: <b>${Number(p.stock||0)}</b></p><div class="grid2">

  DB.adjustments.push({id:uid('aj'),date:new Date().toISOString(),productId:p.id,name:p.name,from:old,to:nw,delta,reason:$('#aj_reason').value});
  save();closeModal();toast('Stock adjusted ('+(delta>0?'+':'')+delta+')');vPhInventory();}

function phSavePurchase(){const sup=$('#pu_sup').value;const items=[];
  DB.products.forEach(p=>{const qel=$('#pu_q_'+p.id);if(!qel)return;const q=Math.floor(Number(qel.value)||0);if(q>0){const c=Number($('#pu_c_'+p.id).value)||0;items.push({productId:p.id,name:p.name,qty:q,cost:c});}});
  if(!items.length){toast('Enter at least one quantity',true);return;}
  const total=items.reduce((a,i)=>a+i.qty*i.cost,0);const paid=Math.max(0,Number($('#pu_paid').value)||0);
  const date=$('#pu_date').value?new Date($('#pu_date').value).toISOString():new Date().toISOString();
  items.forEach(i=>{const p=phProd(i.productId);if(p){p.stock=Number(p.stock||0)+i.qty;if(i.cost)p.cost=i.cost;p.supplierId=sup;}});
  const s=phSupplier(sup);if(s)s.balance=Number(s.balance||0)+(total-paid);
  DB.purchases.push({id:uid('pu'),date,supplierId:sup,items,total,paid,note:$('#pu_note').value.trim()});
  save();closeModal();toast('Purchase recorded · '+pmoney(total));vPhSuppliers();}

/* ---- Reports ---- */
function vPhReports(){const t=today();if(!PH_FROM){PH_FROM=t.slice(0,8)+'01';}if(!PH_TO)PH_TO=t;
  $('#view').innerHTML=`<div class="page-head"><div><h2>Reports</h2><p>Sales, profit & stock</p></div>
    <div class="flex gap"><button class="btn no-print" style="background:#0c5b56" onclick="storeEOD()">🧾 End-of-day</button><button class="btn gold no-print" onclick="window.print()">🖨 Print</button></div></div>
  <div class="toolbar no-print"><div><label>From</label><input id="rp_from" type="date" value="${PH_FROM}" onchange="PH_FROM=this.value;phRenderReports()"></div>
    <div><label>To</label><input id="rp_to" type="date" value="${PH_TO}" onchange="PH_TO=this.value;phRenderReports()"></div>
    <div style="align-self:flex-end"><button class="btn sm sec" onclick="phRange('today')">Today</button>
      <button class="btn sm sec" onclick="phRange('month')">This month</button>
      <button class="btn sm sec" onclick="phRange('all')">All time</button></div></div>
  <div id="rpArea"></div>`;phRenderReports();}
function phRange(k){const t=today();if(k==='today'){PH_FROM=t;PH_TO=t;}else if(k==='month'){PH_FROM=t.slice(0,8)+'01';PH_TO=t;}else if(k==='all'){PH_FROM='2000-01-01';PH_TO=t;}
  const f=$('#rp_from'),to=$('#rp_to');if(f)f.value=PH_FROM;if(to)to.value=PH_TO;phRenderReports();}
function phRenderReports(){const sales=phSalesIn(PH_FROM,PH_TO);
  const gross=sales.reduce((a,s)=>a+Number(s.total||0),0);
  const cost=sales.reduce((a,s)=>a+Number(s.cost||0),0);
  const profit=gross-cost;
  const byPay={};sales.forEach(s=>{byPay[s.payment||'Cash']=(byPay[s.payment||'Cash']||0)+Number(s.total||0);});
  const agg={};sales.forEach(s=>(s.items||[]).forEach(i=>{const a=agg[i.productId]||(agg[i.productId]={name:i.name,qty:0,rev:0});a.qty+=Number(i.qty||0);a.rev+=Number(i.price||0)*Number(i.qty||0);}));
  const best=Object.values(agg).sort((a,b)=>b.qty-a.qty).slice(0,10);
  const low=phLow(),exp=phExpiring();
  const expTotal=storeExpensesIn(PH_FROM,PH_TO).reduce((a,e)=>a+Number(e.amount||0),0);const net=profit-expTotal;
  const el=$('#rpArea');if(!el)return;
  el.innerHTML=`<div class="cards-row">
    ${phStat('Transactions',sales.length,PH_FROM+' → '+PH_TO)}
    ${phStat('Gross sales',pmoney(gross),'','#0c5b56')}
    ${phStat('Gross profit',pmoney(profit),gross?((profit/gross*100).toFixed(1)+'% margin'):'','#0a7d33')}
    ${phStat('Expenses',pmoney(expTotal),'',expTotal?'#c0392b':'')}
    ${phStat('NET PROFIT',pmoney(net),'after expenses',net>=0?'#0a7d33':'#c0392b')}
  </div>
  <div class="flex gap" style="flex-wrap:wrap;align-items:flex-start">
    <div class="card pad" style="flex:1;min-width:280px"><h3 class="mb">Best sellers</h3>
      ${best.length?`<div class="t-wrap"><table><thead><tr><th>Product</th><th class="right">Qty</th><th class="right">Revenue</th></tr></thead><tbody>
        ${best.map(b=>`<tr><td>${esc(b.name)}</td><td class="right">${b.qty}</td><td class="right">${pmoney(b.rev)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No sales in range.</div>`}</div>
    <div class="card pad" style="flex:1;min-width:240px"><h3 class="mb">Payment methods</h3>
      ${Object.keys(byPay).length?`<div class="t-wrap"><table><tbody>${Object.entries(byPay).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="right"><b>${pmoney(v)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">—</div>`}
      <hr><div class="flex" style="justify-content:space-between"><span class="muted">Stock value (cost)</span><b>${pmoney(phStockValue())}</b></div>
      <div class="flex" style="justify-content:space-between"><span class="muted">Stock value (retail)</span><b>${pmoney(phRetailValue())}</b></div>
    </div>
  </div>
  <div class="flex gap" style="flex-wrap:wrap;align-items:flex-start">
    <div class="card pad" style="flex:1;min-width:280px"><h3 class="mb">⚠️ Low stock (${low.length})</h3>
      ${low.length?`<div class="t-wrap"><table><thead><tr><th>Product</th><th class="right">Stock</th><th class="right">Reorder ≤</th></tr></thead><tbody>${low.map(p=>`<tr><td>${esc(p.name)}</td><td class="right">${Number(p.stock||0)}</td><td class="right">${phReorder(p)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">All good 👍</div>`}</div>
    <div class="card pad" style="flex:1;min-width:280px"><h3 class="mb">⏳ Expiring / expired (${exp.length})</h3>
      ${exp.length?`<div class="t-wrap"><table><thead><tr><th>Product</th><th>Expiry</th><th class="right">Stock</th></tr></thead><tbody>${exp.map(p=>{const es=phExpStatus(p);return `<tr><td>${esc(p.name)}</td><td>${esc(p.expiry||'')} <span class="pill ${es.cls}">${es.txt}</span></td><td class="right">${Number(p.stock||0)}</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty">None 👍</div>`}</div>
  </div>
  ${storeExpensesCardHTML(PH_FROM,PH_TO,'phRenderReports')}`;}

function phExportCSV(type){let rows,name;
  if(type==='inventory'){name='inventory';rows=[['Name','Category','Unit','Stock','Cost','Sell','Reorder','Expiry','Batch','Barcode']];
    DB.products.filter(p=>!p.archived).forEach(p=>rows.push([p.name,p.category||'',p.unit||'',p.stock||0,p.cost||0,p.sell||0,phReorder(p),p.expiry||'',p.batch||'',p.barcode||'']));}
  else{name='sales';rows=[['Receipt','Date','Items','Total','Paid','Balance','Cost','Profit','Payment','Customer','Voided']];
    DB.sales.forEach(s=>rows.push([s.receiptNo,(s.date||'').replace('T',' ').slice(0,16),(s.items||[]).reduce((a,i)=>a+Number(i.qty||0),0),s.total||0,(s.paid!=null?s.paid:s.total)||0,phSaleBalance(s),s.cost||0,s.profit||0,s.payment||'',s.customer||'',s.voided?'YES':'']));}
  const csv=rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(DB.settings.shortName||DB.settings.storeName||'pharmacy')+'-'+name+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('CSV downloaded');}

  if(days<0)return{cls:'red',txt:'Overdue '+(-days)+'d'};if(days<=7)return{cls:'gold',txt:'Due in '+days+'d'};return{cls:'green',txt:'Paid · due '+due};}

function auRenderPosList(){const q=($('#aupos_q')?$('#aupos_q').value:'').toLowerCase().trim();
  let list=DB.products.filter(p=>!p.archived);
  if(q)list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.partNo||'').toLowerCase().includes(q)||(p.brand||'').toLowerCase().includes(q)||(p.fitment||'').toLowerCase().includes(q)||(p.barcode||'').toLowerCase().includes(q));
  list=list.slice(0,60);const el=$('#auposList');if(!el)return;
  el.innerHTML=list.length?`<div class="t-wrap" style="max-height:60vh;overflow:auto"><table><tbody>
    ${list.map(p=>{const out=Number(p.stock||0)<=0;return `<tr>
      <td><b>${esc(p.name)}</b><br><span class="muted" style="font-size:11px">${esc(auPartLine(p)||p.category||'')} · Stock ${Number(p.stock||0)}</span></td>
      <td class="right" style="white-space:nowrap"><b>${amoney(p.sell)}</b></td>
      <td class="right"><button class="btn sm ${out?'sec':''}" ${out?'disabled':''} style="${out?'':'background:#15366e;color:#fff'}" onclick="auAddCart('${p.id}')">${out?'Out':'＋ Add'}</button></td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="empty"><div class="big">🔧</div>${DB.products.length?'No match.':'No parts yet. Add them in Inventory.'}</div>`;}
function auQuickAdd(){const q=($('#aupos_q').value||'').toLowerCase().trim();if(!q)return;
  const p=DB.products.find(x=>!x.archived&&((x.barcode||'').toLowerCase()===q||(x.partNo||'').toLowerCase()===q))||DB.products.find(x=>!x.archived&&(x.name||'').toLowerCase().includes(q));
  if(p){auAddCart(p.id);$('#aupos_q').value='';auRenderPosList();}}
function auAddCart(id){const p=auProd(id);if(!p)return;const stock=Number(p.stock||0);const line=AU_CART.find(c=>c.id===id);
  if(line){if(line.qty>=stock){toast('Only '+stock+' in stock',true);return;}line.qty++;}else{if(stock<=0){toast('Out of stock',true);return;}AU_CART.push({id,qty:1});}auRenderCart();}
function auCartQty(id,delta){const line=AU_CART.find(c=>c.id===id);if(!line)return;const p=auProd(id);const stock=Number(p.stock||0);
  line.qty+=delta;if(line.qty<=0){AU_CART=AU_CART.filter(c=>c.id!==id);}else if(line.qty>stock){line.qty=stock;toast('Only '+stock+' in stock',true);}auRenderCart();}
function auCartSet(id,val){const line=AU_CART.find(c=>c.id===id);if(!line)return;const p=auProd(id);const stock=Number(p.stock||0);let q=Math.floor(Number(val)||0);if(q>stock){q=stock;toast('Only '+stock+' in stock',true);}if(q<=0){AU_CART=AU_CART.filter(c=>c.id!==id);}else line.qty=q;auRenderCart();}
function auRemoveCart(id){AU_CART=AU_CART.filter(c=>c.id!==id);auRenderCart();}
function auCartTotal(){return AU_CART.reduce((a,c)=>{const p=auProd(c.id);return a+(p?Number(p.sell||0)*c.qty:0);},0);}
function auRenderCart(){const el=$('#auposCart');if(!el)return;
  if(!AU_CART.length){el.innerHTML=`<div class="empty"><div class="big">🛒</div>Cart is empty.</div>`;return;}
  const total=auCartTotal();
  el.innerHTML=`<div class="t-wrap"><table><tbody>
    ${AU_CART.map(c=>{const p=auProd(c.id);if(!p)return '';return `<tr>
      <td><b>${esc(p.name)}</b><br><span class="muted" style="font-size:11px">${amoney(p.sell)} each</span></td>
      <td style="white-space:nowrap"><button class="btn icon sm" onclick="auCartQty('${c.id}',-1)">−</button>
        <input value="${c.qty}" onchange="auCartSet('${c.id}',this.value)" style="width:46px;text-align:center;display:inline-block;padding:4px">
        <button class="btn icon sm" onclick="auCartQty('${c.id}',1)">＋</button></td>
      <td class="right"><b>${amoney(p.sell*c.qty)}</b></td>
      <td class="right"><button class="btn icon sm danger" onclick="auRemoveCart('${c.id}')">✕</button></td></tr>`;}).join('')}
  </tbody></table></div>
  <div class="flex" style="justify-content:space-between;align-items:center;font-size:18px;font-weight:800;margin:10px 0 4px"><span>Subtotal</span><span style="color:#15366e">${amoney(total)}</span></div>
  <div class="grid2"><div class="fld"><label>Discount (${auCur()})</label><input id="aupos_disc" type="number" min="0" step="0.01" value="0" oninput="auPaidHint(${total})"></div>
    <div class="fld"><label>Payment</label><select id="aupos_pay"><option>Cash</option><option>Transfer</option><option>POS / Card</option><option>Credit</option></select></div></div>
  <div class="grid2"><div class="fld"><label>Customer / Workshop</label><input id="aupos_cust" list="custList" placeholder="Walk-in"></div>
    <div class="fld"><label>Warranty (optional)</label><input id="aupos_warr" placeholder="e.g. 1 month / no warranty"></div></div>${storeCustDatalist()}
  <div class="fld"><label>Amount paid now (${auCur()})</label><input id="aupos_paid" type="number" min="0" step="0.01" value="${total}" oninput="auPaidHint(${total})"></div>
  <div id="aupos_balhint" class="muted" style="font-size:12.5px;margin:-4px 0 8px"></div>
  <div class="flex gap"><button class="btn" style="flex:1;justify-content:center;background:#15366e" onclick="auCheckout()">✓ Checkout</button>
    <button class="btn sec" onclick="AU_CART=[];auRenderCart()">Clear</button></div>`;}
function auPaidHint(sub){const disc=Math.max(0,Number(($('#aupos_disc')||{}).value)||0);const net=Math.max(0,sub-disc);const pf=$('#aupos_paid');if(pf&&(pf._auto!==false))pf.value=net;
  const v=Math.max(0,Number(pf?pf.value:net)||0);const bal=Math.max(0,net-v);const el=$('#aupos_balhint');if(!el)return;
  el.innerHTML=`<b>Total: ${amoney(net)}</b>${disc>0?' · discount '+amoney(disc):''} — `+(bal>0?`<span style="color:#c0392b;font-weight:700">balance ${amoney(bal)}</span>`:`<span style="color:#0a7d33">paid in full ✓</span>`);}
function auCheckout(){if(!AU_CART.length){toast('Cart is empty',true);return;}
  for(const c of AU_CART){const p=auProd(c.id);if(!p||c.qty>Number(p.stock||0)){toast('Not enough stock for '+(p?p.name:'item'),true);return;}}
  const items=AU_CART.map(c=>{const p=auProd(c.id);return{productId:p.id,name:p.name,partNo:p.partNo||'',qty:c.qty,price:Number(p.sell||0),cost:Number(p.cost||0)};});
  const subtotal=items.reduce((a,i)=>a+i.price*i.qty,0);const cost=items.reduce((a,i)=>a+i.cost*i.qty,0);
  const discount=Math.min(subtotal,Math.max(0,Number($('#aupos_disc').value)||0));const total=subtotal-discount;
  DB.settings.receiptSeq=(DB.settings.receiptSeq||0)+1;
  const paid=Math.min(total,Math.max(0,Number($('#aupos_paid').value)||0));const balance=Math.max(0,total-paid);
  const sale={id:uid('sl'),receiptNo:'AP/'+String(DB.settings.receiptSeq).padStart(4,'0'),date:new Date().toISOString(),
    items,subtotal,discount,total,cost,profit:total-cost,payment:$('#aupos_pay').value,customer:($('#aupos_cust').value||'').trim(),warranty:($('#aupos_warr').value||'').trim(),cashier:USER.name,
    paid,balance,settled:balance<=0.001,payments:paid>0?[{date:new Date().toISOString(),amount:paid,method:$('#aupos_pay').value}]:[]};
  items.forEach(i=>{const p=auProd(i.productId);if(p)p.stock=Number(p.stock||0)-i.qty;});
  DB.sales.push(sale);storeLoyaltyAccrue(sale);save();AU_CART=[];toast(balance>0?('Sale recorded · balance '+amoney(balance)):('Sale recorded · '+amoney(total)));auShowReceipt(sale.id);vAuPOS();}

function auScanToggle(){const box=$('#auposScan');if(!box)return;if(box.style.display==='none'){box.style.display='block';auStartPosScan();}else{stopScan();box.style.display='none';}}
function auStartPosScan(){if(!window.Html5Qrcode){toast('Scanner not loaded',true);return;}if(window._scanner)return;
  const fmts=window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.QR_CODE]:undefined;
  window._scanner=new Html5Qrcode('reader');
  window._scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:140},formatsToSupport:fmts},txt=>auScanned(txt),()=>{}).catch(()=>{toast('Camera failed',true);window._scanner=null;});}
function auScanned(code){code=(code||'').trim();const p=DB.products.find(x=>!x.archived&&((x.barcode||'')===code||(x.partNo||'')===code));if(p){auAddCart(p.id);toast('Added '+p.name);}else{toast('No part with code '+code,true);}}

/* ---- Sales history + debtors ---- */
function auSaleBalance(s){if(s.voided)return 0;if(s.balance!=null)return Number(s.balance||0);return (s.payment==='Credit'&&!s.settled)?Number(s.total||0):0;}
function auCreditOutstanding(){return DB.sales.reduce((a,s)=>a+auSaleBalance(s),0);}
function vAuSales(){const t=today();if(!AU_SFROM)AU_SFROM=t.slice(0,8)+'01';if(!AU_STO)AU_STO=t;
  $('#view').innerHTML=`<div class="page-head"><div><h2>Sales</h2><p>History, receipts, refunds & debtors</p></div>
    <button class="btn" style="background:#15366e" onclick="go('aupos')">🛒 New Sale</button></div>
  <div class="toolbar no-print"><div><label>From</label><input id="ausl_from" type="date" value="${AU_SFROM}" onchange="AU_SFROM=this.value;auRenderSales()"></div>
    <div><label>To</label><input id="ausl_to" type="date" value="${AU_STO}" onchange="AU_STO=this.value;auRenderSales()"></div>
    <div style="flex:1"><label>Search</label><input id="ausl_q" value="${esc(AU_SQ)}" placeholder="receipt / customer" oninput="AU_SQ=this.value;auRenderSales()"></div>
    <div style="align-self:flex-end"><button class="btn sm sec" onclick="auSRange('today')">Today</button><button class="btn sm sec" onclick="auSRange('all')">All</button></div></div>
  <div id="auslArea"></div>`;auRenderSales();}
function auSRange(k){const t=today();if(k==='today'){AU_SFROM=t;AU_STO=t;}else{AU_SFROM='2000-01-01';AU_STO=t;}
  const f=$('#ausl_from'),to=$('#ausl_to');if(f)f.value=AU_SFROM;if(to)to.value=AU_STO;auRenderSales();}
function auRenderSales(){const q=AU_SQ.toLowerCase().trim();
  let list=DB.sales.filter(s=>{const d=(s.date||'').slice(0,10);return (!AU_SFROM||d>=AU_SFROM)&&(!AU_STO||d<=AU_STO);});
  if(q)list=list.filter(s=>(s.receiptNo||'').toLowerCase().includes(q)||(s.customer||'').toLowerCase().includes(q));
  list=list.slice().reverse();const valid=list.filter(s=>!s.voided);
  const gross=valid.reduce((a,s)=>a+Number(s.total||0),0),profit=valid.reduce((a,s)=>a+Number(s.profit||0),0);const debt=auCreditOutstanding();
  const el=$('#auslArea');if(!el)return;
  el.innerHTML=`<div class="cards-row">
    ${phStat('Transactions',valid.length,'in range')}
    ${phStat('Gross sales',amoney(gross),'','#15366e')}
    ${phStat('Profit',amoney(profit),'','#0a7d33')}
    ${phStat('Debtors (credit)',amoney(debt),'unpaid',debt?'#c0392b':'')}
  </div>
  ${list.length?`<div class="t-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Pay</th><th class="right">Total</th><th class="right">Profit</th><th></th></tr></thead><tbody>
    ${list.map(s=>{const bal=auSaleBalance(s);return `<tr${s.voided?' style="opacity:.5"':''}>
      <td><b>${esc(s.receiptNo||'')}</b>${s.voided?' <span class="pill red">VOID</span>':''}</td>
      <td>${esc((s.date||'').replace('T',' ').slice(0,16))}</td><td>${esc(s.customer||'—')}</td>
      <td>${esc(s.payment||'')}${bal>0?` <span class="pill gold">owes ${amoney(bal)}</span>`:''}</td>
      <td class="right">${amoney(s.total)}</td><td class="right" style="color:#0a7d33">${amoney(s.profit)}</td>
      <td class="right" style="white-space:nowrap"><button class="btn sm sec" onclick="auShowReceipt('${s.id}')">Receipt</button>${bal>0?`<button class="btn sm" style="background:#0a7d33" onclick="auCustPay('${s.id}')">＋ Payment</button>`:''}${!s.voided?`<button class="btn sm danger" onclick="auVoidSale('${s.id}')">Void</button>`:''}</td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">🧾</div>No sales in range.</div></div>`}`;}
function auCustPay(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const bal=auSaleBalance(s);
  modal('Record customer payment — '+s.receiptNo,`<p class="muted mb">${esc(s.customer||'Customer')} · Total ${amoney(s.total)} · Outstanding <b style="color:#c0392b">${amoney(bal)}</b></p><div class="grid2">
    <div class="fld"><label>Amount received (${auCur()})</label><input id="aucp_amt" type="number" min="0" step="0.01" value="${bal}"></div>
    <div class="fld"><label>Method</label><select id="aucp_method"><option>Cash</option><option>Transfer</option><option>POS / Card</option></select></div>
  </div>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#0a7d33" onclick="auDoCustPay('${id}')">Record payment</button>`);}
function auDoCustPay(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;const bal=auSaleBalance(s);
  let amt=Math.max(0,Number($('#aucp_amt').value)||0);if(amt<=0){toast('Enter an amount',true);return;}if(amt>bal)amt=bal;
  s.payments=s.payments||[];s.payments.push({date:new Date().toISOString(),amount:amt,method:$('#aucp_method').value});
  s.paid=Number(s.paid||0)+amt;s.balance=Math.max(0,Number(s.total||0)-Number(s.paid||0));s.settled=s.balance<=0.001;
  DB.settings.custPaySeq=(DB.settings.custPaySeq||0)+1;

function auSaveProduct(id){const name=$('#ar_name').value.trim(),sell=Number($('#ar_sell').value);
  if(!name){toast('Part name required',true);return;}if($('#ar_sell').value===''||!(sell>=0)){toast('Selling price required',true);return;}
  const rl=$('#ar_reorder').value;
  const data={name,partNo:$('#ar_partno').value.trim(),brand:$('#ar_brand').value.trim(),category:$('#ar_cat').value,condition:$('#ar_cond').value,
    fitment:$('#ar_fit').value.trim(),cost:Number($('#ar_cost').value)||0,sell,stock:Math.max(0,Math.floor(Number($('#ar_stock').value)||0)),
    reorder:rl===''?null:Math.max(0,Math.floor(Number(rl)||0)),location:$('#ar_loc').value.trim(),barcode:$('#ar_bc').value.trim(),supplierId:$('#ar_sup').value};
  if(id){Object.assign(auProd(id),data);}
  else{const np={id:uid('pr'),...data};DB.products.push(np);
    const paidNow=Math.max(0,Number(($('#ar_paid')||{}).value)||0);
    if(np.supplierId&&np.stock>0&&np.cost>0){const tot=np.stock*np.cost;const sp=auSupplier(np.supplierId);

        ${best.map(b=>`<tr><td>${esc(b.name)}</td><td class="right">${b.qty}</td><td class="right">${amoney(b.rev)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No sales in range.</div>`}</div>
    <div class="card pad" style="flex:1;min-width:240px"><h3 class="mb">Payment methods</h3>
      ${Object.keys(byPay).length?`<div class="t-wrap"><table><tbody>${Object.entries(byPay).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="right"><b>${amoney(v)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">—</div>`}

function auExportCSV(type){let rows,name;

  else{name='sales';rows=[['Receipt','Date','Items','Total','Paid','Balance','Cost','Profit','Payment','Customer','Warranty','Voided']];
    DB.sales.forEach(s=>rows.push([s.receiptNo,(s.date||'').replace('T',' ').slice(0,16),(s.items||[]).reduce((a,i)=>a+Number(i.qty||0),0),s.total||0,(s.paid!=null?s.paid:s.total)||0,auSaleBalance(s),s.cost||0,s.profit||0,s.payment||'',s.customer||'',s.warranty||'',s.voided?'YES':'']));}

/* ---- share a receipt as an IMAGE (PNG) to WhatsApp / share sheet ---- */
function storeShareImage(html,filename,shareText){
  if(!window.html2canvas){toast('Image tool still loading — try again in a moment',true);return;}
  const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-10000px;top:0;background:#fff;z-index:-1';
  wrap.innerHTML=html;document.body.appendChild(wrap);const node=wrap.firstElementChild||wrap;toast('Preparing image…');
  html2canvas(node,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(canvas=>{
    if(wrap.parentNode)document.body.removeChild(wrap);
    canvas.toBlob(blob=>{if(!blob){toast('Could not create image',true);return;}
      const file=new File([blob],filename+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],text:shareText||''}).catch(()=>{});}
      else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Receipt image saved — attach it in WhatsApp');}
    },'image/png');
  }).catch(()=>{if(wrap.parentNode)document.body.removeChild(wrap);toast('Image failed — try Print instead',true);});
}

function storeAccent(){return DB.kind==='autoparts'?'#15366e':'#0c5b56';}
function storeDailySeries(n){const arr=[];const base=new Date(today());
  for(let i=n-1;i>=0;i--){const dt=new Date(base);dt.setDate(dt.getDate()-i);const ds=dt.toISOString().slice(0,10);
    const day=(DB.sales||[]).filter(s=>!s.voided&&(s.date||'').slice(0,10)===ds);
    arr.push({date:ds,total:day.reduce((a,s)=>a+Number(s.total||0),0),profit:day.reduce((a,s)=>a+(Number(s.total||0)-Number(s.cost||0)),0)});}
  return arr;}
function storeTopSellers(n,days){const from=new Date(today());from.setDate(from.getDate()-(days-1));const f=from.toISOString().slice(0,10);
  const agg={};(DB.sales||[]).filter(s=>!s.voided&&(s.date||'').slice(0,10)>=f).forEach(s=>(s.items||[]).forEach(i=>{const a=agg[i.productId]||(agg[i.productId]={name:i.name,qty:0,rev:0});a.qty+=Number(i.qty||0);a.rev+=Number(i.price||0)*Number(i.qty||0);}));
  return Object.values(agg).sort((a,b)=>b.qty-a.qty).slice(0,n);}

function storeNewQuote(){const ac=storeAccent();const prods=DB.products.filter(p=>!p.archived).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(!prods.length){toast('Add products first',true);return;}

function storeSaveQuote(){const items=[];DB.products.forEach(p=>{const el=$('#q_q_'+p.id);if(!el)return;const q=Math.floor(Number(el.value)||0);if(q>0)items.push({productId:p.id,name:p.name,partNo:p.partNo||'',qty:q,price:Number(p.sell||0)});});

function storeQuoteHTML(q){const set=DB.settings;const logo=set.logo?`<img src="${set.logo}" style="width:100%;height:100%;object-fit:cover">`:(DB.kind==='autoparts'?'🔧':'💊');

function storeShowQuote(id){const q=(DB.quotes||[]).find(x=>x.id===id);if(!q)return;

function storeDelQuote(id){DB.quotes=(DB.quotes||[]).filter(q=>q.id!==id);save();toast('Deleted');vStoreQuotes();}
function storeConvertQuote(id){const q=(DB.quotes||[]).find(x=>x.id===id);if(!q)return;
  for(const i of q.items){const p=DB.products.find(x=>x.id===i.productId);if(!p||i.qty>Number(p.stock||0)){toast('Not enough stock for '+(p?p.name:i.name),true);return;}}
  modal('Convert to sale?',`<p>Create a sale from <b>${esc(q.quoteNo)}</b> for <b>${pmoney(q.total)}</b>? Stock will be deducted.</p>
   <div class="fld"><label>Amount paid now (${(DB.settings.currency||'₦')})</label><input id="qcv_paid" type="number" min="0" step="0.01" value="${q.total}"></div>`,
   `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#0a7d33" onclick="storeDoConvertQuote('${id}')">Create sale</button>`);}
function storeDoConvertQuote(id){const q=(DB.quotes||[]).find(x=>x.id===id);if(!q)return;
  const items=q.items.map(i=>{const p=DB.products.find(x=>x.id===i.productId)||{};return{productId:i.productId,name:i.name,partNo:i.partNo||'',qty:i.qty,price:Number(i.price||0),cost:Number(p.cost||0)};});
  const total=items.reduce((a,i)=>a+i.price*i.qty,0);const cost=items.reduce((a,i)=>a+i.cost*i.qty,0);
  const paid=Math.min(total,Math.max(0,Number($('#qcv_paid').value)||0));const balance=Math.max(0,total-paid);
  DB.settings.receiptSeq=(DB.settings.receiptSeq||0)+1;const pre=DB.kind==='autoparts'?'AP/':'PH/';
  const sale={id:uid('sl'),receiptNo:pre+String(DB.settings.receiptSeq).padStart(4,'0'),date:new Date().toISOString(),items,total,cost,profit:total-cost,payment:balance>0?'Credit':'Cash',customer:q.customer||'',cashier:USER.name,paid,balance,settled:balance<=0.001,payments:paid>0?[{date:new Date().toISOString(),amount:paid,method:'Cash'}]:[],fromQuote:q.quoteNo};
  items.forEach(i=>{const p=DB.products.find(x=>x.id===i.productId);if(p)p.stock=Number(p.stock||0)-i.qty;});
  DB.sales.push(sale);q.status='converted';storeLoyaltyAccrue(sale);save();closeModal();toast('Sale created from quote');
  if(DB.kind==='autoparts')auShowReceipt(sale.id);else phShowReceipt(sale.id);}
/* ---- loyalty ---- */
function storeLoyaltyAccrue(sale){const rate=Number(DB.settings.loyaltyRate||0);if(rate<=0||!sale.customer)return;
  const c=(DB.customers||[]).find(x=>(x.name||'').toLowerCase()===sale.customer.toLowerCase());if(!c)return;
  c.points=Number(c.points||0)+Math.floor(Number(sale.total||0)/rate);}

function carPick(which,inp){const files=[...inp.files];inp.value='';if(!files.length)return;toast('Adding photo(s)…');

function auCarEdit(id){const v=id?vehicle(id):null;_carEx=v?[...(v.images||[])]:[];_carIn=v?[...(v.interior||[])]:[];const ac=storeAccent();
  modal(v?'Edit car':'Add car',`<div class="grid2">

function vehicleViewer(id,pub){const v=vehicle(id);if(!v)return;_vv={id,tab:'ext',idx:0,drag:false,lastX:0,acc:0};const ac=storeAccent();const set=DB.settings;

    <div id="vvStage" style="position:relative;height:300px;background:#0d1117;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:pan-y;cursor:ew-resize;user-select:none">

  </div>`;

function vvTab(t){_vv.tab=t;_vv.idx=0;const e=$('#vvTabExt'),i=$('#vvTabInt');if(e)e.className='btn sm'+(t==='ext'?'':' sec');if(i)i.className='btn sm'+(t==='int'?'':' sec');vvRender();}
function vvImgs(){const v=vehicle(_vv.id)||{};return _vv.tab==='ext'?(v.images||[]):(v.interior||[]);}
function vvRender(){const imgs=vvImgs();const w=$('#vvImgWrap');if(!w)return;
  if(!imgs.length){w.innerHTML=`<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#7a8699;font-size:42px">${_vv.tab==='ext'?'🚗':'🪑'}</div>`;}
  else{if(_vv.idx>=imgs.length)_vv.idx=0;if(_vv.idx<0)_vv.idx=imgs.length-1;w.innerHTML=`<img src="${imgs[_vv.idx]}" style="width:100%;height:100%;object-fit:contain" draggable="false">`;}
  const h=$('#vvHint');if(h)h.textContent=imgs.length>1?((_vv.tab==='ext'?'↔ Drag to rotate · ':'')+(_vv.idx+1)+' / '+imgs.length):(imgs.length?'':'No photos');
  const t=$('#vvThumbs');if(t)t.innerHTML=imgs.map((u,i)=>`<img src="${u}" onclick="_vv.idx=${i};vvRender()" style="width:62px;height:46px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid ${i===_vv.idx?storeAccent():'transparent'}">`).join('');}
function vvStep(d){const imgs=vvImgs();if(!imgs.length)return;_vv.idx=(_vv.idx+d+imgs.length)%imgs.length;vvRender();}
function vvBind(){const st=$('#vvStage');if(!st)return;
  const move=x=>{if(!_vv.drag)return;const dx=x-_vv.lastX;_vv.lastX=x;_vv.acc+=dx;const step=20;while(Math.abs(_vv.acc)>=step){vvStep(_vv.acc>0?-1:1);_vv.acc+=(_vv.acc>0?-step:step);}};
  st.onpointerdown=e=>{_vv.drag=true;_vv.lastX=e.clientX;_vv.acc=0;try{st.setPointerCapture(e.pointerId);}catch(_){}};
  st.onpointermove=e=>move(e.clientX);
  st.onpointerup=()=>{_vv.drag=false;};st.onpointerleave=()=>{_vv.drag=false;};}

let FAM_MONTH='';
const FAM_AC='#7a4d12';
function seedFamily(code,name){return{kind:'family',
  settings:{code,familyName:name,shortName:'',address:'Nigeria',phone:'',email:'',logo:'',theme:'maroon',currency:'₦',slogan:'',status:'active',monthlyFee:0,rcptSeq:0},
  users:[{id:'u1',name:'Family Admin',username:'admin',password:'admin123',role:'admin'}],
  sections:[],members:[],payments:[],levies:[],disburse:[]};}
function ensureFamily(d){d.kind='family';d.settings=d.settings||{};const s=d.settings;
  if(!s.currency)s.currency='₦';if(!s.theme)s.theme='maroon';if(!s.status)s.status='active';if(s.monthlyFee==null)s.monthlyFee=0;if(s.rcptSeq==null)s.rcptSeq=0;
  if(!s.familyName)s.familyName=s.storeName||s.schoolName||'Family';
  ['sections','members','payments','levies','disburse'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  if(!Array.isArray(d.users)||!d.users.length)d.users=[{id:'u1',name:'Family Admin',username:'admin',password:'admin123',role:'admin'}];
  return d;}
/* ---- helpers ---- */
function famCur(){return DB.settings.currency||'₦';}
function fmoney(n){return famCur()+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-NG');}
function famSection(id){return DB.sections.find(s=>s.id===id);}
function famMember(id){return DB.members.find(m=>m.id===id);}
function famSectionMembers(sid){return DB.members.filter(m=>m.sectionId===sid).sort((a,b)=>(a.name||'').localeCompare(b.name||''));}
function famMonthPaid(memberId,period){return DB.payments.find(p=>p.kind==='monthly'&&p.memberId===memberId&&p.period===period);}
function famLevyPaid(memberId,levyId){return DB.payments.find(p=>p.kind==='levy'&&p.memberId===memberId&&p.levyId===levyId);}
function famTotalIn(){return DB.payments.reduce((a,p)=>a+Number(p.amount||0),0);}
function famTotalOut(){return DB.disburse.reduce((a,d)=>a+Number(d.amount||0),0);}
function famBalance(){return famTotalIn()-famTotalOut();}
function famSectionTotal(sid){const ids=famSectionMembers(sid).map(m=>m.id);return DB.payments.filter(p=>ids.includes(p.memberId)).reduce((a,p)=>a+Number(p.amount||0),0);}
function famMemberTotal(mid){return DB.payments.filter(p=>p.memberId===mid).reduce((a,p)=>a+Number(p.amount||0),0);}
function famMonthLabel(p){const d=new Date(p+'-01');return isNaN(d)?p:d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
function famLevyApplies(levy,member){return levy.scope==='all'||(Array.isArray(levy.sections)&&levy.sections.includes(member.sectionId));}
function famLevyMembers(levy){return DB.members.filter(m=>famLevyApplies(levy,m));}

function famRenderDues(){const p=FAM_MONTH;const fee=Number(DB.settings.monthlyFee||0);

  const expected=DB.members.length*fee;const paidN=DB.members.filter(m=>famMonthPaid(m.id,p)).length;
  const el=$('#fdArea');if(!el)return;
  el.innerHTML=`<div class="cards-row">
    ${phStat('Collected',fmoney(collected),famMonthLabel(p),FAM_AC)}
    ${phStat('Expected',fmoney(expected),DB.members.length+' members')}
    ${phStat('Outstanding',fmoney(Math.max(0,expected-collected)),'',expected-collected>0?'#c0392b':'')}
    ${phStat('Paid',paidN+'/'+DB.members.length,'members')}
  </div>
  ${DB.sections.map(s=>{const mem=famSectionMembers(s.id);if(!mem.length)return '';return `<div class="card pad mb"><h3 class="mb">${esc(s.name)} <span class="muted" style="font-size:13px">(${mem.filter(m=>famMonthPaid(m.id,p)).length}/${mem.length} paid)</span></h3>

    </tbody></table></div></div>`;}).join('')||`<div class="card"><div class="empty"><div class="big">👪</div>Add sections & members first.</div></div>`}`;}
function famPay(memberId){const m=famMember(memberId);if(!m)return;const fee=Number(DB.settings.monthlyFee||0);
  modal('Record dues — '+m.name,`<div class="grid2">
    <div class="fld"><label>Month</label><input id="fp_month" type="month" value="${FAM_MONTH||today().slice(0,7)}"></div>
    <div class="fld"><label>Amount (${famCur()})</label><input id="fp_amt" type="number" min="0" step="0.01" value="${fee}"></div>
    <div class="fld"><label>Method</label><select id="fp_method"><option>Cash</option><option>Transfer</option><option>POS / Card</option></select></div>
    <div class="fld"><label>Note</label><input id="fp_note" placeholder="optional"></div>
  </div>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:#0a7d33" onclick="famDoPay('${memberId}')">Record payment</button>`);}
function famDoPay(memberId){const m=famMember(memberId);const period=$('#fp_month').value||today().slice(0,7);const amt=Math.max(0,Number($('#fp_amt').value)||0);if(amt<=0){toast('Enter an amount',true);return;}
  const ex=famMonthPaid(memberId,period);if(ex){toast('Already recorded for '+famMonthLabel(period),true);return;}
  DB.settings.rcptSeq=(DB.settings.rcptSeq||0)+1;
  const pay={id:uid('pay'),rcptNo:'FC/'+String(DB.settings.rcptSeq).padStart(4,'0'),date:new Date().toISOString(),memberId,sectionId:m.sectionId,kind:'monthly',period,amount:amt,method:$('#fp_method').value,note:$('#fp_note').value.trim()};
  DB.payments.push(pay);save();closeModal();toast('Payment recorded · '+fmoney(amt));famShowReceipt(pay.id);if(CURRENT==='famdues')famRenderDues();}
function famUndoPay(payId){const p=DB.payments.find(x=>x.id===payId);if(!p)return;
  modal('Undo payment?',`<p>Remove this ${fmoney(p.amount)} payment record?</p>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="famDoUndo('${payId}')">Remove</button>`);}
function famDoUndo(payId){DB.payments=DB.payments.filter(x=>x.id!==payId);save();closeModal();toast('Removed');if(CURRENT==='famdues')famRenderDues();else if(CURRENT==='famlevies')vFamLevies();}
function famReceiptHTML(p){const set=DB.settings;const m=famMember(p.memberId)||{};const sec=famSection(p.sectionId)||{};const logo=set.logo?`<img src="${set.logo}" style="width:46px;height:46px;border-radius:8px;object-fit:cover">`:'<div style="font-size:34px">👪</div>';

      <div style="display:flex;justify-content:space-between"><span>Member</span><b>${esc(m.name||'')}</b></div>
      <div style="display:flex;justify-content:space-between"><span>Section</span><span>${esc(sec.name||'')}</span></div>

      <div style="display:flex;justify-content:space-between"><span>Method</span><span>${esc(p.method||'')}</span></div>

function famShowReceipt(payId){const p=DB.payments.find(x=>x.id===payId);if(!p)return;

function famExportCSV(){const rows=[['Receipt','Date','Member','Section','Type','Period/Levy','Amount','Method']];
  DB.payments.forEach(p=>{const m=famMember(p.memberId)||{};const sec=famSection(p.sectionId)||{};const lv=p.kind==='levy'?((DB.levies.find(l=>l.id===p.levyId)||{}).name||''):famMonthLabel(p.period||'');rows.push([p.rcptNo||'',(p.date||'').slice(0,10),m.name||'',sec.name||'',p.kind||'',lv,p.amount||0,p.method||'']);});
  const csv=rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(DB.settings.shortName||DB.settings.familyName||'family')+'-payments-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('CSV downloaded');}

let PA_FROM='', PA_TO='', PA_Q='';
const PA_AC='#0a7d33';
const PA_TYPES={withdrawal:{lbl:'Withdrawal (cash out)',cash:-1,bank:1},deposit:{lbl:'Deposit / Send (cash in)',cash:1,bank:-1},transfer:{lbl:'Transfer (cash in)',cash:1,bank:-1},airtime:{lbl:'Airtime / Data',cash:1,bank:-1},bills:{lbl:'Bills payment',cash:1,bank:-1}};
const PA_ADJ={addcash:{lbl:'Add cash (float in)',cash:1,bank:0},removecash:{lbl:'Remove cash (float out)',cash:-1,bank:0},fundbank:{lbl:'Move cash → bank',cash:-1,bank:1},tocash:{lbl:'Move bank → cash',cash:1,bank:-1}};
function seedPos(code,name){return{kind:'posagent',
  settings:{code,storeName:name,agentName:'',shortName:'',address:'Nigeria',phone:'',email:'',logo:'',theme:'green',currency:'₦',slogan:'',status:'active',rcptSeq:0,cash:0,bank:0},
  users:[{id:'u1',name:'POS Operator',username:'admin',password:'admin123',role:'admin'}],
  txns:[],debtors:[],expenses:[]};}
function ensurePos(d){d.kind='posagent';d.settings=d.settings||{};const s=d.settings;
  if(!s.currency)s.currency='₦';if(!s.theme)s.theme='green';if(!s.status)s.status='active';if(s.rcptSeq==null)s.rcptSeq=0;
  if(s.cash==null)s.cash=0;if(s.bank==null)s.bank=0;if(!s.storeName)s.storeName=s.familyName||'POS Business';
  ['txns','debtors','expenses'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  if(!Array.isArray(d.users)||!d.users.length)d.users=[{id:'u1',name:'POS Operator',username:'admin',password:'admin123',role:'admin'}];
  return d;}
/* helpers */
function paCur(){return DB.settings.currency||'₦';}
function pamoney(n){return paCur()+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-NG');}
function paTxnsIn(from,to){return DB.txns.filter(t=>{const d=(t.date||'').slice(0,10);return (!from||d>=from)&&(!to||d<=to);});}
function paEarnIn(from,to){return paTxnsIn(from,to).reduce((a,t)=>a+Number(t.charge||0),0);}
function paDebtTotal(){return DB.debtors.filter(d=>!d.settled).reduce((a,d)=>a+Number(d.amount||0),0);}

function paTypeLabel(t){return (PA_TYPES[t]||PA_ADJ[t]||{lbl:t}).lbl;}

/* record transaction */
function paRecord(preType){
  modal('Record transaction',`<div class="grid2">
    <div class="fld full"><label>Type</label><select id="pa_type">${Object.entries(PA_TYPES).map(([k,v])=>`<option value="${k}" ${preType===k?'selected':''}>${v.lbl}</option>`).join('')}</select></div>
    <div class="fld"><label>Amount (${paCur()}) *</label><input id="pa_amt" type="number" min="0" step="0.01" value="" autofocus></div>
    <div class="fld"><label>Charge / commission (${paCur()})</label><input id="pa_charge" type="number" min="0" step="0.01" value=""></div>
    <div class="fld"><label>Customer (optional)</label><input id="pa_cust" placeholder="name"></div>
    <div class="fld"><label>Phone (optional)</label><input id="pa_phone" placeholder="080…"></div>
    <div class="fld full"><label>Note</label><input id="pa_note" placeholder="optional"></div>
  </div>
  <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;margin-top:6px"><input type="checkbox" id="pa_credit" style="width:auto"> Customer didn't pay cash — record as debt (owed to you)</label>
  <p class="muted" style="font-size:11.5px;margin-top:6px">Withdrawal = you give cash. Deposit/Send/Airtime/Bills = customer gives you cash. Balances update automatically.</p>`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:${PA_AC}" onclick="paSaveTxn()">Record</button>`);}
function paSaveTxn(){const type=$('#pa_type').value;const amt=Math.max(0,Number($('#pa_amt').value)||0);if(amt<=0){toast('Enter an amount',true);return;}
  const charge=Math.max(0,Number($('#pa_charge').value)||0);const def=PA_TYPES[type];const credit=$('#pa_credit').checked;
  let cashD=def.cash*amt+charge;let bankD=def.bank*amt;
  if(credit){ // customer didn't hand over the cash; remove the cash leg, keep bank leg, log a debtor for amount(+charge)
    if(def.cash>0){cashD=0;} // they owe the cash they should have given
    DB.debtors.push({id:uid('db'),date:new Date().toISOString(),name:($('#pa_cust').value||'Customer').trim(),phone:$('#pa_phone').value.trim(),amount:amt+charge,reason:paTypeLabel(type),settled:false});
  }
  DB.settings.cash=Number(DB.settings.cash||0)+cashD;DB.settings.bank=Number(DB.settings.bank||0)+bankD;
  DB.settings.rcptSeq=(DB.settings.rcptSeq||0)+1;
  DB.txns.push({id:uid('tx'),rcptNo:'PA/'+String(DB.settings.rcptSeq).padStart(4,'0'),date:new Date().toISOString(),type,amount:amt,charge,customer:$('#pa_cust').value.trim(),phone:$('#pa_phone').value.trim(),note:$('#pa_note').value.trim(),credit,cashD,bankD});
  save();closeModal();toast('Recorded · earning '+pamoney(charge));if(CURRENT==='padash')vPaDash();else if(CURRENT==='palist')vPaList();}
function paAdjust(){
  modal('Adjust float / balances',`<p class="muted mb">Use when you add your own cash, move money between cash and bank, or correct a balance.</p><div class="grid2">
    <div class="fld full"><label>Action</label><select id="paj_type">${Object.entries(PA_ADJ).map(([k,v])=>`<option value="${k}">${v.lbl}</option>`).join('')}<option value="setcash">Set cash balance to…</option><option value="setbank">Set bank balance to…</option></select></div>
    <div class="fld"><label>Amount (${paCur()})</label><input id="paj_amt" type="number" step="0.01" value=""></div>
    <div class="fld"><label>Note</label><input id="paj_note"></div>
  </div>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:${PA_AC}" onclick="paSaveAdjust()">Save</button>`);}
function paSaveAdjust(){const type=$('#paj_type').value;const amt=Number($('#paj_amt').value)||0;const s=DB.settings;
  if(type==='setcash'){s.cash=amt;}else if(type==='setbank'){s.bank=amt;}
  else{if(amt<=0){toast('Enter an amount',true);return;}const def=PA_ADJ[type];const cashD=def.cash*amt,bankD=def.bank*amt;s.cash=Number(s.cash||0)+cashD;s.bank=Number(s.bank||0)+bankD;
    DB.settings.rcptSeq=(DB.settings.rcptSeq||0)+1;DB.txns.push({id:uid('tx'),rcptNo:'PA/'+String(DB.settings.rcptSeq).padStart(4,'0'),date:new Date().toISOString(),type,amount:amt,charge:0,note:$('#paj_note').value.trim(),cashD,bankD,adj:true});}
  save();closeModal();toast('Balances updated');if(CURRENT==='padash')vPaDash();else if(CURRENT==='palist')vPaList();else if(CURRENT==='pasettings')vPaSettings();}
function paUndo(id){const x=DB.txns.find(t=>t.id===id);if(!x)return;
  modal('Undo transaction?',`<p>Reverse <b>${esc(paTypeLabel(x.type))}</b> of ${pamoney(x.amount)}? Balances will be restored.</p>`,`<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="paDoUndo('${id}')">Undo</button>`);}
function paDoUndo(id){const x=DB.txns.find(t=>t.id===id);if(!x)return;DB.settings.cash=Number(DB.settings.cash||0)-Number(x.cashD||0);DB.settings.bank=Number(DB.settings.bank||0)-Number(x.bankD||0);
  DB.txns=DB.txns.filter(t=>t.id!==id);save();closeModal();toast('Reversed');if(CURRENT==='palist')vPaList();else vPaDash();}

    ${list.map(x=>`<tr><td>${esc((x.date||'').replace('T',' ').slice(0,16))}</td><td>${esc(paTypeLabel(x.type))}${x.adj?' <span class="pill grey">adj</span>':''}${x.credit?' <span class="pill gold">credit</span>':''}</td><td>${esc(x.customer||'—')}</td><td class="right">${pamoney(x.amount)}</td><td class="right" style="color:#0a7d33">${x.charge?'+'+pamoney(x.charge):'—'}</td><td class="right"><button class="btn sm sec" onclick="paUndo('${x.id}')">Undo</button></td></tr>`).join('')}

function paAddDebt(){modal('Add debt',`<div class="grid2">

function paSaveDebt(){const name=$('#pad_name').value.trim(),amt=Math.max(0,Number($('#pad_amt').value)||0);if(!name||amt<=0){toast('Name and amount required',true);return;}
