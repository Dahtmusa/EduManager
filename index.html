  $('#galArea').innerHTML=`<div class="cards-row" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${DB.gallery.slice().reverse().map(a=>{const cover=(a.media||[]).find(m=>m.type==='image');return `<div class="card" style="overflow:hidden;cursor:pointer" onclick="openAlbum('${a.id}')">
    <div style="height:140px;background:#eef2ef;display:flex;align-items:center;justify-content:center;font-size:40px">${cover?`<img src="${cover.url}" style="width:100%;height:100%;object-fit:cover">`:'🖼️'}</div>
    <div class="pad" style="padding:12px"><div class="flex" style="justify-content:space-between"><b>${esc(a.title)}</b><span class="pill grey">${(a.media||[]).length}</span></div>
      <div class="muted" style="font-size:12px">${a.date?esc(a.date):''}${a.showHome?' · <span class="pill green" style="font-size:9px">🏠 Homepage</span>':''}</div></div></div>`;}).join('')}</div>`;
}
function editAlbum(id){const a=id?DB.gallery.find(x=>x.id===id):{date:today()};const media=a.media||[];
  modal(id?'Edit activity':'Add activity',`<div class="grid2">
    <div class="fld full"><label>Title / heading *</label><input id="al_title" value="${esc(a.title||'')}" placeholder="e.g. 2026 Inter-house Sports, Graduation Day…"></div>
    <div class="fld"><label>Date</label><input id="al_date" type="date" value="${esc(a.date||today())}"></div>
    <div class="fld full"><label>Description</label><input id="al_desc" value="${esc(a.desc||'')}" placeholder="A short description of the event"></div></div>
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;color:var(--ink);margin-top:6px"><input type="checkbox" id="al_home" style="width:auto" ${a.showHome?'checked':''}> Feature this on the <b>homepage</b> (otherwise it shows only in <b>Our Gallery</b>)</label>
    <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><b style="font-size:13px">📸 Photos &amp; videos</b>
      <div class="flex gap mt" style="flex-wrap:wrap"><button type="button" class="btn sm sec" onclick="albumAddPhoto('${id||''}')">⬆ Add photo(s)</button><button type="button" class="btn sm sec" onclick="albumAddVideo('${id||''}')">🎬 Add video link</button></div>
      ${id?`<div class="cards-row mt" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${media.map((m,i)=>mediaTile(m,id,i,true)).join('')||'<p class="muted" style="font-size:12px">No media yet — add photos or a video link above.</p>'}</div>`:`<p class="muted mt" style="font-size:12px">Type a title, then tap <b>Add photo(s)</b> or <b>Add video link</b> — the activity is created and you can keep adding more.</p>`}</div>`,
    `<button class="btn sec" onclick="closeModal()">${id?'Close':'Cancel'}</button><button class="btn" onclick="saveAlbum('${id||''}')">Save</button>`,true);}
function _ensureAlbumFromForm(){const t=($('#al_title')&&$('#al_title').value.trim())||'Untitled activity';const obj={id:uid('al'),title:t,date:($('#al_date')&&$('#al_date').value)||today(),desc:($('#al_desc')&&$('#al_desc').value.trim())||'',showHome:!!($('#al_home')&&$('#al_home').checked),media:[]};DB.gallery.push(obj);save();return obj.id;}
function _pickImages(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(inp);
  inp.onchange=()=>{const files=[...inp.files];cb(files);setTimeout(()=>{try{document.body.removeChild(inp);}catch(e){}},1000);};inp.click();}
function albumAddPhoto(id){if(!id)id=_ensureAlbumFromForm();_pickImages(files=>{const a=DB.gallery.find(x=>x.id===id);if(!a)return;a.media=a.media||[];processImages(files,850,.6,d=>a.media.push({type:'image',url:d}),cnt=>{save();editAlbum(id);toast(cnt?cnt+' photo(s) added':'Could not read those images',!cnt);});});}
function albumAddVideo(id){if(!id)id=_ensureAlbumFromForm();
  modal('Add video link',`<div class="fld"><label>Video URL</label><input id="vid_url" placeholder="https://youtu.be/… or https://facebook.com/…"></div>
    <p class="muted" style="font-size:12px">Works with <b>YouTube</b>, <b>Facebook</b> and Vimeo links. Facebook videos must be <b>Public</b> to play. Paste a link (video files are too large to store).</p>`,
    `<button class="btn sec" onclick="editAlbum('${id}')">Cancel</button><button class="btn" onclick="albumSaveVideo('${id}')">Add</button>`);}
function albumSaveVideo(id){const u=$('#vid_url').value.trim();if(!u){toast('URL required',true);return;}const a=DB.gallery.find(x=>x.id===id);a.media=a.media||[];a.media.push({type:'video',url:u});save();editAlbum(id);toast('Video added');}
function saveAlbum(id){const t=$('#al_title').value.trim();if(!t){toast('Title required',true);return;}
  const obj={title:t,date:$('#al_date').value,desc:$('#al_desc').value.trim(),showHome:$('#al_home').checked};
  if(id)Object.assign(DB.gallery.find(x=>x.id===id),obj);else{obj.id=uid('al');obj.media=[];DB.gallery.push(obj);}save();closeModal();renderGallery();toast('Saved');}
function toggleAlbumHome(id){const a=DB.gallery.find(x=>x.id===id);if(!a)return;a.showHome=!a.showHome;save();openAlbum(id);toast(a.showHome?'Featured on homepage':'Removed from homepage');}
function openAlbum(id){const a=DB.gallery.find(x=>x.id===id);
  modal(a.title,`<div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div><span class="pill ${a.showHome?'green':'grey'}" style="font-size:10px">${a.showHome?'🏠 On homepage':'Gallery only'}</span> <span class="muted" style="font-size:12px">${esc(a.date||'')}</span><div class="muted" style="font-size:12.5px;margin-top:4px">${esc(a.desc||'')}</div></div>
    <div class="flex gap" style="flex-wrap:wrap"><button class="btn sm sec" onclick="addPhoto('${id}')">⬆ Add photo</button><button class="btn sm sec" onclick="addVideo('${id}')">🎬 Add video link</button><button class="btn sm ${a.showHome?'sec':'gold'}" onclick="toggleAlbumHome('${id}')">${a.showHome?'Remove from homepage':'Feature on homepage'}</button><button class="btn sm sec" onclick="editAlbum('${id}')">Edit</button><button class="btn icon" onclick="delAlbum('${id}')">🗑️</button></div></div>
    <div class="cards-row mt" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${(a.media||[]).map((m,i)=>mediaTile(m,id,i,true)).join('')||'<p class="muted">No media yet. Add photos or a video link.</p>'}</div>`,
    `<button class="btn sec" onclick="closeModal()">Close</button>`,true);}
function addPhoto(id){_pickImages(files=>{const a=DB.gallery.find(x=>x.id===id);if(!a)return;a.media=a.media||[];processImages(files,850,.6,d=>a.media.push({type:'image',url:d}),cnt=>{save();openAlbum(id);toast(cnt?cnt+' photo(s) added':'Could not read those images',!cnt);});});}
function addVideo(id){modal('Add video link',`<div class="fld"><label>Video URL</label><input id="vid_url" placeholder="https://facebook.com/… or https://youtu.be/…"></div>
  <p class="muted" style="font-size:12px">Works with <b>Facebook</b>, YouTube and Vimeo links. ⚠ Facebook videos must be set to <b>Public</b> on Facebook to play here. Paste a link rather than uploading (video files are too large to store).</p>`,
  `<button class="btn sec" onclick="openAlbum('${id}')">Cancel</button><button class="btn" onclick="saveVideo('${id}')">Add</button>`);}
function saveVideo(id){const u=$('#vid_url').value.trim();if(!u){toast('URL required',true);return;}const a=DB.gallery.find(x=>x.id===id);a.media=a.media||[];a.media.push({type:'video',url:u});save();openAlbum(id);toast('Video added');}
function delMedia(id,i){const a=DB.gallery.find(x=>x.id===id);a.media.splice(i,1);save();openAlbum(id);}
function delAlbum(id){DB.gallery=DB.gallery.filter(x=>x.id!==id);save();closeModal();renderGallery();toast('Activity removed');}

/* ===================== QUR'AN COMPETITION ===================== */
let qTab='levels',qFilterHizb='',QURAN=null;
function quranLoaded(){return Array.isArray(QURAN)&&QURAN.length>6000&&QURAN[0]&&QURAN[0].g;}
function loadQuranCache(){if(quranLoaded())return;try{const c=JSON.parse(localStorage.getItem('quran_uthmani_v2'));if(Array.isArray(c)&&c.length>6000&&c[0].g)QURAN=c;}catch(e){}}
const RECITERS=[{id:'ar.alafasy',name:'Mishary Al-Afasy',br:128},{id:'ar.husary',name:'Mahmoud Al-Husary',br:128},{id:'ar.husarymujawwad',name:'Al-Husary (Mujawwad)',br:128},{id:'ar.minshawi',name:'Al-Minshawi',br:128},{id:'ar.abdulbasitmurattal',name:'Abdul-Basit (Murattal)',br:128},{id:'ar.abdurrahmaansudais',name:'Abdur-Rahman As-Sudais',br:192},{id:'ar.mahermuaiqly',name:'Maher Al-Muaiqly',br:128},{id:'ar.shaatree',name:'Abu Bakr Ash-Shaatri',br:128}];
function curReciter(){return RECITERS.find(r=>r.id===(DB.settings.quranReciter||'ar.alafasy'))||RECITERS[0];}
function ayahAudio(g){const r=curReciter();return 'https://cdn.islamic.network/quran/audio/'+r.br+'/'+r.id+'/'+g+'.mp3';}
let _qAudio=null;
function playAyah(g){try{if(_qAudio){_qAudio.pause();}_qAudio=new Audio(ayahAudio(g));_qAudio.play().catch(()=>toast('Audio needs internet (plays offline once cached).',true));toast('▶ Playing ayah…');}catch(e){toast('Could not play audio',true);}}
function stopAyah(){if(_qAudio){_qAudio.pause();_qAudio=null;}}
async function fetchQuran(){
  toast('Downloading the Qur’an… (one-time)');
  try{const r=await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');const j=await r.json();
    if(!j||!j.data||!j.data.surahs)throw 0;
    const arr=[];j.data.surahs.forEach(su=>su.ayahs.forEach(ay=>arr.push({g:ay.number,s:su.number,sn:su.englishName,a:ay.numberInSurah,h:Math.ceil(ay.hizbQuarter/4),t:ay.text})));
    QURAN=arr;try{localStorage.setItem('quran_uthmani_v2',JSON.stringify(arr));}catch(e){toast('Loaded (too large to cache offline)',true);}
    toast('Qur’an loaded — '+arr.length+' ayat across 60 Hizb');if(qTab==='levels')qRenderLevels();else if(qTab==='compete')qRenderCompete();
  }catch(e){toast('Could not download the Qur’an. Check internet, then retry.',true);}
}
function quranDir(){return DB.settings.quranDir||'end';}
function levelHizbRange(l){const cap=l.cap;return quranDir()==='begin'?[1,cap]:[61-cap,60];}
function reciteCandidates(l){if(!quranLoaded())return [];const[lo,hi]=levelHizbRange(l);const c=[];
  for(let i=0;i<QURAN.length-1;i++){const x=QURAN[i],y=QURAN[i+1];if(x.h>=lo&&x.h<=hi&&y.s===x.s)c.push(i);}return c;}
function reciteSheet(s){const l=qLevelOf(s);if(!l||!quranLoaded())return [];const cand=reciteCandidates(l);const n=DB.settings.quranQPerStudent||5;
  const picks=[],used={};let guard=0;while(picks.length<Math.min(n,cand.length)&&guard++<n*40){const idx=cand[Math.floor(Math.random()*cand.length)];if(used[idx])continue;used[idx]=1;const x=QURAN[idx],y=QURAN[idx+1];picks.push({prompt:x,answer:y});}return picks;}
function qLevel(id){return DB.quranLevels.find(l=>l.id===id);}
function qLevelOf(s){return s.quranLevel?qLevel(s.quranLevel):null;}
function qStudents(levelId){return DB.students.filter(s=>!s.graduated&&s.quranLevel===levelId).sort((a,b)=>a.name.localeCompare(b.name));}
function qScoreKey(sid){return DB.settings.session+'|'+DB.settings.term+'|'+sid;}
function bankForLevel(l){if(!l)return [];const[lo,hi]=levelHizbRange(l);return DB.quranQuestions.filter(q=>Number(q.hizb)>=lo&&Number(q.hizb)<=hi);}
function qEligible(s){return bankForLevel(qLevelOf(s));}
function vQuran(){loadQuranCache();
  $('#view').innerHTML=`<div class="page-head"><div><h2>☪ Qur’an Competition</h2><p>${esc(DB.settings.term)}, ${esc(DB.settings.session)} — Hizb levels (1–60). All pupils participate.</p></div></div>
  <div class="subtabs">${[['levels','Levels & Pupils'],['bank','Question Bank'],['compete','Competition'],['results','Results 🏆']].map(([k,l])=>`<button class="subtab${qTab===k?' active':''}" onclick="qTab='${k}';vQuran()">${l}</button>`).join('')}</div>
  <div id="qArea"></div>`;
  ({levels:qRenderLevels,bank:qRenderBank,compete:qRenderCompete,results:qRenderResults}[qTab]||qRenderLevels)();
}
function qRenderLevels(){
  const unassigned=DB.students.filter(s=>!s.graduated&&!s.quranLevel).length;
  $('#qArea').innerHTML=`<div class="card pad mb"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><b>📖 Qur’an text:</b> ${quranLoaded()?`<span class="pill green">Loaded (${QURAN.length} ayat, 60 Hizb)</span>`:'<span class="pill amber">Not loaded</span> — load it to auto-generate recitation questions'}</div>
      <button class="btn ${quranLoaded()?'sec':''} sm" onclick="fetchQuran()">${quranLoaded()?'↻ Reload':'⬇ Load Qur’an (one-time)'}</button></div>
    <div class="flex gap mt" style="align-items:center"><label style="margin:0">Memorisation counts:</label>
      <select onchange="DB.settings.quranDir=this.value;save();qRenderLevels()" style="max-width:280px">
        <option value="end" ${quranDir()==='end'?'selected':''}>From the end — Juz’ Amma first (Hizb 60 → 1)</option>
        <option value="begin" ${quranDir()==='begin'?'selected':''}>From the beginning — Al-Baqarah first (Hizb 1 → 60)</option></select></div>
    <p class="muted mt" style="font-size:12px">A level covers its Hizb range automatically, e.g. “5 Hizb” = ${quranDir()==='end'?'Hizb 56–60':'Hizb 1–5'}.</p></div>
  <div class="cards-row">${DB.quranLevels.map(l=>{const[lo,hi]=levelHizbRange(l);return `<div class="stat"><div class="lbl">${esc(l.name)}</div><div class="num">${qStudents(l.id).length}</div><div class="meta">Hizb ${lo}–${hi}</div></div>`;}).join('')}</div>
  ${unassigned?`<div class="viewonly mb">⚠ ${unassigned} pupil(s) not yet placed in a Hizb level. Assign them below.</div>`:''}
  <div class="card pad"><div class="flex" style="justify-content:space-between"><h3>Assign pupils to levels</h3><span class="muted" style="font-size:12px">Use ⬆ to upgrade a pupil to the next level when they complete it.</span></div>
  <div class="t-wrap mt"><table><thead><tr><th>Pupil</th><th>Class</th><th>Hizb Level</th><th></th></tr></thead><tbody>
  ${DB.students.filter(s=>!s.graduated).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td class="muted">${esc(className(s.classId))}</td>
    <td><select onchange="setQLevel('${s.id}',this.value)"><option value="">— not set —</option>${DB.quranLevels.map(l=>`<option value="${l.id}" ${s.quranLevel===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></td>
    <td class="right"><button class="btn sm sec" title="Upgrade to next level" onclick="upgradeQ('${s.id}')">⬆ Upgrade</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function setQLevel(sid,lid){const s=DB.students.find(x=>x.id===sid);if(lid)s.quranLevel=lid;else delete s.quranLevel;save();}
function upgradeQ(sid){const s=DB.students.find(x=>x.id===sid);const order=DB.quranLevels;const i=order.findIndex(l=>l.id===s.quranLevel);
  if(i<0){s.quranLevel=order[0].id;}else if(i+1<order.length){s.quranLevel=order[i+1].id;}else{toast('Already at highest level',true);return;}
  save();qRenderLevels();toast(s.name.split(' ')[0]+' upgraded to '+qLevel(s.quranLevel).name);}
function qRenderBank(){
  let list=DB.quranQuestions.slice();if(qFilterHizb)list=list.filter(q=>String(q.hizb)===String(qFilterHizb));
  list.sort((a,b)=>a.hizb-b.hizb);
  $('#qArea').innerHTML=`<div class="toolbar"><button class="btn" onclick="editQuestion()">＋ Add question</button>
    <div><label>Filter by Hizb</label><select onchange="qFilterHizb=this.value;qRenderBank()"><option value="">All Hizb</option>${Array.from({length:60},(_,i)=>i+1).map(n=>`<option value="${n}" ${String(qFilterHizb)===String(n)?'selected':''}>Hizb ${n}</option>`).join('')}</select></div>
    <span class="pill grey">${DB.quranQuestions.length} question(s) total</span></div>
  ${list.length?`<div class="t-wrap"><table><thead><tr><th>Hizb</th><th>Question</th><th>Answer</th><th></th></tr></thead><tbody>
    ${list.map(q=>`<tr><td class="center"><b>${q.hizb}</b></td><td>${esc(q.text)}</td><td class="muted">${esc(q.answer||'—')}</td>
      <td class="right" style="white-space:nowrap"><button class="btn icon" onclick="editQuestion('${q.id}')">✏️</button><button class="btn icon" onclick="delQuestion('${q.id}')">🗑️</button></td></tr>`).join('')}
  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">📖</div>No questions yet. Add questions tagged by their Hizb number.</div></div>`}`;
}
function editQuestion(id){const q=id?DB.quranQuestions.find(x=>x.id===id):{hizb:qFilterHizb||1};
  modal(id?'Edit question':'Add question',`<div class="grid2">
    <div class="fld"><label>Hizb (1–60) *</label><input id="q_hizb" type="number" min="1" max="60" value="${q.hizb||1}"></div></div>
    <div class="fld"><label>Question *</label><textarea id="q_text" rows="2" placeholder="e.g. Recite the next verse after… / Which Surah contains…">${esc(q.text||'')}</textarea></div>
    <div class="fld"><label>Answer / note (for examiner, optional)</label><textarea id="q_ans" rows="2">${esc(q.answer||'')}</textarea></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveQuestion('${id||''}')">Save</button>`);}
function saveQuestion(id){const hizb=Math.max(1,Math.min(60,Number($('#q_hizb').value)||1));const text=$('#q_text').value.trim();if(!text){toast('Question required',true);return;}
  const obj={hizb,text,answer:$('#q_ans').value.trim()};if(id)Object.assign(DB.quranQuestions.find(x=>x.id===id),obj);else{obj.id=uid('q');DB.quranQuestions.push(obj);}
  save();closeModal();qRenderBank();toast('Question saved');}
function delQuestion(id){DB.quranQuestions=DB.quranQuestions.filter(x=>x.id!==id);save();qRenderBank();toast('Question removed');}
function qRenderCompete(){
  const n=DB.settings.quranQPerStudent||5;const src=DB.settings.quranSource||(quranLoaded()?'recite':'bank');
  $('#qArea').innerHTML=`<div class="card pad mb" style="max-width:640px"><div class="grid2">
      <div class="fld"><label>Questions per pupil</label><input id="q_per" type="number" min="1" value="${n}"></div>
      <div class="fld"><label>Question source</label><select id="q_src"><option value="recite" ${src==='recite'?'selected':''}>Recitation — auto from Qur’an</option><option value="bank" ${src==='bank'?'selected':''}>Typed question bank</option></select></div>
      <div class="fld full"><label>Reciter (for ▶ audio)</label><select id="q_reciter">${RECITERS.map(r=>`<option value="${r.id}" ${curReciter().id===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
        <button type="button" class="btn sec sm mt" onclick="DB.settings.quranReciter=document.getElementById('q_reciter').value;playAyah(1)">▶ Preview</button></div>
    </div><button class="btn sec sm" onclick="setQCompete()">Save</button>
    ${src==='recite'&&!quranLoaded()?'<p class="viewonly mt">⚠ Load the Qur’an text on the <b>Levels</b> tab first to use recitation questions.</p>':''}</div>
  <div class="card pad"><h3 class="mb">Generate question sheets</h3>
    <p class="muted mb">Each pupil gets <b>${n}</b> ${src==='recite'?'<b>recitation prompt(s)</b> — a verse to continue — drawn from the Hizb within their level':'question(s) from the typed bank within their level'}. The examiner answer key is included.</p>
    <div class="t-wrap"><table><thead><tr><th>Level</th><th class="center">Pupils</th><th class="center">Available</th><th></th></tr></thead><tbody>
    ${DB.quranLevels.map(l=>{const pupils=qStudents(l.id);if(!pupils.length)return '';const avail=src==='recite'?reciteCandidates(l).length:bankForLevel(l).length;return `<tr><td><b>${esc(l.name)}</b></td><td class="center">${pupils.length}</td><td class="center">${avail}</td>
      <td class="right"><button class="btn sm ${avail<1?'sec':''}" onclick="printSheets('${l.id}')">🖨 Sheets for level</button></td></tr>`;}).join('')||'<tr><td colspan=4 class="muted center">No pupils assigned to levels yet.</td></tr>'}
    </tbody></table></div>
    <p class="muted mt" style="font-size:12px">If fewer items are available than the set number, all available are used. Each sheet is freshly randomised.</p></div>`;
}
function setQCompete(){DB.settings.quranQPerStudent=Math.max(1,Number($('#q_per').value)||1);DB.settings.quranSource=$('#q_src').value;if($('#q_reciter'))DB.settings.quranReciter=$('#q_reciter').value;save();qRenderCompete();toast('Saved');}
function pickQs(s){const pool=qEligible(s).slice();const n=DB.settings.quranQPerStudent||5;for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}return pool.slice(0,n);}
function sheetHead(s,l){const logo=DB.settings.logo?`<img src="${DB.settings.logo}">`:'🎓';
  return `<div class="rc-top"><div class="rc-bism">۞ ${BISMILLAH.a} ۞</div><div class="rc-head"><div class="rc-crest">${logo}</div><div class="rc-sch"><h2>${esc(DB.settings.schoolName)}</h2><div class="addr">${addrTel()}</div></div></div></div>
    <div class="rc-title">✦ QUR’AN COMPETITION — QUESTION SHEET ✦</div>
    <div class="rc-fields" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px;padding:12px 18px 0"><div class="f"><span>Pupil</span><b>${esc(s.name)}</b></div><div class="f"><span>Level</span><b>${esc(l?l.name:'—')}</b></div><div class="f"><span>Term</span><b>${esc(DB.settings.term)}</b></div></div>`;}
function sheetHTML(s){const l=qLevelOf(s);const src=DB.settings.quranSource||(quranLoaded()?'recite':'bank');
  let body;
  if(src==='recite'){const items=reciteSheet(s);
    body=items.length?`<ol style="font-size:13px;padding-left:20px">${items.map(it=>`<li style="margin-bottom:12px">Continue the recitation from <b>(${esc(it.prompt.sn)} ${it.prompt.s}:${it.prompt.a}, Hizb ${it.prompt.h})</b>
      <button class="btn sm sec no-print" style="margin-left:6px" onclick="playAyah(${it.prompt.g})">▶ Play ayah</button>:
      <div class="ayah">${esc(it.prompt.t)}</div>
      <div class="ayah-ans">الإجابة: ${esc(it.answer.t)} <span style="font-size:11px;color:#888">(${esc(it.answer.sn)} ${it.answer.s}:${it.answer.a})</span> <button class="btn sm sec no-print" onclick="playAyah(${it.answer.g})">▶ Play answer</button></div></li>`).join('')}</ol>`
      :'<p class="muted">No recitation items available for this level. Load the Qur’an text and check the level’s Hizb range.</p>';
  }else{const qs=pickQs(s);
    body=qs.length?`<ol style="font-size:13px;padding-left:20px">${qs.map(q=>`<li style="margin-bottom:8px"><b>(Hizb ${q.hizb})</b> ${esc(q.text)}${q.answer?`<div class="muted" style="font-size:11px;border-left:2px solid var(--rgold);padding-left:8px;margin-top:3px">Answer: ${esc(q.answer)}</div>`:''}</li>`).join('')}</ol>`

function houseTotal(hid){let t=0;INSPECT_WEEKS.forEach(w=>{t+=Number(DB.houseScores[hsKey('insp','wk'+w,hid)])||0;});
  DB.houseActivities.forEach(a=>{t+=Number(DB.houseScores[hsKey('evt',a.id,hid)])||0;});return t;}
function houseRank(){return DB.houses.map(h=>({h,total:houseTotal(h.id)})).sort((a,b)=>b.total-a.total);}

  ${DB.houses.map(h=>{let tot=0;const cells=INSPECT_WEEKS.map(w=>{const k=hsKey('insp','wk'+w,h.id);const v=DB.houseScores[k];tot+=Number(v)||0;return `<td class="center"><input class="score-in" type="number" value="${v??''}" onchange="setHouseScore('insp','wk${w}','${h.id}',this.value)"></td>`;}).join('');

}
function renderEvents(){if(!DB.houses.length){$('#houseArea').innerHTML=`<div class="card"><div class="empty">Create houses first.</div></div>`;return;}

  ${DB.houses.map(h=>{let tot=0;const cells=DB.houseActivities.map(a=>{const k=hsKey('evt',a.id,h.id);const v=DB.houseScores[k];tot+=Number(v)||0;return `<td class="center"><input class="score-in" type="number" value="${v??''}" onchange="setHouseScore('evt','${a.id}','${h.id}',this.value)"></td>`;}).join('');

function setHouseScore(kind,id,hid,val){const k=hsKey(kind,id,hid);if(val==='')delete DB.houseScores[k];else DB.houseScores[k]=Number(val);save();
  (houseTab==='inspect'?renderInspect:renderEvents)();}
function addHouseActivity(){modal('Add activity',`<div class="fld"><label>Activity name *</label><input id="act_name" placeholder="e.g. March Past"></div>`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveHouseActivity()">Add</button>`);}
function saveHouseActivity(){const n=$('#act_name').value.trim();if(!n){toast('Name required',true);return;}DB.houseActivities.push({id:uid('a'),name:n});save();closeModal();vHouses();}
function delHouseActivity(id){DB.houseActivities=DB.houseActivities.filter(a=>a.id!==id);save();vHouses();}
function renderStandings(){if(!DB.houses.length){$('#houseArea').innerHTML=`<div class="card"><div class="empty">Create houses first.</div></div>`;return;}
  const rank=houseRank();const best=rank[0];const scored=rank.some(r=>r.total>0);
  const top=rank.slice(0,3);const order=[1,0,2];const heights=[110,86,66];const medals=['🥇','🥈','🥉'];const maxP=Math.max(1,top[0]?top[0].total:1);
  const podium=`<div class="podium">${order.filter(i=>top[i]).map(i=>{const r=top[i];return `<div class="col"><div class="name">${medals[i]} ${esc(r.h.name)}</div>

  $('#houseArea').innerHTML=`${scored?podium:''}
  <div class="t-wrap"><table><thead><tr><th>Pos</th><th>House</th><th class="center">Pupils</th><th class="right">Inspections</th><th class="right">Activities</th><th class="right">Total</th></tr></thead><tbody>
  ${rank.map((r,i)=>{let insp=0;INSPECT_WEEKS.forEach(w=>insp+=Number(DB.houseScores[hsKey('insp','wk'+w,r.h.id)])||0);const evt=r.total-insp;
    return `<tr${i===0&&scored?' style="background:#fdf3d7"':''}><td><b>${ord(i+1)}</b></td><td><b style="color:${esc(r.h.color)}">●</b> ${esc(r.h.name)}</td><td class="center">${houseStudents(r.h.id).length}</td><td class="right">${insp}</td><td class="right">${evt}</td><td class="right"><b>${r.total}</b></td></tr>`;}).join('')}
  </tbody></table></div>
  ${best&&scored?`<div class="card pad mt"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div>🏆 <b>Best house of the term:</b> ${esc(best.h.name)} — ${best.total} pts</div>
    <button class="btn gold" onclick="bestHouseCert()">🏅 Generate best-house certificate</button></div></div>`:'<p class="muted mt">Enter inspection & activity scores to rank houses.</p>'}`;

function houseCertHTML(){const best=houseRank()[0];if(!best||!best.total)return '';const h=best.h;const m=DB.users.find(u=>u.id===h.masterId);

/* ===================== LESSON PLANS ===================== */
let lpClass='';
function myLessonClasses(){return USER.role==='admin'?DB.classes:teacherClasses();}
function vLessons(){
  const cls=myLessonClasses();if(!lpClass||!cls.find(c=>c.id===lpClass))lpClass=cls[0]?cls[0].id:'';
  let list=DB.lessonPlans.filter(p=>p.classId===lpClass);
  if(USER.role!=='admin')list=list.filter(p=>p.teacherId===USER.id||(USER.classes||[]).includes(p.classId));
  list.sort((a,b)=>(a.week||0)-(b.week||0));
  $('#view').innerHTML=`<div class="page-head"><div><h2>📚 Lesson Plans</h2><p>${esc(DB.settings.term)}, ${esc(DB.settings.session)} — Nigerian curriculum format</p></div>
    <button class="btn" onclick="editLesson()">＋ New Lesson Plan</button></div>
  <div class="toolbar"><div><label>Class</label><select onchange="lpClass=this.value;vLessons()">${cls.map(c=>`<option value="${c.id}" ${lpClass===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
  ${list.length?`<div class="t-wrap"><table><thead><tr><th class="center">Wk</th><th>Subject</th><th>Topic</th><th>Teacher</th><th></th></tr></thead><tbody>
    ${list.map(p=>{const t=DB.users.find(u=>u.id===p.teacherId);return `<tr><td class="center"><b>${p.week||'—'}</b></td><td>${esc(p.subject)}</td><td><b>${esc(p.topic)}</b></td>
      <td>${t?esc(t.name):'<span class="muted">Unassigned</span>'}</td>
      <td class="right" style="white-space:nowrap"><button class="btn sm" onclick="viewLesson('${p.id}')">View / Print</button><button class="btn icon" onclick="editLesson('${p.id}')">✏️</button><button class="btn icon" onclick="delLesson('${p.id}')">🗑️</button></td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">📚</div>No lesson plans for this class yet.<br><button class="btn sm mt" onclick="editLesson()">Create one</button></div></div>`}`;
}
function editLesson(id){const p=id?DB.lessonPlans.find(x=>x.id===id):{classId:lpClass,week:DB.settings.currentWeek||1,duration:'40 minutes'};
  const cls=myLessonClasses();const subs=DB.subjects[p.classId||lpClass]||[];const teachers=DB.users.filter(u=>u.role==='teacher');
  modal(id?'Edit Lesson Plan':'New Lesson Plan',`
    <div class="grid2">
      <div class="fld"><label>Class *</label><select id="lp_class" onchange="lpSubjects(this.value)">${cls.map(c=>`<option value="${c.id}" ${(p.classId||lpClass)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Subject *</label><select id="lp_subject">${subs.map(su=>`<option ${p.subject===su?'selected':''}>${esc(su)}</option>`).join('')}</select></div>
      <div class="fld"><label>Week</label><input id="lp_week" type="number" value="${p.week||1}"></div>
      <div class="fld"><label>Duration</label><input id="lp_dur" value="${esc(p.duration||'40 minutes')}"></div>
      <div class="fld full"><label>Topic *</label><input id="lp_topic" value="${esc(p.topic||'')}" placeholder="e.g. Parts of the Body"></div>
      <div class="fld full"><label>Assign to teacher</label><select id="lp_teacher"><option value="">— Unassigned —</option>${teachers.map(t=>`<option value="${t.id}" ${p.teacherId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
    </div>
    <div class="flex" style="justify-content:space-between"><label>Lesson content</label><button class="btn sm purple" onclick="autogenLesson()">✨ Auto-generate draft</button></div>
    <div class="fld"><label>Behavioural objectives</label><textarea id="lp_obj" rows="3">${esc(p.objectives||'')}</textarea></div>
    <div class="grid2"><div class="fld"><label>Instructional materials</label><textarea id="lp_mat" rows="2">${esc(p.materials||'')}</textarea></div>
      <div class="fld"><label>Previous knowledge</label><textarea id="lp_prev" rows="2">${esc(p.prevKnowledge||'')}</textarea></div></div>
    <div class="fld"><label>Introduction</label><textarea id="lp_intro" rows="2">${esc(p.intro||'')}</textarea></div>
    <div class="fld"><label>Presentation (steps)</label><textarea id="lp_steps" rows="4">${esc(p.steps||'')}</textarea></div>
    <div class="grid2"><div class="fld"><label>Evaluation</label><textarea id="lp_eval" rows="3">${esc(p.evaluation||'')}</textarea></div>
      <div class="fld"><label>Summary / Conclusion</label><textarea id="lp_sum" rows="3">${esc(p.summary||'')}</textarea></div></div>
    <div class="fld"><label>Assignment</label><textarea id="lp_assign" rows="2">${esc(p.assignment||'')}</textarea></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveLesson('${id||''}')">Save lesson plan</button>`,true);}
function lpSubjects(cid){const subs=DB.subjects[cid]||[];$('#lp_subject').innerHTML=subs.map(su=>`<option>${esc(su)}</option>`).join('');}
function autogenLesson(){const topic=$('#lp_topic').value.trim()||'the topic';const subj=$('#lp_subject').value;const cls=className($('#lp_class').value);
  const T=topic;const isMath=/math|quantitative/i.test(subj);
  $('#lp_obj').value=`By the end of the lesson, pupils should be able to:\n1. explain the meaning of ${T};\n2. ${isMath?'solve simple problems involving '+T:'mention/identify examples of '+T};\n3. state the importance/use of ${T} in everyday life.`;
  $('#lp_mat').value=`Textbook, chalkboard/whiteboard, charts, flashcards and real/improvised objects related to ${T}.`;
  $('#lp_prev').value=`Pupils in ${cls} are familiar with ideas around ${T} from earlier lessons and daily experience.`;
  $('#lp_intro').value=`The teacher introduces the lesson by asking pupils questions about ${T} and relating it to their everyday life.`;
  $('#lp_steps').value=`Step 1: Teacher explains the meaning of ${T}.\nStep 2: Teacher gives examples and demonstrates using the materials.\nStep 3: Pupils participate by giving their own examples.\nStep 4: Teacher writes summary notes on the board for pupils to copy.`;
  $('#lp_eval').value=`1. What is ${T}?\n2. ${isMath?'Solve one example involving '+T:'Mention two examples of '+T}.\n3. State one importance of ${T}.`;
  $('#lp_sum').value=`The teacher summarises the key points of ${T}, corrects pupils' misconceptions and links it to the next lesson.`;
  $('#lp_assign').value=`Pupils should write three sentences about ${T}${isMath?' and solve two practice questions':' and bring one example to the next class'}.`;
  toast('Draft generated — review & edit before saving');}
function saveLesson(id){const topic=$('#lp_topic').value.trim();if(!topic){toast('Topic is required',true);return;}
  const obj={classId:$('#lp_class').value,subject:$('#lp_subject').value,week:Number($('#lp_week').value)||1,duration:$('#lp_dur').value.trim(),topic,teacherId:$('#lp_teacher').value,
    objectives:$('#lp_obj').value.trim(),materials:$('#lp_mat').value.trim(),prevKnowledge:$('#lp_prev').value.trim(),intro:$('#lp_intro').value.trim(),
    steps:$('#lp_steps').value.trim(),evaluation:$('#lp_eval').value.trim(),summary:$('#lp_sum').value.trim(),assignment:$('#lp_assign').value.trim(),term:DB.settings.term,session:DB.settings.session};
  if(id)Object.assign(DB.lessonPlans.find(x=>x.id===id),obj);else{obj.id=uid('lp');obj.createdBy=USER.name;obj.createdAt=today();DB.lessonPlans.push(obj);}
  save();closeModal();lpClass=obj.classId;vLessons();toast('Lesson plan saved');}
function delLesson(id){DB.lessonPlans=DB.lessonPlans.filter(x=>x.id!==id);save();vLessons();toast('Lesson plan removed');}
function viewLesson(id){const p=DB.lessonPlans.find(x=>x.id===id);const t=DB.users.find(u=>u.id===p.teacherId);const logo=DB.settings.logo?`<img src="${DB.settings.logo}">`:'🎓';
  const nl=s=>esc(s||'—').replace(/\n/g,'<br>');
  modal('Lesson Plan — '+p.topic,`<div class="rc" style="${themeVars()}">
    <div class="rc-top"><div class="rc-head"><div class="rc-crest">${logo}</div><div class="rc-sch"><h2>${esc(DB.settings.schoolName)}</h2><div class="addr">${addrTel()}</div></div></div></div>
    <div class="rc-title">✦ LESSON PLAN ✦</div>
    <div style="padding:14px 18px">
      <div class="rc-fields" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 14px;margin-bottom:12px">
        <div class="f"><span>Subject</span><b>${esc(p.subject)}</b></div><div class="f"><span>Class</span><b>${esc(className(p.classId))}</b></div><div class="f"><span>Week</span><b>${p.week||'—'}</b></div>
        <div class="f"><span>Topic</span><b>${esc(p.topic)}</b></div><div class="f"><span>Duration</span><b>${esc(p.duration||'—')}</b></div><div class="f"><span>Teacher</span><b>${t?esc(t.name):'—'}</b></div></div>
      ${[['Behavioural Objectives',p.objectives],['Instructional Materials',p.materials],['Previous Knowledge',p.prevKnowledge],['Introduction',p.intro],['Presentation',p.steps],['Evaluation',p.evaluation],['Summary / Conclusion',p.summary],['Assignment',p.assignment]]
        .map(([h,v])=>`<div style="margin-bottom:8px"><b style="color:var(--rg);font-size:11px;text-transform:uppercase;letter-spacing:.04em">${h}</b><div style="font-size:12.5px;margin-top:2px;border:1px solid #e7dec0;border-radius:6px;padding:7px;background:#fbfaf3">${nl(v)}</div></div>`).join('')}
      <div class="rc-sign" style="padding:8px 0 0"><div><div class="ln">Teacher's Signature</div></div><div><div class="ln">Head Teacher's Signature</div></div></div>
    </div></div>`,
    `<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print / Save PDF</button>`,true);}

  if(MODE!=='owner'&&DB&&DB.kind==='pharmacy'){renderPharmacyAuth();return;}

  if(MODE!=='owner'&&DB&&DB.kind==='family'){renderFamilyAuth();return;}

async function ownerLogin(){const u=$('#ou').value.trim(),p=$('#op').value;
  // Phase 1 owner containment: prefer Supabase Auth. The owner credential lives ONLY in Supabase Auth,
  // never in client-readable data. An email in the field routes to Auth; a legacy username uses the fallback.
  if(u.indexOf('@')>-1 && supa && supa.auth){
    try{const{data,error}=await supa.auth.signInWithPassword({email:u.toLowerCase(),password:p});
      if(!error && data && data.user){
        const role=data.user.app_metadata && data.user.app_metadata.role;
        if(role && role!=='owner'){try{await supa.auth.signOut();}catch(e){}$('#aerr').style.display='block';$('#aerr').textContent='This account is not an owner account.';return;}
        USER={name:(MASTER&&MASTER.platform&&MASTER.platform.owner&&MASTER.platform.owner.name)||'Platform Owner',role:'owner'};enterApp();return;}
    }catch(e){}
    $('#aerr').style.display='block';$('#aerr').textContent='Invalid owner credentials.';return;
  }
  // Legacy fallback — remains only until the owner password is removed from __master__ in the gated migration step.
  const o=MASTER&&MASTER.platform&&MASTER.platform.owner;const ul=u.toLowerCase();
  if(o&&o.password&&ul===String(o.username||'').toLowerCase()&&p===o.password){USER={name:o.name,role:'owner'};enterApp();}
  else{$('#aerr').style.display='block';$('#aerr').textContent='Invalid owner credentials.';}}

function doRelabelTerm(code){const d=STORE[code];const sess=($('#rl_sess').value||'').trim()||d.settings.session;
  const from=$('#rl_from').value,to=$('#rl_to').value;
  if(from===to){toast('Choose two different terms',true);return;}
  const fromPre=sess+'|'+from+'|',toPre=sess+'|'+to+'|';let moved=0;
  ['results','fees','remarks','affective','quranScores','tahfiz'].forEach(store=>{const m=d[store];if(!m||typeof m!=='object')return;
    Object.keys(m).forEach(k=>{if(k.indexOf(fromPre)===0){const nk=toPre+k.slice(fromPre.length);if(m[nk]===undefined){m[nk]=m[k];delete m[k];moved++;}}});});
  ['payments','ledger','lessonPlans'].forEach(arrName=>{const a=d[arrName];if(!Array.isArray(a))return;
    a.forEach(it=>{if(it&&it.session===sess&&it.term===from){it.term=to;moved++;}});});
  if($('#rl_setcur')&&$('#rl_setcur').checked){d.settings.term=to;const idx=TERMS.indexOf(to);if(idx>=0)d.settings.termsDone=TERMS.slice(0,idx);}
  STORE[code]=d;BASE[code]=_clone(d);saveStoreLocal();saveBase();if(code===SCHOOL_CODE)DB=STORE[code];
  if(supa){try{setSync('saving','Saving…');supa.from('school_data').upsert({id:code,data:d,updated_at:new Date().toISOString()}).then(()=>setSync('on','Synced')).catch(()=>setSync('err','Sync error'));}catch(e){}}
  toast(moved+' record(s) moved from '+from+' to '+to);manageSchool(code);}
function classReadiness(cid){const subs=DB.subjects[cid]||[],list=studentsIn(cid).filter(s=>!s.graduated);
  const useRatings=hasModule('affective');const traits=useRatings?[...affectiveList(),...psychoList()]:[];
  const perStudent=subs.length+traits.length,expected=list.length*perStudent;
  let done=0;list.forEach(s=>{const res=DB.results[rkey(s.id)]||{};
    subs.forEach(sub=>{const r=res[sub]||{};if(r.ca1!=null&&r.ca2!=null&&r.exam!=null)done++;});
    if(useRatings){const rt=(DB.affective||{})[rkey(s.id)]||{};traits.forEach(tr=>{if(rt[tr]!=null)done++;});}
  });
  return{pct:expected?Math.round(done/expected*100):0,done,expected,students:list.length,ratings:useRatings};}
function ownerBuildCards(code,classId){const d=STORE[code];if(!d)return[];const prevDB=(typeof DB!=='undefined')?DB:null;let cards=[];

  }catch(e){cards=[];}finally{DB=prevDB;}

/* ===================== SCHOOL: INSIGHTS (smart) ===================== */
function vInsights(){
  const insights=[];
  // best/worst class by average
  const classStats=DB.classes.map(c=>{const{rows}=computeClassResults(c.id);const scored=rows.filter(r=>r.count);
    const avg=scored.length?scored.reduce((a,r)=>a+r.avg,0)/scored.length:0;return{c,avg,scored:scored.length,total:rows.length};}).filter(x=>x.scored);
  if(classStats.length){const best=classStats.slice().sort((a,b)=>b.avg-a.avg)[0];const worst=classStats.slice().sort((a,b)=>a.avg-b.avg)[0];
    insights.push(`🏆 <b>${esc(best.c.name)}</b> leads with a class average of <b>${best.avg.toFixed(1)}%</b>.`);
    if(worst.c.id!==best.c.id)insights.push(`📉 <b>${esc(worst.c.name)}</b> needs support — class average <b>${worst.avg.toFixed(1)}%</b>.`);}
  // pupils needing attention across school
  let atRisk=[];DB.classes.forEach(c=>{const{rows}=computeClassResults(c.id);rows.forEach(r=>{if(r.count&&r.avg<50)atRisk.push({name:r.s.name,cls:c.name,avg:r.avg});});});
  atRisk.sort((a,b)=>a.avg-b.avg);
  // subject hotspots
  const subjAgg={};DB.classes.forEach(c=>{const{rows}=computeClassResults(c.id);rows.forEach(r=>r.marks.forEach(m=>{if(m.has){subjAgg[m.sub]=subjAgg[m.sub]||{t:0,n:0};subjAgg[m.sub].t+=m.total;subjAgg[m.sub].n++;}}));});
  const subjArr=Object.entries(subjAgg).map(([k,v])=>({sub:k,avg:v.t/v.n,n:v.n})).filter(x=>x.n>=3).sort((a,b)=>a.avg-b.avg);
  // attendance
  let p=0,tot=0;Object.keys(DB.attendance).forEach(k=>Object.values(DB.attendance[k]).forEach(v=>{tot++;if(v==='P')p++;}));
  const attRate=tot?Math.round(p/tot*100):0;
  if(attRate)insights.push(`📅 Overall attendance is <b>${attRate}%</b> across all recorded days.`);
  if(!insights.length)insights.push('Enter some results and attendance to unlock insights.');

  const totalPupils=DB.students.length;
  const summary=`Across <b>${totalPupils}</b> pupil(s)${classStats.length?` and ${classStats.length} class(es) with results`:''}, `+
    (classStats.length?`the school's overall average is <b>${(classStats.reduce((a,c)=>a+c.avg,0)/classStats.length).toFixed(1)}%</b>. `:'no results have been entered yet. ')+
    (atRisk.length?`<b>${atRisk.length}</b> pupil(s) are below 50% and may need extra support. `:(classStats.length?'No pupils are currently below 50% — strong performance overall. ':''))+
    (subjArr.length?`The weakest subject so far is <b>${esc(subjArr[0].sub)}</b> (${subjArr[0].avg.toFixed(0)}%)${subjArr.length>1?`, and the strongest is <b>${esc(subjArr[subjArr.length-1].sub)}</b> (${subjArr[subjArr.length-1].avg.toFixed(0)}%)`:''}.`:'');
  $('#view').innerHTML=`<div class="page-head"><div><h2>✨ Smart Insights</h2><p>Automatic analysis of results & attendance</p></div></div>
  <div class="card pad mb" style="border-left:4px solid var(--purple);background:var(--purple-light)"><div class="flex gap" style="align-items:flex-start"><span style="font-size:22px">🤖</span><div><b style="color:var(--purple)">AI Summary</b><div style="margin-top:4px">${summary}</div></div></div></div>
  ${insights.map(i=>`<div class="insight">${i}</div>`).join('')}
  <div class="grid2">
    <div class="card pad"><h3 class="mb">Pupils needing attention <span class="muted" style="font-size:12px">(avg below 50%)</span></h3>
      ${atRisk.length?`<div class="t-wrap"><table><thead><tr><th>Pupil</th><th>Class</th><th class="right">Avg</th></tr></thead><tbody>
        ${atRisk.slice(0,12).map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.cls)}</td><td class="right" style="color:var(--red)">${r.avg.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No at-risk pupils 🎉</p>'}</div>
    <div class="card pad"><h3 class="mb">Subjects by average</h3>
      ${subjArr.length?subjArr.slice(0,12).map(x=>`<div class="flex mb" style="gap:10px"><div style="flex:1"><div style="font-size:12.5px">${esc(x.sub)}</div>
        <div class="bar" style="width:${Math.max(4,x.avg)}%;background:${x.avg<50?'var(--red)':x.avg<60?'var(--gold)':'var(--green)'}"></div></div>
        <b style="width:48px;text-align:right">${x.avg.toFixed(0)}%</b></div>`).join(''):'<p class="muted">Not enough data yet.</p>'}</div>
  </div>`;
}

function saveStudent(id){const name=$('#f_name').value.trim();if(!name){toast('Name required',true);return;}

function renumberAdmissions(){const pfx=(DB.settings.admissionPrefix||'ADM').trim()||'ADM';const yr=((DB.settings.admissionSession||DB.settings.session||'').slice(0,4))||(''+new Date().getFullYear());

function doRenumberAdmissions(){const pfx=(DB.settings.admissionPrefix||'ADM').trim()||'ADM';const yr=((DB.settings.admissionSession||DB.settings.session||'').slice(0,4))||(''+new Date().getFullYear());let n=0;
  DB.classes.forEach(c=>{DB.students.filter(s=>!s.graduated&&s.classId===c.id).sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(s=>{n++;s.admissionNo=pfx+'/'+yr+'/'+String(n).padStart(3,'0');});});
  DB.students.filter(s=>!s.graduated&&!DB.classes.find(c=>c.id===s.classId)).forEach(s=>{n++;s.admissionNo=pfx+'/'+yr+'/'+String(n).padStart(3,'0');});

function confirmDelStudent(id){DB.students=DB.students.filter(x=>x.id!==id);

  Object.keys(DB.fees).forEach(k=>{if(k.endsWith('|'+id))delete DB.fees[k];});
  Object.keys(DB.remarks).forEach(k=>{if(k.endsWith('|'+id))delete DB.remarks[k];});
  Object.keys(DB.attendance).forEach(k=>{if(DB.attendance[k][id])delete DB.attendance[k][id];});

  <div class="subtabs">${[['all','All'],['applied','New'],['reviewing','Screening'],['approved','Admitted'],['enrolled','Enrolled'],['rejected','Not admitted']]

function saveAdmissionPortal(){const s=DB.settings;s.admissionFee=Number($('#ad_fee').value)||0;s.admissionSession=$('#ad_sess').value.trim();
  s.admissionScreening=$('#ad_scr').value.trim();s.admissionCloseDate=$('#ad_close').value;s.admissionPayUrl=$('#ad_payurl').value.trim();
  s.admissionPrefix=($('#ad_pfx').value.trim()||'ADM').toUpperCase();
  save();vAdmissions();toast('Portal settings saved');}
function renderAdm(){let list=DB.applicants.slice().reverse();if(admFilter!=='all')list=list.filter(a=>a.status===admFilter);const el=$('#admTable');
  if(!list.length){el.innerHTML=`<div class="card"><div class="empty"><div class="big">📥</div>No applications here.<br><button class="btn sm mt" onclick="editApplicant()">Add an application</button></div></div>`;return;}
  const stp={applied:['blue','New'],reviewing:['amber','Screening'],approved:['green','Admitted'],enrolled:['green','Enrolled'],rejected:['red','Not admitted']};
  el.innerHTML=`<div class="t-wrap"><table><thead><tr><th></th><th>Applicant</th><th>App&nbsp;No</th><th>Class / Section</th><th>Guardian</th><th>Fee</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(a=>{const st=stp[a.status]||['grey',a.status];return `<tr><td>${avatar(a.photo,'🧒')}</td><td><b>${esc(a.name)}</b>${a.online?' <span class="pill blue" style="font-size:9px">🌐 online</span>':''}<br><span class="muted" style="font-size:11.5px">${esc(a.gender||'')}${a.dob?' · '+esc(a.dob):''}</span></td>
    <td><span class="muted" style="font-size:11.5px;font-family:monospace">${esc(a.appNo||'—')}</span></td>
    <td>${esc(className(a.classId))}${a.section==='Boarding'?' <span class="pill amber" style="font-size:9px">Boarding</span>':''}</td><td>${esc(a.guardianName||'—')}<br><span class="muted" style="font-size:11.5px">${esc(a.guardianPhone||'')}</span></td>
    <td>${a.feePaid?'<span class="pill green" style="font-size:10px">Paid</span>':(a.feeAmount?'<span class="pill amber" style="font-size:10px">Pending</span>':'<span class="muted">—</span>')}</td><td><span class="pill ${st[0]}">${st[1]}</span></td>
    <td class="right" style="white-space:nowrap"><button class="btn sm sec" onclick="reviewApplicant('${a.id}')">Process</button><button class="btn icon" onclick="editApplicant('${a.id}')">✏️</button></td></tr>`;}).join('')}
  </tbody></table></div>`;}
function editApplicant(id){const a=id?DB.applicants.find(x=>x.id===id):{};
  modal(id?'Edit Application':'New Application',`${photoField(a.photo)}<div class="grid2">
    <div class="fld full"><label>Applicant full name *</label><input id="a_name" value="${esc(a.name||'')}"></div>
    <div class="fld"><label>Class applying for *</label><select id="a_class">${DB.classes.map(c=>`<option value="${c.id}" ${a.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>Section</label><select id="a_section"><option ${(a.section||'Day')==='Day'?'selected':''}>Day</option><option ${a.section==='Boarding'?'selected':''}>Boarding</option></select></div>
    <div class="fld"><label>Gender</label><select id="a_gender"><option ${a.gender==='Male'?'selected':''}>Male</option><option ${a.gender==='Female'?'selected':''}>Female</option></select></div>
    <div class="fld"><label>Date of birth</label><input id="a_dob" type="date" value="${esc(a.dob||'')}"></div>
    <div class="fld"><label>Date applied</label><input id="a_date" type="date" value="${esc(a.dateApplied||today())}"></div>
    <div class="fld"><label>Guardian name</label><input id="a_gname" value="${esc(a.guardianName||'')}"></div>
    <div class="fld"><label>Guardian phone</label><input id="a_gphone" value="${esc(a.guardianPhone||'')}"></div>
    <div class="fld full"><label>Address</label><input id="a_addr" value="${esc(a.address||'')}"></div>
    <div class="fld full"><label>Notes</label><textarea id="a_notes" rows="2">${esc(a.notes||'')}</textarea></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveApplicant('${id||''}')">Save</button>`);}
function saveApplicant(id){const name=$('#a_name').value.trim();if(!name){toast('Name required',true);return;}
  const obj={name,photo:_photo,classId:$('#a_class').value,section:($('#a_section')&&$('#a_section').value)||'Day',gender:$('#a_gender').value,dob:$('#a_dob').value,dateApplied:$('#a_date').value,
    guardianName:$('#a_gname').value.trim(),guardianPhone:$('#a_gphone').value.trim(),address:$('#a_addr').value.trim(),notes:$('#a_notes').value.trim()};
  if(id)Object.assign(DB.applicants.find(x=>x.id===id),obj);else{obj.id=uid('a');obj.status='applied';DB.applicants.push(obj);}
  save();closeModal();vAdmissions();toast('Application saved');}
function reviewApplicant(id){const a=DB.applicants.find(x=>x.id===id);const fee=Number(a.feeAmount)||0;
  modal('Process Application — '+a.name,`<div class="flex gap mb">${avatar(a.photo,'🧒')}<div><b>${esc(a.name)}</b>${a.appNo?` <span class="pill grey" style="font-size:10px;font-family:monospace">${esc(a.appNo)}</span>`:''}<br><span class="muted">${esc(className(a.classId))}${a.section?' · '+esc(a.section):''} · ${esc(a.gender||'')}</span></div></div>
    <div class="t-wrap mb"><table><tr><th>Guardian</th><td>${esc(a.guardianName||'—')} (${esc(a.guardianPhone||'—')})</td></tr>
    <tr><th>Address</th><td>${esc(a.address||'—')}</td></tr><tr><th>DOB</th><td>${esc(a.dob||'—')}</td></tr>${a.prevSchool?`<tr><th>Previous school</th><td>${esc(a.prevSchool)}</td></tr>`:''}
    <tr><th>Applied</th><td>${esc(a.dateApplied||'—')}${a.session?' · '+esc(a.session):''}</td></tr><tr><th>Notes</th><td>${esc(a.notes||'—')}</td></tr><tr><th>Status</th><td><b>${esc(a.status)}</b></td></tr></table></div>
    ${fee?`<div class="flex" style="justify-content:space-between;align-items:center;gap:8px;background:#fbf6e7;border:1px dashed #caa64e;border-radius:8px;padding:9px 12px;margin-bottom:10px">
      <span style="font-size:13px">Application fee ${naira(fee)} — ${a.feePaid?'<b style="color:#0b8a45">Paid ✓</b>':'<b style="color:#b26a00">not confirmed</b>'}</span>
      <button class="btn sm ${a.feePaid?'sec':'gold'}" onclick="toggleFeePaid('${id}')">${a.feePaid?'Mark unpaid':'Confirm payment'}</button></div>`:''}
    ${a.status!=='enrolled'?`<div class="fld"><label>Screening date &amp; venue for this applicant (optional — overrides the general one)</label><input id="rv_scr" value="${esc(a.screeningDate||'')}" placeholder="${esc(DB.settings.admissionScreening||'e.g. Sat 12 Sep, 9am')}"></div>`:''}
    ${a.status==='enrolled'?'<p class="pill green">Already enrolled as a pupil.</p>':''}`,
    a.status==='enrolled'?`<button class="btn sec" onclick="closeModal()">Close</button>`:`<button class="btn sec" onclick="setAppStatus('${id}','reviewing')">Invite to screening</button>
      <button class="btn danger" onclick="setAppStatus('${id}','rejected')">Not admit</button><button class="btn gold" onclick="setAppStatus('${id}','approved')">Admit</button>
      <button class="btn" onclick="enrollApplicant('${id}')">✓ Admit & Enroll</button>`);}
function toggleFeePaid(id){const a=DB.applicants.find(x=>x.id===id);a.feePaid=!a.feePaid;if(a.feePaid)a.feePaidOn=today();save();closeModal();vAdmissions();toast(a.feePaid?'Payment confirmed':'Marked unpaid');}
function setAppStatus(id,st){const a=DB.applicants.find(x=>x.id===id);a.status=st;const scr=$('#rv_scr');if(scr)a.screeningDate=scr.value.trim();save();closeModal();vAdmissions();toast('Marked '+st);}
function enrollApplicant(id){const a=DB.applicants.find(x=>x.id===id);const pfx=(DB.settings.admissionPrefix||'ADM').trim()||'ADM';const yr=((DB.settings.admissionSession||DB.settings.session||'').slice(0,4))||new Date().getFullYear();const adm=pfx+'/'+yr+'/'+String(DB.students.length+1).padStart(3,'0');
  const stu={id:uid('s'),name:a.name,photo:a.photo||'',admissionNo:adm,classId:a.classId,section:a.section||'Day',gender:a.gender,dob:a.dob,guardianName:a.guardianName,guardianPhone:a.guardianPhone,address:a.address};
  DB.students.push(stu);a.status='enrolled';a.studentId=stu.id;save();closeModal();vAdmissions();toast('Enrolled — '+adm);}

    <td style="max-width:430px"><span class="muted" style="font-size:12.5px">${(DB.subjects[c.id]||[]).map(esc).join(', ')||'—'}</span></td>
    <td class="right" style="white-space:nowrap"><button class="btn sm sec" onclick="editSubjects('${c.id}')">Subjects</button>
      <button class="btn icon" onclick="editClass('${c.id}')">✏️</button><button class="btn icon" onclick="delClass('${c.id}')">🗑️</button></td></tr>`).join('')}
  </tbody></table></div>`;}
function editClass(id){const c=id?DB.classes.find(x=>x.id===id):{};
  modal(id?'Rename Class':'Add Class',`<div class="fld"><label>Class name *</label><input id="f_cname" value="${esc(c.name||'')}" placeholder="e.g. Primary 3"></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveClass('${id||''}')">Save</button>`);}
function saveClass(id){const name=$('#f_cname').value.trim();if(!name){toast('Name required',true);return;}
  if(id)DB.classes.find(x=>x.id===id).name=name;else{const nid=uid('c');DB.classes.push({id:nid,name});DB.subjects[nid]=name.startsWith('Nursery')?[...NURSERY_SUBJECTS]:[...PRIMARY_SUBJECTS];}
  save();closeModal();vClasses();toast('Class saved');}
function delClass(id){if(studentsIn(id).length){toast('Move pupils out first',true);return;}DB.classes=DB.classes.filter(x=>x.id!==id);delete DB.subjects[id];save();vClasses();toast('Class removed');}
function editSubjects(cid){const subs=DB.subjects[cid]||[];
  modal('Subjects — '+className(cid),`<div id="subList">${subs.map(s=>subRow(s)).join('')}</div><button class="btn sec sm mt" onclick="addSubRow()">＋ Add subject</button>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveSubjects('${cid}')">Save</button>`,true);}
function subRow(v){return `<div class="flex mb" data-row><input value="${esc(v)}" placeholder="Subject name"><button class="btn icon" onclick="this.parentElement.remove()">✕</button></div>`;}
function addSubRow(){$('#subList').insertAdjacentHTML('beforeend',subRow(''));}
function saveSubjects(cid){DB.subjects[cid]=[...document.querySelectorAll('#subList [data-row] input')].map(i=>i.value.trim()).filter(Boolean);save();closeModal();vClasses();toast('Subjects updated');}

    :`<tr><td colspan=6><div class="empty"><div class="big">👩‍🏫</div>No staff yet.</div></td></tr>`}</tbody></table></div>`;}
function editTeacher(id){const u=id?DB.users.find(x=>x.id===id):{classes:[]};const sid=u.staffId||('STAFF/'+String(DB.users.filter(x=>x.role==='teacher').length+1).padStart(3,'0'));

    <div class="fld"><label>Phone number</label><input id="t_phone" value="${esc(u.phone||'')}" placeholder="080…"></div>
    <div class="fld"><label>Homepage rank (lower = higher up)</label><input id="t_rank" type="number" value="${u.rank!=null?u.rank:''}" placeholder="auto by position"></div>
    <div class="fld"><label>Staff ID</label><input id="t_sid" value="${esc(sid)}"></div>
    <div class="fld"><label>Username *</label><input id="t_user" value="${esc(u.username||'')}" placeholder="e.g. mrs.bello"></div>
    <div class="fld"><label>Password *</label><input id="t_pass" value="${esc(u.password||'')}"></div>
    <div class="fld"><label>Homepage placement</label><select id="t_group">
      <option value="leadership" ${gcur==='leadership'?'selected':''}>Leadership (Director, Asst Director, Supervisor…)</option>
      <option value="teaching" ${gcur==='teaching'?'selected':''}>Teaching staff (Meet Our Teachers)</option>
      <option value="support" ${gcur==='support'?'selected':''}>Support / Section staff</option>
      <option value="hidden" ${gcur==='hidden'?'selected':''}>Do not show on homepage</option></select></div>

    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTeacher('${id||''}')">Save</button>`);}
function saveTeacher(id){const name=$('#t_name').value.trim(),username=$('#t_user').value.trim(),password=$('#t_pass').value.trim(),staffId=$('#t_sid').value.trim();
  if(!name||!username||!password){toast('Name, username, password required',true);return;}
  if(DB.users.some(u=>u.username.toLowerCase()===username.toLowerCase()&&u.id!==id)){toast('Username taken',true);return;}
  const classes=[...document.querySelectorAll('.t_class:checked')].map(c=>c.value);const position=$('#t_pos').value.trim()||'Teacher';const rank=$('#t_rank').value!==''?Number($('#t_rank').value):null;
  const group=$('#t_group')?$('#t_group').value:'teaching';const showOnSite=group!=='hidden';
  const phone=$('#t_phone')?$('#t_phone').value.trim():'';const bio=$('#t_bio')?$('#t_bio').value.trim():'';
  if(id)Object.assign(DB.users.find(x=>x.id===id),{name,username,password,classes,staffId,photo:_photo,position,rank,group,showOnSite,phone,bio});
  else DB.users.push({id:uid('u'),name,username,password,role:'teacher',classes,staffId,photo:_photo,position,rank,group,showOnSite,phone,bio});

function delTeacher(id){DB.users=DB.users.filter(x=>x.id!==id);save();vTeachers();toast('Teacher removed');}

function openIncidentCount(){return (DB.incidents||[]).filter(i=>i.status!=='seen').length;}
function reportIncident(){const cls=teacherClasses();if(!cls.length){toast('No class assigned to you yet',true);return;}
  modal('Report an incident',`<p class="muted mb">Log a classroom incident (sickness, behaviour, injury…) for the administrator to see.</p>
    <div class="grid2"><div class="fld"><label>Class</label><select id="in_class">${cls.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Type</label><select id="in_type">${['Sickness / Health','Misbehaviour','Accident / Injury','Absence concern','Other'].map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="fld"><label>Pupil (optional)</label><select id="in_stu"><option value="">— Whole class / N.A.</option></select></div>
      <div class="fld"><label>Date</label><input id="in_date" type="date" value="${today()}"></div>
      <div class="fld full"><label>What happened? *</label><textarea id="in_desc" rows="3"></textarea></div></div>`,
    `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveIncident()">Submit to admin</button>`,true);
  const fill=()=>{const cid=$('#in_class').value;$('#in_stu').innerHTML='<option value="">— Whole class / N.A.</option>'+studentsIn(cid).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');};
  const cs=$('#in_class');if(cs){cs.onchange=fill;fill();}}
function saveIncident(){const cid=$('#in_class').value,type=$('#in_type').value,sidv=$('#in_stu').value,desc=$('#in_desc').value.trim(),date=$('#in_date').value;
  if(!desc){toast('Please describe the incident',true);return;}
  DB.incidents=DB.incidents||[];DB.incidents.push({id:uid('inc'),at:Date.now(),byId:USER.id,byName:USER.name,classId:cid,studentId:sidv||'',type,desc,date,status:'open'});
  save();closeModal();buildNav();toast('Incident reported to the administrator');if(CURRENT==='incidents')vIncidents();else if(CURRENT==='tdash')vTdash();}
function vIncidents(){const admin=USER.role==='admin';const list=(DB.incidents||[]).filter(i=>admin||i.byId===USER.id||(USER.classes||[]).includes(i.classId)).slice().reverse();
  $('#view').innerHTML=`<div class="page-head"><div><h2>🚩 Incidents</h2><p>Classroom reports${admin?' from teachers':''}</p></div><button class="btn" onclick="reportIncident()">＋ Report incident</button></div>

    ${list.map(i=>{const stu=i.studentId?(DB.students.find(x=>x.id===i.studentId)||{}).name:'';return `<tr${i.status!=='seen'?' style="background:#fff8e6"':''}><td class="muted" style="white-space:nowrap">${esc(i.date||'')}</td><td><b>${esc(i.type)}</b></td><td>${esc(className(i.classId))}${stu?'<br><span class="muted" style="font-size:11.5px">'+esc(stu)+'</span>':''}</td><td style="max-width:320px">${esc(i.desc)}</td><td class="muted">${esc(i.byName)}</td><td class="right">${admin&&i.status!=='seen'?`<button class="btn sm sec" onclick="markIncident('${i.id}')">Mark seen</button>`:(i.status==='seen'?'<span class="pill green" style="font-size:10px">Seen</span>':'')}</td></tr>`;}).join('')}

function classScoreList(cid){const list=studentsIn(cid);if(hasModule('tahfiz'))return list.map(s=>({s,score:tahTermScore(s.id).total})).filter(x=>x.score>0);

function stuAge(dob){if(!dob)return '';const d=new Date(dob);if(isNaN(d))return '';const n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return (a>=0&&a<130)?a+' yrs':'';}
function _prow(l,v){return `<tr><td style="padding:5px 9px;background:#f5f8f6;font-weight:600;width:42%">${l}</td><td style="padding:5px 9px">${v||'—'}</td></tr>`;}
function _pfHead(photo,fallback,name,sub,idline,right){return `<div style="background:linear-gradient(135deg,var(--green),var(--green-dark));margin:-20px -20px 0;padding:22px 20px;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
  <div style="width:78px;height:78px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:34px;flex:0 0 auto">${photo?`<img src="${photo}" style="width:100%;height:100%;object-fit:cover">`:fallback}</div>
  <div style="flex:1;min-width:0"><div style="font-size:21px;font-weight:800;line-height:1.15">${esc(name)}</div><div style="opacity:.92;font-size:13px;margin-top:3px">${sub}</div>${idline?`<div style="opacity:.82;font-size:11.5px;font-family:monospace;margin-top:3px">${esc(idline)}</div>`:''}</div>
  ${right||''}</div>`;}
function _pfSection(t){return `<div style="font-weight:800;color:var(--green);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;margin:18px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--green-light)">${t}</div>`;}
function _pfGrid(pairs){return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px">${pairs.filter(Boolean).map(p=>`<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">${esc(p[0])}</div><div style="font-weight:600;font-size:13.5px;color:var(--ink);word-break:break-word;margin-top:1px">${(p[1]!=null&&p[1]!=='')?p[1]:'—'}</div></div>`).join('')}</div>`;}
function _pfStat(l,v,color){return `<div style="flex:1;min-width:110px;background:#f5f8f6;border-radius:12px;padding:11px 14px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">${esc(l)}</div><div style="font-weight:800;font-size:16px;margin-top:2px${color?';color:'+color:''}">${v}</div></div>`;}
function openStudentProfile(id){const s=DB.students.find(x=>x.id===id);if(!s)return;const admin=USER.role==='admin';
  const due=studentDue(s),paid=approvedPaid(s.id),bal=due-paid;
  let pres=0,tot=0;Object.keys(DB.attendance).forEach(k=>{const cid=k.split('|')[1];if(cid===s.classId){const v=DB.attendance[k][s.id];if(v!==undefined){tot++;if(v==='P')pres++;}}});
  let acadShort='—';if(hasModule('tahfiz')){const ts=tahTermScore(s.id);acadShort=ts.total?ts.total+'/100 · '+ts.grade.g:'—';}
  else{const {rows}=computeClassResults(s.classId);const r=rows.find(x=>x.s.id===s.id);acadShort=(r&&r.count)?r.avg.toFixed(0)+'% · '+(r.pos?ord(r.pos):'—'):'—';}
  const attPct=tot?Math.round(pres/tot*100):null;
  const incs=(DB.incidents||[]).filter(i=>i.studentId===s.id).slice().reverse();
  const custom=s.custom||{};const ck=Object.keys(custom);
  const rightChip=`<div style="text-align:center;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 13px;flex:0 0 auto"><div style="font-size:9px;opacity:.85;text-transform:uppercase;letter-spacing:.04em">Balance</div><div style="font-weight:800;font-size:15px;color:${bal>0?'#ffd3ce':'#c9f7d8'}">${naira(bal)}</div></div>`;
  modal('Pupil Profile',
    _pfHead(s.photo,'👧',s.name,`${esc(className(s.classId))} · ${esc(sectionOf(s))}${s.gender?' · '+esc(s.gender):''}${stuAge(s.dob)?' · '+stuAge(s.dob):''}`,s.admissionNo||'',rightChip)
    +`<div style="padding-top:14px">`
    +`<div class="flex gap" style="flex-wrap:wrap">${_pfStat('Academic',acadShort)}${_pfStat('Attendance',attPct!=null?attPct+'%':'—')}${_pfStat('Fees paid',naira(paid),'var(--green)')}</div>`
    +_pfSection('Personal')
    +_pfGrid([['Full name',esc(s.name)],['Admission No',esc(s.admissionNo||'')],['Class',esc(className(s.classId))],['Section',sectionBadge(s)],['Gender',esc(s.gender||'')],['Date of birth',esc(s.dob||'')],['Guardian',esc(s.guardianName||'')],['Guardian phone',esc(s.guardianPhone||'')],['Address',esc(s.address||'')]])
    +_pfSection('🩺 Health &amp; emergency')
    +_pfGrid([['Emergency contact',esc(s.emName||'')+(s.emPhone?' · '+esc(s.emPhone):'')],['Blood group',esc(s.blood||'')],['Genotype',esc(s.geno||'')],['Allergies',esc(s.allergies||'')],['Medications',esc(s.meds||'')],['Health history',esc(s.health||'')],['Special / spiritual notes',esc(s.special||'')]])
    +_hifzProfileSection(s,admin)
    +(ck.length?_pfSection('📋 Other details')+_pfGrid(ck.map(k=>[k,esc(custom[k])+(admin?` <button class="btn icon" style="padding:0 5px;vertical-align:middle" onclick="delStudentDetail('${s.id}','${jq(k)}')">🗑️</button>`:'')])):'')
    +(incs.length?_pfSection('🚩 Incidents')+incs.map(i=>`<div class="ev-item" style="display:block"><b>${esc(i.type)}</b> <span class="muted" style="font-size:11px">${esc(i.date||'')}</span><div style="font-size:12.5px">${esc(i.desc)}</div></div>`).join(''):'')
    +`</div>`,
    `<button class="btn sec" onclick="closeModal()">Close</button>${admin?`<button class="btn sec" onclick="openSignPad('student','${s.id}')">✍️ Signature</button><button class="btn sec" onclick="addStudentDetail('${s.id}')">＋ Add detail</button><button class="btn" onclick="editStudent('${s.id}')">✏️ Edit</button>`:''}`,true);}
function addStudentDetail(id){modal('Add detail',`<p class="muted mb">Add any extra information to this pupil's profile.</p><div class="fld"><label>Detail label</label><input id="cd_k" placeholder="e.g. Previous school, NIN, State of origin, Hobby"></div><div class="fld"><label>Value</label><input id="cd_v"></div>`,

function saveStudentDetail(id){const k=$('#cd_k').value.trim(),v=$('#cd_v').value.trim();if(!k){toast('Enter a label',true);return;}const s=DB.students.find(x=>x.id===id);s.custom=s.custom||{};s.custom[k]=v;save();closeModal();openStudentProfile(id);toast('Detail added');}
function delStudentDetail(id,k){const s=DB.students.find(x=>x.id===id);if(s&&s.custom){delete s.custom[k];if(!Object.keys(s.custom).length)delete s.custom;save();openStudentProfile(id);}}
function openStaffProfile(id){const u=DB.users.find(x=>x.id===id);if(!u)return;const admin=USER.role==='admin';const cls=(u.classes||[]).map(cid=>className(cid)).join(', ')||'—';

    `<button class="btn sec" onclick="closeModal()">Close</button>${admin?`<button class="btn sec" onclick="openSignPad('staff','${u.id}')">✍️ Signature</button><button class="btn" onclick="editTeacher('${u.id}')">✏️ Edit</button>`:''}`,true);}

let attDate=today(),attClass='';
function vAttendance(){const cls=teacherClasses();if(!attClass||!cls.find(c=>c.id===attClass))attClass=cls[0]?cls[0].id:'';
  $('#view').innerHTML=`<div class="page-head"><div><h2>Attendance</h2><p>Daily register</p></div></div>
  <div class="toolbar"><div><label>Date</label><input type="date" value="${attDate}" onchange="attDate=this.value;renderAtt()"></div>
    <div><label>Class</label><select onchange="attClass=this.value;renderAtt()">${cls.map(c=>`<option value="${c.id}" ${attClass===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div><button class="btn sec sm" onclick="markAll('P')">Mark all present</button></div></div><div id="attTable"></div>`;renderAtt();}
function renderAtt(){if(!attClass){$('#attTable').innerHTML=`<div class="card"><div class="empty">No class assigned.</div></div>`;return;}
  const list=studentsIn(attClass),key=attDate+'|'+attClass,rec=DB.attendance[key]||{};
  if(!list.length){$('#attTable').innerHTML=`<div class="card"><div class="empty"><div class="big">📅</div>No pupils in ${esc(className(attClass))}.</div></div>`;return;}
  const c={P:0,A:0,L:0};list.forEach(s=>{const v=rec[s.id];if(v)c[v]++;});
  $('#attTable').innerHTML=`<div class="cards-row" style="margin-bottom:16px">
    <div class="stat"><div class="lbl">Present</div><div class="num" style="color:var(--green)">${c.P}</div></div>
    <div class="stat"><div class="lbl">Absent</div><div class="num" style="color:var(--red)">${c.A}</div></div>
    <div class="stat"><div class="lbl">Late</div><div class="num" style="color:var(--amber)">${c.L}</div></div>
    <div class="stat"><div class="lbl">Total</div><div class="num">${list.length}</div></div></div>
  <div class="t-wrap"><table><thead><tr><th></th><th>Adm. No</th><th>Name</th><th class="center">Status</th></tr></thead><tbody>
  ${list.map(s=>{const v=rec[s.id]||'';return `<tr><td>${avatar(s.photo,'👧')}</td><td class="muted">${esc(s.admissionNo||'—')}</td><td><b>${esc(s.name)}</b></td>
    <td class="center"><div class="flex gap" style="justify-content:center">${['P','A','L'].map(st=>{const lbl={P:'Present',A:'Absent',L:'Late'}[st],col={P:'green',A:'danger',L:'gold'}[st];return `<button class="btn sm ${v===st?col:'sec'}" onclick="setAtt('${s.id}','${st}')">${lbl}</button>`;}).join('')}</div></td></tr>`;}).join('')}
  </tbody></table></div>`;}
function setAtt(sid,st){const key=attDate+'|'+attClass;if(!DB.attendance[key])DB.attendance[key]={};if(DB.attendance[key][sid]===st)delete DB.attendance[key][sid];else DB.attendance[key][sid]=st;save();renderAtt();}
function markAll(st){const key=attDate+'|'+attClass;DB.attendance[key]=DB.attendance[key]||{};studentsIn(attClass).forEach(s=>DB.attendance[key][s.id]=st);save();renderAtt();toast('All marked present');}

function setSurah(sid,field){const el=$('#'+field+'_'+sid);if(!el)return;const v=el.value;setTah(sid,field,v,true);
  const ayField=field==='ss'?'as':'ac';const aEl=$('#'+ayField+'_'+sid);if(aEl){aEl.innerHTML=ayahOpts(surahCount(v),'');}

function setTah(sid,field,val,quiet){if(!tahEditable(tahClass))return;const k=tKey(sid);DB.tahfiz[k]=DB.tahfiz[k]||{};val=(val==null?'':(''+val).trim());
  if(field==='mark'&&val!==''){const n=Math.max(0,Math.min(tahMonthMax(),Number(val)||0));val=''+n;const el=$('#mk_'+sid);if(el)el.value=n;}
  if(field==='pg'&&val!==''){const n=Math.max(0,Number(val)||0);val=''+n;const el=$('#pg_'+sid);if(el)el.value=n;}
  if(val==='')delete DB.tahfiz[k][field];else DB.tahfiz[k][field]=val;
  if(!tahHasData(DB.tahfiz[k])&&!DB.tahfiz[k].status)delete DB.tahfiz[k];
  saveStoreLocal();tahDirty[tahClass]=true;renderTahSaveBar();}
async function tahCommit(cid,mutate,msg){
  if(!navigator.onLine){toast('⚠ No internet — not saved. Connect and try again.',true);return;}
  if(!supa){toast('⚠ Cloud not connected — not saved.',true);return;}
  const btn=$('#saveTahBtn');if(btn){btn.disabled=true;btn.textContent='Saving…';}setSync('saving','Saving…');
  try{const sess=DB.settings.session,term=DB.settings.term,list=studentsIn(cid);mutate(list,sess,term);
    const{data,error}=await supa.from('school_data').select('data').eq('id',SCHOOL_CODE).maybeSingle();if(error)throw error;
    const server=(data&&data.data&&typeof data.data==='object')?data.data:_clone(DB);server.tahfiz=server.tahfiz||{};server.tahEvalOpen=server.tahEvalOpen||{};
    list.forEach(s=>{const k=sess+'|'+term+'|'+tahMonth+'|'+s.id;if(DB.tahfiz[k]!==undefined)server.tahfiz[k]=DB.tahfiz[k];else delete server.tahfiz[k];});
    server.tahEvalOpen[tahMonthKey()]=DB.tahEvalOpen[tahMonthKey()];
    const{error:e2}=await supa.from('school_data').upsert({id:SCHOOL_CODE,data:server,updated_at:new Date().toISOString()});if(e2)throw e2;
    Object.keys(DB.tahfiz||{}).forEach(k=>{if(server.tahfiz[k]===undefined)server.tahfiz[k]=DB.tahfiz[k];});
    DB=server;STORE[SCHOOL_CODE]=server;BASE[SCHOOL_CODE]=_clone(server);saveStoreLocal();saveBase();
    delete tahDirty[cid];setSync('on','Synced');toast(msg);renderTah();
  }catch(e){console.warn('tahCommit',e);setSync('err','Sync error');toast('⚠ Not saved — check your internet and try again',true);const b=$('#saveTahBtn');if(b){b.disabled=false;b.textContent='💾 Save & submit for review';}}}
function saveTahSubmit(){const bad=tahIncomplete(tahClass);if(bad.length){toast('Please complete all pupils first: '+bad.slice(0,4).join(', ')+(bad.length>4?' +'+(bad.length-4)+' more':''),true);return;}
  tahCommit(tahClass,(list,sess,term)=>{list.forEach(s=>{const k=sess+'|'+term+'|'+tahMonth+'|'+s.id;const e=DB.tahfiz[k];if(e&&tahHasData(e)){e.status='submitted';e.by=USER.name;}});},'✓ Submitted for the administrator’s review');}
function tahApprove(){tahCommit(tahClass,(list,sess,term)=>{list.forEach(s=>{const e=DB.tahfiz[sess+'|'+term+'|'+tahMonth+'|'+s.id];if(e&&e.status)e.status='approved';});},'✓ Approved — now on report cards');}
function tahReturn(){if(!confirm('Return this month to the teacher for editing?'))return;tahCommit(tahClass,(list,sess,term)=>{list.forEach(s=>{const e=DB.tahfiz[sess+'|'+term+'|'+tahMonth+'|'+s.id];if(e)delete e.status;});},'Returned to teacher for edits');}

function tahMarksSetup(){modal('Marks setup',`<p class="muted mb">Set the maximum marks. Default: each month is out of 30 (3 months = 90) and attendance &amp; conduct is out of 10, giving 100 for the term.</p>

function saveTahMarks(){DB.settings.tahMonthMax=Number($('#ms_mm').value)||30;DB.settings.tahAttMax=Number($('#ms_att').value)||10;save();closeModal();if(CURRENT==='tahfiz')vTahfiz();toast('Marks setup saved');}

function tahTermMonths(cid,sess,term){sess=sess||DB.settings.session;term=term||DB.settings.term;const ids={};studentsIn(cid).forEach(s=>ids[s.id]=1);const set={};
  Object.keys(DB.tahfiz||{}).forEach(k=>{const p=k.split('|');if(p.length!==4||p[0]!==sess||p[1]!==term||!ids[p[3]])return;const e=DB.tahfiz[k];if(e.status!=='approved')return;set[p[2]]=1;});
  return Object.keys(set).sort();}
function tahMarkFor(sid,month,sess,term){const e=(DB.tahfiz||{})[(sess||DB.settings.session)+'|'+(term||DB.settings.term)+'|'+month+'|'+sid];return (e&&e.status==='approved')?(Number(e.mark)||0):null;}

  el.innerHTML=`<div class="card no-print" style="background:#fff8e6;border:1px solid #f0d089;border-left:4px solid #caa64e;padding:10px 14px;margin-bottom:12px;font-size:13px">📌 Term total = the approved monthly scores (each /${mm}, up to ${tahMemMax()}) + attendance &amp; conduct (max ${attMax}) = 100. Monthly scores appear here once the administrator <b>approves</b> that month. Other-subject percentages are for the report only and do <b>not</b> affect the 100.</div>

    <thead><tr style="background:#f3f7f4;text-align:left"><th class="center" style="padding:8px 6px">#</th><th style="padding:8px 6px">Pupil / Adm No</th>${monthHead}<th class="center" style="padding:8px 6px">Attend.<br><span class="muted" style="font-weight:400">/ ${attMax}</span></th>${subs.map(n=>`<th class="center" style="padding:8px 6px">${esc(n)}<br><span class="muted" style="font-weight:400">%</span></th>`).join('')}<th style="padding:8px 6px">Final remark</th><th class="center" style="padding:8px 6px">Total<br><span class="muted" style="font-weight:400">/ 100</span></th><th class="center" style="padding:8px 6px">Grade</th></tr></thead>

  if(field==='att'){if(val==='')delete DB.tahTerm[k].att;else DB.tahTerm[k].att=Math.max(0,Math.min(tahAttMax(),Number(val)||0));}

function setTahSubject(sid,name,val){const k=tahTermKey(sid);DB.tahTerm=DB.tahTerm||{};DB.tahTerm[k]=DB.tahTerm[k]||{};DB.tahTerm[k].subjects=DB.tahTerm[k].subjects||{};

function userName(id){const u=(DB.users||[]).find(x=>x.id===id);return u?u.name:'';}
function fmtWhen(ts){if(!ts)return '';const d=new Date(ts);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function msgLastAct(m){let t=m.at||0,by=m.fromId;(m.thread||[]).forEach(x=>{if((x.at||0)>=t){t=x.at;by=x.byId;}});return{t,by};}
function msgRelevant(m){if(USER.role==='admin')return true;const u=USER.id;return m.scope==='all'||m.scope==='teacher'||m.scope===u||m.fromId===u||(m.thread||[]).some(x=>x.byId===u);}
function unreadMsgCount(){try{if(!DB||!Array.isArray(DB.messages)||!USER)return '';const u=USER.id;let n=0;DB.messages.forEach(m=>{if(!msgRelevant(m))return;const la=msgLastAct(m);if(la.by!==u&&la.t>((m.readBy&&m.readBy[u])||0))n++;});return n||'';}catch(e){return '';}}

  <div id="msgList">${list.length?list.map(m=>{const la=msgLastAct(m);const unread=la.by!==u&&la.t>((m.readBy&&m.readBy[u])||0);
    const to=m.scope==='all'?'All staff':m.scope==='teacher'?'All teachers':(userName(m.scope)||'a teacher');

      <div style="font-size:13px;margin-top:4px;color:#444">${esc((m.body||'').slice(0,140))}${(m.body||'').length>140?'…':''}</div></div>`;}).join('')

function composeMsg(){const teachers=(DB.users||[]).filter(u=>u.role==='teacher');
  modal('New message',`<div class="fld"><label>To</label><select id="cm_to"><option value="teacher">All teachers</option>${teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>

function autoRemark(avg,subs){if(!subs||!subs.some(m=>m.has))return'No results entered yet.';
  const scored=subs.filter(m=>m.has);const best=scored.slice().sort((a,b)=>b.total-a.total)[0];const worst=scored.slice().sort((a,b)=>a.total-b.total)[0];
  let base=avg>=70?'An excellent result.':avg>=60?'A very good performance.':avg>=50?'A good effort.':avg>=40?'A fair result; more effort needed.':'Needs serious improvement.';
  let tip='';if(best)tip+=` Strongest in ${best.sub}.`;if(worst&&worst.total<50&&worst.sub!==best.sub)tip+=` Should improve in ${worst.sub}.`;return base+tip;}
function autoHead(a){if(a>=70)return'Outstanding. A model pupil.';if(a>=50)return'Good progress. Well done.';if(a>=40)return'Can do better with more focus.';return'Requires close attention and support.';}

    `<button class="btn sec" onclick="openReport('${sid}')">Back</button><button class="btn" onclick="saveRemarks('${sid}')">Save & view</button>`);}
function aiRemark(sid,which){const s=DB.students.find(x=>x.id===sid);const {rows}=computeClassResults(s.classId);const row=rows.find(r=>r.s.id===sid);
  const first=(s.name||'').split(/\s+/).slice(-1)[0]||'The pupil';
  if(which==='t'){$('#rm_t').value=first+' — '+autoRemark(row.avg,row.marks);}else{$('#rm_h').value=autoHead(row.avg);}
  toast('AI remark generated — edit if you like');}
function saveRemarks(sid){DB.remarks[rkey(sid)]={teacher:$('#rm_t').value.trim(),head:$('#rm_h').value.trim()};save();toast('Remarks saved');openReport(sid);}
