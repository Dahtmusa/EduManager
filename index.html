    <div class="fld full" style="margin-top:-6px"><span class="muted" style="font-size:12px">Login link: <b>${esc(location.origin)}/</b><b>${esc((code||'').toLowerCase())}</b></span></div>
    <div class="fld full"><label>Address</label><input id="ep_addr" value="${esc(d?(d.settings.address||''):'')}"></div>
    <div class="fld"><label>Phone *</label><input id="ep_phone" value="${esc(d?(d.settings.phone||''):'')}"></div>
    <div class="fld"><label>Currency symbol</label><input id="ep_cur" value="${esc(d?(d.settings.currency||'₦'):'₦')}" style="max-width:90px"></div>
  </div>
  <hr><label>Subscription (your flat fee)</label><div class="grid2">
    <div class="fld"><label>Monthly fee (₦)</label><input id="ep_subfee" type="number" min="0" value="${sub.fee||0}"></div>
    <div class="fld"><label>Next due date</label><input id="ep_due" type="date" value="${esc(sub.due||'')}"></div>
  </div>
  ${code?'':`<hr><label>Operator login</label><div class="grid2">
    <div class="fld"><label>Name</label><input id="ep_aname" value="POS Operator"></div>
    <div class="fld"><label>Username *</label><input id="ep_auser" value="admin"></div>
    <div class="fld full"><label>Password *</label><input id="ep_apass" value="admin123"></div></div>`}
  <div class="fld"><label>Status</label><select id="ep_status"><option value="active" ${reg&&reg.status!=='suspended'?'selected':''}>Active</option><option value="suspended" ${reg&&reg.status==='suspended'?'selected':''}>Suspended</option></select></div>`,
  `<button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" style="background:${PA_AC}" onclick="savePos('${code||''}')">${code?'Save changes':'Create agent'}</button>`,true);}
function savePos(code){const name=$('#ep_name').value.trim(),addr=$('#ep_addr').value.trim(),phone=$('#ep_phone').value.trim();
  if(!name){toast('Name required',true);return;}if(!phone||phone.replace(/\D/g,'').length<7){toast('Valid phone required',true);return;}
  const fee=Math.max(0,Number($('#ep_subfee').value)||0),due=$('#ep_due').value,cur=$('#ep_cur').value.trim()||'₦',status=$('#ep_status').value;
  if(code){const reg=MASTER.schools.find(s=>s.code===code);reg.name=name;reg.status=status;reg.sub=Object.assign(reg.sub||{},{fee,due});
    const d=STORE[code];Object.assign(d.settings,{storeName:name,shortName:$('#ep_short').value.trim(),address:addr,phone,currency:cur,status});
    saveMaster();saveSchoolRow(code);closeModal();toast('Agent updated');managePos(code);return;}
  const newCode=$('#ep_code').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').replace(/^-+|-+$/g,'');
  if(!newCode){toast('Code required',true);return;}if(MASTER.schools.some(s=>s.code===newCode)){toast('Code already exists',true);return;}
  const auser=$('#ep_auser').value.trim(),apass=$('#ep_apass').value.trim();if(!auser||!apass){toast('Operator login required',true);return;}
  const d=seedPos(newCode,name);Object.assign(d.settings,{shortName:$('#ep_short').value.trim(),address:addr,phone,currency:cur,status});
  d.users[0].name=$('#ep_aname').value.trim()||'POS Operator';d.users[0].username=auser;d.users[0].password=apass;
  STORE[newCode]=d;MASTER.schools.push({code:newCode,name,type:'posagent',status,createdAt:today(),sub:{fee,due,lastPaid:'',history:[]}});
  saveStoreLocal();saveMaster();saveSchoolRow(newCode);closeModal();toast('POS agent created');managePos(newCode);}
function managePos(code){const reg=MASTER.schools.find(s=>s.code===code);const d=STORE[code];if(!d){toast('Data not loaded',true);return;}
  const sub=reg.sub||(reg.sub={fee:0,due:'',lastPaid:'',history:[]});const si=phSubInfo(reg);
  modal('Manage — '+reg.name,`
    <div class="cards-row" style="margin-bottom:14px">
      <div class="stat"><div class="lbl">Transactions</div><div class="num">${(d.txns||[]).length}</div></div>
      <div class="stat"><div class="lbl">Cash + Bank</div><div class="num" style="font-size:17px">${'₦'+((Number(d.settings.cash||0)+Number(d.settings.bank||0))).toLocaleString('en-NG')}</div></div>
      <div class="stat"><div class="lbl">Subscription</div><div class="num" style="font-size:16px"><span class="pill ${si.cls}">${si.txt}</span></div></div>
    </div>
    <label>Login link (give to the operator)</label>
    <div class="linkbox mb"><code>${esc(schoolLink(code))}</code><button class="btn sm sec" onclick="copyText('${jq(schoolLink(code))}')">Copy</button></div>
    <label>Logins (passwords visible — reset any)</label>
    <div class="t-wrap" style="margin-bottom:6px"><table><tbody>
      ${d.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="muted" style="font-size:11px">POS Operator</span></td><td>${esc(u.username)}</td><td><span style="font-family:monospace;background:#f3f6f2;padding:1px 6px;border-radius:5px">${esc(u.password)}</span></td>
        <td class="right"><button class="btn sm sec" onclick="resetCred('${code}','${u.id}')">🔑 Reset</button></td></tr>`).join('')}
    </tbody></table></div>
    <hr><label>Subscription billing</label>
    <div class="card pad" style="background:#f7faf8"><div class="grid2">
      <div class="fld"><label>Monthly fee (₦)</label><input id="mp_fee" type="number" min="0" value="${sub.fee||0}"></div>
      <div class="fld"><label>Next due date</label><input id="mp_due" type="date" value="${esc(sub.due||'')}"></div>
    </div>
    <div class="flex gap"><button class="btn sm sec" onclick="posOwnerSaveSub('${code}')">Save</button>
      <button class="btn sm" style="background:#0a7d33" onclick="posOwnerMarkPaid('${code}')">✓ Mark paid (extend 1 month)</button></div>
    ${(sub.history&&sub.history.length)?`<div class="muted mt" style="font-size:12px">Last payments: ${sub.history.slice(-4).reverse().map(h=>esc(h.date)+' '+pmoneyOwner(h.amount)).join(' · ')}</div>`:''}
    </div>`,
    `<button class="btn sec" onclick="closeModal()">Close</button>
     <button class="btn ${reg.status==='suspended'?'':'sec'}" onclick="togglePos('${code}')">${reg.status==='suspended'?'Re-activate':'Suspend'}</button>
     <button class="btn sec" onclick="editPos('${code}')">Edit details</button>
     ${backupToggleBtn(code)}
     <button class="btn sec" onclick="downloadBackup('${code}')">⬇ Backup</button>
     <button class="btn sec" onclick="restoreBackupModal('${code}')">🛟 Restore</button>
     <button class="btn danger" onclick="delPos('${code}')">Delete</button>`,true);}
function posOwnerSaveSub(code){const reg=MASTER.schools.find(s=>s.code===code);reg.sub=reg.sub||{};reg.sub.fee=Math.max(0,Number($('#mp_fee').value)||0);reg.sub.due=$('#mp_due').value;saveMaster();toast('Subscription saved');managePos(code);}
function posOwnerMarkPaid(code){const reg=MASTER.schools.find(s=>s.code===code);const sub=reg.sub=reg.sub||{fee:0,history:[]};
  const base=sub.due&&sub.due>today()?new Date(sub.due):new Date(today());base.setMonth(base.getMonth()+1);
  sub.due=base.toISOString().slice(0,10);sub.lastPaid=today();sub.history=sub.history||[];sub.history.push({date:today(),amount:sub.fee||0});
  if(reg.status==='suspended'){reg.status='active';if(STORE[code])STORE[code].settings.status='active';saveSchoolRow(code);}
  saveMaster();toast('Payment recorded · next due '+sub.due);managePos(code);}
function togglePos(code){const reg=MASTER.schools.find(s=>s.code===code);reg.status=reg.status==='suspended'?'active':'suspended';
  if(STORE[code])STORE[code].settings.status=reg.status;saveMaster();saveSchoolRow(code);toast('Agent '+reg.status);managePos(code);}
function delPos(code){modal('Delete POS agent?',`<p>Permanently delete <b>${esc(MASTER.schools.find(s=>s.code===code).name)}</b> and all its records? This cannot be undone.</p>`,
  `<button class="btn sec" onclick="managePos('${code}')">Cancel</button><button class="btn danger" onclick="confirmDelPos('${code}')">Delete</button>`);}
async function confirmDelPos(code){MASTER.schools=MASTER.schools.filter(s=>s.code!==code);delete STORE[code];saveStoreLocal();saveMaster();
  if(supa){try{await supa.from('school_data').delete().eq('id',code);}catch(e){}}closeModal();toast('Agent deleted');vPosAgents();}

/* ===================== PWA: offline + auto-update + install ===================== */
function setManifest(){try{
  const nm=(MODE==='owner')?((MASTER&&MASTER.platform&&MASTER.platform.name)||'EduManager'):((DB&&DB.settings&&DB.settings.schoolName)||'EduManager Cloud');
  const icons=[{src:'/icon.svg',sizes:'any',type:'image/svg+xml',purpose:'any maskable'}];
  if(DB&&DB.settings&&DB.settings.logo){const lg=DB.settings.logo;icons.unshift({src:lg,sizes:'512x512',type:lg.indexOf('image/png')>0?'image/png':(lg.indexOf('svg')>0?'image/svg+xml':'image/jpeg'),purpose:'any'});}
  const m={name:nm,short_name:nm.slice(0,18),start_url:location.pathname,scope:'/',display:'standalone',orientation:'portrait',background_color:'#0a7d33',theme_color:'#0a7d33',icons};
  const url=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  const link=document.getElementById('manifestLink');if(link){if(link._u)URL.revokeObjectURL(link._u);link.href=url;link._u=url;}
  document.title=nm;const ti=document.getElementById('touchIcon');if(ti&&DB&&DB.settings&&DB.settings.logo)ti.href=DB.settings.logo;
}catch(e){}}
// install prompt
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-flex';});
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.style.display='none';deferredPrompt=null;toast('App installed');});
function doInstall(){if(!deferredPrompt){toast('On iPhone: tap Share → Add to Home Screen',true);return;}deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none';});}
// service worker (offline + update)
if('serviceWorker' in navigator){window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller){const ub=document.getElementById('updateBar');if(ub)ub.style.display='flex';}
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){const ub=document.getElementById('updateBar');if(ub)ub.style.display='flex';}});});
  }).catch(()=>{});
});}
</script>
</body>
