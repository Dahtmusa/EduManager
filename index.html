<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}

.btn{background:var(--green);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(.93)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:#f7faf8}
.btn.danger{background:var(--red)}.btn.gold{background:var(--gold);color:#3a2c00}
.btn.blue{background:var(--blue)}.btn.purple{background:var(--purple)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn.icon{padding:5px 8px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.icon:hover{border-color:var(--green);color:var(--green)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill.green{background:var(--green-light);color:var(--green-dark)}.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:#fdf3d7;color:var(--amber)}.pill.blue{background:#e3eefb;color:var(--blue)}
.pill.purple{background:var(--purple-light);color:var(--purple)}.pill.grey{background:#eef2ef;color:var(--muted)}

#screen{min-height:100vh}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth.owner{background:linear-gradient(135deg,#3a2461,#6b3fa0)}
.auth.school{background:linear-gradient(135deg,var(--green),var(--green-dark))}
.auth.check{background:linear-gradient(135deg,#0f3d6e,#1e5fa8)}
.acard{background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:410px;padding:32px 30px;text-align:center}
.acard .crest{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px}
.crest.g{background:var(--green-light)}.crest.p{background:var(--purple-light)}.crest.b{background:#e3eefb}
.acard h1{font-size:20px;margin-bottom:3px}.acard .sub{color:var(--muted);font-size:13px;margin-bottom:22px}

.swlink{margin-top:16px;font-size:13px}.swlink a{color:var(--green);font-weight:600;cursor:pointer}

#app{display:none;min-height:100vh}
.topbar{color:#fff;padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;background:var(--green)}

.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.topbar .brand .logo{width:32px;height:32px;background:rgba(255,255,255,.18);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.topbar .right{display:flex;align-items:center;gap:12px;font-size:13px}

.sync-chip .d{width:8px;height:8px;border-radius:50%;background:#9ad6ad}
.sync-chip.saving .d{background:var(--gold)}.sync-chip.off .d{background:#cbd5d0}.sync-chip.err .d{background:#ff9b8e}
.topbar .who{text-align:right;line-height:1.25}.topbar .who b{display:block}.topbar .who span{font-size:11.5px;opacity:.85}
.layout{display:flex}

.nav-item:hover{background:var(--green-light)}.nav-item.active{background:var(--green);color:#fff}
.nav-item.owner.active{background:var(--purple)}.nav-item.owner:hover{background:var(--purple-light)}
.nav-item .ic{font-size:17px;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:20px;padding:0 7px;font-weight:700}
.main{flex:1;padding:24px 28px;max-width:1200px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-head h2{font-size:22px}.page-head p{color:var(--muted);font-size:13.5px;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card.pad{padding:18px}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .num{font-size:28px;font-weight:800;margin-top:4px;line-height:1}.stat .meta{font-size:12px;color:var(--muted);margin-top:6px}
.stat.accent{background:var(--green);color:#fff;border-color:var(--green)}.stat.accent.purple{background:var(--purple);border-color:var(--purple)}
.stat.accent .lbl,.stat.accent .meta{color:rgba(255,255,255,.85)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:11px 12px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:none}

.t-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}.toolbar .grow{flex:1;min-width:160px}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}.empty .big{font-size:40px;margin-bottom:8px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--green-light);display:inline-flex;align-items:center;justify-content:center;font-size:15px;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .15s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal.lg{max-width:820px}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:17px}.modal-body{padding:20px;max-height:74vh;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2 .full{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.fld{margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:32px}.toast.err{background:var(--red)}
.subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.subtab{padding:7px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted)}
.subtab.active{background:var(--green);color:#fff;border-color:var(--green)}
.score-in{width:56px;padding:6px;text-align:center}
.muted{color:var(--muted)}.right{text-align:right}.center{text-align:center}.flex{display:flex;align-items:center;gap:8px}.gap{gap:8px}
.mt{margin-top:14px}.mb{margin-bottom:14px}hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-prev{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px}
#camWrap video{width:100%;border-radius:10px;background:#000}
.linkbox{display:flex;gap:8px;align-items:center;background:#f7faf8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.linkbox code{flex:1;overflow:auto;white-space:nowrap;color:var(--green-dark)}
.insight{border-left:4px solid var(--purple);background:var(--purple-light);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:13.5px}
.insight b{color:var(--purple)}
.bar{height:8px;border-radius:5px;background:var(--green);display:inline-block}
.report{background:#fff;border:2px solid var(--green);border-radius:8px;padding:26px;max-width:760px;margin:0 auto}
.report .rh{display:flex;align-items:center;gap:16px;border-bottom:3px double var(--green);padding-bottom:14px;margin-bottom:14px}
.report .rh .seal{width:62px;height:62px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--green);overflow:hidden}
.report .rh .seal img{width:100%;height:100%;object-fit:cover}
.report .rh h2{font-size:21px;color:var(--green-dark)}.report .rh .addr{font-size:12px;color:var(--muted)}
.report .rh .doc{margin-left:auto;text-align:right;font-size:12px}.report .rh .doc b{color:var(--green-dark)}
.report .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 18px;font-size:12.5px;margin-bottom:16px}
.report .meta-grid div span{color:var(--muted);display:block;font-size:10.5px;text-transform:uppercase}
.report table{font-size:12.5px}.report th,.report td{border:1px solid #cfe0d5;padding:7px 9px}.report th{background:var(--green-light);color:var(--green-dark)}
.report .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.report .summary .box{border:1px solid #cfe0d5;border-radius:8px;padding:10px;text-align:center}
.report .summary .box .v{font-size:20px;font-weight:800;color:var(--green-dark)}.report .summary .box .k{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.report .remarks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;font-size:12.5px}
.report .remarks .r{border:1px solid #cfe0d5;border-radius:8px;padding:10px;min-height:62px}
.report .remarks .r b{color:var(--green-dark);display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase}
.report .sign{display:flex;justify-content:space-between;margin-top:24px;font-size:12px}
.report .sign div{text-align:center;width:45%}.report .sign .line{border-top:1px solid #888;margin-top:30px;padding-top:4px}
.keybox{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.viewonly{background:#fff8e1;border:1px solid #f3e2a0;color:#8a6d00;border-radius:8px;padding:8px 12px;font-size:12.5px;text-align:center;margin-top:10px}
.receipt{max-width:520px;margin:0 auto;border:1px solid var(--line);border-radius:10px;padding:24px;background:#fff}
.receipt .rh{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--green);padding-bottom:12px;margin-bottom:14px}
.receipt .rh .seal{width:50px;height:50px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:24px}
.receipt h2{font-size:18px;color:var(--green-dark)}.receipt .no{margin-left:auto;text-align:right;font-size:12px}
.receipt .amount{font-size:30px;font-weight:800;color:var(--green-dark);text-align:center;margin:14px 0;border:2px dashed var(--green);border-radius:10px;padding:12px}
.receipt .lines div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.receipt .lines div span{color:var(--muted)}
.receipt .paid-stamp{display:inline-block;border:3px solid var(--green);color:var(--green);font-weight:800;padding:4px 14px;border-radius:8px;transform:rotate(-8deg);letter-spacing:.1em;margin-top:14px}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.idcard{width:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);margin:0 auto}
.idcard .top{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:9px}
.idcard .top .lg{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px}
.idcard .top .nm{font-weight:700;font-size:12.5px;line-height:1.15}.idcard .top .nm small{font-weight:400;opacity:.85;font-size:10px;display:block}
.idcard .body{display:flex;gap:12px;padding:14px}
.idcard .ph{width:84px;height:96px;object-fit:cover;border-radius:8px;border:2px solid var(--green-light);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0}
.idcard .info{font-size:12px;flex:1}.idcard .info .big{font-size:15px;font-weight:800;color:var(--ink);line-height:1.1;margin-bottom:4px}
.idcard .info .row{margin-bottom:3px}.idcard .info .row span{color:var(--muted)}
.idcard .role-pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--green-light);color:var(--green-dark);margin-top:3px}
.idcard .barcode{padding:6px 14px 12px;text-align:center}.idcard .barcode svg{max-width:100%}
.idcard .foot{background:var(--green-light);color:var(--green-dark);font-size:9.5px;text-align:center;padding:5px;font-weight:600}
.pincard{border:2px dashed var(--purple);border-radius:10px;padding:12px 14px;background:#fff;font-size:12px}
.pincard .p{font-size:20px;font-weight:800;letter-spacing:.12em;color:var(--purple);font-family:monospace;margin:4px 0}
.pingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
#reader{width:100%;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden}.scan-result{max-width:460px;margin:16px auto 0}
@media print{body{background:#fff}.topbar,.sidebar,.no-print,.modal-foot{display:none!important}.main{padding:0;max-width:none}
  .modal-bg{position:static;background:none;padding:0;display:block}.modal,.modal.lg{box-shadow:none;max-width:none;border-radius:0}
  .modal-head{display:none}.modal-body{max-height:none;overflow:visible;padding:0}.report,.receipt{border:none}
  .idgrid,.pingrid{gap:10px}.idcard,.idc,.pincard{break-inside:avoid;page-break-inside:avoid}#checkPrint{box-shadow:none!important}}
@media(max-width:760px){.sidebar{position:fixed;left:-230px;transition:.2s;z-index:40;box-shadow:4px 0 20px rgba(0,0,0,.15)}.sidebar.show{left:0}
  .main{padding:16px}.grid2,.grid3,.report .meta-grid,.report .summary,.report .remarks{grid-template-columns:1fr}.menu-toggle{display:flex!important}.topbar .who{display:none}}
.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:22px;padding:6px;margin-left:-4px}
#navScrim{display:none;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.35);z-index:39}
#navScrim.show{display:block}
.qrimg{image-rendering:pixelated}
/* Admission letter */
.letter{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:38px 42px 30px;font-size:13.5px;line-height:1.75;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.letter:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,var(--green),var(--gold))}
.letter .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.04;font-size:260px}
.letter .wm img{width:340px;height:340px;object-fit:contain}
.letter>*{position:relative;z-index:1}
.letter .lh{display:flex;align-items:center;gap:14px;border-bottom:3px double var(--green);padding-bottom:12px;margin-bottom:8px;margin-top:6px}
.letter .lh .lg{width:64px;height:64px;border-radius:12px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;flex-shrink:0;box-shadow:0 3px 8px rgba(10,125,51,.2)}
.letter .lh .lg img{width:100%;height:100%;object-fit:cover}
.letter .lh h2{font-size:21px;color:var(--green-dark)}.letter .lh .addr{font-size:11.5px;color:var(--muted)}
.letter .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:10px 0}
.letter .passport{float:right;width:90px;height:104px;object-fit:cover;border:2px solid var(--green-light);border-radius:8px;margin:0 0 8px 14px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:34px}
.letter .qrbox{text-align:center;font-size:9.5px;color:var(--muted)}
.letter .qrbox img{width:84px;height:84px}
.letter .lsign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px}
.letter .lsign .line{border-top:1px solid #888;padding-top:4px;width:170px;text-align:center;font-size:11.5px}
/* Certificate */
.cert{max-width:820px;margin:0 auto;background:linear-gradient(#fff,#fbfdfb);border:14px solid var(--green);outline:2px solid var(--gold);outline-offset:-22px;border-radius:6px;padding:40px 54px;text-align:center;position:relative}
.cert .lg{width:72px;height:72px;border-radius:50%;background:var(--green-light);display:inline-flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;border:2px solid var(--gold)}

.idc-photo img{width:100%;height:100%;object-fit:cover}
.idc-name{text-align:center;font-weight:800;font-size:17px;margin-top:9px;color:var(--ink);padding:0 12px}

<div id="updateBar" class="no-print" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--ink);color:#fff;padding:11px 16px;display:none;align-items:center;justify-content:center;gap:14px;font-size:13.5px">
  <span>A new version is available.</span><button class="btn sm gold" onclick="location.reload()">Refresh</button></div>

  <div class="chip"><div class="m">M</div>
    <div class="t"><span class="by">Developed by</span><b>Muscode</b>
      <div class="det"><a href="mailto:musahassan575@gmail.com" onclick="event.stopPropagation()">✉ musahassan575@gmail.com</a><a href="tel:08036874028" onclick="event.stopPropagation()">☎ 08036874028</a></div></div>
  </div></div>

<script>
/* ===================== GLOBALS ===================== */
const TERMS=['First Term','Second Term','Third Term'];
const DEFAULT_CLASSES=['Nursery 1','Nursery 2','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Primary 6'];
const NURSERY_SUBJECTS=['Numeracy','Literacy','Rhymes','Colouring & Drawing','Social Habits','Health Habits'];
const PRIMARY_SUBJECTS=['English Language','Mathematics','Basic Science','Social Studies','Verbal Reasoning','Quantitative Reasoning','Civic Education','Computer Studies','Agricultural Science','Christian Religious Studies','Creative Arts','Physical & Health Education'];
let MODE='owner', SCHOOL_CODE='', DB=null, MASTER=null, USER=null, supa=null;
let STORE={}, pushTimers={};

/* ===================== STORAGE ===================== */
function loadStore(){try{STORE=JSON.parse(localStorage.getItem('sms_store'))||{};}catch(e){STORE={};}}
function saveStoreLocal(){localStorage.setItem('sms_store',JSON.stringify(STORE));}
function initSupa(){
  let url=SUPABASE_URL,key=SUPABASE_KEY;
  if(!url||!key){try{const c=JSON.parse(localStorage.getItem('sms_cfg'));if(c){url=c.url;key=c.key;}}catch(e){}}
  if(url&&key&&window.supabase){try{supa=window.supabase.createClient(url,key);return true;}catch(e){supa=null;}}
  return false;
}
async function pullRow(id){if(!supa)return STORE[id];try{const{data}=await supa.from('school_data').select('data').eq('id',id).maybeSingle();if(data&&data.data){STORE[id]=data.data;saveStoreLocal();}return STORE[id];}catch(e){console.warn(e);return STORE[id];}}
async function pullAll(){if(!supa)return;try{const{data,error}=await supa.from('school_data').select('id,data');if(error)throw error;if(data){data.forEach(r=>STORE[r.id]=r.data);saveStoreLocal();}}catch(e){console.warn(e);setSync('err','Sync error');}}
function pushRow(id){STORE[id]=(id==='__master__')?MASTER:(id===SCHOOL_CODE?DB:STORE[id]);saveStoreLocal();
  if(!supa)return;clearTimeout(pushTimers[id]);setSync('saving','Saving…');
  pushTimers[id]=setTimeout(async()=>{try{const{error}=await supa.from('school_data').upsert({id,data:STORE[id],updated_at:new Date().toISOString()});if(error)throw error;setSync('on','Synced');}catch(e){console.warn(e);setSync('err','Sync error');}},700);}
function save(){pushRow(SCHOOL_CODE);}
function saveMaster(){pushRow('__master__');}
function saveSchoolRow(code){STORE[code]=STORE[code];saveStoreLocal();if(!supa)return;clearTimeout(pushTimers[code]);
  pushTimers[code]=setTimeout(async()=>{try{await supa.from('school_data').upsert({id:code,data:STORE[code],updated_at:new Date().toISOString()});setSync('on','Synced');}catch(e){setSync('err','Sync error');}},400);}
async function manualSync(){if(!supa){toast('Cloud is off. Owner sets keys in the file or Settings.',true);return;}
  if(MODE==='owner'){await pullAll();MASTER=STORE['__master__'];}else{await pullRow(SCHOOL_CODE);await pullRow('__master__');DB=STORE[SCHOOL_CODE];MASTER=STORE['__master__'];}
  if(USER){buildNav();go(CURRENT);}toast('Synced');}
function setSync(state,txt){const c=$('#syncChip');if(!c)return;c.className='sync-chip '+(state==='on'?'':state);$('#syncTxt').textContent=txt;}

/* ===================== SEEDS ===================== */
function seedSchool(code,name){
  const classes=DEFAULT_CLASSES.map((n,i)=>({id:'c'+(i+1),name:n}));
  const subjects={};classes.forEach(c=>subjects[c.id]=c.name.startsWith('Nursery')?[...NURSERY_SUBJECTS]:[...PRIMARY_SUBJECTS]);
  return{settings:{code,schoolName:name,address:'Nigeria',motto:'Knowledge • Character • Service',logo:'',
      session:'2025/2026',term:'First Term',nextResumption:'',status:'active',receiptSeq:0,grade:{ca1:20,ca2:20,exam:60}},
    users:[{id:'u1',name:'School Administrator',username:'admin',password:'admin123',role:'admin',classes:[],staffId:'STAFF/001',photo:''}],
    classes,students:[],subjects,attendance:{},results:{},fees:{},payments:[],applicants:[],remarks:{}};
}
function seedMaster(){return{platform:{name:'EduManager Cloud',owner:{name:'Platform Owner',username:'owner',password:'owner123'}},
    schools:[{code:'DEMO',name:'Demo Nursery & Primary',status:'active',createdAt:today()}],
    pins:[],batches:[]};}
function ensureSchool(d){d.settings=d.settings||{};const g=d.settings.grade;if(!g)d.settings.grade={ca1:20,ca2:20,exam:60};
  if(d.settings.receiptSeq==null)d.settings.receiptSeq=0;if(!d.settings.status)d.settings.status='active';
  if(!Array.isArray(d.settings.termsDone))d.settings.termsDone=[];
  ['users','classes','students','payments','applicants'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  ['subjects','attendance','results','fees','remarks'].forEach(k=>{if(!d[k]||typeof d[k]!=='object')d[k]={};});
  d.classes.forEach(c=>{if(!d.subjects[c.id])d.subjects[c.id]=c.name.startsWith('Nursery')?[...NURSERY_SUBJECTS]:[...PRIMARY_SUBJECTS];});return d;}

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jq=s=>esc(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function today(){return new Date().toISOString().slice(0,10);}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2400);}
function uid(p){return p+Math.random().toString(36).slice(2,8);}
function className(id){const c=DB.classes.find(c=>c.id===id);return c?c.name:'—';}
function rkey(sid,sess,term){return (sess||DB.settings.session)+'|'+(term||DB.settings.term)+'|'+sid;}
function studentsIn(cid){return DB.students.filter(s=>s.classId===cid&&!s.graduated).sort((a,b)=>a.name.localeCompare(b.name));}
function naira(n){return '₦'+(Number(n)||0).toLocaleString('en-NG');}
function addrTel(){return esc(DB.settings.address)+(DB.settings.phone?' · ☎ '+esc(DB.settings.phone):'')+(DB.settings.email?' · ✉ '+esc(DB.settings.email):'');}
function enquiryLine(){const bits=[];if(DB.settings.phone)bits.push('☎ '+esc(DB.settings.phone));if(DB.settings.email)bits.push('✉ '+esc(DB.settings.email));return bits.length?'For enquiries: '+bits.join(' · '):'';}
function G(){return DB.settings.grade||{ca1:20,ca2:20,exam:60};}
function gradeOf(t){if(t>=70)return{g:'A',r:'Excellent'};if(t>=60)return{g:'B',r:'Very Good'};if(t>=50)return{g:'C',r:'Good'};if(t>=45)return{g:'D',r:'Fair'};if(t>=40)return{g:'E',r:'Pass'};return{g:'F',r:'Fail'};}
function teacherClasses(){return USER.role==='admin'?DB.classes:DB.classes.filter(c=>(USER.classes||[]).includes(c.id));}
function avatar(p,f){return p?`<img class="avatar" src="${p}">`:`<span class="avatar">${f||'👤'}</span>`;}
function pendingPayCount(){return DB.payments.filter(p=>p.status==='pending').length;}
function pendingAppCount(){return DB.applicants.filter(a=>a.status==='applied'||a.status==='reviewing').length;}
function approvedPaid(sid){return DB.payments.filter(p=>p.studentId===sid&&p.status==='approved'&&p.session===DB.settings.session&&p.term===DB.settings.term).reduce((a,p)=>a+(Number(p.amount)||0),0);}
function appUrl(){return location.origin+location.pathname;}
// Pretty path links (need Netlify _redirects). Fall back to ?s= if opened from a file.
function prettyOK(){return location.protocol==='http:'||location.protocol==='https:';}
function schoolLink(code){return prettyOK()?location.origin+'/'+code.toLowerCase():appUrl()+'?s='+encodeURIComponent(code);}
function checkLink(code){return prettyOK()?location.origin+'/'+code.toLowerCase()+'/check':appUrl()+'?s='+encodeURIComponent(code)+'&check=1';}
function copyText(t){navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Link copied'),()=>toast('Copy failed',true));}

/* ===================== MODAL & PHOTO ===================== */
function modal(title,body,foot,big){$('#modal').className='modal'+(big?' lg':'');
  $('#modal').innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;$('#modalBg').classList.add('open');}
function closeModal(){stopCam();$('#modalBg').classList.remove('open');}
$('#modalBg').addEventListener('click',e=>{if(e.target===$('#modalBg'))closeModal();});
let _photo='',_camStream=null;
function photoField(cur){_photo=cur||'';return `<label>Photo</label><div class="photo-pick mb">
  <div class="photo-prev" id="phPrev">${_photo?`<img src="${_photo}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'📷'}</div>
  <div><input type="file" id="phFile" accept="image/*" style="display:none" onchange="pickPhoto(this)">
   <button type="button" class="btn sec sm" onclick="document.getElementById('phFile').click()">⬆ Upload</button>
   <button type="button" class="btn sec sm" onclick="openCam()">📸 Camera</button>
   ${_photo?'<button type="button" class="btn sec sm" onclick="clearPhoto()">Remove</button>':''}</div></div>
  <div id="camWrap" style="display:none" class="mb"><video id="camVid" autoplay playsinline></video>
   <div class="flex gap mt"><button type="button" class="btn sm" onclick="snap()">Capture</button><button type="button" class="btn sec sm" onclick="stopCam()">Cancel</button></div></div>`;}
function setPrev(){$('#phPrev').innerHTML=_photo?`<img src="${_photo}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'📷';}
function clearPhoto(){_photo='';setPrev();}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>compress(e.target.result,d=>{_photo=d;setPrev();});r.readAsDataURL(f);}
function compress(dataURL,cb,max=260,q=.6){const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',q));};img.src=dataURL;}
async function openCam(){$('#camWrap').style.display='block';try{_camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});$('#camVid').srcObject=_camStream;}catch(e){toast('Camera needs the hosted https link. Use Upload.',true);$('#camWrap').style.display='none';}}
function snap(){const v=$('#camVid');if(!v||!v.videoWidth)return;const cv=document.createElement('canvas');cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);compress(cv.toDataURL('image/jpeg',.8),d=>{_photo=d;setPrev();});stopCam();}
function stopCam(){if(_camStream){_camStream.getTracks().forEach(t=>t.stop());_camStream=null;}const w=$('#camWrap');if(w)w.style.display='none';}

/* ===================== QR & LOGO ===================== */
function renderQRs(){if(!window.qrcode)return;document.querySelectorAll('img.qrimg[data-qr]').forEach(el=>{if(el.dataset.done)return;
  try{const q=qrcode(0,'M');q.addData(el.getAttribute('data-qr')||' ');q.make();el.src=q.createDataURL(5,1);el.dataset.done='1';}catch(e){}});}
// Render barcodes + QRs, retrying a few times in case the CDN libs load slightly late.
function renderVisuals(tries){tries=tries||0;
  renderBarcodes();renderQRs();
  const pendingBC=[...document.querySelectorAll('svg.bc[data-code]')].some(el=>!el.dataset.done);
  const pendingQR=[...document.querySelectorAll('img.qrimg[data-qr]')].some(el=>!el.dataset.done);
  if((pendingBC||pendingQR)&&tries<14){setTimeout(()=>renderVisuals(tries+1),250);}
  else if(pendingBC){ // libs never loaded — show the code as text so the card still works
    document.querySelectorAll('svg.bc[data-code]').forEach(el=>{if(el.dataset.done)return;const fb=el.parentElement&&el.parentElement.querySelector('.bc-fallback');if(fb){fb.style.display='block';el.style.display='none';}el.dataset.done='1';});}}
// logo picker (upload + generate)
let _logo='';
function logoField(cur){_logo=cur||'';return `<label>School logo</label>
  <div class="photo-pick mb"><div class="photo-prev" id="lgPrev">${_logo?`<img src="${_logo}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'🏫'}</div>
   <div><input type="file" id="lgFile" accept="image/*" style="display:none" onchange="pickLogo(this)">
    <button type="button" class="btn sec sm" onclick="document.getElementById('lgFile').click()">⬆ Upload logo</button>
    <button type="button" class="btn sec sm" onclick="genLogoChooser()">✨ Generate from name</button>
    ${_logo?'<button type="button" class="btn sec sm" onclick="clearLogo()">Remove</button>':''}</div></div>
  <div id="logoOpts"></div>`;}
function setLogoPrev(){const p=$('#lgPrev');if(p)p.innerHTML=_logo?`<img src="${_logo}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'🏫';}
function clearLogo(){_logo='';setLogoPrev();const o=$('#logoOpts');if(o)o.innerHTML='';}
function pickLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>compress(e.target.result,d=>{_logo=d;setLogoPrev();},256,.8);r.readAsDataURL(f);}
function initials(name){return (name||'').split(/\s+/).filter(w=>/[a-z0-9]/i.test(w)).slice(0,3).map(w=>w[0].toUpperCase()).join('')||'S';}
function logoSVG(text,style){
  const palettes=[['#0a7d33','#e7f5ec'],['#1e5fa8','#e3eefb'],['#6b3fa0','#f0eafa'],['#b8860b','#fdf3d7'],['#c0392b','#fdecea'],['#0f766e','#d7f0ec']];
  const[fg,bg]=palettes[style%palettes.length];const t=esc(text);const shape=Math.floor(style/2)%3;let bgEl;
  if(shape===0)bgEl=`<circle cx="60" cy="60" r="56" fill="${bg}" stroke="${fg}" stroke-width="4"/>`;
  else if(shape===1)bgEl=`<rect x="6" y="6" width="108" height="108" rx="22" fill="${bg}" stroke="${fg}" stroke-width="4"/>`;
  else bgEl=`<path d="M60 6 L112 26 V64 C112 92 88 110 60 116 C32 110 8 92 8 64 V26 Z" fill="${bg}" stroke="${fg}" stroke-width="4"/>`;
  const fs=t.length>2?30:38;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">${bgEl}<text x="60" y="60" dy=".35em" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="${fs}" fill="${fg}">${t}</text></svg>`;}
function svgToDataURL(svg){return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));}
function genLogoChooser(){
  const nm=($('#sc_name')&&$('#sc_name').value.trim())||'School';const ini=initials(nm);
  const opts=[];for(let i=0;i<6;i++)opts.push(logoSVG(ini,i));
  $('#logoOpts').innerHTML=`<label>Pick a generated logo for “${esc(nm)}”</label><div class="logo-opts mb">
    ${opts.map((svg,i)=>`<div class="logo-opt" onclick="chooseLogo(${i})" id="lo${i}">${svg}</div>`).join('')}</div>`;
  window._logoOpts=opts;
}
function chooseLogo(i){_logo=svgToDataURL(window._logoOpts[i]);setLogoPrev();document.querySelectorAll('.logo-opt').forEach(e=>e.classList.remove('sel'));const el=$('#lo'+i);if(el)el.classList.add('sel');}

/* ===================== PROMOTION / ANNUAL HELPERS ===================== */
function termAvg(stu,term){const subs=DB.subjects[stu.classId]||[];const res=DB.results[DB.settings.session+'|'+term+'|'+stu.id]||{};let t=0,n=0;
  subs.forEach(sub=>{const r=res[sub];if(r&&(r.ca1!=null||r.ca2!=null||r.exam!=null)){t+=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);n++;}});return n?t/n:null;}
function annual(stu){const t1=termAvg(stu,'First Term'),t2=termAvg(stu,'Second Term'),t3=termAvg(stu,'Third Term');
  const vals=[t1,t2,t3].filter(v=>v!=null);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;return{t1,t2,t3,avg,terms:vals.length};}
function promoteMark(){return (DB.settings.grade&&DB.settings.grade.promote)||40;}
function isFinalClass(classId){const c=DB.classes.find(x=>x.id===classId);return c&&/primary\s*6|grad/i.test(c.name);}
function nextClassName(classId){if(isFinalClass(classId))return 'Graduated';const i=DB.classes.findIndex(c=>c.id===classId);return (i>=0&&i+1<DB.classes.length)?DB.classes[i+1].name:'Graduated';}
function promotionFor(stu){const a=annual(stu);if(a.avg==null)return{...a,decision:'pending',label:'No results',cls:'muted'};
  if(isFinalClass(stu.classId))return{...a,decision:'graduate',label:'Graduated (Primary Certificate)',cls:'promo-grad'};
  if(a.avg>=promoteMark())return{...a,decision:'promote',label:'Promoted to '+nextClassName(stu.classId),cls:'promo-yes'};
  return{...a,decision:'repeat',label:'To repeat '+className(stu.classId),cls:'promo-no'};}

/* ===================== SESSION / TERM MANAGEMENT ===================== */
function termsDone(){return DB.settings.termsDone||[];}
function allTermsDone(){return TERMS.every(t=>termsDone().includes(t));}
function nextSessionStr(s){const m=(s||'').match(/(\d{4})\s*\/\s*(\d{4})/);if(m)return (+m[1]+1)+'/'+(+m[2]+1);const y=new Date().getFullYear();return y+'/'+(y+1);}
function termArchive(label){
  // Build a records bundle for download/email at term/session close.
  const data={school:DB.settings.schoolName,code:DB.settings.code,session:DB.settings.session,term:DB.settings.term,generated:new Date().toISOString(),
    students:DB.students,results:DB.results,payments:DB.payments,fees:DB.fees,attendance:DB.attendance,applicants:DB.applicants,remarks:DB.remarks,settings:DB.settings};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(DB.settings.code||'school')+'-archive-'+(label||DB.settings.session).replace(/[^a-z0-9]/gi,'_')+'-'+today()+'.json';a.click();
}
function vSession(){
  const done=termsDone(),cur=DB.settings.term;
  $('#view').innerHTML=`<div class="page-head"><div><h2>📆 Session & Terms</h2><p>${esc(DB.settings.session)} — manage term progress and start a new session</p></div></div>
  <div class="cards-row">${TERMS.map(t=>{const d=done.includes(t);const isCur=t===cur;return `<div class="stat" style="border-color:${d?'var(--green)':isCur?'var(--gold)':'var(--line)'}">
    <div class="lbl">${esc(t)}</div><div class="num" style="font-size:18px;color:${d?'var(--green)':isCur?'var(--amber)':'var(--muted)'}">${d?'✓ Completed':isCur?'In progress':'Pending'}</div></div>`;}).join('')}</div>
  <div class="card pad mb" style="max-width:680px"><h3 class="mb">Current term: ${esc(cur)}</h3>
    <p class="muted mb">Completing a term locks it for the records and moves the school to the next term. A records archive (pupils, results, payments, admissions) downloads automatically for safe-keeping. Your data also stays in the cloud.</p>
    <div class="fld" style="max-width:340px"><label>Records email (for your reference)</label><input id="se_email" value="${esc(DB.settings.recordEmail||'')}" placeholder="admin@school.com"></div>
    ${done.includes(cur)?`<p class="pill green">${esc(cur)} already completed.</p>`:`<button class="btn" onclick="completeTerm()">✓ Complete ${esc(cur)} & download records</button>`}
  </div>
  <div class="card pad" style="max-width:680px;border-left:4px solid ${allTermsDone()?'var(--green)':'var(--line)'}">
    <h3 class="mb">Start new session</h3>
    ${allTermsDone()
      ? `<p class="muted mb">All three terms are completed. Starting a new session will <b>promote pupils</b> (based on the Promotions page), graduate Primary 6, advance to <b>${esc(nextSessionStr(DB.settings.session))}</b>, reset to First Term, and archive this session.</p>
         <button class="btn gold" onclick="confirmNewSession()">🎓 Promote & Start ${esc(nextSessionStr(DB.settings.session))}</button>`
      : `<p class="muted">🔒 You can start a new session only after <b>all three terms</b> are completed. Completed: ${done.length}/3.</p>`}
  </div>`;
}
function completeTerm(){
  const cur=DB.settings.term;DB.settings.recordEmail=$('#se_email').value.trim();
  if(!termsDone().includes(cur))DB.settings.termsDone.push(cur);
  // advance to next not-done term (keep order)
  const nextT=TERMS.find(t=>!DB.settings.termsDone.includes(t));
  if(nextT)DB.settings.term=nextT;
  save();termArchive(DB.settings.session+'-'+cur);
  toast(cur+' completed — records downloaded');
  vSession();buildNav();$('#termBadge').textContent=DB.settings.term+' • '+DB.settings.session;
}
function confirmNewSession(){
  const next=nextSessionStr(DB.settings.session);
  let promo=0,grad=0,rep=0;
  DB.students.filter(s=>!s.graduated).forEach(s=>{const d=promotionFor(s).decision;if(d==='promote')promo++;else if(d==='graduate')grad++;else rep++;});
  modal('Start new session — '+next,`<p>This will close <b>${esc(DB.settings.session)}</b> and begin <b>${esc(next)}</b>:</p>
    <ul style="margin:10px 0 10px 18px;font-size:13.5px">
      <li><b>${promo}</b> pupil(s) promoted to the next class</li>
      <li><b>${grad}</b> Primary 6 pupil(s) graduated (kept as records)</li>
      <li><b>${rep}</b> pupil(s) repeating their class</li></ul>

function doNewSession(){
  termArchive('FULL-'+DB.settings.session);
  const next=nextSessionStr(DB.settings.session);
  DB.students.filter(s=>!s.graduated).forEach(s=>{const p=promotionFor(s);
    if(p.decision==='graduate'){s.graduated=true;s.graduatedSession=DB.settings.session;}
    else if(p.decision==='promote'){const i=DB.classes.findIndex(c=>c.id===s.classId);if(i>=0&&i+1<DB.classes.length)s.classId=DB.classes[i+1].id;}
    // repeat/pending: stay in same class
  });
  DB.settings.session=next;DB.settings.term='First Term';DB.settings.termsDone=[];
  save();closeModal();$('#termBadge').textContent=DB.settings.term+' • '+DB.settings.session;
  toast('New session '+next+' started');go('dashboard');
}

function doGenPins(){
  const school=$('#g_school').value,sess=$('#g_sess').value.trim(),term=$('#g_term').value;
  const qty=Math.max(1,Math.min(2000,+$('#g_qty').value||0)),maxUses=Math.max(1,+$('#g_uses').value||1),price=+$('#g_price').value||0;
  const batch={id:uid('b'),school,session:sess,term,qty,maxUses,price,createdAt:today()};
  const existing=new Set(MASTER.pins.map(p=>p.code));
  for(let i=0;i<qty;i++){let code;do{code=String(Math.floor(100000000000+Math.random()*899999999999));}while(existing.has(code));existing.add(code);
    MASTER.pins.push({code,school,session:sess,term,maxUses,uses:0,price,batch:batch.id,createdAt:today()});}
  MASTER.batches.push(batch);saveMaster();pinSchool=school;closeModal();toast(qty+' PINs generated');vPins();
}
function printPins(batchId){

  modal('Print PINs — '+reg.name,html,`<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn purple no-print" onclick="window.print()">🖨 Print</button>`,true);

/* ===================== SCHOOL: INSIGHTS (smart) ===================== */
function vInsights(){
  const insights=[];
  // best/worst class by average
  const classStats=DB.classes.map(c=>{const{rows}=computeClassResults(c.id);const scored=rows.filter(r=>r.count);
    const avg=scored.length?scored.reduce((a,r)=>a+r.avg,0)/scored.length:0;return{c,avg,scored:scored.length,total:rows.length};}).filter(x=>x.scored);
  if(classStats.length){const best=classStats.slice().sort((a,b)=>b.avg-a.avg)[0];const worst=classStats.slice().sort((a,b)=>a.avg-b.avg)[0];
    insights.push(`🏆 <b>${esc(best.c.name)}</b> leads with a class average of <b>${best.avg.toFixed(1)}%</b>.`);
    if(worst.c.id!==best.c.id)insights.push(`📉 <b>${esc(worst.c.name)}</b> needs support — class average <b>${worst.avg.toFixed(1)}%</b>.`);}
  // pupils needing attention across school
  let atRisk=[];DB.classes.forEach(c=>{const{rows}=computeClassResults(c.id);rows.forEach(r=>{if(r.count&&r.avg<50)atRisk.push({name:r.s.name,cls:c.name,avg:r.avg});});});
  atRisk.sort((a,b)=>a.avg-b.avg);
  // subject hotspots
  const subjAgg={};DB.classes.forEach(c=>{const{rows}=computeClassResults(c.id);rows.forEach(r=>r.marks.forEach(m=>{if(m.has){subjAgg[m.sub]=subjAgg[m.sub]||{t:0,n:0};subjAgg[m.sub].t+=m.total;subjAgg[m.sub].n++;}}));});
  const subjArr=Object.entries(subjAgg).map(([k,v])=>({sub:k,avg:v.t/v.n,n:v.n})).filter(x=>x.n>=3).sort((a,b)=>a.avg-b.avg);
  // attendance
  let p=0,tot=0;Object.keys(DB.attendance).forEach(k=>Object.values(DB.attendance[k]).forEach(v=>{tot++;if(v==='P')p++;}));
  const attRate=tot?Math.round(p/tot*100):0;
  if(attRate)insights.push(`📅 Overall attendance is <b>${attRate}%</b> across all recorded days.`);
  if(!insights.length)insights.push('Enter some results and attendance to unlock insights.');

  const totalPupils=DB.students.length;
  const summary=`Across <b>${totalPupils}</b> pupil(s)${classStats.length?` and ${classStats.length} class(es) with results`:''}, `+
    (classStats.length?`the school's overall average is <b>${(classStats.reduce((a,c)=>a+c.avg,0)/classStats.length).toFixed(1)}%</b>. `:'no results have been entered yet. ')+
    (atRisk.length?`<b>${atRisk.length}</b> pupil(s) are below 50% and may need extra support. `:(classStats.length?'No pupils are currently below 50% — strong performance overall. ':''))+
    (subjArr.length?`The weakest subject so far is <b>${esc(subjArr[0].sub)}</b> (${subjArr[0].avg.toFixed(0)}%)${subjArr.length>1?`, and the strongest is <b>${esc(subjArr[subjArr.length-1].sub)}</b> (${subjArr[subjArr.length-1].avg.toFixed(0)}%)`:''}.`:'');
  $('#view').innerHTML=`<div class="page-head"><div><h2>✨ Smart Insights</h2><p>Automatic analysis of results & attendance</p></div></div>
  <div class="card pad mb" style="border-left:4px solid var(--purple);background:var(--purple-light)"><div class="flex gap" style="align-items:flex-start"><span style="font-size:22px">🤖</span><div><b style="color:var(--purple)">AI Summary</b><div style="margin-top:4px">${summary}</div></div></div></div>
  ${insights.map(i=>`<div class="insight">${i}</div>`).join('')}
  <div class="grid2">
    <div class="card pad"><h3 class="mb">Pupils needing attention <span class="muted" style="font-size:12px">(avg below 50%)</span></h3>
      ${atRisk.length?`<div class="t-wrap"><table><thead><tr><th>Pupil</th><th>Class</th><th class="right">Avg</th></tr></thead><tbody>
        ${atRisk.slice(0,12).map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.cls)}</td><td class="right" style="color:var(--red)">${r.avg.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No at-risk pupils 🎉</p>'}</div>
    <div class="card pad"><h3 class="mb">Subjects by average</h3>
      ${subjArr.length?subjArr.slice(0,12).map(x=>`<div class="flex mb" style="gap:10px"><div style="flex:1"><div style="font-size:12.5px">${esc(x.sub)}</div>
        <div class="bar" style="width:${Math.max(4,x.avg)}%;background:${x.avg<50?'var(--red)':x.avg<60?'var(--gold)':'var(--green)'}"></div></div>
        <b style="width:48px;text-align:right">${x.avg.toFixed(0)}%</b></div>`).join(''):'<p class="muted">Not enough data yet.</p>'}</div>
  </div>`;
}

function showSubj(btn,i){document.querySelectorAll('.subtab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');

  ${list.map(s=>{const r=(DB.results[rkey(s.id)]||{})[subj]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const tot=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);const gr=gradeOf(tot);
    return `<tr><td><b>${esc(s.name)}</b></td>

    <td class="center"><input class="score-in" type="number" min="0" max="${g.ca2}" value="${r.ca2??''}" onchange="setScore('${s.id}','${jq(subj)}','ca2',this,${g.ca2})"></td>
    <td class="center"><input class="score-in" type="number" min="0" max="${g.exam}" value="${r.exam??''}" onchange="setScore('${s.id}','${jq(subj)}','exam',this,${g.exam})"></td>
    <td class="center" id="tot_${s.id}"><b>${has?tot:'—'}</b></td><td class="center" id="gr_${s.id}">${has?`<span class="pill ${gr.g==='F'?'red':'green'}">${gr.g}</span>`:'—'}</td></tr>`;}).join('')}
  </tbody></table></div><p class="muted mt" style="font-size:12.5px">Scores save automatically.</p>`;}
function setScore(sid,subj,field,inp,max){let v=inp.value===''?null:Math.max(0,Math.min(max,Number(inp.value)));if(v!==null)inp.value=v;
  const k=rkey(sid);DB.results[k]=DB.results[k]||{};DB.results[k][subj]=DB.results[k][subj]||{};
  if(v===null)delete DB.results[k][subj][field];else DB.results[k][subj][field]=v;
  const cur=DB.results[k][subj];if(cur.ca1==null&&cur.ca2==null&&cur.exam==null)delete DB.results[k][subj];save();
  const r=(DB.results[k]||{})[subj]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const tot=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);const gr=gradeOf(tot);
  $('#tot_'+sid).innerHTML=`<b>${has?tot:'—'}</b>`;$('#gr_'+sid).innerHTML=has?`<span class="pill ${gr.g==='F'?'red':'green'}">${gr.g}</span>`:'—';}

function computeClassResults(cid,sess,term){const subs=DB.subjects[cid]||[],list=studentsIn(cid);
  const rows=list.map(s=>{const res=DB.results[rkey(s.id,sess,term)]||{};let total=0,count=0;
    const marks=subs.map(sub=>{const r=res[sub]||{};const has=r.ca1!=null||r.ca2!=null||r.exam!=null;const t=(+r.ca1||0)+(+r.ca2||0)+(+r.exam||0);if(has){total+=t;count++;}return{sub,ca1:r.ca1,ca2:r.ca2,exam:r.exam,total:has?t:null,has};});
    return{s,marks,total,count,avg:count?total/count:0};});
  const ranked=rows.slice().filter(r=>r.count).sort((a,b)=>b.total-a.total);ranked.forEach((r,i)=>r.pos=i+1);return{rows,size:ranked.length};}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

    <div class="remarks"><div class="r"><b>Class Teacher's Remark</b>${esc(rem.teacher||autoRemark(row.avg,subs))}</div><div class="r"><b>Head Teacher's Remark</b>${esc(rem.head||autoHead(row.avg))}</div></div>
    <div class="keybox">A 70–100 · B 60–69 · C 50–59 · D 45–49 · E 40–44 · F below 40</div>

function openReport(sid){modal('Report Card — '+DB.students.find(x=>x.id===sid).name,reportHTML(sid),
  `<button class="btn sec no-print" onclick="editRemarks('${sid}')">✎ Edit remarks</button><button class="btn sec no-print" onclick="closeModal()">Close</button>
   <span class="viewonly no-print" style="margin:0">🔒 Printing available to pupils via PIN</span>`,true);renderVisuals();}
function autoRemark(avg,subs){if(!subs||!subs.some(m=>m.has))return'No results entered yet.';
  const scored=subs.filter(m=>m.has);const best=scored.slice().sort((a,b)=>b.total-a.total)[0];const worst=scored.slice().sort((a,b)=>a.total-b.total)[0];
  let base=avg>=70?'An excellent result.':avg>=60?'A very good performance.':avg>=50?'A good effort.':avg>=40?'A fair result; more effort needed.':'Needs serious improvement.';
  let tip='';if(best)tip+=` Strongest in ${best.sub}.`;if(worst&&worst.total<50&&worst.sub!==best.sub)tip+=` Should improve in ${worst.sub}.`;return base+tip;}
function autoHead(a){if(a>=70)return'Outstanding. A model pupil.';if(a>=50)return'Good progress. Well done.';if(a>=40)return'Can do better with more focus.';return'Requires close attention and support.';}

function aiRemark(sid,which){const s=DB.students.find(x=>x.id===sid);const {rows}=computeClassResults(s.classId);const row=rows.find(r=>r.s.id===sid);

function savePayment(sid,approve){const amt=Number($('#p_amt').value);if(!amt||amt<=0){toast('Enter a valid amount',true);return;}

  <div class="terms">This card certifies the holder as authorised staff of ${esc(DB.settings.schoolName)}. It remains school property and must be returned on exit.</div>
  <div class="sig"><div class="ln">Staff Signature</div><div class="ln">Head Teacher</div></div></div>
  <div class="idc-foot">${esc(DB.settings.motto||'')}</div></div>`;}
function renderBarcodes(){if(!window.JsBarcode)return;document.querySelectorAll('svg.bc[data-code]').forEach(el=>{if(el.dataset.done)return;
  try{JsBarcode(el,el.getAttribute('data-code'),{format:'CODE128',height:42,width:1.7,fontSize:12,margin:0,displayValue:true});if(el.childNodes.length)el.dataset.done='1';}catch(e){}});}
function showStudentId(id){const s=DB.students.find(x=>x.id===id);modal('Pupil ID Card (Front & Back)',`<div class="idgrid" style="padding:6px 0">${studentCardHTML(s)}${studentCardBack(s)}</div>`,`<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print</button>`,true);renderVisuals();}
function showTeacherId(id){const u=DB.users.find(x=>x.id===id);modal('Staff ID Card (Front & Back)',`<div class="idgrid" style="padding:6px 0">${teacherCardHTML(u)}${teacherCardBack(u)}</div>`,`<button class="btn sec no-print" onclick="closeModal()">Close</button><button class="btn gold no-print" onclick="window.print()">🖨 Print</button>`,true);renderVisuals();}

/* ===================== SCHOOL: SCANNER ===================== */
function vScanner(){$('#view').innerHTML=`<div class="page-head"><div><h2>Scan ID</h2><p>Scan a pupil/staff barcode to verify, mark present or check fees</p></div></div>
  <div class="card pad" style="max-width:520px;margin:0 auto"><div id="reader"></div>
    <div class="flex gap mt" style="justify-content:center"><button class="btn" id="scanStartBtn" onclick="startScan()">▶ Start camera</button><button class="btn sec" onclick="stopScan()">Stop</button></div>
    <hr><p class="muted center" style="font-size:12.5px">No camera? Type the ID / admission number:</p>
    <div class="flex gap" style="max-width:340px;margin:0 auto"><input id="manualCode" placeholder="e.g. ADM/2025/001" onkeydown="if(event.key==='Enter')handleScan(this.value)"><button class="btn sec" onclick="handleScan(document.getElementById('manualCode').value)">Find</button></div>
    <p class="muted center mt" style="font-size:12px">📷 Camera needs the hosted https link.</p></div><div id="scanResult"></div>`;}
function startScan(){if(!window.Html5Qrcode){toast('Scanner not loaded',true);return;}if(window._scanner)return;
  const fmts=window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.QR_CODE]:undefined;
  window._scanner=new Html5Qrcode('reader');
  window._scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150},formatsToSupport:fmts},txt=>handleScan(txt),()=>{}).then(()=>{$('#scanStartBtn').textContent='Scanning…';}).catch(e=>{toast('Camera failed. Use manual entry.',true);window._scanner=null;});}
function stopScan(){if(window._scanner){const sc=window._scanner;window._scanner=null;sc.stop().then(()=>sc.clear()).catch(()=>{});const b=$('#scanStartBtn');if(b)b.textContent='▶ Start camera';}}
function handleScan(code){code=(code||'').trim();if(!code)return;
  const s=DB.students.find(x=>(x.admissionNo||'').toLowerCase()===code.toLowerCase()||x.id===code);
  const u=!s&&DB.users.find(x=>(x.staffId||'').toLowerCase()===code.toLowerCase()||x.id===code);stopScan();
  if(s)showScanStudent(s);else if(u)showScanTeacher(u);else{const r=$('#scanResult');if(r)r.innerHTML=`<div class="scan-result"><div class="card pad center"><div style="font-size:34px">❌</div><b>No match for “${esc(code)}”.</b></div></div>`;toast('No match',true);}}
function showScanStudent(s){const due=Number((DB.fees[rkey(s.id)]||{}).due)||0,paid=approvedPaid(s.id),bal=due-paid;const t=today();const mark=(DB.attendance[t+'|'+s.classId]||{})[s.id];const r=$('#scanResult');
  r.innerHTML=`<div class="scan-result"><div class="card pad"><div class="flex gap mb">${s.photo?`<img src="${s.photo}" style="width:64px;height:64px;border-radius:10px;object-fit:cover">`:'<div style="width:64px;height:64px;border-radius:10px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px">👧</div>'}
    <div><span class="pill green">PUPIL VERIFIED</span><div style="font-size:18px;font-weight:800;margin-top:4px">${esc(s.name)}</div><div class="muted">${esc(className(s.classId))} · Adm ${esc(s.admissionNo||'—')}</div></div></div>
    <div class="cards-row" style="margin-bottom:14px"><div class="stat"><div class="lbl">Fee due</div><div class="num" style="font-size:20px">${naira(due)}</div></div>
      <div class="stat"><div class="lbl">Paid</div><div class="num" style="font-size:20px;color:var(--green)">${naira(paid)}</div></div>
      <div class="stat"><div class="lbl">Balance</div><div class="num" style="font-size:20px;color:${bal>0?'var(--red)':'var(--green)'}">${naira(bal)}</div></div></div>
    <div class="flex gap" style="flex-wrap:wrap"><button class="btn ${mark==='P'?'sec':''}" onclick="scanMarkPresent('${s.id}')">${mark==='P'?'✓ Present today':'📅 Mark present today'}</button>
      <button class="btn sec" onclick="showStudentId('${s.id}')">ID card</button>${USER.role==='admin'?`<button class="btn sec" onclick="recordPayment('${s.id}')">Record payment</button>`:''}</div></div></div>`;
  r.scrollIntoView({behavior:'smooth',block:'nearest'});}
function showScanTeacher(u){const r=$('#scanResult');r.innerHTML=`<div class="scan-result"><div class="card pad"><div class="flex gap mb">${u.photo?`<img src="${u.photo}" style="width:64px;height:64px;border-radius:10px;object-fit:cover">`:'<div style="width:64px;height:64px;border-radius:10px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:30px">👩‍🏫</div>'}
    <div><span class="pill blue">STAFF VERIFIED</span><div style="font-size:18px;font-weight:800;margin-top:4px">${esc(u.name)}</div><div class="muted">Teacher · ${esc(u.staffId||'—')}</div><div class="muted">Classes: ${esc((u.classes||[]).map(className).join(', ')||'—')}</div></div></div>
    <button class="btn sec" onclick="showTeacherId('${u.id}')">ID card</button></div></div>`;r.scrollIntoView({behavior:'smooth',block:'nearest'});}
function scanMarkPresent(sid){const s=DB.students.find(x=>x.id===sid);const t=today();const k=t+'|'+s.classId;DB.attendance[k]=DB.attendance[k]||{};DB.attendance[k][sid]='P';save();toast(s.name.split(' ')[0]+' marked present');showScanStudent(s);}

/* ===================== SCHOOL: MY CLASSES (teacher) ===================== */
function vMyClasses(){const cls=teacherClasses();
  $('#view').innerHTML=`<div class="page-head"><div><h2>My Classes</h2><p>Classes assigned to you</p></div></div>
  ${cls.length?`<div class="cards-row">${cls.map(c=>`<div class="card pad"><h3>${esc(c.name)}</h3><p class="muted">${studentsIn(c.id).length} pupils · ${(DB.subjects[c.id]||[]).length} subjects</p>
    <div class="flex gap mt"><button class="btn sm sec" onclick="attClass='${c.id}';go('attendance')">Attendance</button><button class="btn sm sec" onclick="resClass='${c.id}';go('results')">Results</button></div></div>`).join('')}</div>

    ${cls.flatMap(c=>studentsIn(c.id).map(s=>`<tr><td>${avatar(s.photo,'👧')}</td><td>${esc(c.name)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.guardianName||'—')}</td><td>${esc(s.guardianPhone||'—')}</td></tr>`)).join('')||'<tr><td colspan=5 class="muted center">No pupils yet</td></tr>'}
  </tbody></table></div>`:`<div class="card"><div class="empty"><div class="big">🏫</div>No classes assigned.</div></div>`}`;}

/* ===================== STUDENT RESULT CHECKER (public) ===================== */
function renderChecker(){
  $('#app').style.display='none';$('#screen').style.display='';
  const name=(DB&&DB.settings.schoolName)||'Result Checker';
  if(!DB){$('#screen').innerHTML=`<div class="auth check"><div class="acard"><div class="crest b">🚫</div><h1>School not found</h1><div class="sub">Check your link.</div></div></div>`;return;}
  $('#screen').innerHTML=`<div class="auth check"><div class="acard"><div class="crest b">📄</div>
    <h1>${esc(name)}</h1><div class="sub">Student Result Checker</div>
    <div class="auth-err" id="cerr"></div>
    <div class="field"><label>Admission Number</label><input id="ck_adm" placeholder="ADM/2025/001"></div>
    <div class="field"><label>Result PIN</label><input id="ck_pin" placeholder="12-digit PIN"></div>
    <button class="btn blue" style="width:100%;justify-content:center" onclick="checkResult()">Check Result</button>
    <div class="swlink"><a onclick="MODE='school';renderAuth()">← Staff login</a></div>
    <div class="hint">Enter your admission number and the PIN on your scratch card. Your school provides PINs.</div></div></div>`;
  $('#ck_pin').addEventListener('keydown',e=>{if(e.key==='Enter')checkResult();});
}
function checkResult(){
  const adm=$('#ck_adm').value.trim(),pinCode=$('#ck_pin').value.replace(/\s/g,'');
  const err=$('#cerr');err.style.display='none';
  const s=DB.students.find(x=>(x.admissionNo||'').toLowerCase()===adm.toLowerCase());
  if(!s){err.style.display='block';err.textContent='Admission number not found for this school.';return;}
  const pin=MASTER&&MASTER.pins.find(p=>p.code===pinCode&&p.school===SCHOOL_CODE);
  if(!pin){err.style.display='block';err.textContent='Invalid PIN for this school.';return;}
  if(pin.uses>=pin.maxUses){err.style.display='block';err.textContent='This PIN has reached its usage limit.';return;}
  pin.uses=(pin.uses||0)+1;saveMaster();
  showStudentResult(s,pin);
}
let _ckStudent=null,_ckPin=null,_ckTab='term';
function showStudentResult(s,pin){_ckStudent=s;_ckPin=pin;_ckTab='term';renderCheckResult();}
function setCkTab(t){_ckTab=t;renderCheckResult();}
function renderCheckResult(){
  const s=_ckStudent,pin=_ckPin;const remaining=pin.maxUses-pin.uses;const fin=isFinalClass(s.classId);
  let body;
  if(_ckTab==='annual')body=annualReportHTML(s.id);
  else if(_ckTab==='cert')body=`<div class="cert-wrap">${certHTMLInner(s.id)}</div>`;
  else body=reportHTML(s.id,pin.session,pin.term);
  $('#screen').innerHTML=`<div style="min-height:100vh;background:#eef3f8;padding:20px 14px">
    <div style="max-width:840px;margin:0 auto">
      <div class="flex no-print" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div><b>${esc(s.name)}</b> · ${esc(className(s.classId))} <span class="pill blue" style="margin-left:6px">${remaining} check(s) left</span></div>
        <div class="flex gap"><button class="btn gold" onclick="window.print()">🖨 Print / Save PDF</button><button class="btn sec" onclick="renderChecker()">Check another</button></div></div>
      <div class="subtabs no-print"><button class="subtab${_ckTab==='term'?' active':''}" onclick="setCkTab('term')">Termly Result</button>
        <button class="subtab${_ckTab==='annual'?' active':''}" onclick="setCkTab('annual')">Annual / Promotion</button>
        ${fin?`<button class="subtab${_ckTab==='cert'?' active':''}" onclick="setCkTab('cert')">Leaving Certificate</button>`:''}</div>
      <div id="checkPrint" ${_ckTab==='cert'?'':'class="card pad"'} style="${_ckTab==='cert'?'':'box-shadow:0 6px 24px rgba(0,0,0,.1)'}">${body}</div>
    </div></div>`;
  window.scrollTo(0,0);renderVisuals();
}

/* ===================== BOOT ===================== */
async function boot(){
  loadStore();
  const params=new URLSearchParams(location.search);
  let code=params.get('s')||'';
  let wantCheck=params.get('check')==='1';
  // pretty path support: /greenfield  or  /greenfield/check
  const segs=location.pathname.split('/').filter(Boolean).filter(x=>!/\.html?$/i.test(x)&&!/^index$/i.test(x));
  if(!code&&segs.length){code=segs[0];if(segs[1]&&segs[1].toLowerCase()==='check')wantCheck=true;}
  SCHOOL_CODE=code.toUpperCase();
  initSupa();
  // ensure master
  if(supa){await pullRow('__master__');}
  MASTER=STORE['__master__'];
  if(!MASTER){MASTER=seedMaster();STORE['__master__']=MASTER;saveStoreLocal();
    // also seed DEMO school
    if(!STORE['DEMO']){STORE['DEMO']=seedSchool('DEMO','Demo Nursery & Primary');saveStoreLocal();}
    if(supa){saveMaster();saveSchoolRow('DEMO');}}
  if(SCHOOL_CODE){
    MODE=wantCheck?'check':'school';
    if(supa){await pullRow(SCHOOL_CODE);if(MASTER&&!STORE[SCHOOL_CODE]){}}
    DB=STORE[SCHOOL_CODE]?ensureSchool(STORE[SCHOOL_CODE]):null;
    if(DB){STORE[SCHOOL_CODE]=DB;}
    setSync(supa?'on':'off',supa?'Synced':'Local');
    // restore session
    const sess=sessionStorage.getItem('sms_su');
    if(!wantCheck&&DB&&sess&&sess.startsWith(SCHOOL_CODE+'|')){const uidp=sess.split('|')[1];const u=DB.users.find(x=>x.id===uidp);if(u){USER=u;enterApp();return;}}
    renderAuth();
  }else{
    MODE='owner';
    if(supa){await pullAll();MASTER=STORE['__master__']||MASTER;}
    setSync(supa?'on':'off',supa?'Synced':'Local');renderAuth();
  }
}
boot();

/* ===================== PWA: offline + auto-update + install ===================== */
function setManifest(){try{
  const nm=(MODE==='owner')?((MASTER&&MASTER.platform&&MASTER.platform.name)||'EduManager'):((DB&&DB.settings&&DB.settings.schoolName)||'EduManager Cloud');
  const icons=[{src:'/icon.svg',sizes:'any',type:'image/svg+xml',purpose:'any maskable'}];
  if(DB&&DB.settings&&DB.settings.logo){const lg=DB.settings.logo;icons.unshift({src:lg,sizes:'512x512',type:lg.indexOf('image/png')>0?'image/png':(lg.indexOf('svg')>0?'image/svg+xml':'image/jpeg'),purpose:'any'});}
  const m={name:nm,short_name:nm.slice(0,18),start_url:location.pathname,scope:'/',display:'standalone',orientation:'portrait',background_color:'#0a7d33',theme_color:'#0a7d33',icons};
  const url=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  const link=document.getElementById('manifestLink');if(link){if(link._u)URL.revokeObjectURL(link._u);link.href=url;link._u=url;}
  document.title=nm;const ti=document.getElementById('touchIcon');if(ti&&DB&&DB.settings&&DB.settings.logo)ti.href=DB.settings.logo;
}catch(e){}}
// install prompt
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-flex';});
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.style.display='none';deferredPrompt=null;toast('App installed');});
function doInstall(){if(!deferredPrompt){toast('On iPhone: tap Share → Add to Home Screen',true);return;}deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none';});}
// service worker (offline + update)
if('serviceWorker' in navigator){window.addEventListener('load',()=>{
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller){const ub=document.getElementById('updateBar');if(ub)ub.style.display='flex';}
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){const ub=document.getElementById('updateBar');if(ub)ub.style.display='flex';}});});
  }).catch(()=>{});
});}
</script>
